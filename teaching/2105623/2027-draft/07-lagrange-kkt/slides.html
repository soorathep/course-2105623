const LAB_SRC = "\"\"\"Session 7 (2027 draft): Lagrange multipliers and the KKT conditions.\n\nCourse convention, used in every function below:\n    minimize f(x)  subject to  g_i(x) <= 0  (multiplier mu_i >= 0)\n                               h_j(x)  = 0  (multiplier lambda_j, any sign)\n    L(x, mu, lambda) = f(x) + sum_i mu_i g_i(x) + sum_j lambda_j h_j(x)\nA maximization is written as \"minimize -f\". Writing a constraint as g(x) - b <= 0\ngives dv*/db = -mu: relaxing it by one unit lowers the minimum by mu.\n\nRun `python kkt_lab.py` for a printed summary, or `python kkt_lab.py --json`\nto write kkt-results.json, which the slides and the lab page read.\n\"\"\"\nimport itertools\nimport json\nimport math\nimport sys\nimport warnings\n\nimport numpy as np\nfrom scipy.optimize import brentq, minimize\n\n\ndef r6(v):\n    \"\"\"Round for printing, so recorded and live runs print the same text.\"\"\"\n    if isinstance(v, (list, tuple, np.ndarray)):\n        return [r6(u) for u in v]\n    v = round(float(v), 6)\n    return 0.0 if v == 0 else v\n\n\n# ---------------------------------------------------------------------------\n# Part A. Lagrange: one equality constraint\n# ---------------------------------------------------------------------------\nELLIPSE = {\"a\": 2.0, \"b\": 1.0, \"target\": [0.6, 0.35]}   # h(x) = x1^2/a^2 + x2^2/b^2 - 1 = 0\n\n\ndef ellipse_point(t, E=ELLIPSE):\n    \"\"\"Point, f, gradients, lambda and curvature at angle t on the ellipse.\"\"\"\n    a, b, (p, q) = E[\"a\"], E[\"b\"], E[\"target\"]\n    x = np.array([a * math.cos(t), b * math.sin(t)])\n    gf = 2 * (x - np.array([p, q]))                    # f = (x1 - p)^2 + (x2 - q)^2\n    gh = np.array([2 * x[0] / a**2, 2 * x[1] / b**2])\n    lam = -gf @ gh / (gh @ gh)                         # best fit of grad f + lambda grad h = 0\n    tau = np.array([-a * math.sin(t), b * math.cos(t)]); tau /= np.linalg.norm(tau)\n    HL = 2 * np.eye(2) + lam * np.diag([2 / a**2, 2 / b**2])   # Hessian of the Lagrangian\n    return {\"t\": t, \"x\": x, \"f\": float((x - [p, q]) @ (x - [p, q])), \"grad_f\": gf, \"grad_h\": gh, \"lam\": lam,\n            \"residual\": float(np.linalg.norm(gf + lam * gh)), \"slope\": float(gf @ tau), \"curv\": float(tau @ HL @ tau)}\n\n\ndef ellipse_stationary(E=ELLIPSE, n=3600):\n    \"\"\"Every point where grad f is parallel to grad h, classified by the second-order test.\"\"\"\n    ts = np.linspace(0, 2 * math.pi, n + 1)\n    s = [ellipse_point(t, E)[\"slope\"] for t in ts]\n    out = []\n    for k in range(n):\n        if s[k] == 0 or s[k] * s[k + 1] < 0:\n            t = brentq(lambda u: ellipse_point(u, E)[\"slope\"], ts[k], ts[k + 1], xtol=1e-14)\n            P = ellipse_point(t, E)\n            out.append({\"t\": t, \"x\": P[\"x\"].tolist(), \"f\": P[\"f\"], \"lam\": P[\"lam\"], \"curv\": P[\"curv\"],\n                        \"kind\": \"local min\" if P[\"curv\"] > 0 else \"local max\"})\n    fmin = min(q[\"f\"] for q in out); fmax = max(q[\"f\"] for q in out)\n    for q in out:\n        q[\"kind\"] = (\"global min\" if abs(q[\"f\"] - fmin) < 1e-12 else \"global max\" if abs(q[\"f\"] - fmax) < 1e-12 else q[\"kind\"])\n    return out\n\n\ndef tank(V=10.0):\n    \"\"\"Closed cylinder of volume V with the least surface: min 2 pi r^2 + 2 pi r h  s.t.  pi r^2 h - V = 0.\"\"\"\n    r = (V / (2 * math.pi)) ** (1 / 3); h = 2 * r\n    lam = -2 / r                                         # from dL/dh = 2 pi r + lambda pi r^2 = 0\n    A = 2 * math.pi * r**2 + 2 * math.pi * r * h\n    Ah = lambda v: 6 * math.pi * (v / (2 * math.pi)) ** (2 / 3)\n    return {\"V\": V, \"r\": r, \"h\": h, \"D\": 2 * r, \"lam\": lam, \"A\": A, \"dA_dV\": -lam, \"fd\": (Ah(V + 1e-4) - Ah(V - 1e-4)) / 2e-4}\n\n\ndef line_sensitivity(b):\n    \"\"\"min (x1-3)^2 + (x2-2)^2  s.t.  x1 + x2 - b = 0: closed form, so dv*/db = -lambda can be checked.\"\"\"\n    lam = 5 - b\n    x = [3 - lam / 2, 2 - lam / 2]\n    return {\"b\": b, \"x\": x, \"lam\": lam, \"v\": lam**2 / 2, \"dv_db\": -lam}\n\n\n# ---------------------------------------------------------------------------\n# Part A2. Equal marginal value: three electrolyzer stacks share the power\n# ---------------------------------------------------------------------------\nSTACKS = {\"names\": [\"Stack A\", \"Stack B\", \"Stack C\"],\n          \"a\": [20.0, 19.5, 19.0],      # kg H2 per MWh at low load\n          \"b\": [0.40, 0.25, 0.15],      # loss of marginal yield, kg H2 per MW^2 h\n          \"Pmax\": [5.0, 6.0, 8.0],      # MW\n          \"units\": \"P in MW, H2 in kg/h, marginal yield in kg/MWh\"}\n\n\ndef h2(P, S=STACKS):\n    return [a * p - b * p * p for a, b, p in zip(S[\"a\"], S[\"b\"], P)]\n\n\ndef allocate_power(Ptot, S=STACKS):\n    \"\"\"Maximize total H2 = sum(a P - b P^2) s.t. sum P = Ptot, 0 <= P <= Pmax.\n    KKT (written as min -H2): a - 2 b P = lambda for a stack between its bounds,\n    mu_up = (a - 2 b Pmax) - lambda at full load, mu_lo = lambda - a when off.\"\"\"\n    a, b, Pm = map(np.array, (S[\"a\"], S[\"b\"], S[\"Pmax\"]))\n    Ptot = min(max(Ptot, 0.0), float(Pm.sum()))\n    P_of = lambda lam: np.clip((a - lam) / (2 * b), 0, Pm)\n    lo, hi = float((a - 2 * b * Pm).min()) - 1, float(a.max()) + 1\n    for _ in range(200):\n        m = (lo + hi) / 2\n        lo, hi = (m, hi) if P_of(m).sum() > Ptot else (lo, m)\n    lam = (lo + hi) / 2; P = P_of(lam); marg = a - 2 * b * P\n    mu_up = np.where(P >= Pm - 1e-9, marg - lam, 0.0); mu_lo = np.where(P <= 1e-9, lam - marg, 0.0)\n    return {\"Ptot\": Ptot, \"P\": P.tolist(), \"H2\": h2(P, S), \"total\": float(sum(h2(P, S))), \"lam\": lam,\n            \"marginal\": marg.tolist(), \"mu_up\": np.maximum(mu_up, 0).tolist(), \"mu_lo\": np.maximum(mu_lo, 0).tolist()}\n\n\n# ---------------------------------------------------------------------------\n# Part B. KKT with inequalities\n# ---------------------------------------------------------------------------\n# Explorer: f = (x1 - T1)^2 + (x2 - T2)^2 over the region\n#   g1 = x1^2 + x2^2 - 9 <= 0,   g2 = 0.5 - x2 <= 0,   g3 = x1 - 2 <= 0\nEXPLORER = {\"R\": 3.0, \"ymin\": 0.5, \"xmax\": 2.0}\n\n\ndef g_explorer(x, E=EXPLORER):\n    return np.array([x[0]**2 + x[1]**2 - E[\"R\"]**2, E[\"ymin\"] - x[1], x[0] - E[\"xmax\"]])\n\n\ndef grad_g_explorer(x):\n    return np.array([[2 * x[0], 2 * x[1]], [0.0, -1.0], [1.0, 0.0]])\n\n\ndef kkt_explorer(T, E=EXPLORER, tol=1e-9):\n    \"\"\"Enumerate active sets; return the point that passes all four KKT conditions.\"\"\"\n    T = np.array(T, float); R, y0, x0 = E[\"R\"], E[\"ymin\"], E[\"xmax\"]\n    cands = {(): [T]}\n    cands[(0,)] = [R * T / np.linalg.norm(T)] if np.linalg.norm(T) > 0 else []\n    cands[(1,)] = [np.array([T[0], y0])]\n    cands[(2,)] = [np.array([x0, T[1]])]\n    s1 = math.sqrt(R**2 - y0**2); s2 = math.sqrt(R**2 - x0**2)\n    cands[(0, 1)] = [np.array([s1, y0]), np.array([-s1, y0])]\n    cands[(0, 2)] = [np.array([x0, s2]), np.array([x0, -s2])]\n    cands[(1, 2)] = [np.array([x0, y0])]\n    for act, pts in cands.items():\n        for x in pts:\n            gf = 2 * (x - T); G = grad_g_explorer(x)[list(act)]\n            mu = np.zeros(3)\n            if act:\n                sol = np.linalg.lstsq(G.T, -gf, rcond=None)[0]; mu[list(act)] = sol\n            res = kkt_residuals(gf, grad_g_explorer(x), g_explorer(x, E), mu)\n            if max(res.values()) < 1e-7:\n                return {\"T\": T.tolist(), \"x\": x.tolist(), \"active\": list(act), \"mu\": mu.tolist(), \"g\": g_explorer(x, E).tolist(),\n                        \"grad_f\": gf.tolist(), \"residuals\": res}\n    raise RuntimeError(\"no KKT point found\")\n\n\ndef kkt_residuals(grad_f, G, g, mu, H=None, h=None, lam=None):\n    \"\"\"The four KKT residuals used in this course (all zero at a KKT point).\"\"\"\n    st = np.array(grad_f, float) + np.array(G, float).T @ np.array(mu, float)\n    if H is not None:\n        st = st + np.array(H, float).T @ np.array(lam, float)\n    primal = max([0.0] + [float(v) for v in g] + ([abs(float(v)) for v in h] if h is not None else []))\n    return {\"stationarity\": float(np.max(np.abs(st))), \"primal\": primal,\n            \"dual\": max(0.0, float(-np.min(mu))) if len(mu) else 0.0,\n            \"complementarity\": float(np.max(np.abs(np.array(mu) * np.array(g)))) if len(mu) else 0.0}\n\n\n# Guess the active set: min (x1-3)^2 + (x2-2)^2  s.t.  g1 = x1 + x2 - 3 <= 0, g2 = x1 - 1.5 <= 0, g3 = -x2 <= 0\nGUESS = {\"T\": [3.0, 2.0], \"A\": [[1.0, 1.0], [1.0, 0.0], [0.0, -1.0]], \"b\": [3.0, 1.5, 0.0],\n         \"names\": [\"g1: x1 + x2 <= 3\", \"g2: x1 <= 1.5\", \"g3: x2 >= 0\"]}\n\n\ndef test_guess(active, P=GUESS):\n    \"\"\"Treat the guessed constraints as equalities, solve the KKT system, then test the rest.\"\"\"\n    A, b, T = np.array(P[\"A\"]), np.array(P[\"b\"]), np.array(P[\"T\"])\n    act = list(active); m = len(act)\n    if m > 2 or (m == 2 and abs(np.linalg.det(A[act])) < 1e-12):\n        return {\"active\": act, \"ok\": False, \"reason\": \"inconsistent: more independent equalities than variables\"}\n    K = np.zeros((2 + m, 2 + m)); K[:2, :2] = 2 * np.eye(2); K[:2, 2:] = A[act].T; K[2:, :2] = A[act]\n    rhs = np.concatenate([2 * T, b[act]])\n    z = np.linalg.solve(K, rhs); x = z[:2]; mu = np.zeros(3); mu[act] = z[2:]\n    g = A @ x - b\n    viol = [i for i in range(3) if g[i] > 1e-9]; neg = [i for i in act if mu[i] < -1e-9]\n    reason = (\"passes all four conditions: the optimum\" if not viol and not neg else\n              (\"primal: violates \" + \", \".join(f\"g{i+1}\" for i in viol)) if viol else\n              (\"dual: mu\" + \", mu\".join(str(i + 1) for i in neg) + \" < 0, so releasing that constraint lowers f\"))\n    return {\"active\": act, \"x\": x.tolist(), \"mu\": mu.tolist(), \"g\": g.tolist(), \"f\": float((x - T) @ (x - T)),\n            \"ok\": not viol and not neg, \"reason\": reason}\n\n\ndef all_guesses(P=GUESS):\n    return [test_guess(list(c), P) for k in range(4) for c in itertools.combinations(range(3), k)]\n\n\ndef simple_case():\n    \"\"\"By hand: min x1^2 + x2^2  s.t.  g = 2 - x1 - x2 <= 0. Two cases.\"\"\"\n    return {\"inactive\": {\"x\": [0.0, 0.0], \"g\": 2.0, \"verdict\": \"infeasible\"},\n            \"active\": {\"x\": [1.0, 1.0], \"mu\": 2.0, \"f\": 2.0, \"verdict\": \"KKT point; convex problem, so the global minimum\"}}\n\n\ndef lp_as_kkt():\n    \"\"\"Session 1 plant as min -c'x s.t. Ax - b <= 0 (mu) and -x <= 0 (nu): the prices are KKT multipliers.\"\"\"\n    A = np.array([[3.0, 2.0], [1.0, 2.0], [1.0, 1.0]]); b = np.array([24.0, 16.0, 9.0]); c = np.array([400.0, 300.0])\n    rows = []\n    for x, mu in (([6.0, 3.0], [100.0, 0.0, 100.0]), ([8.0, 0.0], [400 / 3, 0.0, 0.0])):\n        x = np.array(x); mu = np.array(mu); nu = A.T @ mu - c      # stationarity: -c + A'mu - nu = 0\n        G = np.vstack([A, -np.eye(2)]); g = np.concatenate([A @ x - b, -x]); m = np.concatenate([mu, nu])\n        res = kkt_residuals(-c, G, g, m)\n        rows.append({\"x\": x.tolist(), \"mu\": mu.tolist(), \"nu\": nu.tolist(), \"residuals\": res})\n    return rows\n\n\n# ---------------------------------------------------------------------------\n# Part C. When KKT works: qualifications, second order, the Lagrangian dual\n# ---------------------------------------------------------------------------\ndef cusp():\n    \"\"\"min -x1  s.t.  g1 = x2 - (1 - x1)^3 <= 0,  g2 = -x2 <= 0. Optimum (1, 0); LICQ fails there.\"\"\"\n    grad_f = [-1.0, 0.0]; G = [[0.0, 1.0], [0.0, -1.0]]          # at (1, 0)\n    return {\"x\": [1.0, 0.0], \"grad_f\": grad_f, \"grad_g\": G, \"rank\": int(np.linalg.matrix_rank(np.array(G))),\n            \"note\": \"no mu solves -1 + 0 mu1 + 0 mu2 = 0: no multipliers exist, though (1, 0) is the minimum\"}\n\n\ndef dual_convex(mu):\n    \"\"\"min x^2  s.t.  1 - x <= 0.  q(mu) = min_x x^2 + mu (1 - x) = mu - mu^2/4 at x = mu/2.\"\"\"\n    return {\"mu\": mu, \"x\": mu / 2, \"q\": mu - mu**2 / 4}\n\n\ndef dual_nonconvex(mu):\n    \"\"\"min -x^2 over X = [-1, 2]  s.t.  x - 1 <= 0. f* = -1; q(mu) = min(-1 - 2 mu, mu - 4).\"\"\"\n    a, b = -1 - 2 * mu, mu - 4\n    return {\"mu\": mu, \"x\": -1.0 if a <= b else 2.0, \"q\": min(a, b)}\n\n\ndef solver_check(T=(3.0, 2.0)):\n    \"\"\"SLSQP on the guess problem; multipliers from the KKT stationarity at its answer.\"\"\"\n    A, b = np.array(GUESS[\"A\"]), np.array(GUESS[\"b\"])\n    cons = [{\"type\": \"ineq\", \"fun\": (lambda x, i=i: b[i] - A[i] @ x), \"jac\": (lambda x, i=i: -A[i])} for i in range(3)]\n    with warnings.catch_warnings():\n        warnings.simplefilter(\"ignore\")\n        r = minimize(lambda x: (x[0] - T[0])**2 + (x[1] - T[1])**2, [0.0, 0.0], jac=lambda x: 2 * (x - np.array(T)),\n                     method=\"SLSQP\", constraints=cons, options={\"ftol\": 1e-12})\n    g = A @ r.x - b; act = [i for i in range(3) if g[i] > -1e-7]\n    mu = np.zeros(3); mu[act] = np.linalg.lstsq(A[act].T, -2 * (r.x - np.array(T)), rcond=None)[0]\n    return {\"x\": r.x.tolist(), \"active\": act, \"mu\": mu.tolist(), \"residuals\": kkt_residuals(2 * (r.x - np.array(T)), A, g, mu)}\n\n\n# ---------------------------------------------------------------------------\n# Lab 7. Feed allocation between three parallel CSTRs (synthetic)\n# ---------------------------------------------------------------------------\nLAB = {\"names\": [\"R1\", \"R2\", \"R3\"], \"V\": [6.0, 5.0, 4.0], \"k\": [1.5, 1.0, 0.2],   # m^3, 1/h (first order A -> B)\n       \"Fmax\": [5.0, 11.0, 6.0], \"Fmin\": [1.0, 1.0, 2.0],                          # pump limits and minimum circulation, m^3/h\n       \"CA0\": 2.0, \"Ftot\": 15.0,                                                   # kmol A/m^3, m^3/h of feed to share\n       \"dH\": 80000.0, \"Qmax1\": 125.0,                                              # kJ released per kmol B; cooling limit of R1, kW\n       \"units\": \"F in m^3/h, production in kmol B/h, cooling in kW\"}\n\n\ndef production(F, D=LAB):\n    \"\"\"CSTR, first order: B made = CA0 F k tau / (1 + k tau) = CA0 F kV / (F + kV), kmol/h.\"\"\"\n    return [D[\"CA0\"] * f * k * v / (f + k * v) for f, k, v in zip(F, D[\"k\"], D[\"V\"])]\n\n\ndef marginal(F, D=LAB):\n    return [D[\"CA0\"] * (k * v)**2 / (f + k * v)**2 for f, k, v in zip(F, D[\"k\"], D[\"V\"])]\n\n\ndef cooling(F, D=LAB):\n    \"\"\"Heat released in R1, kW.\"\"\"\n    return production(F, D)[0] * D[\"dH\"] / 3600\n\n\ndef allocate_feed(D=LAB):\n    \"\"\"Exact optimum by the equal-marginal rule, with the KKT multipliers of every row.\n    Problem (as min): -sum P_i(F_i)  s.t.  h = sum F_i - Ftot = 0 (lambda),\n    g_cool = Q1(F1) - Qmax1 <= 0, g_pump,i = F_i - Fmax_i <= 0, g_min,i = Fmin_i - F_i <= 0.\"\"\"\n    kV = np.array(D[\"k\"]) * np.array(D[\"V\"]); CA0 = D[\"CA0\"]\n    Pcap = D[\"Qmax1\"] * 3600 / D[\"dH\"]                                   # kmol/h that R1 can cool\n    Fcool = Pcap * kV[0] / (CA0 * kV[0] - Pcap) if CA0 * kV[0] > Pcap else math.inf\n    hi = np.array(D[\"Fmax\"], float); hi[0] = min(hi[0], Fcool); lo = np.array(D[\"Fmin\"], float)\n    if not lo.sum() - 1e-12 <= D[\"Ftot\"] <= hi.sum() + 1e-12:\n        return {\"feasible\": False}\n    F_of = lambda lam: np.clip(kV * (np.sqrt(CA0 / lam) - 1), lo, hi)\n    a, b = 1e-9, CA0 * 4\n    for _ in range(300):\n        m = (a + b) / 2\n        a, b = (m, b) if F_of(m).sum() > D[\"Ftot\"] else (a, m)\n    lam = (a + b) / 2; F = F_of(lam); dP = np.array(marginal(F, D))\n    free = [i for i in range(3) if lo[i] + 1e-9 < F[i] < hi[i] - 1e-9]\n    if free:\n        lam = float(dP[free[0]])\n    mu_cool = 0.0; mu_pump = np.zeros(3); mu_min = np.zeros(3)\n    kappa = D[\"dH\"] / 3600                                               # kW per kmol/h\n    for i in range(3):\n        if F[i] >= hi[i] - 1e-9 and dP[i] > lam:\n            if i == 0 and Fcool < D[\"Fmax\"][0] - 1e-9:\n                mu_cool = (dP[0] - lam) / (kappa * dP[0])\n            else:\n                mu_pump[i] = dP[i] - lam\n        if F[i] <= lo[i] + 1e-9 and dP[i] < lam:\n            mu_min[i] = lam - dP[i]\n    P = production(F, D)\n    # residuals of the four KKT conditions, rows in the order cool, pump 1-3, min 1-3\n    grad_f = -dP\n    G = np.vstack([[kappa * dP[0], 0, 0], np.eye(3), -np.eye(3)])\n    g = np.concatenate([[cooling(F, D) - D[\"Qmax1\"]], F - np.array(D[\"Fmax\"]), np.array(D[\"Fmin\"]) - F])\n    mu = np.concatenate([[mu_cool], mu_pump, mu_min])\n    res = kkt_residuals(grad_f, G, g, mu, H=[[1.0, 1.0, 1.0]], h=[F.sum() - D[\"Ftot\"]], lam=[lam])\n    act = [n for n, gi in zip([\"cooling R1\", \"pump R1\", \"pump R2\", \"pump R3\", \"minimum R1\", \"minimum R2\", \"minimum R3\"], g) if gi > -1e-7]\n    return {\"feasible\": True, \"F\": F.tolist(), \"P\": P, \"total\": float(sum(P)), \"conversion\": [p / (CA0 * f) for p, f in zip(P, F)],\n            \"marginal\": dP.tolist(), \"lam\": lam, \"mu_cool\": mu_cool, \"mu_pump\": mu_pump.tolist(), \"mu_min\": mu_min.tolist(),\n            \"cooling_kW\": cooling(F, D), \"Fcool\": Fcool, \"g\": g.tolist(), \"active\": act, \"residuals\": res}\n\n\ndef slsqp_feed(D=LAB):\n    \"\"\"The same problem with a general NLP solver, as a cross-check.\"\"\"\n    cons = [{\"type\": \"eq\", \"fun\": lambda F: F.sum() - D[\"Ftot\"]},\n            {\"type\": \"ineq\", \"fun\": lambda F: D[\"Qmax1\"] - cooling(F, D)}]\n    with warnings.catch_warnings():\n        warnings.simplefilter(\"ignore\")\n        r = minimize(lambda F: -sum(production(F, D)), [D[\"Ftot\"] / 3] * 3, method=\"SLSQP\", constraints=cons,\n                     bounds=list(zip(D[\"Fmin\"], D[\"Fmax\"])), options={\"ftol\": 1e-12, \"maxiter\": 500})\n    F = r.x; dP = np.array(marginal(F, D)); kappa = D[\"dH\"] / 3600\n    G = np.vstack([[kappa * dP[0], 0, 0], np.eye(3), -np.eye(3)])\n    g = np.concatenate([[cooling(F, D) - D[\"Qmax1\"]], F - np.array(D[\"Fmax\"]), np.array(D[\"Fmin\"]) - F])\n    act = [i for i in range(7) if g[i] > -1e-6]\n    M = np.vstack([np.ones(3), G[act]]).T                      # columns: equality row, then the active rows\n    z = np.linalg.lstsq(M, dP, rcond=None)[0]                  # stationarity: -dP + lambda*1 + G_act' mu_act = 0\n    mu = np.zeros(7); mu[act] = z[1:]\n    res = kkt_residuals(-dP, G, g, mu, H=[[1.0, 1.0, 1.0]], h=[F.sum() - D[\"Ftot\"]], lam=[z[0]])\n    return {\"F\": F.tolist(), \"total\": float(-r.fun), \"nit\": int(r.nit), \"success\": bool(r.success),\n            \"lam\": float(z[0]), \"mu\": mu.tolist(), \"residuals\": res}\n\n\ndef with_change(**kw):\n    D = dict(LAB); D.update(kw); return allocate_feed(D)\n\n\ndef lab_results():\n    base = allocate_feed()\n    sweep = []\n    for Ft in np.round(np.arange(6.0, 20.01, 0.05), 2):\n        q = with_change(Ftot=float(Ft))\n        if q[\"feasible\"]:\n            sweep.append({\"Ftot\": float(Ft), \"F\": q[\"F\"], \"total\": q[\"total\"], \"lam\": q[\"lam\"], \"active\": q[\"active\"],\n                          \"mu_cool\": q[\"mu_cool\"], \"mu_min3\": q[\"mu_min\"][2], \"mu_pump2\": q[\"mu_pump\"][1]})\n    changes = [i for i in range(1, len(sweep)) if sweep[i][\"active\"] != sweep[i - 1][\"active\"]]\n    # exact feeds where the active set changes: R1 reaches its cooling limit; R2 reaches its pump limit\n    kV = np.array(LAB[\"k\"]) * np.array(LAB[\"V\"]); Fc = base[\"Fcool\"]\n    lam_c = LAB[\"CA0\"] * kV[0]**2 / (Fc + kV[0])**2\n    F2_c = kV[1] * (math.sqrt(LAB[\"CA0\"] / lam_c) - 1)\n    bounds = {\"cooling_binds_above\": Fc + F2_c + LAB[\"Fmin\"][2], \"pump2_binds_above\": Fc + LAB[\"Fmax\"][1] + LAB[\"Fmin\"][2]}\n    return {\"data\": LAB, \"base\": base, \"slsqp\": slsqp_feed(),\n            \"feed_plus1\": with_change(Ftot=LAB[\"Ftot\"] + 1), \"cool_plus10\": with_change(Qmax1=LAB[\"Qmax1\"] + 10),\n            \"min3_minus1\": with_change(Fmin=[1.0, 1.0, 1.0]),\n            \"sweep\": sweep, \"boundaries\": bounds, \"set_changes\": [{\"between\": [sweep[i - 1][\"Ftot\"], sweep[i][\"Ftot\"]],\n                                             \"before\": sweep[i - 1][\"active\"], \"after\": sweep[i][\"active\"]} for i in changes]}\n\n\n# ---------------------------------------------------------------------------\ndef clean(o):\n    if isinstance(o, dict):\n        return {k: clean(v) for k, v in o.items()}\n    if isinstance(o, (list, tuple)):\n        return [clean(v) for v in o]\n    if isinstance(o, np.ndarray):\n        return clean(o.tolist())\n    if isinstance(o, (float, np.floating)):\n        return float(o) if np.isfinite(o) else None\n    if isinstance(o, np.integer):\n        return int(o)\n    return o\n\n\ndef classroom_results():\n    R = {\"meta\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__, \"python\": sys.version.split()[0]}}\n    st = ellipse_stationary()\n    R[\"lecture\"] = {\n        \"ellipse\": {\"E\": ELLIPSE, \"stationary\": st},\n        \"tank\": tank(10.0),\n        \"line\": [line_sensitivity(b) for b in (3.0, 4.0, 5.0, 6.0)],\n        \"stacks\": {\"data\": STACKS, \"at12\": allocate_power(12.0),\n                   \"sweep\": [allocate_power(float(p)) for p in np.round(np.arange(0, 19.001, 0.1), 1)]},\n        \"explorer\": {\"E\": EXPLORER, \"cases\": [kkt_explorer(T) for T in ([0.0, 2.0], [0.0, 5.0], [1.0, -1.0], [3.5, 1.5], [3.5, -1.0], [3.5, 4.0], [-4.0, -1.0])]},\n        \"guess\": {\"P\": GUESS, \"all\": all_guesses()},\n        \"simple\": simple_case(), \"lp\": lp_as_kkt(), \"cusp\": cusp(),\n        \"dual_convex\": [dual_convex(float(m)) for m in np.round(np.arange(0, 4.001, 0.05), 2)],\n        \"dual_nonconvex\": [dual_nonconvex(float(m)) for m in np.round(np.arange(0, 3.001, 0.05), 2)],\n        \"solver\": solver_check()}\n    R[\"lab\"] = lab_results()\n    return clean(R)\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"kkt-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote kkt-results.json\"); sys.exit()\n    L = R[\"lecture\"]\n    for q in L[\"ellipse\"][\"stationary\"]:\n        print(\"A ellipse\", r6(q[\"x\"]), \"f\", r6(q[\"f\"]), \"lambda\", r6(q[\"lam\"]), \"curvature\", r6(q[\"curv\"]), q[\"kind\"])\n    print(\"A tank\", {k: r6(v) for k, v in L[\"tank\"].items()})\n    print(\"A line\", [(q[\"b\"], r6(q[\"lam\"]), r6(q[\"v\"])) for q in L[\"line\"]])\n    s = L[\"stacks\"][\"at12\"]; print(\"A stacks 12 MW\", r6(s[\"P\"]), \"H2\", r6(s[\"total\"]), \"lambda\", r6(s[\"lam\"]), \"mu_up\", r6(s[\"mu_up\"]), \"mu_lo\", r6(s[\"mu_lo\"]))\n    for q in L[\"explorer\"][\"cases\"]:\n        print(\"B explorer T\", q[\"T\"], \"x\", r6(q[\"x\"]), \"active\", q[\"active\"], \"mu\", r6(q[\"mu\"]))\n    for q in L[\"guess\"][\"all\"]:\n        print(\"B guess\", q[\"active\"], r6(q.get(\"x\", [])), r6(q.get(\"mu\", [])), q[\"reason\"])\n    for q in L[\"lp\"]:\n        print(\"B LP x\", q[\"x\"], \"mu\", r6(q[\"mu\"]), \"nu\", r6(q[\"nu\"]), {k: r6(v) for k, v in q[\"residuals\"].items()})\n    print(\"C cusp\", L[\"cusp\"])\n    print(\"C solver\", r6(L[\"solver\"][\"x\"]), L[\"solver\"][\"active\"], r6(L[\"solver\"][\"mu\"]))\n    lab = R[\"lab\"]; b = lab[\"base\"]\n    print(\"E base F\", r6(b[\"F\"]), \"total\", r6(b[\"total\"]), \"lambda\", r6(b[\"lam\"]), \"mu_cool\", r6(b[\"mu_cool\"]), \"mu_pump\", r6(b[\"mu_pump\"]),\n          \"mu_min\", r6(b[\"mu_min\"]), \"active\", b[\"active\"], {k: r6(v) for k, v in b[\"residuals\"].items()})\n    print(\"E slsqp\", r6(lab[\"slsqp\"][\"F\"]), r6(lab[\"slsqp\"][\"total\"]))\n    print(\"E +1 feed\", r6(lab[\"feed_plus1\"][\"total\"] - b[\"total\"]), \"+10 kW\", r6(lab[\"cool_plus10\"][\"total\"] - b[\"total\"]),\n          \"Fmin3 2 -> 1\", r6(lab[\"min3_minus1\"][\"total\"] - b[\"total\"]))\n    print(\"E set changes\", lab[\"set_changes\"], {k: r6(v) for k, v in lab[\"boundaries\"].items()})\n    print(\"E +10 kW plan\", r6(lab[\"cool_plus10\"][\"F\"]), \"16 m3/h plan\", r6(lab[\"feed_plus1\"][\"F\"]), \"Fmin3 = 1 plan\", r6(lab[\"min3_minus1\"][\"F\"]))\n    print(\"E conversions\", r6(b[\"conversion\"]), \"marginals\", r6(b[\"marginal\"]), \"cooling kW\", r6(b[\"cooling_kW\"]), \"Fcool\", r6(b[\"Fcool\"]))\n";   // embedded copy, so live Python also works when the file is opened locally

/* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks
  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";
  for(let k=0;k<=n;k++){const v=ymin+(ymax-ymin)*k/n, y=t+Y-(v-ymin)/(ymax-ymin)*Y;
    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  const z=t+Y-(0-ymin)/(ymax-ymin)*Y; s+=`<line x1="${l}" x2="${w-r}" y1="${Math.min(t+Y,Math.max(t,z))}" y2="${Math.min(t+Y,Math.max(t,z))}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;
  return s}
function ymap(o,v){const Y=o.h-o.t-o.b;return o.t+Y-(v-o.ymin)/(o.ymax-o.ymin)*Y}
function legend(items,x,y){let s="";items.forEach((it,i)=>{const yy=y+i*22;s+=it.line?`<line x1="${x}" x2="${x+22}" y1="${yy}" y2="${yy}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${x}" y="${yy-8}" width="16" height="16" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${x+28}" y="${yy+5}" font-size="16" fill="${C.ink}">${it.t}</text>`});return s}
function legendRow(items,x,y){let s="",xx=x;items.forEach(it=>{s+=it.line?`<line x1="${xx}" x2="${xx+20}" y1="${y}" y2="${y}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${xx}" y="${y-7}" width="14" height="14" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${xx+26}" y="${y+5}" font-size="16" fill="${C.ink}">${it.t}</text>`;xx+=38+it.t.length*8.2});return s}

/* Food Manufacture: stacked bars of a [month][oil] matrix, optional line */
function hbar(items,opt={}){ // items: {t,v,c}
  const w=opt.w||640,h=opt.h||330,l=opt.l||250,r=90,t=16,rowh=(h-t-20)/items.length;
  const mx=opt.max||niceMax(Math.max(...items.map(i=>i.v)));let s=svgEl(w,h);
  items.forEach((it,i)=>{const y=t+i*rowh,bw=(w-l-r)*it.v/mx;
    s+=`<text x="${l-12}" y="${y+rowh/2+5}" font-size="16" text-anchor="end" fill="${C.ink}">${it.t}</text><rect x="${l}" y="${y+rowh*0.18}" width="${Math.max(bw,1)}" height="${rowh*0.64}" fill="${it.c}" rx="3"/><text x="${l+bw+8}" y="${y+rowh/2+6}" font-size="17" font-weight="700" fill="${C.ink}">${opt.fmt?opt.fmt(it.v):fmt(it.v)}</text>`});
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${h-20}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  return s+"</svg>"}

 const px=x=>l+X*(x-o.xr[0])/(o.xr[1]-o.xr[0]),py=y=>t+Y*(o.yr[1]-y)/(o.yr[1]-o.yr[0]);let s=svgEl(w,h);
 if(o.val){const nx=o.nx||60,ny=o.ny||40,dx=X/nx,dy=Y/ny;for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
  const x=o.xr[0]+(i+.5)*(o.xr[1]-o.xr[0])/nx,y=o.yr[1]-(j+.5)*(o.yr[1]-o.yr[0])/ny;

/* contour lines by marching squares */
function contours(f,xr,yr,nx,ny,levels,px,py,stroke,sw,op){let s="";const xs=[],ys=[];
 for(let i=0;i<=nx;i++)xs.push(xr[0]+(xr[1]-xr[0])*i/nx);for(let j=0;j<=ny;j++)ys.push(yr[0]+(yr[1]-yr[0])*j/ny);
 const F=ys.map(y=>xs.map(x=>f(x,y)));
 levels.forEach(c=>{let d="";for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const v=[F[j][i],F[j][i+1],F[j+1][i+1],F[j+1][i]],
   P=[[xs[i],ys[j]],[xs[i+1],ys[j]],[xs[i+1],ys[j+1]],[xs[i],ys[j+1]]],pts=[];
  for(let k=0;k<4;k++){const a=v[k],b=v[(k+1)%4];if((a<c)!==(b<c)){const q=(c-a)/(b-a),A=P[k],B=P[(k+1)%4];pts.push([A[0]+q*(B[0]-A[0]),A[1]+q*(B[1]-A[1])])}}
  for(let k=0;k+1<pts.length;k+=2)d+=`M${px(pts[k][0]).toFixed(1)},${py(pts[k][1]).toFixed(1)}L${px(pts[k+1][0]).toFixed(1)},${py(pts[k+1][1]).toFixed(1)}`}
  s+=`<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${sw||1}" opacity="${op||1}"/>`});return s}

/* arrow from (x0, y0) to (x1, y1) in pixels, with an optional label */
function arrow(x0,y0,x1,y1,col,w,lab,lx,ly,anchor){const a=Math.atan2(y1-y0,x1-x0),L=Math.hypot(x1-x0,y1-y0);if(L<2)return"";const hs=Math.min(12,L*.45);
 const p1=[x1-hs*Math.cos(a-0.4),y1-hs*Math.sin(a-0.4)],p2=[x1-hs*Math.cos(a+0.4),y1-hs*Math.sin(a+0.4)];
 let s=`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${(x1-0.8*hs*Math.cos(a)).toFixed(1)}" y2="${(y1-0.8*hs*Math.sin(a)).toFixed(1)}" stroke="${col}" stroke-width="${w||3}"/><polygon points="${x1.toFixed(1)},${y1.toFixed(1)} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${col}"/>`;
 if(lab){const tx=lx==null?x1+6:lx,ty=ly==null?y1-6:ly;s+=`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" font-size="15" font-weight="700" fill="${col}" text-anchor="${anchor||"start"}">${lab}</text>`}return s}
const mn = s => String(s).replace(/^-/, "−").replace(/\/-/, "/−");
const S = [];
/* ---------- Session 7, part 1: Lagrange multipliers ---------- */
/* the ellipse example: f = (x1 - 0.6)^2 + (x2 - 0.35)^2 on h = x1^2/4 + x2^2 - 1 = 0 */
const EA=2,EB=1,ET=[0.6,0.35];
function ellPt(t){const x=[EA*Math.cos(t),EB*Math.sin(t)],gf=[2*(x[0]-ET[0]),2*(x[1]-ET[1])],gh=[2*x[0]/EA**2,2*x[1]/EB**2];
 const lam=-(gf[0]*gh[0]+gf[1]*gh[1])/(gh[0]**2+gh[1]**2);let tau=[-EA*Math.sin(t),EB*Math.cos(t)];const n=Math.hypot(...tau);tau=[tau[0]/n,tau[1]/n];
 const H=[2+lam*2/EA**2,2+lam*2/EB**2];return {t,x,gf,gh,lam,tau,f:(x[0]-ET[0])**2+(x[1]-ET[1])**2,res:Math.hypot(gf[0]+lam*gh[0],gf[1]+lam*gh[1]),
 slope:gf[0]*tau[0]+gf[1]*tau[1],curv:H[0]*tau[0]**2+H[1]*tau[1]**2}}
function ellPlane(w,h){return plane({w,h,xr:[-2.7,2.7],yr:[-1.6,1.6],xt:[-2,-1,0,1,2],yt:[-1,0,1],xlab:"x₁",ylab:"x₂",l:46,b:46})}
function ellBase(P,levels){const sx=P.px(1)-P.px(0),sy=P.py(0)-P.py(1);let s="";
 levels.forEach(v=>{const r=Math.sqrt(v);s+=`<ellipse cx="${P.px(ET[0])}" cy="${P.py(ET[1])}" rx="${r*sx}" ry="${r*sy}" fill="none" stroke="${C.mist}" stroke-width="1.2"/>`});
 s+=`<ellipse cx="${P.px(0)}" cy="${P.py(0)}" rx="${EA*sx}" ry="${EB*sy}" fill="none" stroke="${C.graphite}" stroke-width="2.6"/>`;
 s+=`<text x="${P.px(-2.6)}" y="${P.py(-1.42)}" font-size="14" fill="${C.graphite}">h(x) = x₁²/4 + x₂² − 1 = 0</text>`;
 s+=`<path d="M${P.px(ET[0])-6},${P.py(ET[1])-6}L${P.px(ET[0])+6},${P.py(ET[1])+6}M${P.px(ET[0])-6},${P.py(ET[1])+6}L${P.px(ET[0])+6},${P.py(ET[1])-6}" stroke="${C.graphite}" stroke-width="2.2"/>`;
 return {s,sx,sy}}
const STAT=()=>LC().ellipse.stationary.slice().sort((a,b)=>a.t-b.t);

S.push({kicker:"Part 1 · Lagrange", title:"Why the gradients line up at a constrained optimum", html:()=>`<div class="body"><div class="col w45"><div class="panel"><div class="math" style="font-size:18px;line-height:1.7">

/* ---------- Part 2: KKT conditions ---------- */
/* explorer region: g1 = x1^2 + x2^2 - 9, g2 = 0.5 - x2, g3 = x1 - 2 (all <= 0) */
const XR=3,XY0=0.5,XX0=2,GN=["g₁: x₁² + x₂² ≤ 9","g₂: x₂ ≥ 0.5","g₃: x₁ ≤ 2"],GC=[C.graphite,C.sky,C.sage];
const gEx=x=>[x[0]**2+x[1]**2-XR**2,XY0-x[1],x[0]-XX0],GgEx=x=>[[2*x[0],2*x[1]],[0,-1],[1,0]];
function kktRes(gf,G,g,mu){const st=[0,1].map(k=>gf[k]+G.reduce((s,r,i)=>s+r[k]*mu[i],0));
 return {stationarity:Math.max(...st.map(Math.abs)),primal:Math.max(0,...g),dual:Math.max(0,...mu.map(v=>-v)),complementarity:Math.max(...mu.map((v,i)=>Math.abs(v*g[i])))}}
function kktExplorer(T){const s1=Math.sqrt(XR**2-XY0**2),s2=Math.sqrt(XR**2-XX0**2),n=Math.hypot(...T);
 const cands=[[[],[T]],[[0],n>0?[[XR*T[0]/n,XR*T[1]/n]]:[]],[[1],[[T[0],XY0]]],[[2],[[XX0,T[1]]]],[[0,1],[[s1,XY0],[-s1,XY0]]],[[0,2],[[XX0,s2],[XX0,-s2]]],[[1,2],[[XX0,XY0]]]];
 for(const [act,pts] of cands)for(const x of pts){const gf=[2*(x[0]-T[0]),2*(x[1]-T[1])],G=GgEx(x),mu=[0,0,0];
  if(act.length===1){const a=G[act[0]];mu[act[0]]=-(gf[0]*a[0]+gf[1]*a[1])/(a[0]**2+a[1]**2)}
  if(act.length===2){const a=G[act[0]],b=G[act[1]],det=a[0]*b[1]-a[1]*b[0];mu[act[0]]=(-gf[0]*b[1]+gf[1]*b[0])/det;mu[act[1]]=(-a[0]*gf[1]+a[1]*gf[0])/det}
  const r=kktRes(gf,G,gEx(x),mu);if(Math.max(r.stationarity,r.primal,r.dual,r.complementarity)<1e-7)return {x,act,mu,gf,g:gEx(x),r}}

S.push({kicker:"Part 2 · The KKT conditions", title:"Four conditions, and four residuals that measure them", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18.5px;line-height:1.8">
<span class="lbl">Stationarity</span>∇f(x*) + Σ μ<sub>i</sub>∇g<sub>i</sub>(x*) + Σ λ<sub>j</sub>∇h<sub>j</sub>(x*) = 0<br>
<span class="lbl">Primal feasibility</span>g<sub>i</sub>(x*) ≤ 0, &nbsp;h<sub>j</sub>(x*) = 0<br>
<span class="lbl">Dual feasibility</span>μ<sub>i</sub> ≥ 0<br>

<p class="note">Active set A(x*) = {i : g<sub>i</sub>(x*) = 0}. Rows outside it have μ<sub>i</sub> = 0, so only active rows enter the stationarity sum.</p></div>

<tr><td>Stationarity</td><td>‖∇f + Σμ<sub>i</sub>∇g<sub>i</sub> + Σλ<sub>j</sub>∇h<sub>j</sub>‖<sub>∞</sub></td></tr>

S.push({kicker:"Part 3 · Constraint qualifications", title:"A minimum without multipliers: why KKT needs a qualification", html:()=>`<div class="body"><div class="col w45"><div class="panel grow"><div class="chart" id="ch-cusp"></div></div>
<p class="note">min −x₁ s.t. g₁ = x₂ − (1 − x₁)³ ≤ 0, g₂ = −x₂ ≤ 0. The region ends in a cusp at (1, 0), which is the minimum.</p></div>
<div class="col"><ul class="b xs"><li>At (1, 0): ∇g₁ = (0, 1), ∇g₂ = (0, −1), −∇f = (1, 0). No μ ≥ 0 gives μ₁(0, 1) + μ₂(0, −1) = (1, 0): no multipliers exist</li>
<li>The linearized rows allow any step along x₁, but the true region allows none to the right. The gradients misdescribe the region</li>
<li><b>LICQ</b>: the gradients of the active rows (and of all h<sub>j</sub>) are linearly independent. Then multipliers exist and are unique. Here they are not independent</li>
<li><b>Slater</b>, for convex problems: some point satisfies every g<sub>i</sub> &lt; 0 strictly. Then KKT is necessary</li>
<li>Practical trap: writing h(x) = 0 as h(x)² ≤ 0 makes the row's gradient zero at every feasible point. Keep equalities as equalities</li></ul></div></div>`,
draw:()=>{const P=plane({w:440,h:380,xr:[-0.3,1.5],yr:[-0.35,1.3],xt:[0,0.5,1],yt:[0,0.5,1],xlab:"x₁",ylab:"x₂",l:58,b:44});let s=P.s;
 const cur=lin(-0.3,1,80).map(x=>[x,Math.min(1.3,(1-x)**3)]);
 s+=`<polygon points="${cur.map(p=>`${P.px(p[0])},${P.py(p[1])}`).join(" ")} ${P.px(1)},${P.py(0)} ${P.px(-0.3)},${P.py(0)}" fill="${C.teal}" opacity=".16"/>`;
 s+=`<polyline points="${cur.map(p=>`${P.px(p[0])},${P.py(p[1])}`).join(" ")}" fill="none" stroke="${C.graphite}" stroke-width="2.4"/><line x1="${P.px(-0.3)}" x2="${P.px(1.5)}" y1="${P.py(0)}" y2="${P.py(0)}" stroke="${C.sky}" stroke-width="2.4"/>`;
 s+=`<text x="${P.px(0.12)}" y="${P.py(0.82)}" font-size="13" fill="${C.graphite}">x₂ = (1 − x₁)³</text>`;
 const X=P.px(1),Y=P.py(0);s+=arrow(X,Y,X,P.py(0.45),C.graphite,3,"∇g₁");s+=arrow(X,Y,X,P.py(-0.3),C.sky,3,"∇g₂",X+6,P.py(-0.24));s+=arrow(X,Y,P.px(1.42),Y,C.amber,3.5,"−∇f",P.px(1.3),Y-10);
 s+=`<circle cx="${X}" cy="${Y}" r="7" fill="${C.amber}" stroke="#fff" stroke-width="2"/>`;
 document.getElementById("ch-cusp").innerHTML=s+P.frame()+"</svg>"}});

S.push({kicker:"Part 3 · Necessary and sufficient", title:"When is a KKT point the answer?", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:17px;line-height:1.7">
<b>Necessary.</b> x* a local minimum + a qualification ⇒ μ, λ exist with KKT<br>
<b>Sufficient (convex).</b> f, g<sub>i</sub> convex, h<sub>j</sub> affine, KKT at x* ⇒ global minimum.<br>
For any feasible x: f(x) ≥ f(x) + Σμ<sub>i</sub>g<sub>i</sub>(x) + Σλ<sub>j</sub>h<sub>j</sub>(x) = L(x, μ, λ)<br>
&nbsp;&nbsp;&nbsp;≥ L(x*, μ, λ) &nbsp;(L convex in x, ∇<sub>x</sub>L(x*) = 0)<br>
&nbsp;&nbsp;&nbsp;= f(x*) &nbsp;(complementarity, h(x*) = 0) &nbsp;∎</div></div></div>
<div class="col"><table class="t" style="font-size:16px"><tr><th>Problem class</th><th>A KKT point is</th></tr>
<tr><td>LP</td><td>a global optimum; no qualification needed</td></tr>
<tr><td>Convex NLP, Slater holds</td><td>a global optimum, and every optimum is a KKT point</td></tr>
<tr><td>Convex NLP, no Slater</td><td>still a global optimum if you find one; the optimum may have no multipliers</td></tr>
<tr><td>Nonconvex NLP</td><td>a candidate: local minimum, saddle or local maximum</td></tr></table>
<ul class="b xs" style="margin-top:10px"><li>This is Session 5's map, made precise: a local solver returns a KKT point, and convexity decides what that point proves</li>
<li>The tank, the electrolyzers and Lab 7 are convex after the change of form: their KKT points are global</li></ul></div></div>`});

S.push({kicker:"Part 3 · Second-order conditions", title:"Curvature on the constraint: the Hessian of the Lagrangian", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:17.5px;line-height:1.7">
∇²<sub>xx</sub>L = ∇²f + Σ μ<sub>i</sub>∇²g<sub>i</sub> + Σ λ<sub>j</sub>∇²h<sub>j</sub><br>
Critical cone C: ∇h<sub>j</sub>·d = 0; ∇g<sub>i</sub>·d = 0 for active rows with μ<sub>i</sub> &gt; 0; ∇g<sub>i</sub>·d ≤ 0 for active rows with μ<sub>i</sub> = 0<br>
Sufficient: dᵀ∇²<sub>xx</sub>L d &gt; 0 for every d ∈ C, d ≠ 0 ⇒ strict local minimum<br>
Necessary (at a local minimum with LICQ): dᵀ∇²<sub>xx</sub>L d ≥ 0 for every d ∈ C</div></div>
<table class="t" style="font-size:15.5px;margin-top:8px" id="soT"></table></div>
<div class="col"><ul class="b xs"><li>On the ellipse, ∇²f = 2I is positive definite everywhere, yet two of the four stationary points are maxima along the curve</li>
<li>The constraint bends: λ∇²h adds its curvature. Only the Hessian of L, along the tangent d, gives the right sign</li>
<li>With equality rows only, as on the ellipse, C is the tangent space {d : ∇h·d = 0}. An active row with μ<sub>i</sub> = 0 adds a one-sided condition, so C becomes a cone; solvers check a reduced Hessian</li>
<li>Session 5's test for problems without rows is the special case with no multipliers</li></ul></div></div>`,
draw:()=>{const st=LC().ellipse.stationary.slice().sort((a,b)=>a.f-b.f);document.getElementById("soT").innerHTML=`<tr><th>Point x</th><th class="n">f</th><th class="n">λ</th><th class="n">dᵀ∇²L d</th><th>Kind</th></tr>`+
 st.map(q=>`<tr><td>(${mn(fmt(q.x[0],3))}, ${mn(fmt(q.x[1],3))})</td><td class="n">${fmt(q.f,3)}</td><td class="n">${mn(fmt(q.lam,3))}</td><td class="n" style="color:${q.curv>0?C.teal:C.rust};font-weight:700">${mn(fmt(q.curv,2))}</td><td>${q.kind}</td></tr>`).join("")}});

S.push({kicker:"Part 3 · Check your understanding · 5 minutes", title:"Qualifications, convexity and curvature", html:()=>CHECK(3,
OL+`<li>At the cusp, which condition fails, and what does that do to KKT?</li>
<li>SLSQP returns a KKT point of a convex problem. Local or global?</li>
<li>Two stationary points on a constraint have dᵀ∇²L d = 1.17 and −2.97 along the tangent. Which is a local minimum?</li>
<li>A model writes x₁ + x₂ = 1 as (x₁ + x₂ − 1)² ≤ 0. What goes wrong?</li></ol>`,
`<li>1. LICQ: the active gradients (0, 1) and (0, −1) are dependent. KKT is then not necessary: the minimum has no multipliers</li>
<li>2. Global: for a convex problem a KKT point is a global minimum</li>
<li>3. The one with 1.17: positive curvature of L along the tangent. The other is a local maximum along the curve</li>
<li>4. The row's gradient 2(x₁ + x₂ − 1)(1, 1) is zero at every feasible point: no qualification holds, multipliers may not exist, and solvers stall</li>`),
draw:()=>reveal("k3btn","k3ans")});

S.push({kicker:"Part 3 · The Lagrangian dual", title:"Minimize L over x: a lower bound for every μ ≥ 0, and sometimes a gap", html:()=>`<div class="body"><div class="col w40"><div class="panel"><div class="math" style="font-size:17px;line-height:1.65">
q(μ) = min<sub>x∈X</sub> f(x) + μ g(x)<br>
Feasible x, μ ≥ 0: μg(x) ≤ 0, so q(μ) ≤ f(x)<br>
Dual: max<sub>μ≥0</sub> q(μ) = d* ≤ f*<br>
q is concave, even when f is not<br>
Convex + Slater: d* = f*</div></div>
<div class="ctrl" style="margin-top:8px"><button id="dq0" class="on">Convex: min x², x ≥ 1</button><button id="dq1">Nonconvex: min −x² on [−1, 2], x ≤ 1</button></div>
<div class="ctrl">μ <input type="range" id="dqm" min="0" max="80" step="1" value="20"><b id="dqmv"></b></div>
<p style="font-size:17px;margin:4px 0 0;font-weight:700" id="dqM"></p></div>
<div class="col"><div class="panel grow" style="flex-direction:row;gap:8px"><div class="chart" id="ch-dq1" style="flex:1"></div><div class="chart" id="ch-dq2" style="flex:1"></div></div>
<p class="note">Left: f (teal), L(x, μ) (amber) and its minimum. Right: q(μ) with the current μ; dashed: f*. Session 6's "best bound from combining rows" is this construction for an LP.</p></div></div>`,
draw:()=>{let mode=0;const M=[{xr:[-1,3],f:x=>x*x,g:x=>1-x,feas:[1,3],fstar:1,mmax:4,yr:[-3,9],qr:[-1,2],
   arg:m=>m/2,q:m=>m-m*m/4,xlab:"x",lab:"f = x², feasible x ≥ 1"},
  {xr:[-1,2],f:x=>-x*x,g:x=>x-1,feas:[-1,1],fstar:-1,mmax:3,yr:[-8,2],qr:[-8,0],arg:m=>(-1-2*m<=m-4)?-1:2,q:m=>Math.min(-1-2*m,m-4),xlab:"x",lab:"f = −x², feasible −1 ≤ x ≤ 1"}];
 const go=()=>{const E=M[mode],mu=Math.min(E.mmax,0.05*(+document.getElementById("dqm").value));document.getElementById("dqmv").textContent=fmt(mu,2);
  const xs=lin(E.xr[0],E.xr[1],121),xm=E.arg(mu),qv=E.q(mu);
  document.getElementById("ch-dq1").innerHTML=xyChart({w:380,h:380,xmin:E.xr[0],xmax:E.xr[1],xstep:1,ymin:E.yr[0],ymax:E.yr[1],ystep:mode?2:3,xlab:"x",ylab:"f and L",l:46,
   under:(px,py)=>`<rect x="${px(E.feas[0])}" y="${py(E.yr[1])}" width="${px(E.feas[1])-px(E.feas[0])}" height="${py(E.yr[0])-py(E.yr[1])}" fill="${C.teal}" opacity=".12"/>`,
   series:[{pts:xs.map(x=>[x,E.f(x)]),c:C.teal,w:2.6},{pts:xs.map(x=>[x,E.f(x)+mu*E.g(x)]),c:C.amber,w:2.6}],marks:[{x:xm,y:qv,c:C.amber,t:"min L",dx:8,dy:16}]});
  const ms=lin(0,E.mmax,E.mmax*20+1),qs=ms.map(m=>[m,E.q(m)]),best=qs.reduce((a,b)=>b[1]>a[1]?b:a);
  document.getElementById("ch-dq2").innerHTML=xyChart({w:380,h:380,xmin:0,xmax:E.mmax,xstep:1,ymin:E.qr[0],ymax:E.qr[1]+0.5,ystep:mode?2:1,xlab:"μ",ylab:"q(μ)",l:46,
   series:[{pts:qs,c:C.teal,w:2.6},{pts:[[0,E.fstar],[E.mmax,E.fstar]],c:C.graphite,w:1.6,dash:true}],marks:[{x:mu,y:qv,c:C.amber},{x:best[0],y:best[1],c:C.teal,r:5}]});
  const gap=E.fstar-best[1];document.getElementById("dqM").textContent=`q(${fmt(mu,2)}) = ${mn(fmt(qv,3))} ≤ f* = ${mn(fmt(E.fstar,0))}. Best bound d* = ${mn(fmt(best[1],2))} at μ = ${fmt(best[0],2)}: ${gap<1e-6?"no gap":`a duality gap of ${fmt(gap,2)}`}.`};
 [0,1].forEach(i=>document.getElementById("dq"+i).onclick=()=>{mode=i;[0,1].forEach(k=>document.getElementById("dq"+k).classList.toggle("on",k===i));const s=document.getElementById("dqm");s.max=M[i].mmax*20;if(+s.value>+s.max)s.value=s.max;go()});
 document.getElementById("dqm").oninput=go;go()},
notes:"In the nonconvex case the minimizer of L jumps from x = −1 to x = 2 at μ = 1: the bound cannot reach f* = −1."});

S.push({kicker:"Part 3 · Solvers", title:"What solvers report, and how to check it", html:()=>`<div class="body"><div class="col w60"><table class="t" style="font-size:15.5px">
<tr><th>Tool</th><th>Row form</th><th>Multipliers</th><th>Stopping test</th></tr>
<tr><td>SciPy SLSQP</td><td>eq: c(x) = 0; ineq: c(x) ≥ 0</td><td>res.multipliers from SciPy 1.16: rows only, no bound multipliers, taken from the last QP subproblem; equalities first; for c ≥ 0 they are ≥ 0, our μ</td><td>rows met within ftol, and the change in f, the step length or a first-order measure below ftol (all absolute); no KKT residuals reported</td></tr>
<tr><td>SciPy trust-constr</td><td>lb ≤ c(x) ≤ ub</td><td>res.v, one array per constraint object</td><td>res.optimality and res.constr_violation below gtol</td></tr>
<tr><td>Ipopt (Pyomo, cyipopt)</td><td>g<sub>L</sub> ≤ g(x) ≤ g<sub>U</sub>, bounds</td><td>row and bound multipliers; Pyomo imports them through a dual Suffix</td><td>"Overall NLP error": scaled stationarity (Ipopt calls it dual infeasibility), violation, complementarity</td></tr></table>
<p class="note">Sign conventions differ between tools and interfaces. Convert to the course form, then confirm one multiplier with a small re-solve: Δv* ≈ −μΔb.</p></div>
<div class="col"><ul class="b xs"><li>Do not stop at "success". Compute the four residuals at the returned point, with the multipliers you trust</li>
<li>Without reported multipliers, take the rows with g<sub>i</sub> ≈ 0 and solve the stationarity condition for μ by least squares, as the code on this slide does</li>
<li>Large multipliers, or ones that change wildly between nearby runs, signal a failing qualification or bad scaling</li></ul></div></div>`,
py:{title:"SLSQP on slide 19's problem, then the four residuals", sub:"kkt_lab.solver_check()", code:
`from kkt_lab import solver_check, r6
q = solver_check()
print("x", r6(q["x"]), "active", q["active"])
print("mu", r6(q["mu"]))
print({k: r6(v) for k, v in q["residuals"].items()})`,
out:()=>{const q=LC().solver;return `x ${py6l(q.x)} active ${pyList(q.active)}\nmu ${py6l(q.mu)}\n{${["stationarity","primal","dual","complementarity"].map(k=>`'${k}': ${py6(q.residuals[k])}`).join(", ")}}`}}});

S.push({kicker:"Part 3 · Multipliers in process models", title:"What the multipliers of a process model mean", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:16.5px">
<tr><th>Row</th><th>Multiplier</th><th>Meaning and unit</th></tr>
<tr><td>Component balance at a node, h = 0</td><td>λ, either sign</td><td>Marginal value of that component there, USD/kmol: Session 4's value of oil by month</td></tr>
<tr><td>Energy balance or utility limit</td><td>λ or μ</td><td>Value of one more kW of steam or cooling, as for the cooling row of Lab 7</td></tr>
<tr><td>Unit capacity, g ≤ 0</td><td>μ ≥ 0</td><td>Value of debottlenecking; zero unless the unit is full</td></tr>
<tr><td>Product specification</td><td>μ ≥ 0</td><td>Cost of tightening the specification by one unit: Session 2's price of one RON</td></tr>
<tr><td>Element balances in a Gibbs minimization</td><td>λ per element</td><td>Element potentials: at equilibrium each species' chemical potential is the sum of its elements' potentials (Session 5's isomers)</td></tr>
<tr><td>State equations of a dynamic model</td><td>λ(t), costates</td><td>Value of one more unit of a state at time t (Session 11)</td></tr></table>
<p class="note">A design rule follows: spend money on the rows with large multipliers. A row with μ = 0 has slack, and relaxing it buys nothing at the margin.</p></div></div>`});

S.push({kicker:"Part 3 · Check your understanding · 5 minutes", title:"Duals, solvers and meaning", html:()=>CHECK(4,
OL+`<li>For min x² s.t. x ≥ 1, q(μ) = μ − μ²/4. What is the best lower bound, at which μ, and how does it compare with f*?</li>
<li>A solver reports success. Residuals: stationarity 10⁻⁹, primal 0.3, dual 0, complementarity 10⁻⁸. Accept the point?</li>
<li>SLSQP returns multiplier 2.0 for the row 1.5 − x₁ ≥ 0 in a minimization. Estimate the change in f* if the limit becomes 1.6</li>
<li>A capacity row has μ = 0 at the optimum. Is it worth paying to expand that unit?</li></ol>`,
`<li>1. q′(μ) = 1 − μ/2 = 0 at μ = 2: d* = 1 = f*. No gap: the problem is convex and Slater holds</li>
<li>2. No. A primal residual of 0.3 means a row is violated by 0.3: the point is not feasible, whatever the status says</li>
<li>3. In course form g = x₁ − 1.5 ≤ 0 with μ = 2: relaxing by 0.1 lowers f* by about 0.2 (slide 19: μ₂ = 2)</li>
<li>4. Not at the margin: the unit has slack, so a little more capacity changes nothing. Only a change large enough to alter the active set could matter</li>`),
draw:()=>reveal("k4btn","k4ans")});

<tr><th>Quantity</th><th class="n">Value</th></tr><tr><td>Tank, 10 m³: h = D</td><td class="n">2.335 m</td></tr>
<tr><td>Tank: dA*/dV = −λ</td><td class="n">1.713 m²/m³</td></tr><tr><td>Stationary points on the ellipse</td><td class="n">4: 2 min, 2 max</td></tr>
<tr><td>Slide 19: active set, μ</td><td class="n">{g₁, g₂}, (1, 2, 0)</td></tr><tr><td>Plant at (8, 0): dual residual</td><td class="n">33.3 = reduced cost</td></tr>
<tr><td>Nonconvex dual example: gap</td><td class="n">f* = −1, d* = −3</td></tr></table></div>
<div class="col"><ul class="b xs"><li>At a constrained optimum, ∇f is a combination of the active row gradients: ∇f + Σμ<sub>i</sub>∇g<sub>i</sub> + Σλ<sub>j</sub>∇h<sub>j</sub> = 0</li>
<li>Four conditions: stationarity, primal feasibility, dual feasibility (μ ≥ 0), complementarity. Check them with residuals</li>
<li>Multipliers are slopes: dv*/db = −λ or −μ, with units. In allocation, every free unit runs at the same marginal value λ</li>
<li>Find the active set by testing guesses; −∇f must lie in the cone of the active gradients</li>
<li>Necessary with a qualification; sufficient for convex problems; otherwise check curvature of L along the active rows</li>
<li>q(μ) = min L is always a lower bound; for convex problems the best bound is f*</li></ul></div></div>`});

  d.innerHTML=(s.kicker&&!s.cls?`<p class="kicker">${s.kicker}</p>`:"")+(s.title?`<h1>${s.title}</h1>`:"")+s.html()+(s.py?`<div class="dhint">D · Python</div>`:"")+`<footer><span>${foot}</span><span>${i+1} / ${N}</span></footer>`;host.appendChild(d)})}
function drawAll(){S.forEach(s=>{if(s.draw)try{s.draw()}catch(e){console.error(e)}})}
function show(i){cur=Math.max(0,Math.min(N-1,i));document.querySelectorAll(".slide").forEach((el,k)=>el.classList.toggle("on",k===cur));
 history.replaceState(null,"",location.search+"#"+(cur+1));fillDrawer();if(window.onSlideChange)onSlideChange(cur);const n=document.getElementById("notes");n.textContent=S[cur].notes||"No notes for this slide."}
let CAP_ON=false;   // set by the narration player; reserves a caption band under the slide
function fit(){const W=innerWidth,H=innerHeight,vp=document.getElementById("viewport"),dock=document.getElementById("dock"),cap=document.getElementById("cap");
 const hasDock=dock.style.display==="flex",barH=hasDock?document.getElementById("nbar").offsetHeight:0;
 let k=Math.min(W/1280,H/720)*0.98,capH=0,fs=0,dockH=0;
 for(let it=0;it<3;it++){if(hasDock&&CAP_ON){const lines=k<0.6?4:2;fs=Math.max(12,Math.min(22,24*k));capH=Math.ceil(lines*fs*1.45)+4}else capH=0;
  dockH=hasDock?capH+barH+(capH?6:0)+14:0;k=Math.min(W/1280,Math.max(120,H-dockH)/720)*0.98}
 const h=720*k,pad=10,top=Math.max(0,(H-h-dockH)/2);
 vp.style.top=(top-pad)+"px";vp.style.bottom="auto";vp.style.height=(h+2*pad)+"px";
 document.getElementById("stage").style.transform=`scale(${k})`;
 if(hasDock){dock.style.top=(top+h+6)+"px";cap.style.display=CAP_ON?"block":"none";cap.style.width=Math.min(1280*k,W-16)+"px";cap.style.height=capH+"px";cap.dataset.fs=fs;if(window.capRefit)capRefit()}}
function fillDrawer(){const p=S[cur].py,dr=document.getElementById("drawer");
 if(!p){document.getElementById("dTitle").textContent="No Python on this slide";document.getElementById("dSub").textContent="Slides with a 'D · Python' tag have code and output.";document.getElementById("dCode").value="";document.getElementById("dOut").textContent="";return}
 document.getElementById("dTitle").textContent=p.title;document.getElementById("dSub").textContent=p.sub||"";document.getElementById("dCode").value=p.code;
 try{document.getElementById("dOut").textContent=p.out()}catch(e){document.getElementById("dOut").textContent=String(e)}
 const m=document.getElementById("dMode");m.className="pill "+(MODE==="live"?"live":"rec");m.textContent=MODE==="live"?"LIVE RUN":"RECORDED RUN"}
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes(e.target.tagName)){if(e.key==="Escape")e.target.blur();return}const k=e.key;
 if(["ArrowRight","PageDown"," "].includes(k)){e.preventDefault();show(cur+1)}else if(["ArrowLeft","PageUp"].includes(k)){e.preventDefault();show(cur-1)}
 else if(k==="Home")show(0);else if(k==="End")show(N-1);else if(k==="d"||k==="D")document.getElementById("drawer").classList.toggle("open");
 else if(k==="f"||k==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
 else if(k==="p"||k==="P"){if(window.narrToggle)narrToggle()}
 else if(k==="c"||k==="C"){if(window.ccCycle)ccCycle()}
 else if(k==="n"||k==="N"){const n=document.getElementById("notes");n.style.display=n.style.display==="block"?"none":"block"}});
document.getElementById("stage").addEventListener("click",e=>{if(e.target.closest("button,input,select,#drawer,a,#startov"))return;const r=e.currentTarget.getBoundingClientRect();(e.clientX-r.left)>r.width*0.5?show(cur+1):show(cur-1)});
addEventListener("resize",fit);

/* ---------- live Python (Pyodide) ---------- */
let py=null;
async function ensurePy(msg){if(py)return py;msg.textContent="Loading Python in the browser (first time about 5–10 s) ...";
 if(!window.loadPyodide){await new Promise((ok,bad)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js";s.onload=ok;s.onerror=()=>bad(new Error("could not load Pyodide"));document.head.appendChild(s)})}
 const p=await loadPyodide();await p.loadPackage(["numpy","scipy"]);
 const src=LAB_SRC||await (await fetch(LAB_FILE)).text();p.FS.writeFile("kkt_lab.py",src);
 await p.runPythonAsync('import sys\nsys.path.insert(0, ".")\nfrom kkt_lab import *');py=p;return p}
async function runCode(){const msg=document.getElementById("liveMsg"),out=document.getElementById("dOut"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Running ...";const buf=[];p.setStdout({batched:s=>buf.push(s)});p.setStderr({batched:s=>buf.push(s)});
  try{await p.runPythonAsync(document.getElementById("dCode").value)}catch(e){buf.push(String(e.message||e).split("\n").slice(-4).join("\n"))}
  out.textContent=buf.join("\n")||"(no output)";const m=document.getElementById("dMode");m.className="pill live";m.textContent="LIVE OUTPUT";
  msg.textContent=`Ran in ${((performance.now()-t0)/1000).toFixed(1)} s in the browser`}
 catch(e){msg.textContent="Python could not start: "+e.message+". The recorded output is still available."}}
async function runLive(){const msg=document.getElementById("liveMsg"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Solving every model ...";
  const out=await p.runPythonAsync('import importlib, json\nimport kkt_lab as lab\nimportlib.reload(lab)\njson.dumps(lab.classroom_results())');
  R=JSON.parse(out);MODE="live";drawAll();fillDrawer();msg.textContent=`All slides now show a live run (${((performance.now()-t0)/1000).toFixed(1)} s, SciPy ${R.meta.scipy})`}
 catch(e){msg.textContent="Live run failed: "+e.message+". The recorded run is still shown."}}
document.getElementById("runCode").onclick=runCode;
document.getElementById("runLive").onclick=runLive;
document.getElementById("useRec").onclick=()=>{R=RECORDED;MODE="recorded";drawAll();fillDrawer();document.getElementById("liveMsg").textContent="Showing the recorded run."};

  {

   "cues": [
    {
     "s": 0.1,
     "e": 4.8,
     "en": "For nonconvex problems we need more: second-order conditions.",
     "th": "สำหรับปัญหาที่ไม่ convex เราต้องการมากกว่านั้น คือเงื่อนไขอันดับสอง"

    {
     "s": 4.8,
     "e": 13.218,
     "en": "The right Hessian is the Hessian of the Lagrangian: the Hessian of f, plus mu times the Hessians of the g, plus lambda times the Hessians of the h.",
     "th": "Hessian ที่ถูกต้องคือ Hessian ของ Lagrangian คือ Hessian ของ f บวก mu คูณ Hessian ของ g บวก lambda คูณ Hessian ของ h"

    {
     "s": 13.218,
     "e": 26.329,
     "en": "Test it only on the critical cone. For an equality row, d must be tangent: grad h dot d equal to zero. For an active inequality with a positive mu, grad g dot d equal to zero.",

     "s": 26.329,

     "en": "For an active inequality with mu equal to zero, grad g dot d at most zero.",

     "en": "In words: only the directions in which you can still move without leaving the active rows matter.",

    {
     "s": 37.869,
     "e": 45.803,
     "en": "Directions that leave an active row with a positive multiplier already raise f to first order, so they need no second-order test.",

    {

     "e": 53.78,
     "en": "If d transpose, times this Hessian, times d, is positive for every nonzero d in the cone, the point is a strict local minimum.",

     "en": "Conversely, at a local minimum where the active gradients are linearly independent, that quantity cannot be negative on the cone.",
     "th": "ในทางกลับกัน ที่จุดต่ำสุดเฉพาะที่ซึ่ง gradient ของแถวที่ active เป็นอิสระเชิงเส้นต่อกัน ค่านี้ติดลบบน cone ไม่ได้"

    {

 lang=ls("cc-lang")||"off";const sp=ls("narr-speed");if(sp)document.getElementById("nSpeed").value=sp;
 const fmtT=t=>isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`:"0:00";
 const S_=i=>NARR.slides[i];
 function load(i){slideIdx=i;const s=S_(i);if(!s){au.removeAttribute("src");return}au.src=s.file;au.playbackRate=+document.getElementById("nSpeed").value;tm.textContent=`0:00 / ${fmtT(s.duration)}`;showCap(0)}
 function setPlayUI(){play.textContent=au.paused?"▶ Play":"❚❚ Pause";play.classList.toggle("on",!au.paused)}
 // captions sit in their own band under the slide; long lines shrink to fit the band
 window.capRefit=()=>{let f=parseFloat(cap.dataset.fs)||18;cap.style.fontSize=f+"px";while(cap.scrollHeight>cap.clientHeight+1&&f>11){f-=1;cap.style.fontSize=f+"px"}};
 function showCap(t){const s=S_(slideIdx);let c=null;if(s&&lang!=="off"){for(const q of s.cues){if(t>=q.s-0.05)c=q;else break}}
  const txt=(!c||(au.paused&&au.currentTime===0&&!on))?"":(lang==="th"?c.th:c.en);if(cap.textContent!==txt){cap.textContent=txt;capRefit()}}
 function ccUI(){const b=document.getElementById("nCC");b.textContent=lang==="off"?"CC off":lang==="en"?"CC English":"CC ไทย";b.classList.toggle("on",lang!=="off");CAP_ON=lang!=="off";fit();showCap(au.currentTime||0)}
 window.ccCycle=()=>{lang=lang==="off"?"en":lang==="en"?"th":"off";ls("cc-lang",lang);ccUI()};
 // "on" means the student is listening: it starts with Play and ends with Pause or Stop.
 // Slides change only when the student moves; the new slide's narration then starts if "on".
 window.narrToggle=()=>{if(au.paused){on=true;if(slideIdx!==cur)load(cur);if(au.ended)au.currentTime=0;msg.textContent="";au.play().catch(()=>{msg.textContent="Press Play again to start audio."})}else{on=false;au.pause()}};
 window.onSlideChange=i=>{au.pause();msg.textContent="";load(i);if(on)au.play().catch(()=>{})};
 document.getElementById("nPlay").onclick=narrToggle;
 document.getElementById("nStop").onclick=()=>{au.pause();au.currentTime=0;on=false;setPlayUI();showCap(0);tm.textContent=`0:00 / ${fmtT((S_(cur)||{}).duration)}`};
 document.getElementById("nCC").onclick=ccCycle;
 document.getElementById("nPrev").onclick=()=>show(cur-1);document.getElementById("nNext").onclick=()=>show(cur+1);
 document.getElementById("nSpeed").onchange=e=>{au.playbackRate=+e.target.value;ls("narr-speed",e.target.value)};
 au.addEventListener("play",setPlayUI);au.addEventListener("pause",setPlayUI);
 au.addEventListener("timeupdate",()=>{tm.textContent=`${fmtT(au.currentTime)} / ${fmtT((S_(slideIdx)||{}).duration)}`;showCap(au.currentTime)});
 au.addEventListener("ended",()=>{setPlayUI();const s=S_(slideIdx);msg.textContent=s&&s.hold?"Activity: do it now, then press Next ›":cur<N-1?"Press Next › or → for the next slide":"End of the session"});
 const q=new URLSearchParams(location.search);
 if(q.get("narrate")==="1"){const ov=document.getElementById("startov");ov.style.display="flex";document.getElementById("startBtn").onclick=()=>{ov.style.display="none";if(lang==="off"){lang="en";ls("cc-lang",lang)}ccUI();on=true;load(cur);au.play().catch(()=>{})}}
 ccUI();setTimeout(()=>{if(slideIdx<0)load(cur)},0);
})();

build();drawAll();fit();show((parseInt(location.hash.slice(1))||1)-1);
</script>
