const LAB_SRC = "\"\"\"2105623 Session 3: MILP for logical and discrete decisions.\n\nPart A  Lecture: the volume discount left open in Session 2, closed with one\n        binary; the big-M picture for a fixed charge; a plain branch-and-bound\n        tree; aggregated and disaggregated facility location.\nPart B  Lab 3: commit four boilers over 24 hours with minimum loads, no-load\n        costs, start-up costs and a reserve margin.\n\nAll data are synthetic. Runs in the browser (Pyodide: NumPy, SciPy/HiGHS) and\nin desktop Python.\n    python milp_lab.py          print every part\n    python milp_lab.py --json   write milp-results.json for the slides and the lab page\n\"\"\"\nimport itertools\nimport json\nimport sys\nimport time\n\nimport numpy as np\nfrom scipy.optimize import Bounds, LinearConstraint, linprog, milp\n\n\nclass MILP:\n    \"\"\"A small named-variable MILP builder on scipy.optimize.milp (HiGHS).\"\"\"\n\n    def __init__(self):\n        self.cols, self.obj, self.lb, self.ub, self.int = [], [], [], [], []\n        self.rows = []\n\n    def var(self, name, obj=0.0, lb=0.0, ub=np.inf, integer=False):\n        self.cols.append(name); self.obj.append(obj); self.lb.append(lb); self.ub.append(ub); self.int.append(integer)\n\n    def row(self, name, terms, lo=-np.inf, hi=np.inf):\n        self.rows.append((name, dict(terms), lo, hi))\n\n    def solve(self, maximize=False, relax=False, options=None):\n        ix = {c: k for k, c in enumerate(self.cols)}\n        A = np.zeros((len(self.rows), len(self.cols)))\n        for k, (_, t, _, _) in enumerate(self.rows):\n            for c, a in t.items():\n                A[k, ix[c]] += a\n        c = np.array(self.obj) * (-1.0 if maximize else 1.0)\n        integ = np.zeros(len(self.cols)) if relax else np.array(self.int, float)\n        t0 = time.perf_counter()\n        r = milp(c, constraints=LinearConstraint(A, [x[2] for x in self.rows], [x[3] for x in self.rows]),\n                 integrality=integ, bounds=Bounds(self.lb, self.ub), options=options or {})\n        dt = time.perf_counter() - t0\n        if r.status != 0 or r.x is None:\n            return {\"status\": {2: \"infeasible\", 3: \"unbounded\"}.get(r.status, r.message)}\n        sg = -1.0 if maximize else 1.0\n        out = {\"status\": \"optimal\", \"obj\": float(sg * r.fun), \"x\": dict(zip(self.cols, (r.x.round(9) + 0.0).tolist())),\n               \"seconds\": dt}\n        if not relax and any(self.int):\n            out.update(nodes=int(getattr(r, \"mip_node_count\", 0) or 0), gap=float(getattr(r, \"mip_gap\", 0.0) or 0.0),\n                       bound=float(sg * getattr(r, \"mip_dual_bound\", r.fun)))\n        return out\n\n\ndef branch_and_bound(c, A_ub, b_ub, lb, ub, ints, maximize=False, max_nodes=5000):\n    \"\"\"Textbook LP-based branch and bound: depth first, most fractional variable,\n    no presolve and no cuts. Every node is recorded so the tree can be drawn.\"\"\"\n    sg = -1.0 if maximize else 1.0\n    nodes, inc, incx, nid = [], None, None, 0\n    stack = [(0, None, \"root\", np.array(lb, float), np.array(ub, float), None, 0)]\n    while stack and len(nodes) < max_nodes:\n        idn, parent, desc, lo, hi, plp, depth = stack.pop()\n        r = linprog(sg * np.asarray(c, float), A_ub=A_ub, b_ub=b_ub, bounds=list(zip(lo, hi)), method=\"highs\")\n        node = {\"id\": idn, \"parent\": parent, \"branch\": desc, \"depth\": depth}\n        if r.status != 0:\n            node.update(status=\"infeasible\", lp=None)\n        else:\n            z = float(sg * r.fun); node[\"lp\"] = z\n            worse = inc is not None and ((z <= inc + 1e-9) if maximize else (z >= inc - 1e-9))\n            frac = [(j, r.x[j]) for j in ints if abs(r.x[j] - round(r.x[j])) > 1e-6]\n            if worse:\n                node[\"status\"] = \"pruned by bound\"\n            elif not frac:\n                node[\"status\"] = \"integer\"; inc, incx = z, r.x.copy()\n            else:\n                j, v = max(frac, key=lambda t: -abs(t[1] - np.floor(t[1]) - 0.5))\n                node.update(status=\"branched\", var=int(j), value=float(v))\n                l1, u1 = lo.copy(), hi.copy(); u1[j] = np.floor(v)\n                l2, u2 = lo.copy(), hi.copy(); l2[j] = np.ceil(v)\n                for (ll, uu, d) in ((l1, u1, f\"{j}<={int(np.floor(v))}\"), (l2, u2, f\"{j}>={int(np.ceil(v))}\")):\n                    nid += 1; stack.append((nid, idn, d, ll, uu, z, depth + 1))\n        opn = [s[5] for s in stack if s[5] is not None]\n        cand = opn + ([inc] if inc is not None else [])\n        node[\"incumbent\"] = inc\n        node[\"bound\"] = (max(cand) if maximize else min(cand)) if cand else inc\n        nodes.append(node)\n    return {\"nodes\": nodes, \"best\": inc, \"x\": None if incx is None else incx.round(9).tolist(), \"complete\": not stack}\n\n\n# ---------------------------------------------------------------------------\n# Part A1. Session 2's volume discount, closed with one binary\n# ---------------------------------------------------------------------------\nCOMP = [\"Butane\", \"LSR naphtha\", \"Reformate\", \"FCC gasoline\", \"Alkylate\"]\nRON = {\"Butane\": 94.0, \"LSR naphtha\": 70.0, \"Reformate\": 98.0, \"FCC gasoline\": 92.0, \"Alkylate\": 96.0}\nRVP = {\"Butane\": 360.0, \"LSR naphtha\": 80.0, \"Reformate\": 25.0, \"FCC gasoline\": 50.0, \"Alkylate\": 30.0}\nCOST = {\"Butane\": 380.0, \"LSR naphtha\": 520.0, \"Reformate\": 640.0, \"FCC gasoline\": 600.0}\nAVAIL = {\"Butane\": 300.0, \"LSR naphtha\": 900.0, \"Reformate\": 1200.0, \"FCC gasoline\": 1500.0}\nGRADES, RON_MIN, RVP_MAX = [\"Regular\", \"Premium\"], {\"Regular\": 91.0, \"Premium\": 95.0}, 60.0\nPRICE, DEMAND = {\"Regular\": 690.0, \"Premium\": 750.0}, {\"Regular\": 2500.0, \"Premium\": 1500.0}\nTIER, P1, P2 = 300.0, 780.0, 700.0          # alkylate: first 300 m3/d at 780, beyond that 700 USD/m3\n\n\ndef discount_blend(relax=False):\n    \"\"\"Tier 2 may be used only when tier 1 is full: q1 >= 300 z, q2 <= 300 z, z binary.\"\"\"\n    m = MILP()\n    for i in COMP:\n        for g in GRADES:\n            m.var(f\"{i}>{g}\", obj=PRICE[g] - COST.get(i, 0.0))\n    m.var(\"q1\", obj=-P1, ub=TIER); m.var(\"q2\", obj=-P2, ub=TIER); m.var(\"z\", ub=1.0, integer=True)\n    m.row(\"tier 1 full if tier 2 used\", {\"q1\": 1, \"z\": -TIER}, lo=0.0)\n    m.row(\"tier 2 only if z\", {\"q2\": 1, \"z\": -TIER}, hi=0.0)\n    m.row(\"alkylate bought\", {**{f\"Alkylate>{g}\": 1 for g in GRADES}, \"q1\": -1, \"q2\": -1}, lo=0.0, hi=0.0)\n    for i in COMP[:-1]:\n        m.row(f\"avail {i}\", {f\"{i}>{g}\": 1 for g in GRADES}, hi=AVAIL[i])\n    for g in GRADES:\n        m.row(f\"demand {g}\", {f\"{i}>{g}\": 1 for i in COMP}, hi=DEMAND[g])\n        m.row(f\"RON {g}\", {f\"{i}>{g}\": RON[i] - RON_MIN[g] for i in COMP}, lo=0.0)\n        m.row(f\"RVP {g}\", {f\"{i}>{g}\": RVP[i] ** 1.25 - RVP_MAX ** 1.25 for i in COMP}, hi=0.0)\n    r = m.solve(maximize=True, relax=relax)\n    x = r[\"x\"]\n    return {\"margin\": r[\"obj\"], \"q1\": x[\"q1\"], \"q2\": x[\"q2\"], \"z\": x[\"z\"], \"alkylate\": x[\"q1\"] + x[\"q2\"],\n            \"nodes\": r.get(\"nodes\"), \"gap\": r.get(\"gap\")}\n\n\n# ---------------------------------------------------------------------------\n# Part A2. The big-M picture: one boiler or bought steam\n# ---------------------------------------------------------------------------\nFC = {\"demand\": 30.0, \"cap\": 50.0, \"fuel\": 20.0, \"fixed\": 600.0, \"buy\": 45.0}   # t/h, t/h, USD/t, USD/h, USD/t\n\n\ndef fixed_charge(M):\n    \"\"\"min fuel*x + fixed*y + buy*w  s.t.  x + w >= demand, x <= M y, x <= cap, y in {0,1}.\"\"\"\n    out = {\"M\": M}\n    for relax in (True, False):\n        m = MILP()\n        m.var(\"x\", obj=FC[\"fuel\"], ub=FC[\"cap\"]); m.var(\"w\", obj=FC[\"buy\"]); m.var(\"y\", obj=FC[\"fixed\"], ub=1.0, integer=True)\n        m.row(\"steam\", {\"x\": 1, \"w\": 1}, lo=FC[\"demand\"]); m.row(\"big-M\", {\"x\": 1, \"y\": -M}, hi=0.0)\n        r = m.solve(relax=relax)\n        out[\"lp\" if relax else \"milp\"] = {\"cost\": r[\"obj\"], \"x\": r[\"x\"][\"x\"], \"y\": r[\"x\"][\"y\"], \"w\": r[\"x\"][\"w\"]}\n    true_best = min(FC[\"fuel\"] * FC[\"demand\"] + FC[\"fixed\"], FC[\"buy\"] * FC[\"demand\"])\n    out[\"valid\"] = abs(out[\"milp\"][\"cost\"] - true_best) < 1e-6\n    out[\"gap\"] = (out[\"milp\"][\"cost\"] - out[\"lp\"][\"cost\"]) / out[\"milp\"][\"cost\"]\n    return out\n\n\n# ---------------------------------------------------------------------------\n# Part A3. A branch-and-bound tree: heat-recovery projects under a budget\n# ---------------------------------------------------------------------------\nPROJ = [\"P1\", \"P2\", \"P3\", \"P4\", \"P5\"]\nCAPEX = [120.0, 90.0, 75.0, 60.0, 150.0]       # kUSD\nSAVE = [54.0, 38.0, 30.0, 27.0, 60.0]          # kUSD per year\nBUDGET = 300.0\n\n\ndef project_tree():\n    r = branch_and_bound(SAVE, [CAPEX], [BUDGET], [0] * 5, [1] * 5, range(5), maximize=True)\n    # layout: x by in-order position of the final tree, y by depth\n    kids = {}\n    for n in r[\"nodes\"]:\n        kids.setdefault(n[\"parent\"], []).append(n[\"id\"])\n    order, pos = [], {}\n    def walk(i):\n        ch = sorted(kids.get(i, []))\n        if ch:\n            walk(ch[0])\n        order.append(i)\n        for c in ch[1:]:\n            walk(c)\n    walk(0)\n    for k, i in enumerate(order):\n        pos[i] = k\n    for n in r[\"nodes\"]:\n        n[\"xpos\"] = pos[n[\"id\"]]\n        if \"branch\" in n and n[\"branch\"] != \"root\":\n            j, rest = (n[\"branch\"].split(\"<=\") + [None])[:2] if \"<=\" in n[\"branch\"] else n[\"branch\"].split(\">=\")\n            n[\"label\"] = f\"{PROJ[int(j)]} = {'0' if '<=' in n['branch'] else '1'}\"\n    greedy, spent = [], 0.0\n    for j in sorted(range(5), key=lambda j: -SAVE[j] / CAPEX[j]):\n        if spent + CAPEX[j] <= BUDGET:\n            greedy.append(PROJ[j]); spent += CAPEX[j]\n    return {\"nodes\": r[\"nodes\"], \"best\": r[\"best\"], \"x\": r[\"x\"], \"chosen\": [PROJ[j] for j in range(5) if r[\"x\"][j] > 0.5],\n            \"root_lp\": r[\"nodes\"][0][\"lp\"], \"greedy\": greedy, \"greedy_saving\": sum(SAVE[PROJ.index(p)] for p in greedy),\n            \"width\": len(order)}\n\n\n# ---------------------------------------------------------------------------\n# Part A4. Formulation strength: aggregated vs disaggregated facility location\n# ---------------------------------------------------------------------------\ndef location(n_sites=8, n_plants=20, seed=7):\n    \"\"\"Open solvent-recovery sites (fixed cost) and assign each plant to one site.\n    Aggregated:    sum_j x_ij <= n_plants * y_i     (one row per site)\n    Disaggregated: x_ij <= y_i                      (one row per pair; the same integer set)\"\"\"\n    rng = np.random.default_rng(seed)\n    F = rng.uniform(2000, 4000, n_sites); d = rng.uniform(5, 20, n_plants)\n    ps = rng.uniform(0, 100, (n_sites, 2)); pp = rng.uniform(0, 100, (n_plants, 2))\n    tc = 2.0 * np.linalg.norm(ps[:, None] - pp[None], axis=2) * d[None, :]\n    n = n_sites + n_sites * n_plants\n    c = np.concatenate([F, tc.ravel()])\n    out = {\"sites\": ps.round(2).tolist(), \"plants\": pp.round(2).tolist(), \"fixed\": F.round(1).tolist(), \"demand\": d.round(2).tolist()}\n    for name in (\"aggregated\", \"disaggregated\"):\n        A, b = [], []\n        for j in range(n_plants):\n            r = np.zeros(n); r[n_sites + np.arange(n_sites) * n_plants + j] = -1; A.append(r); b.append(-1.0)\n        if name == \"aggregated\":\n            for i in range(n_sites):\n                r = np.zeros(n); r[n_sites + i * n_plants:n_sites + (i + 1) * n_plants] = 1; r[i] = -n_plants; A.append(r); b.append(0.0)\n        else:\n            for i in range(n_sites):\n                for j in range(n_plants):\n                    r = np.zeros(n); r[n_sites + i * n_plants + j] = 1; r[i] = -1; A.append(r); b.append(0.0)\n        A, b = np.array(A), np.array(b)\n        bb = branch_and_bound(c, A, b, [0] * n, [1] * n, range(n_sites), max_nodes=3000)\n        integ = np.zeros(n); integ[:n_sites] = 1\n        t0 = time.perf_counter()\n        h = milp(c, constraints=LinearConstraint(A, -np.inf, b), integrality=integ, bounds=Bounds(0, 1))\n        dt = time.perf_counter() - t0\n        lp = linprog(c, A_ub=A, b_ub=b, bounds=[(0, 1)] * n, method=\"highs\")\n        y = h.x[:n_sites]; x = h.x[n_sites:].reshape(n_sites, n_plants)\n        out[name] = {\"rows\": int(A.shape[0]), \"lp_bound\": float(lp.fun), \"optimum\": float(h.fun),\n                     \"root_gap\": float((h.fun - lp.fun) / h.fun), \"bb_nodes\": len(bb[\"nodes\"]), \"bb_best\": bb[\"best\"],\n                     \"highs_nodes\": int(getattr(h, \"mip_node_count\", 0) or 0), \"highs_seconds\": dt,\n                     \"open\": [int(i) for i in range(n_sites) if y[i] > 0.5],\n                     \"assign\": [int(np.argmax(x[:, j])) for j in range(n_plants)],\n                     \"lp_y\": (lp.x[:n_sites].round(4) + 0.0).tolist()}\n    return out\n\n\n# ---------------------------------------------------------------------------\n# Part B. Lab 3: commit four boilers over 24 hours\n# ---------------------------------------------------------------------------\nBOILERS = [\"B1\", \"B2\", \"B3\", \"B4\"]\nUMAX = {\"B1\": 120.0, \"B2\": 100.0, \"B3\": 60.0, \"B4\": 40.0}       # t/h steam\nLMIN = {\"B1\": 50.0, \"B2\": 40.0, \"B3\": 20.0, \"B4\": 10.0}         # t/h minimum stable load\nFUEL = {\"B1\": 18.0, \"B2\": 20.0, \"B3\": 24.0, \"B4\": 30.0}         # USD per t steam\nNOLOAD = {\"B1\": 900.0, \"B2\": 700.0, \"B3\": 300.0, \"B4\": 120.0}   # USD per hour while on\nSTART = {\"B1\": 6000.0, \"B2\": 4500.0, \"B3\": 1200.0, \"B4\": 300.0}  # USD per start\nU0 = {\"B1\": 1, \"B2\": 0, \"B3\": 0, \"B4\": 0}                        # on at midnight\nSTEAM = [120, 115, 110, 110, 115, 130, 165, 205, 235, 250, 255, 250,\n         240, 245, 250, 240, 225, 215, 205, 190, 170, 150, 135, 125]  # t/h, hour 0 to 23\nRESERVE = 0.10                                                     # committed capacity >= 1.1 x demand\n\n\ndef boilers(M=None, M_b=None, relax=False, start_scale=1.0, hours=None, reserve=RESERVE, fix_u=None):\n    \"\"\"x[b,t] load, u[b,t] on/off (binary), s[b,t] start-up (continuous: s >= u_t - u_{t-1} and a\n    positive start cost make it 0 or 1 whenever u is integer).\n    Load rows: L u <= x <= M u, with M = UMAX (tight) unless M or M_b says otherwise; x <= UMAX always.\"\"\"\n    hours = list(range(24)) if hours is None else list(hours)\n    m = MILP()\n    for b in BOILERS:\n        for t in hours:\n            m.var(f\"x {b} {t}\", obj=FUEL[b], ub=UMAX[b])\n            m.var(f\"u {b} {t}\", obj=NOLOAD[b], ub=1.0, integer=True)\n            m.var(f\"s {b} {t}\", obj=START[b] * start_scale, ub=1.0)\n            mm = UMAX[b] if M is None else M\n            if M_b and b in M_b:\n                mm = M_b[b]\n            m.row(f\"max load {b} {t}\", {f\"x {b} {t}\": 1, f\"u {b} {t}\": -mm}, hi=0.0)\n            m.row(f\"min load {b} {t}\", {f\"x {b} {t}\": 1, f\"u {b} {t}\": -LMIN[b]}, lo=0.0)\n            if fix_u is not None:\n                m.row(f\"fix {b} {t}\", {f\"u {b} {t}\": 1}, lo=fix_u[b], hi=fix_u[b])\n            if len(hours) > 1 or start_scale:\n                prev = hours.index(t)\n                if prev == 0:\n                    m.row(f\"start {b} {t}\", {f\"s {b} {t}\": 1, f\"u {b} {t}\": -1}, lo=-U0[b] if hours[0] == 0 else -np.inf)\n                else:\n                    m.row(f\"start {b} {t}\", {f\"s {b} {t}\": 1, f\"u {b} {t}\": -1, f\"u {b} {hours[prev - 1]}\": 1}, lo=0.0)\n    for t in hours:\n        m.row(f\"steam {t}\", {f\"x {b} {t}\": 1 for b in BOILERS}, lo=STEAM[t])\n        m.row(f\"reserve {t}\", {f\"u {b} {t}\": UMAX[b] for b in BOILERS}, lo=(1 + reserve) * STEAM[t])\n    r = m.solve(relax=relax)\n    if r[\"status\"] != \"optimal\":\n        return r\n    x = r[\"x\"]\n    out = {\"status\": \"optimal\", \"cost\": r[\"obj\"], \"seconds\": r[\"seconds\"],\n           \"u\": {b: [x[f\"u {b} {t}\"] for t in hours] for b in BOILERS},\n           \"x\": {b: [x[f\"x {b} {t}\"] for t in hours] for b in BOILERS},\n           \"starts\": {b: [x[f\"s {b} {t}\"] for t in hours] for b in BOILERS}}\n    # count start-ups from the on/off pattern itself (s is free when its cost is zero)\n    out[\"n_starts\"] = sum(1 for b in BOILERS for k, t in enumerate(hours)\n                          if out[\"u\"][b][k] > 0.5 and (out[\"u\"][b][k - 1] if k else (U0[b] if t == 0 else 0)) < 0.5) \\\n        if not relax else round(sum(sum(v) for v in out[\"starts\"].values()), 6)\n    out[\"n_fractional\"] = sum(1 for b in BOILERS for v in out[\"u\"][b] if 1e-6 < v < 1 - 1e-6)\n    out[\"parts\"] = {\"fuel\": sum(FUEL[b] * x[f\"x {b} {t}\"] for b in BOILERS for t in hours),\n                    \"no_load\": sum(NOLOAD[b] * x[f\"u {b} {t}\"] for b in BOILERS for t in hours),\n                    \"start\": sum(START[b] * start_scale * x[f\"s {b} {t}\"] for b in BOILERS for t in hours)}\n    if not relax:\n        out.update(nodes=r.get(\"nodes\"), gap=r.get(\"gap\"), bound=r.get(\"bound\"))\n    return out\n\n\ndef enumerate_hour(t=19):\n    \"\"\"Every on/off pattern for one hour (no start-up costs): each fixed pattern is an LP.\"\"\"\n    rows = []\n    for pat in itertools.product([0, 1], repeat=4):\n        fu = dict(zip(BOILERS, pat))\n        cap = sum(UMAX[b] * fu[b] for b in BOILERS)\n        r = boilers(hours=[t], start_scale=0.0, fix_u=fu, relax=True)\n        rows.append({\"pattern\": \"\".join(map(str, pat)), \"on\": [b for b in BOILERS if fu[b]], \"capacity\": cap,\n                     \"status\": r[\"status\"], \"cost\": r.get(\"cost\"),\n                     \"load\": {b: r[\"x\"][b][0] for b in BOILERS} if r[\"status\"] == \"optimal\" else None})\n    best = min((r for r in rows if r[\"status\"] == \"optimal\"), key=lambda r: r[\"cost\"])\n    one = boilers(hours=[t], start_scale=0.0)\n    return {\"hour\": t, \"steam\": STEAM[t], \"rows\": rows, \"feasible\": sum(r[\"status\"] == \"optimal\" for r in rows),\n            \"best\": best, \"milp_cost\": one[\"cost\"], \"milp_on\": [b for b in BOILERS if one[\"u\"][b][0] > 0.5]}\n\n\ndef lab_results():\n    tight, tight_lp = boilers(), boilers(relax=True)\n    loose, loose_lp = boilers(M=10000.0), boilers(M=10000.0, relax=True)\n    small = boilers(M_b={\"B1\": 100.0})\n    sweep = []\n    for k in (0.0, 0.25, 0.5, 1.0, 1.5, 2.0, 3.0, 4.0):\n        r = boilers(start_scale=k)\n        sweep.append({\"scale\": k, \"cost\": r[\"cost\"], \"starts\": r[\"n_starts\"], \"nodes\": r[\"nodes\"],\n                      \"u\": r[\"u\"], \"parts\": r[\"parts\"]})\n    return {\"tight\": tight, \"tight_lp\": tight_lp, \"loose\": loose, \"loose_lp\": loose_lp, \"small_M\": small,\n            \"enum\": enumerate_hour(19), \"start_sweep\": sweep,\n            \"data\": {\"boilers\": BOILERS, \"umax\": UMAX, \"lmin\": LMIN, \"fuel\": FUEL, \"noload\": NOLOAD, \"start\": START,\n                     \"u0\": U0, \"steam\": STEAM, \"reserve\": RESERVE}}\n\n\ndef classroom_results():\n    R = {\"meta\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__, \"python\": sys.version.split()[0]}}\n    R[\"lecture\"] = {\n        \"discount\": {\"milp\": discount_blend(), \"lp\": discount_blend(relax=True), \"tier\": TIER, \"p1\": P1, \"p2\": P2},\n        \"fixed_charge\": {\"data\": FC, \"cases\": [fixed_charge(M) for M in (20.0, 25.0, 30.0, 40.0, 50.0, 75.0, 100.0, 200.0, 500.0, 1000.0)]},\n        \"tree\": project_tree(),\n        \"tree_data\": {\"projects\": PROJ, \"capex\": CAPEX, \"save\": SAVE, \"budget\": BUDGET},\n        \"location\": location(),\n    }\n    R[\"lab\"] = lab_results()\n    return R\n\n\ndef _sched(u):\n    return {b: \"\".join(\"#\" if v > 0.999 else (\".\" if v < 1e-3 else \"~\") for v in u[b]) for b in u}\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"milp-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote milp-results.json\")\n        sys.exit()\n    L = R[\"lecture\"]\n    print(\"A1 discount:\", {k: (round(v, 2) if isinstance(v, float) else v) for k, v in L[\"discount\"][\"milp\"].items()},\n          \"| LP relaxation:\", {k: (round(v, 3) if isinstance(v, float) else v) for k, v in L[\"discount\"][\"lp\"].items()})\n    print(\"A2 fixed charge:\")\n    for c in L[\"fixed_charge\"][\"cases\"]:\n        print(f\"   M {c['M']:7.0f}: LP {c['lp']['cost']:8.1f} (y {c['lp']['y']:.3f})  MILP {c['milp']['cost']:7.1f}  valid {c['valid']}  gap {100*c['gap']:5.1f}%\")\n    t = L[\"tree\"]; print(f\"A3 tree: {len(t['nodes'])} nodes, best {t['best']} {t['chosen']}, root LP {t['root_lp']:.2f}, greedy {t['greedy']} {t['greedy_saving']}\")\n    for k in (\"aggregated\", \"disaggregated\"):\n        v = L[\"location\"][k]\n        print(f\"A4 {k}: rows {v['rows']}, LP {v['lp_bound']:.0f}, opt {v['optimum']:.0f}, root gap {100*v['root_gap']:.1f}%, plain B&B {v['bb_nodes']} nodes, HiGHS {v['highs_nodes']} nodes, open {v['open']}\")\n    lab = R[\"lab\"]\n    for k in (\"tight\", \"tight_lp\", \"loose\", \"loose_lp\", \"small_M\"):\n        v = lab[k]\n        print(f\"B {k}: cost {v['cost']:.1f}, starts {v['n_starts']}, fractional u {v['n_fractional']}, nodes {v.get('nodes')}, gap {v.get('gap')}\")\n    for b, s in _sched(lab[\"tight\"][\"u\"]).items():\n        print(\"   \", b, s)\n    e = lab[\"enum\"]; print(f\"B enum hour {e['hour']}: {e['feasible']} feasible, best {e['best']['on']} {e['best']['cost']:.1f}; MILP {e['milp_on']} {e['milp_cost']:.1f}\")\n    for s in lab[\"start_sweep\"]:\n        print(f\"   start x{s['scale']}: cost {s['cost']:.1f}, starts {s['starts']}, nodes {s['nodes']}\")\n";   // embedded copy, so live Python also works when the file is opened locally
let R = RECORDED, MODE = "recorded";
const C = {teal:"#0F6E6B",amber:"#E29A2D",rust:"#BE654C",sky:"#5A91BE",sage:"#83A462",plum:"#995A90",graphite:"#333F4A",sand:"#DFC98F",ink:"#1C242B",slate:"#66727C",mist:"#B9C1C6",paper:"#F3F0EB"};
const fmt = (x,d=0)=>x==null?"–":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

/* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks
  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";
  for(let k=0;k<=n;k++){const v=ymin+(ymax-ymin)*k/n, y=t+Y-(v-ymin)/(ymax-ymin)*Y;
    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  const z=t+Y-(0-ymin)/(ymax-ymin)*Y; s+=`<line x1="${l}" x2="${w-r}" y1="${Math.min(t+Y,Math.max(t,z))}" y2="${Math.min(t+Y,Math.max(t,z))}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;
  return s}
function ymap(o,v){const Y=o.h-o.t-o.b;return o.t+Y-(v-o.ymin)/(o.ymax-o.ymin)*Y}
function legend(items,x,y){let s="";items.forEach((it,i)=>{const yy=y+i*22;s+=it.line?`<line x1="${x}" x2="${x+22}" y1="${yy}" y2="${yy}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${x}" y="${yy-8}" width="16" height="16" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${x+28}" y="${yy+5}" font-size="16" fill="${C.ink}">${it.t}</text>`});return s}
function legendRow(items,x,y){let s="",xx=x;items.forEach(it=>{s+=it.line?`<line x1="${xx}" x2="${xx+20}" y1="${y}" y2="${y}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${xx}" y="${y-7}" width="14" height="14" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${xx+26}" y="${y+5}" font-size="16" fill="${C.ink}">${it.t}</text>`;xx+=38+it.t.length*8.2});return s}

/* Food Manufacture: stacked bars of a [month][oil] matrix, optional line */
function hbar(items,opt={}){ // items: {t,v,c}
  const w=opt.w||640,h=opt.h||330,l=opt.l||250,r=90,t=16,rowh=(h-t-20)/items.length;
  const mx=opt.max||niceMax(Math.max(...items.map(i=>i.v)));let s=svgEl(w,h);
  items.forEach((it,i)=>{const y=t+i*rowh,bw=(w-l-r)*it.v/mx;
    s+=`<text x="${l-12}" y="${y+rowh/2+5}" font-size="16" text-anchor="end" fill="${C.ink}">${it.t}</text><rect x="${l}" y="${y+rowh*0.18}" width="${Math.max(bw,1)}" height="${rowh*0.64}" fill="${it.c}" rx="3"/><text x="${l+bw+8}" y="${y+rowh/2+6}" font-size="17" font-weight="700" fill="${C.ink}">${opt.fmt?opt.fmt(it.v):fmt(it.v)}</text>`});
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${h-20}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  return s+"</svg>"}

const foot = "2105623 Optimization of Chemical Processes · Session 3 · MILP: logical and discrete decisions · draft for 2027";
function xyChart(o){ // series:[{pts:[[x,y]],c,dash,w}], xmin,xmax,ymin,ymax,xlab,ylab,marks,hline,xstep
  const w=o.w||620,h=o.h||430,l=o.l||84,r=24,t=18,b=58,X=w-l-r;let s=svgEl(w,h);const A=scale({w,h,l,r,t,b,ylab:o.ylab},o.ymin,o.ymax);
  const px=x=>l+X*(x-o.xmin)/(o.xmax-o.xmin),py=y=>ymap(A,y);s+=axes(A);
  for(let x=o.xmin;x<=o.xmax+1e-9;x+=o.xstep){s+=`<text x="${px(x)}" y="${h-b+24}" font-size="16" text-anchor="middle" fill="${C.ink}">${o.xfmt?o.xfmt(x):fmt(x)}</text>`}
  s+=`<text x="${l+X/2}" y="${h-8}" font-size="17" text-anchor="middle" fill="${C.ink}">${o.xlab}</text>`;
  if(o.hline)s+=`<line x1="${l}" x2="${w-r}" y1="${py(o.hline.y)}" y2="${py(o.hline.y)}" stroke="${C.graphite}" stroke-width="1.6" stroke-dasharray="7 5"/><text x="${w-r-6}" y="${py(o.hline.y)-8}" font-size="16" text-anchor="end" fill="${C.graphite}">${o.hline.t}</text>`;
  o.series.forEach(se=>{s+=`<polyline fill="none" stroke="${se.c}" stroke-width="${se.w||3}" ${se.dash?'stroke-dasharray="8 6"':''} points="${se.pts.map(p=>`${px(p[0])},${py(p[1])}`).join(" ")}"/>`});
  (o.marks||[]).forEach(m=>{s+=`<circle cx="${px(m.x)}" cy="${py(m.y)}" r="7" fill="${m.c||C.amber}" stroke="#fff" stroke-width="2"/>`+(m.t?`<text x="${px(m.x)+(m.dx||10)}" y="${py(m.y)+(m.dy||-12)}" font-size="16" font-weight="700" text-anchor="${m.anchor||"start"}" fill="${C.ink}">${m.t}</text>`:"")});
  if(o.legend)s+=legend(o.legend,l+16,t+18);
  return s+"</svg>"}

/* big-M picture: x horizontal (t/h), y vertical (0..1) */
function bigMPlot(c,d){const W=600,H=430,l=70,r=20,t=24,bm=58,X=W-l-r,Y=H-t-bm,xm=60,px=x=>l+X*x/xm,py=y=>t+Y-Y*y;let s=svgEl(W,H);
 for(let k=0;k<=xm;k+=10)s+=`<line x1="${px(k)}" x2="${px(k)}" y1="${t}" y2="${t+Y}" stroke="${C.mist}" stroke-width=".7"/><text x="${px(k)}" y="${t+Y+22}" font-size="16" text-anchor="middle">${k}</text>`;
 [0,0.5,1].forEach(v=>{s+=`<line x1="${l}" x2="${l+X}" y1="${py(v)}" y2="${py(v)}" stroke="${C.mist}" stroke-width=".7"/><text x="${l-10}" y="${py(v)+5}" font-size="16" text-anchor="end">${v}</text>`});
 s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.6"/><line x1="${l}" x2="${l+X}" y1="${t+Y}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.6"/>`;
 s+=`<text x="${l+X/2}" y="${H-10}" font-size="17" text-anchor="middle">x, steam from the boiler, t/h</text><text transform="translate(18,${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle">y (on = 1)</text>`;
 const M=c.M,cap=d.cap,poly=M>=cap?[[0,0],[cap,cap/M],[cap,1],[0,1]]:[[0,0],[M,1],[0,1]];
 s+=`<polygon points="${poly.map(p=>`${px(p[0])},${py(p[1])}`).join(" ")}" fill="${C.teal}" opacity=".18" stroke="${C.teal}" stroke-width="2"/>`;
 s+=`<polygon points="${[[0,0],[Math.min(d.demand,cap),1],[0,1]].map(p=>`${px(p[0])},${py(p[1])}`).join(" ")}" fill="none" stroke="${C.graphite}" stroke-width="1.6" stroke-dasharray="6 5"/>`;
 s+=`<line x1="${px(0)}" x2="${px(Math.min(M,cap))}" y1="${py(1)}" y2="${py(1)}" stroke="${C.ink}" stroke-width="5"/><circle cx="${px(0)}" cy="${py(0)}" r="6" fill="${C.ink}"/>`;
 s+=`<line x1="${px(d.demand)}" x2="${px(d.demand)}" y1="${t}" y2="${t+Y}" stroke="${C.rust}" stroke-width="1.6" stroke-dasharray="4 4"/><text x="${px(d.demand)+6}" y="${t+16}" font-size="15" fill="${C.rust}">demand 30</text>`;
 s+=`<circle cx="${px(c.lp.x)}" cy="${py(c.lp.y)}" r="9" fill="${C.amber}" stroke="#fff" stroke-width="2"/><text x="${px(c.lp.x)+12}" y="${py(c.lp.y)+(c.lp.y>0.85?22:-10)}" font-size="16" font-weight="700">LP optimum (${fmt(c.lp.x,0)}, ${fmt(c.lp.y,2)})</text>`;

 return s+"</svg>"}

/* branch-and-bound tree */
function treePlot(T,k){const W=1150,H=330,n=T.width,dx=(W-60)/n,dy=56,nodes=T.nodes.slice(0,k),byId={};T.nodes.forEach(nd=>byId[nd.id]=nd);let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" font-family="Helvetica Neue,Arial,sans-serif">`;
 const P=nd=>[30+dx*(nd.xpos+0.5),28+dy*nd.depth];
 nodes.forEach(nd=>{if(nd.parent==null)return;const a=P(byId[nd.parent]),b=P(nd);s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${C.mist}" stroke-width="2"/><text x="${(a[0]+b[0])/2+(b[0]<a[0]?-6:6)}" y="${(a[1]+b[1])/2}" font-size="12" text-anchor="${b[0]<a[0]?"end":"start"}" fill="${C.slate}">${nd.label}</text>`});
 nodes.forEach((nd,i)=>{const [x,y]=P(nd),last=i===k-1,col={branched:C.teal,integer:C.amber,infeasible:C.rust,"pruned by bound":C.slate}[nd.status];
  s+=`<circle cx="${x}" cy="${y}" r="${last?17:14}" fill="${nd.status==="integer"?C.amber:"#fff"}" stroke="${col}" stroke-width="${last?4:2.5}"/>`;
  s+=`<text x="${x}" y="${y+5}" font-size="12" font-weight="700" text-anchor="middle" fill="${nd.status==="integer"?"#fff":col}">${nd.lp==null?"×":fmt(nd.lp,0)}</text>`});
 return s+"</svg>"}

/* facility map */
function mapPlot(L,key){const W=560,H=430,p=v=>[30+v[0]*5,20+(100-v[1])*3.9],o=L[key];let s=svgEl(W,H);
 L.plants.forEach((q,j)=>{const a=p(q),b=p(L.sites[o.assign[j]]);s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${C.mist}" stroke-width="1.5"/>`});
 L.plants.forEach(q=>{const a=p(q);s+=`<circle cx="${a[0]}" cy="${a[1]}" r="5" fill="${C.graphite}"/>`});
 L.sites.forEach((q,i)=>{const a=p(q),op=o.open.includes(i);s+=`<rect x="${a[0]-9}" y="${a[1]-9}" width="18" height="18" fill="${op?C.teal:"#fff"}" stroke="${C.teal}" stroke-width="2.5"/>`});
 return s+legend([{t:"open site",c:C.teal},{t:"plant",c:C.graphite}],W-150,H-40)+"</svg>"}

py:{title:"A textbook branch and bound", sub:"milp_lab.branch_and_bound(): depth first, no cuts", code:
`from milp_lab import *
t = project_tree()
print("nodes", len(t["nodes"]), "best", t["best"], t["chosen"])

S.push({kicker:"Part 3 · The certificate", title:"What \"optimal\" means for a MILP", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:22px;line-height:1.7">
incumbent (best plan found) ≤ z* ≤ best bound<br>gap = (bound − incumbent) / |incumbent|</div></div>
<ul class="b xs" style="margin-top:14px"><li>HiGHS stops when the relative gap is at most 10⁻⁴ by default: "optimal" means within 0.01%</li><li>With a time limit, report the incumbent <i>and</i> the bound. A plan without its gap is not a result</li></ul></div>
<div class="col"><ul class="b xs"><li>The pair (incumbent, bound) is the MILP's certificate, as the primal-dual pair was for an LP in Session 1</li>
<li>A MILP has no shadow prices. Fix the binaries at their optimal values and solve the LP: its duals are prices <i>for that on/off pattern</i> only</li>
<li>Equal objective values with different plans are common in MILP. Symmetric units (two identical boilers) multiply them and slow the search</li></ul></div></div>`});

S.push({kicker:"Part 3 · Formulation strength", title:"Same decisions, same optimum, very different bounds", dhint:true, html:()=>`<div class="body"><div class="col w55"><table class="t" id="loc" style="font-size:17px"></table>

<tr><td>LP bound, USD</td><td class="n">${fmt(a.lp_bound)}</td><td class="n">${fmt(d.lp_bound)}</td></tr><tr><td>MILP optimum, USD</td><td class="n">${fmt(a.optimum)}</td><td class="n">${fmt(d.optimum)}</td></tr>

py:{title:"Two formulations of one location problem", sub:"milp_lab.location()", code:
`from milp_lab import *
L = location()
for k in ("aggregated", "disaggregated"):
    v = L[k]
    print(k, "LP", round(v["lp_bound"]), "opt", round(v["optimum"]),
          "B&B nodes", v["bb_nodes"], "HiGHS nodes", v["highs_nodes"])`,
out:()=>["aggregated","disaggregated"].map(k=>{const v=R.lecture.location[k];return `${k} LP ${Math.round(v.lp_bound)} opt ${Math.round(v.optimum)} B&B nodes ${v.bb_nodes} HiGHS nodes ${v.highs_nodes}`}).join("\n")}});

S.push({kicker:"Part 3 · Why", title:"A strong formulation is close to the convex hull", html:()=>`<div class="body"><div class="col w55"><ul class="b sm">
<li>The ideal formulation of a set of integer plans is its convex hull: then the LP relaxation already has an integer optimum</li>
<li>Disaggregation, tight M and valid inequalities move a formulation toward the hull; more rows can mean a faster solve</li>
<li>Solvers add cuts and tighten coefficients themselves. That is why HiGHS needs only a few nodes on the weak form here; on larger models the difference is hours</li></ul></div>
<div class="col"><div class="panel grow" style="justify-content:center"><p style="font-size:21px;line-height:1.5;margin:0">Judge a MILP formulation by<br><b class="hl">the gap between its LP relaxation and its optimum</b>,<br>not by its number of rows.</p></div></div></div>`});

S.push({kicker:"Part 4 · Practice", title:"Five habits for MILP models", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:18px">
<tr><th>Habit</th><th>Why</th></tr>
<tr><td>Write every M with its derivation</td><td>A wrong M changes the answer without any warning</td></tr>
<tr><td>Solve the LP relaxation first and report the root gap</td><td>It tells you how hard the model will be, before you wait</td></tr>
<tr><td>Report incumbent, bound and gap</td><td>"Optimal" is a tolerance; a time limit leaves a gap</td></tr>
<tr><td>Check a small case by enumeration</td><td>It catches logic errors that the solver cannot see</td></tr>
<tr><td>Break symmetry between identical units</td><td>Equivalent plans multiply the search tree</td></tr></table></div></div>`});

<li>Every M must be valid, and should be as small as the model can prove</li><li>The LP relaxation is a bound; branch and bound closes the gap; the gap is the certificate</li>
<li>Judge formulations by their root gap; disaggregation and tight M move toward the convex hull</li></ul></div></div>`,
draw:()=>{const L=R.lecture;document.getElementById("sumt").innerHTML=`<tr><th>Quantity</th><th class="n">Value</th></tr><tr><td>Discount with one binary</td><td class="n">${fmt(L.discount.milp.margin)} USD/d</td></tr>
<tr><td>Fixed charge, root gap at M = 30 and 1,000</td><td class="n">0%, ${fmt(100*L.fixed_charge.cases[9].gap,1)}%</td></tr><tr><td>Project tree</td><td class="n">${L.tree.nodes.length} nodes, best ${L.tree.best}</td></tr>
<tr><td>Location root gap, aggregated</td><td class="n">${fmt(100*L.location.aggregated.root_gap,1)}%</td></tr><tr><td>Location root gap, disaggregated</td><td class="n">${fmt(100*L.location.disaggregated.root_gap,1)}%</td></tr>`}});

S.push({kicker:"Before Session 4", title:"Before we meet again", html:()=>`<div class="body"><div class="col"><ul class="b sm">
<li>Finish Lab 3 if you did not finish in class</li><li>Keep your card with binaries; Session 4 repeats decisions over time and links them through inventory</li>
<li>Read Williams, <i>Model Building in Mathematical Programming</i>, Chapter 10 (building integer programming models II) and Section 12.1 (food manufacture)</li>
<li>Optional: add a minimum up time to the boiler model and see how the schedule changes</li></ul></div></div>`});

/* ---------- deck engine ---------- */
const N=S.length; let cur=0;
function build(){const host=document.getElementById("slides");host.innerHTML="";
 S.forEach((s,i)=>{const d=document.createElement("section");d.className="slide"+(s.cls?" "+s.cls:"");d.id="s"+(i+1);
  d.innerHTML=(s.kicker&&!s.cls?`<p class="kicker">${s.kicker}</p>`:"")+(s.title?`<h1>${s.title}</h1>`:"")+s.html()+(s.py?`<div class="dhint">D · Python</div>`:"")+`<footer><span>${foot}</span><span>${i+1} / ${N}</span></footer>`;host.appendChild(d)})}
function drawAll(){S.forEach(s=>{if(s.draw)try{s.draw()}catch(e){console.error(e)}})}
function show(i){cur=Math.max(0,Math.min(N-1,i));document.querySelectorAll(".slide").forEach((el,k)=>el.classList.toggle("on",k===cur));
 history.replaceState(null,"",location.search+"#"+(cur+1));fillDrawer();if(window.onSlideChange)onSlideChange(cur);const n=document.getElementById("notes");n.textContent=S[cur].notes||"No notes for this slide."}
let CAP_ON=false;   // set by the narration player; reserves a caption band under the slide
function fit(){const W=innerWidth,H=innerHeight,vp=document.getElementById("viewport"),dock=document.getElementById("dock"),cap=document.getElementById("cap");
 const hasDock=dock.style.display==="flex",barH=hasDock?document.getElementById("nbar").offsetHeight:0;
 let k=Math.min(W/1280,H/720)*0.98,capH=0,fs=0,dockH=0;
 for(let it=0;it<3;it++){if(hasDock&&CAP_ON){const lines=k<0.6?4:2;fs=Math.max(12,Math.min(22,24*k));capH=Math.ceil(lines*fs*1.45)+4}else capH=0;
  dockH=hasDock?capH+barH+(capH?6:0)+14:0;k=Math.min(W/1280,Math.max(120,H-dockH)/720)*0.98}
 const h=720*k,pad=10,top=Math.max(0,(H-h-dockH)/2);
 vp.style.top=(top-pad)+"px";vp.style.bottom="auto";vp.style.height=(h+2*pad)+"px";
 document.getElementById("stage").style.transform=`scale(${k})`;
 if(hasDock){dock.style.top=(top+h+6)+"px";cap.style.display=CAP_ON?"block":"none";cap.style.width=Math.min(1280*k,W-16)+"px";cap.style.height=capH+"px";cap.dataset.fs=fs;if(window.capRefit)capRefit()}}
function fillDrawer(){const p=S[cur].py,dr=document.getElementById("drawer");
 if(!p){document.getElementById("dTitle").textContent="No Python on this slide";document.getElementById("dSub").textContent="Slides with a 'D · Python' tag have code and output.";document.getElementById("dCode").value="";document.getElementById("dOut").textContent="";return}
 document.getElementById("dTitle").textContent=p.title;document.getElementById("dSub").textContent=p.sub||"";document.getElementById("dCode").value=p.code;
 try{document.getElementById("dOut").textContent=p.out()}catch(e){document.getElementById("dOut").textContent=String(e)}
 const m=document.getElementById("dMode");m.className="pill "+(MODE==="live"?"live":"rec");m.textContent=MODE==="live"?"LIVE RUN":"RECORDED RUN"}
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes(e.target.tagName)){if(e.key==="Escape")e.target.blur();return}const k=e.key;
 if(["ArrowRight","PageDown"," "].includes(k)){e.preventDefault();show(cur+1)}else if(["ArrowLeft","PageUp"].includes(k)){e.preventDefault();show(cur-1)}
 else if(k==="Home")show(0);else if(k==="End")show(N-1);else if(k==="d"||k==="D")document.getElementById("drawer").classList.toggle("open");
 else if(k==="f"||k==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
 else if(k==="p"||k==="P"){if(window.narrToggle)narrToggle()}
 else if(k==="c"||k==="C"){if(window.ccCycle)ccCycle()}
 else if(k==="n"||k==="N"){const n=document.getElementById("notes");n.style.display=n.style.display==="block"?"none":"block"}});
document.getElementById("stage").addEventListener("click",e=>{if(e.target.closest("button,input,select,#drawer,a,#startov"))return;const r=e.currentTarget.getBoundingClientRect();(e.clientX-r.left)>r.width*0.5?show(cur+1):show(cur-1)});
addEventListener("resize",fit);

/* ---------- live Python (Pyodide) ---------- */
let py=null;
async function ensurePy(msg){if(py)return py;msg.textContent="Loading Python in the browser (first time about 5–10 s) ...";
 if(!window.loadPyodide){await new Promise((ok,bad)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js";s.onload=ok;s.onerror=()=>bad(new Error("could not load Pyodide"));document.head.appendChild(s)})}
 const p=await loadPyodide();await p.loadPackage(["numpy","scipy"]);
 const src=LAB_SRC||await (await fetch(LAB_FILE)).text();p.FS.writeFile("milp_lab.py",src);
 await p.runPythonAsync('import sys\nsys.path.insert(0, ".")\nfrom milp_lab import *');py=p;return p}
async function runCode(){const msg=document.getElementById("liveMsg"),out=document.getElementById("dOut"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Running ...";const buf=[];p.setStdout({batched:s=>buf.push(s)});p.setStderr({batched:s=>buf.push(s)});
  try{await p.runPythonAsync(document.getElementById("dCode").value)}catch(e){buf.push(String(e.message||e).split("\n").slice(-4).join("\n"))}
  out.textContent=buf.join("\n")||"(no output)";const m=document.getElementById("dMode");m.className="pill live";m.textContent="LIVE OUTPUT";
  msg.textContent=`Ran in ${((performance.now()-t0)/1000).toFixed(1)} s in the browser`}
 catch(e){msg.textContent="Python could not start: "+e.message+". The recorded output is still available."}}
async function runLive(){const msg=document.getElementById("liveMsg"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Solving every model ...";
  const out=await p.runPythonAsync('import importlib, json\nimport milp_lab as lab\nimportlib.reload(lab)\njson.dumps(lab.classroom_results())');
  R=JSON.parse(out);MODE="live";drawAll();fillDrawer();msg.textContent=`All slides now show a live run (${((performance.now()-t0)/1000).toFixed(1)} s, SciPy ${R.meta.scipy})`}
 catch(e){msg.textContent="Live run failed: "+e.message+". The recorded run is still shown."}}
document.getElementById("runCode").onclick=runCode;
document.getElementById("runLive").onclick=runLive;
document.getElementById("useRec").onclick=()=>{R=RECORDED;MODE="recorded";drawAll();fillDrawer();document.getElementById("liveMsg").textContent="Showing the recorded run."};

 lang=ls("cc-lang")||"off";const sp=ls("narr-speed");if(sp)document.getElementById("nSpeed").value=sp;
 const fmtT=t=>isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`:"0:00";
 const S_=i=>NARR.slides[i];
 function load(i){slideIdx=i;const s=S_(i);if(!s){au.removeAttribute("src");return}au.src=s.file;au.playbackRate=+document.getElementById("nSpeed").value;tm.textContent=`0:00 / ${fmtT(s.duration)}`;showCap(0)}
 function setPlayUI(){play.textContent=au.paused?"▶ Play":"❚❚ Pause";play.classList.toggle("on",!au.paused)}
 // captions sit in their own band under the slide; long lines shrink to fit the band
 window.capRefit=()=>{let f=parseFloat(cap.dataset.fs)||18;cap.style.fontSize=f+"px";while(cap.scrollHeight>cap.clientHeight+1&&f>11){f-=1;cap.style.fontSize=f+"px"}};
 function showCap(t){const s=S_(slideIdx);let c=null;if(s&&lang!=="off"){for(const q of s.cues){if(t>=q.s-0.05)c=q;else break}}
  const txt=(!c||(au.paused&&au.currentTime===0&&!on))?"":(lang==="th"?c.th:c.en);if(cap.textContent!==txt){cap.textContent=txt;capRefit()}}
 function ccUI(){const b=document.getElementById("nCC");b.textContent=lang==="off"?"CC off":lang==="en"?"CC English":"CC ไทย";b.classList.toggle("on",lang!=="off");CAP_ON=lang!=="off";fit();showCap(au.currentTime||0)}
 window.ccCycle=()=>{lang=lang==="off"?"en":lang==="en"?"th":"off";ls("cc-lang",lang);ccUI()};
 // "on" means the student is listening: it starts with Play and ends with Pause or Stop.
 // Slides change only when the student moves; the new slide's narration then starts if "on".
 window.narrToggle=()=>{if(au.paused){on=true;if(slideIdx!==cur)load(cur);if(au.ended)au.currentTime=0;msg.textContent="";au.play().catch(()=>{msg.textContent="Press Play again to start audio."})}else{on=false;au.pause()}};
 window.onSlideChange=i=>{au.pause();msg.textContent="";load(i);if(on)au.play().catch(()=>{})};
 document.getElementById("nPlay").onclick=narrToggle;
 document.getElementById("nStop").onclick=()=>{au.pause();au.currentTime=0;on=false;setPlayUI();showCap(0);tm.textContent=`0:00 / ${fmtT((S_(cur)||{}).duration)}`};
 document.getElementById("nCC").onclick=ccCycle;
 document.getElementById("nPrev").onclick=()=>show(cur-1);document.getElementById("nNext").onclick=()=>show(cur+1);
 document.getElementById("nSpeed").onchange=e=>{au.playbackRate=+e.target.value;ls("narr-speed",e.target.value)};
 au.addEventListener("play",setPlayUI);au.addEventListener("pause",setPlayUI);
 au.addEventListener("timeupdate",()=>{tm.textContent=`${fmtT(au.currentTime)} / ${fmtT((S_(slideIdx)||{}).duration)}`;showCap(au.currentTime)});
 au.addEventListener("ended",()=>{setPlayUI();const s=S_(slideIdx);msg.textContent=s&&s.hold?"Activity: do it now, then press Next ›":cur<N-1?"Press Next › or → for the next slide":"End of the session"});
 const q=new URLSearchParams(location.search);
 if(q.get("narrate")==="1"){const ov=document.getElementById("startov");ov.style.display="flex";document.getElementById("startBtn").onclick=()=>{ov.style.display="none";if(lang==="off"){lang="en";ls("cc-lang",lang)}ccUI();on=true;load(cur);au.play().catch(()=>{})}}
 ccUI();setTimeout(()=>{if(slideIdx<0)load(cur)},0);
})();

build();drawAll();fit();show((parseInt(location.hash.slice(1))||1)-1);
</script>
