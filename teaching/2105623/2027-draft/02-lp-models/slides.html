:root{--teal:#0F6E6B;--amber:#E29A2D;--rust:#BE654C;--sky:#5A91BE;--sage:#83A462;--plum:#995A90;--graphite:#333F4A;--sand:#DFC98F;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2b3138;font-family:"Helvetica Neue",Helvetica,Arial,"DejaVu Sans",sans-serif;color:var(--ink)}

.slide{position:absolute;inset:0;padding:40px 64px 58px;display:none;flex-direction:column}
.slide.on{display:flex}
.kicker{color:var(--amber);font-weight:700;letter-spacing:.14em;font-size:15px;text-transform:uppercase;margin:0}
h1{color:var(--teal);font-size:42px;line-height:1.12;margin:6px 0 22px;font-weight:800}
.body{flex:1;display:flex;gap:28px;min-height:0}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.w40{flex:0 0 40%}.w45{flex:0 0 45%}.w55{flex:0 0 55%}.w60{flex:0 0 60%}
ul.b{list-style:none;margin:0;padding:0;font-size:24px;line-height:1.36}
ul.b>li{position:relative;padding-left:30px;margin:0 0 16px}
ul.b>li::before{content:"";position:absolute;left:2px;top:.5em;width:11px;height:11px;background:var(--amber)}
ul.b.sm{font-size:21px}ul.b.sm>li{margin-bottom:11px}
ul.b.xs{font-size:19px}ul.b.xs>li{margin-bottom:8px}
.hl{color:var(--teal);font-weight:700}
.panel{background:var(--paper);border-radius:14px;padding:16px 18px;min-height:0;display:flex;flex-direction:column}
.panel.grow{flex:1}
.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:25px;line-height:1.75}
.math .lbl{font-family:"Helvetica Neue",Arial,sans-serif;font-size:16px;color:var(--slate);display:inline-block;width:150px}
.code{font-family:var(--mono);font-size:17px;line-height:1.5;white-space:pre;color:var(--graphite)}
.note{font-size:18px;color:var(--slate);margin-top:10px;line-height:1.4}
.big{font-size:56px;font-weight:800;color:var(--teal)}
table.t{border-collapse:collapse;font-size:19px;width:100%}
table.t th{background:var(--paper);text-align:left;padding:7px 10px;border-bottom:2px solid var(--mist);font-weight:700}
table.t td{padding:6px 10px;border-bottom:1px solid #e3e6e8}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.act{border:3px solid var(--amber);border-radius:16px;padding:22px 28px;background:#fdf6ea}
.act .tag{display:inline-block;background:var(--amber);color:#fff;font-weight:800;letter-spacing:.1em;font-size:15px;padding:4px 10px;border-radius:6px;margin-bottom:12px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px;align-items:center;font-size:16px;color:var(--slate)}
.ctrl button{font:inherit;font-size:15px;padding:5px 11px;border-radius:8px;border:1.5px solid var(--teal);background:#fff;color:var(--teal);cursor:pointer}
.ctrl button.on{background:var(--teal);color:#fff}
.ctrl input[type=range]{width:220px;accent-color:var(--teal)}
.kpi{display:flex;gap:14px;margin-top:8px}
.kpi div{background:#fff;border-radius:10px;padding:8px 12px;font-size:15px;color:var(--slate);flex:1}
.kpi b{display:block;font-size:24px;color:var(--ink)}
.kpi b.a{color:var(--amber)}
svg.ch{width:100%;height:100%;display:block}
.chart{flex:1;min-height:0}
footer{position:absolute;left:64px;right:64px;bottom:20px;border-top:1px solid var(--mist);padding-top:7px;display:flex;justify-content:space-between;font-size:13px;color:var(--slate)}

,"profit":601365.3785199765,"regular":1019.204672948,"premium":900.0000000010001,"butane":88.470755497,"alkylate":600.0,"REF":1100.0,"lsr_naphtha":504.266082548},{"value":60.0,"profit":605331.4960152361,"regular":1032.649139035,"premium":900.0,"butane":100.234663322,"alkylate":600.0,"REF":1100.0,"lsr_naphtha":502.585524287},{"value":62.5,"profit":609395.999279738,"regular":1046.427116203,"premium":900.0,"butane":112.290393344,"alkylate":600.0,"REF":1100.0,"lsr_naphtha":500.863277141},{"value":65.0,"profit":613560.6167250897,"regular":1060.544463475,"premium":900.0,"butane":124.643072207,"alkylate":600.0,"REF":1100.0,"lsr_naphtha":499.098608732},{"value":67.5,"profit":617827.2226721297,"regular":1075.007534482,"premium":900.000000001,"butane":137.298259338,"alkylate":600.0,"REF":1100.0,"lsr_naphtha":497.290724856},{"value":70.0,"profit":622197.8358649494,"regular":1089.823172424,"premium":900.0,"butane":150.261942537,"alkylate":600.0,"REF":1100.0,"lsr_naphtha":495.438770114}]},"data":{"cdu_yield":{"LPG":0.02,"LSR":0.1,"HN":0.18,"Distillate":0.38,"Residue":0.32},"ref_yield":{"Reformate":0.85,"LPG":0.15},"lab":{"crude_price":480.0,"cdu_cap":8000.0,"ref_cap":1100.0,"ref_opex":25.0,"butane_price":380.0,"butane_max":300.0,"alkylate_price":700.0,"alkylate_max":600.0,"price":{"LPG":420.0,"Naphtha":500.0,"Distillate":620.0,"Residue":430.0,"Regular":690.0,"Premium":750.0},"demand":{"Regular":1500.0,"Premium":900.0},"rvp_max":60.0,"ron_min":{"Regular":91.0,"Premium":95.0}},"ron":{"LSR":70.0,"Reformate":98.0,"Butane":94.0,"Alkylate":96.0},"rvp":{"LSR":80.0,"Reformate":25.0,"Butane":360.0,"Alkylate":30.0},"rvp_index_spec":166.98946102282443}}};

const LAB_SRC = "\"\"\"2105623 Session 2: LP models for blending, planning and flowsheets.\n\nPart A  Lecture: blending two gasoline grades from five components. Ratio\n        specifications written as linear rows; Reid vapor pressure blended on\n        the right basis (an index) or the wrong one (linear); the vertex count;\n        convex and concave price tiers; a linear-fractional objective.\nPart B  Lab 2: a small refinery written as a stream table (one balance row per\n        stream, one column per activity), with the gasoline pool on top.\n\nAll data are synthetic but of realistic size. Volumes in m3/d, prices in USD/m3.\nRuns in the browser (Pyodide: NumPy, SciPy/HiGHS) and in desktop Python.\n    python blending_lab.py          print every part\n    python blending_lab.py --json   write blending-results.json for the slides and the lab page\n\"\"\"\nimport json\nimport sys\n\nimport numpy as np\nfrom scipy.optimize import linprog\n\nEXPO = 1.25                      # RVP blending index: I(R) = R ** 1.25 (blends linearly by volume)\n\n\ndef rvp_index(r):\n    return np.asarray(r, float) ** EXPO\n\n\ndef rvp_from_index(i):\n    return float(np.asarray(i, float) ** (1 / EXPO))\n\n\nclass LP:\n    \"\"\"A tiny named-row, named-column LP builder on top of scipy.optimize.linprog (HiGHS).\"\"\"\n\n    def __init__(self):\n        self.cols, self.obj, self.ub = [], [], []\n        self.rows = []                                   # (name, {col: coef}, sense, rhs)\n\n    def var(self, name, obj=0.0, ub=None):\n        self.cols.append(name); self.obj.append(obj); self.ub.append(ub)\n\n    def row(self, name, terms, sense, rhs=0.0):\n        self.rows.append((name, dict(terms), sense, float(rhs)))\n\n    def solve(self, maximize=True):\n        n, ix = len(self.cols), {c: k for k, c in enumerate(self.cols)}\n        def mat(sel):\n            R = [r for r in self.rows if r[2] in sel]\n            A = np.zeros((len(R), n)); b = np.zeros(len(R))\n            for k, (_, t, s, rhs) in enumerate(R):\n                sg = -1.0 if s == \">=\" else 1.0\n                for c, a in t.items():\n                    A[k, ix[c]] += sg * a\n                b[k] = sg * rhs\n            return R, A, b\n        Ru, Au, bu = mat((\"<=\", \">=\")); Re, Ae, be = mat((\"==\",))\n        c = -np.array(self.obj) if maximize else np.array(self.obj)\n        res = linprog(c, A_ub=Au if len(Ru) else None, b_ub=bu if len(Ru) else None,\n                      A_eq=Ae if len(Re) else None, b_eq=be if len(Re) else None,\n                      bounds=[(0, u) for u in self.ub], method=\"highs\")\n        if res.status != 0:\n            return {\"status\": {2: \"infeasible\", 3: \"unbounded\"}.get(res.status, res.message)}\n        x = {k: float(v) for k, v in zip(self.cols, res.x.round(9) + 0.0)}\n        sg = -1.0 if maximize else 1.0\n        duals, slack = {}, {}\n        for (name, t, s, rhs), y in zip(Ru, res.ineqlin.marginals if len(Ru) else []):\n            duals[name] = float(sg * y * (-1.0 if s == \">=\" else 1.0))\n            slack[name] = float(abs(rhs - sum(a * x[c] for c, a in t.items())))\n        for (name, t, s, rhs), y in zip(Re, res.eqlin.marginals if len(Re) else []):\n            duals[name] = float(sg * y); slack[name] = 0.0\n        scale = {r[0]: max(1.0, abs(r[3]), sum(abs(a * x[c]) for c, a in r[1].items())) for r in self.rows}\n        tight_rows = [r[0] for r in self.rows if slack[r[0]] <= 1e-7 * scale[r[0]]]\n        tight_ub = [c for c, u in zip(self.cols, self.ub) if u is not None and abs(x[c] - u) <= 1e-7 * max(1, u)]\n        return {\"status\": \"optimal\", \"obj\": float(sg * res.fun), \"x\": x, \"duals\": duals, \"slack\": slack,\n                \"tight_rows\": tight_rows, \"tight_ub\": tight_ub,\n                \"positive\": [c for c in self.cols if x[c] > 1e-7]}\n\n\n# ---------------------------------------------------------------------------\n# Part A. Lecture: a two-grade gasoline blend\n# ---------------------------------------------------------------------------\nCOMP = [\"Butane\", \"LSR naphtha\", \"Reformate\", \"FCC gasoline\", \"Alkylate\"]\nRON = {\"Butane\": 94.0, \"LSR naphtha\": 70.0, \"Reformate\": 98.0, \"FCC gasoline\": 92.0, \"Alkylate\": 96.0}\nRVP = {\"Butane\": 360.0, \"LSR naphtha\": 80.0, \"Reformate\": 25.0, \"FCC gasoline\": 50.0, \"Alkylate\": 30.0}   # kPa\nCOST = {\"Butane\": 380.0, \"LSR naphtha\": 520.0, \"Reformate\": 640.0, \"FCC gasoline\": 600.0, \"Alkylate\": 700.0}\nAVAIL = {\"Butane\": 300.0, \"LSR naphtha\": 900.0, \"Reformate\": 1200.0, \"FCC gasoline\": 1500.0, \"Alkylate\": 600.0}\nGRADES = [\"Regular\", \"Premium\"]\nRON_MIN = {\"Regular\": 91.0, \"Premium\": 95.0}\nRVP_MAX = 60.0\nPRICE = {\"Regular\": 690.0, \"Premium\": 750.0}\nDEMAND = {\"Regular\": 2500.0, \"Premium\": 1500.0}\n\n\ndef blend(ron_min=None, rvp_max=RVP_MAX, rvp_basis=\"index\", avail=None, price=None, demand=None):\n    \"\"\"Maximize the daily margin of the two-grade blend.\n    rvp_basis = 'index' blends R**1.25 by volume (correct); 'linear' blends R itself (the common error).\"\"\"\n    ron_min = dict(RON_MIN, **(ron_min or {})); avail = dict(AVAIL, **(avail or {}))\n    price = dict(PRICE, **(price or {})); demand = dict(DEMAND, **(demand or {}))\n    f = rvp_index if rvp_basis == \"index\" else (lambda r: np.asarray(r, float))\n    m = LP()\n    for i in COMP:\n        for g in GRADES:\n            m.var(f\"{i}>{g}\", obj=price[g] - COST[i])\n    for i in COMP:\n        m.row(f\"avail {i}\", {f\"{i}>{g}\": 1 for g in GRADES}, \"<=\", avail[i])\n    for g in GRADES:\n        m.row(f\"demand {g}\", {f\"{i}>{g}\": 1 for i in COMP}, \"<=\", demand[g])\n        # sum_i (RON_i - RON_min) x_ig >= 0   <=>   blend RON >= RON_min whenever the grade is made\n        m.row(f\"RON {g}\", {f\"{i}>{g}\": RON[i] - ron_min[g] for i in COMP}, \">=\")\n        m.row(f\"RVP {g}\", {f\"{i}>{g}\": float(f(RVP[i]) - f(rvp_max)) for i in COMP}, \"<=\")\n    r = m.solve()\n    if r[\"status\"] != \"optimal\":\n        return r\n    out = {\"status\": \"optimal\", \"margin\": r[\"obj\"], \"recipe\": {}, \"props\": {}, \"tight\": r[\"tight_rows\"],\n           \"positive\": r[\"positive\"], \"duals\": r[\"duals\"]}\n    for g in GRADES:\n        v = {i: r[\"x\"][f\"{i}>{g}\"] for i in COMP}; V = sum(v.values())\n        out[\"recipe\"][g] = v\n        if V > 1e-9:\n            w = {i: v[i] / V for i in COMP}\n            out[\"props\"][g] = {\"volume\": V, \"RON\": sum(w[i] * RON[i] for i in COMP),\n                               \"RVP_true\": rvp_from_index(sum(w[i] * rvp_index(RVP[i]) for i in COMP)),\n                               \"RVP_linear\": sum(w[i] * RVP[i] for i in COMP)}\n        else:\n            out[\"props\"][g] = {\"volume\": 0.0}\n    out[\"n_positive\"], out[\"n_tight\"] = len(r[\"positive\"]), len(r[\"tight_rows\"])\n    return out\n\n\ndef butane_curve(base=(\"Reformate\", \"FCC gasoline\"), fractions=np.linspace(0, 0.2, 21)):\n    \"\"\"True (index) and linear RVP of a 50/50 reformate + FCC gasoline base with added butane.\"\"\"\n    out = []\n    for fb in fractions:\n        w = {base[0]: (1 - fb) / 2, base[1]: (1 - fb) / 2, \"Butane\": fb}\n        out.append({\"butane\": float(fb), \"linear\": sum(w[i] * RVP[i] for i in w),\n                    \"true\": rvp_from_index(sum(w[i] * rvp_index(RVP[i]) for i in w))})\n    return out\n\n\nTIER = 300.0                     # m3/d in each alkylate price tier\n\n\ndef _tier_lp(p1, p2, tier1_lb=0.0, tier2_ub=TIER, tier1_ub=TIER):\n    m = LP()\n    for i in COMP:\n        for g in GRADES:\n            m.var(f\"{i}>{g}\", obj=PRICE[g] - (0.0 if i == \"Alkylate\" else COST[i]))\n    m.var(\"tier1\", obj=-p1, ub=tier1_ub); m.var(\"tier2\", obj=-p2, ub=tier2_ub)\n    if tier1_lb:\n        m.row(\"tier 1 used first\", {\"tier1\": 1}, \">=\", tier1_lb)\n    m.row(\"alkylate bought\", {**{f\"Alkylate>{g}\": 1 for g in GRADES}, \"tier1\": -1, \"tier2\": -1}, \"==\")\n    for i in COMP:\n        if i != \"Alkylate\":\n            m.row(f\"avail {i}\", {f\"{i}>{g}\": 1 for g in GRADES}, \"<=\", AVAIL[i])\n    for g in GRADES:\n        m.row(f\"demand {g}\", {f\"{i}>{g}\": 1 for i in COMP}, \"<=\", DEMAND[g])\n        m.row(f\"RON {g}\", {f\"{i}>{g}\": RON[i] - RON_MIN[g] for i in COMP}, \">=\")\n        m.row(f\"RVP {g}\", {f\"{i}>{g}\": float(rvp_index(RVP[i]) - rvp_index(RVP_MAX)) for i in COMP}, \"<=\")\n    return m.solve()\n\n\ndef price_tiers(rising=(720.0, 780.0), discount=(780.0, 700.0)):\n    \"\"\"Alkylate bought in two tiers of 300 m3/d. Rising prices (a convex cost) are an LP.\n    A volume discount (a concave cost) is not: the LP buys the cheap second tier without the first.\n    The correct answer for the discount enumerates the two segments, which is what a binary does.\"\"\"\n    out = {}\n    for name, (p1, p2) in ((\"rising\", rising), (\"discount\", discount)):\n        r = _tier_lp(p1, p2); t1, t2 = r[\"x\"][\"tier1\"], r[\"x\"][\"tier2\"]; q = t1 + t2\n        true_cost = p1 * min(q, TIER) + p2 * max(q - TIER, 0.0)\n        out[name] = {\"p1\": p1, \"p2\": p2, \"tier1\": t1, \"tier2\": t2, \"alkylate\": q,\n                     \"lp_cost\": p1 * t1 + p2 * t2, \"true_cost\": true_cost, \"lp_margin\": r[\"obj\"],\n                     \"true_margin\": r[\"obj\"] + (p1 * t1 + p2 * t2) - true_cost}\n    p1, p2 = discount\n    seg1 = _tier_lp(p1, p2, tier2_ub=0.0)                        # stay in tier 1\n    seg2 = _tier_lp(p1, p2, tier1_lb=TIER)                       # fill tier 1, then tier 2\n    best = max((seg1, seg2), key=lambda r: r[\"obj\"])\n    out[\"discount\"][\"correct\"] = {\"alkylate\": best[\"x\"][\"tier1\"] + best[\"x\"][\"tier2\"], \"margin\": best[\"obj\"],\n                                  \"segments\": [seg1[\"obj\"], seg2[\"obj\"]]}\n    return out\n\n\ndef charnes_cooper(fixed=40000.0, vmax=3000.0):\n    \"\"\"Cheapest premium blend per m3 when the batch carries a fixed daily cost F:\n       min (sum c_i x_i + F) / sum x_i   s.t. specs, availability, sum x_i <= vmax.\n    Charnes-Cooper: t = 1 / sum x_i, y = t x gives an LP in (y, t).\"\"\"\n    m = LP()\n    for i in COMP:\n        m.var(f\"y {i}\", obj=COST[i])\n    m.var(\"t\", obj=fixed)\n    m.row(\"normalize\", {f\"y {i}\": 1 for i in COMP}, \"==\", 1.0)\n    for i in COMP:\n        m.row(f\"avail {i}\", {f\"y {i}\": 1, \"t\": -AVAIL[i]}, \"<=\")\n    m.row(\"tank\", {\"t\": vmax}, \">=\", 1.0)                      # sum x = 1/t <= vmax\n    m.row(\"RON\", {f\"y {i}\": RON[i] - RON_MIN[\"Premium\"] for i in COMP}, \">=\")\n    m.row(\"RVP\", {f\"y {i}\": float(rvp_index(RVP[i]) - rvp_index(RVP_MAX)) for i in COMP}, \"<=\")\n    r = m.solve(maximize=False); t = r[\"x\"][\"t\"]\n    V = 1 / t\n    # check by brute force: for a fixed volume V the problem is an ordinary LP\n    def cost_at(V):\n        q = LP()\n        for i in COMP:\n            q.var(i, obj=COST[i], ub=AVAIL[i])\n        q.row(\"volume\", {i: 1 for i in COMP}, \"==\", V)\n        q.row(\"RON\", {i: RON[i] - RON_MIN[\"Premium\"] for i in COMP}, \">=\")\n        q.row(\"RVP\", {i: float(rvp_index(RVP[i]) - rvp_index(RVP_MAX)) for i in COMP}, \"<=\")\n        s = q.solve(maximize=False)\n        return (s[\"obj\"] + fixed) / V if s[\"status\"] == \"optimal\" else None\n    scan = [{\"V\": float(v), \"cost_per_m3\": cost_at(v)} for v in np.linspace(500, vmax, 26)]\n    return {\"fixed\": fixed, \"vmax\": vmax, \"volume\": V, \"cost_per_m3\": r[\"obj\"],\n            \"recipe\": {i: r[\"x\"][f\"y {i}\"] * V for i in COMP}, \"scan\": scan}\n\n\ndef spec_rows():\n    \"\"\"The eight specification rows of the two-grade blend, coefficient by coefficient.\"\"\"\n    out = []\n    for i in COMP:\n        out.append({\"comp\": i, \"RON\": RON[i], \"RVP\": RVP[i], \"index\": float(rvp_index(RVP[i])),\n                    \"ron_reg\": RON[i] - RON_MIN[\"Regular\"], \"ron_pre\": RON[i] - RON_MIN[\"Premium\"],\n                    \"rvp_row\": float(rvp_index(RVP[i]) - rvp_index(RVP_MAX))})\n    return {\"rows\": out, \"index_spec\": float(rvp_index(RVP_MAX))}\n\n\ndef recompute_premium():\n    \"\"\"Recompute Premium's octane and true RVP from the optimal recipe, term by term.\"\"\"\n    b = blend(); v = b[\"recipe\"][\"Premium\"]; V = sum(v.values())\n    terms = [{\"comp\": i, \"v\": v[i], \"v_ron\": v[i] * RON[i], \"index\": float(rvp_index(RVP[i])),\n              \"v_index\": float(v[i] * rvp_index(RVP[i]))} for i in COMP if v[i] > 1e-9]\n    avg_index = sum(t[\"v_index\"] for t in terms) / V\n    return {\"terms\": terms, \"volume\": V, \"ron\": sum(t[\"v_ron\"] for t in terms) / V,\n            \"avg_index\": avg_index, \"rvp_true\": rvp_from_index(avg_index)}\n\n\ndef spec_dual():\n    \"\"\"The dual of the Premium octane row, converted into USD/d per octane number:\n    raising Q by dQ is the same as asking sum_i (RON_i - Q) x_i >= dQ * V, so d(margin)/dQ = dual * V.\"\"\"\n    b = blend(); y = b[\"duals\"][\"RON Premium\"]; V = b[\"props\"][\"Premium\"][\"volume\"]\n    up = blend(ron_min={\"Premium\": RON_MIN[\"Premium\"] + 0.01})\n    return {\"dual\": y, \"volume\": V, \"predicted_per_ron\": y * V,\n            \"finite_difference_per_ron\": (up[\"margin\"] - b[\"margin\"]) / 0.01}\n\n\ndef line_fits(outlier=False):\n    \"\"\"Fit y = a + b x to plant data three ways. L1 and L-infinity fits are LPs (epigraph);\n    least squares is a QP solved here by lstsq. An outlier shows how each one responds.\"\"\"\n    x = np.array([10, 15, 20, 25, 30, 35, 40, 45], float)\n    y = np.array([7.1, 9.4, 12.2, 14.4, 17.3, 19.4, 22.2, 24.6])\n    if outlier:\n        y = y.copy(); y[6] = 30.0\n    n = len(x)\n    ls = np.linalg.lstsq(np.vstack([np.ones(n), x]).T, y, rcond=None)[0]\n    # L1: min sum t_i, t_i >= +/-(y_i - a - b x_i); variables a, b, t\n    c = np.concatenate([[0, 0], np.ones(n)])\n    A = np.vstack([np.hstack([-np.ones((n, 1)), -x[:, None], -np.eye(n)]), np.hstack([np.ones((n, 1)), x[:, None], -np.eye(n)])])\n    r1 = linprog(c, A_ub=A, b_ub=np.concatenate([-y, y]), bounds=[(None, None)] * 2 + [(0, None)] * n, method=\"highs\")\n    # L-infinity: min t, t >= +/-(y_i - a - b x_i)\n    A2 = np.vstack([np.hstack([-np.ones((n, 1)), -x[:, None], -np.ones((n, 1))]), np.hstack([np.ones((n, 1)), x[:, None], -np.ones((n, 1))])])\n    r2 = linprog([0, 0, 1], A_ub=A2, b_ub=np.concatenate([-y, y]), bounds=[(None, None)] * 2 + [(0, None)], method=\"highs\")\n    fit = lambda ab: {\"a\": float(ab[0]), \"b\": float(ab[1]), \"max_abs\": float(np.max(np.abs(y - ab[0] - ab[1] * x))),\n                      \"sum_abs\": float(np.sum(np.abs(y - ab[0] - ab[1] * x))), \"sum_sq\": float(np.sum((y - ab[0] - ab[1] * x) ** 2))}\n    return {\"x\": x.tolist(), \"y\": y.tolist(), \"ls\": fit(ls), \"l1\": fit(r1.x[:2]), \"linf\": fit(r2.x[:2])}\n\n\n# A small pooling problem: two crudes share one tank before the two grades; a third goes direct.\nPOOL_DATA = {\"S\": {\"A\": 3.2, \"B\": 0.8, \"C\": 2.3}, \"cost\": {\"A\": 5.2, \"B\": 15.7, \"C\": 11.6},   # wt% sulfur, USD/t\n             \"price\": {\"X\": 8.7, \"Y\": 16.7}, \"demand\": {\"X\": 100.0, \"Y\": 200.0}, \"smax\": {\"X\": 2.7, \"Y\": 1.3}}\n\n\ndef pooling(starts=40, seed=1):\n    \"\"\"Sulfur balance in the shared tank: q (a + b) = S_A a + S_B b, with q a variable: bilinear.\n    A local NLP method (SLSQP) from random starts; and the LP if every crude had its own tank.\"\"\"\n    from scipy.optimize import minimize\n    d = POOL_DATA; S, cst, P, D, Q = d[\"S\"], d[\"cost\"], d[\"price\"], d[\"demand\"], d[\"smax\"]\n    def neg_profit(v):\n        a, b, px, py, cx, cy, q = v\n        return -(P[\"X\"] * (px + cx) + P[\"Y\"] * (py + cy) - cst[\"A\"] * a - cst[\"B\"] * b - cst[\"C\"] * (cx + cy))\n    cons = [{\"type\": \"eq\", \"fun\": lambda v: v[0] + v[1] - v[2] - v[3]},\n            {\"type\": \"eq\", \"fun\": lambda v: v[6] * (v[2] + v[3]) - S[\"A\"] * v[0] - S[\"B\"] * v[1]},\n            {\"type\": \"ineq\", \"fun\": lambda v: Q[\"X\"] * (v[2] + v[4]) - v[6] * v[2] - S[\"C\"] * v[4]},\n            {\"type\": \"ineq\", \"fun\": lambda v: Q[\"Y\"] * (v[3] + v[5]) - v[6] * v[3] - S[\"C\"] * v[5]},\n            {\"type\": \"ineq\", \"fun\": lambda v: D[\"X\"] - v[2] - v[4]}, {\"type\": \"ineq\", \"fun\": lambda v: D[\"Y\"] - v[3] - v[5]}]\n    bnds = [(0, 300)] * 6 + [(S[\"B\"], S[\"A\"])]\n    rng = np.random.default_rng(seed); runs = []\n    for k in range(starts):\n        x0 = np.concatenate([rng.uniform(0, 200, 6), [rng.uniform(S[\"B\"], S[\"A\"])]])\n        r = minimize(neg_profit, x0, method=\"SLSQP\", bounds=bnds, constraints=cons, options={\"maxiter\": 500, \"ftol\": 1e-9})\n        runs.append({\"start\": k + 1, \"ok\": bool(r.success), \"profit\": float(-r.fun), \"x\": [round(float(v), 3) for v in r.x]})\n    # each crude in its own tank: blend A, B, C straight into X and Y, which is an LP\n    m = LP()\n    for c_ in \"ABC\":\n        for g in \"XY\":\n            m.var(f\"{c_}>{g}\", obj=P[g] - cst[c_])\n    for g in \"XY\":\n        m.row(f\"demand {g}\", {f\"{c_}>{g}\": 1 for c_ in \"ABC\"}, \"<=\", D[g])\n        m.row(f\"S {g}\", {f\"{c_}>{g}\": S[c_] - Q[g] for c_ in \"ABC\"}, \"<=\")\n    lp = m.solve()\n    vals = sorted({round(r[\"profit\"], 1) for r in runs if r[\"ok\"]})\n    return {\"data\": d, \"runs\": runs, \"distinct\": [{\"profit\": v, \"count\": sum(1 for r in runs if r[\"ok\"] and round(r[\"profit\"], 1) == v)} for v in vals],\n            \"separate_tanks_lp\": lp[\"obj\"]}\n\n\n# ---------------------------------------------------------------------------\n# Part B. Lab 2: a small refinery as a stream table\n# ---------------------------------------------------------------------------\nCDU_YIELD = {\"LPG\": 0.02, \"LSR\": 0.10, \"HN\": 0.18, \"Distillate\": 0.38, \"Residue\": 0.32}   # m3 per m3 crude\nREF_YIELD = {\"Reformate\": 0.85, \"LPG\": 0.15}                                             # m3 per m3 heavy naphtha\nLAB = {\"crude_price\": 480.0, \"cdu_cap\": 8000.0, \"ref_cap\": 1100.0, \"ref_opex\": 25.0,\n       \"butane_price\": 380.0, \"butane_max\": 300.0, \"alkylate_price\": 700.0, \"alkylate_max\": 600.0,\n       \"price\": {\"LPG\": 420.0, \"Naphtha\": 500.0, \"Distillate\": 620.0, \"Residue\": 430.0,\n                 \"Regular\": 690.0, \"Premium\": 750.0},\n       \"demand\": {\"Regular\": 1500.0, \"Premium\": 900.0}, \"rvp_max\": 60.0,\n       \"ron_min\": {\"Regular\": 91.0, \"Premium\": 95.0}}\nPOOL = [\"LSR\", \"Reformate\", \"Butane\", \"Alkylate\"]\nLAB_RON = {\"LSR\": 70.0, \"Reformate\": 98.0, \"Butane\": 94.0, \"Alkylate\": 96.0}\nLAB_RVP = {\"LSR\": 80.0, \"Reformate\": 25.0, \"Butane\": 360.0, \"Alkylate\": 30.0}\n\n\ndef refinery(rvp_basis=\"index\", ref_cap=None, premium_price=None, rvp_max=None, ron_premium=None,\n             details=True):\n    \"\"\"Stream-table LP. Columns are activities; each intermediate stream has one balance row:\n       (made by activities) - (used by activities) - (sold) = 0.\"\"\"\n    d = LAB; P = dict(d[\"price\"])\n    if premium_price is not None:\n        P[\"Premium\"] = premium_price\n    ref_cap = d[\"ref_cap\"] if ref_cap is None else ref_cap\n    rvp_max = d[\"rvp_max\"] if rvp_max is None else rvp_max\n    ron_min = dict(d[\"ron_min\"]); ron_min[\"Premium\"] = ron_min[\"Premium\"] if ron_premium is None else ron_premium\n    f = rvp_index if rvp_basis == \"index\" else (lambda r: np.asarray(r, float))\n    m = LP()\n    m.var(\"CDU\", obj=-d[\"crude_price\"])                                 # crude bought and distilled\n    m.var(\"REF\", obj=-d[\"ref_opex\"])                                    # heavy naphtha reformed\n    m.var(\"buy Butane\", obj=-d[\"butane_price\"])\n    m.var(\"buy Alkylate\", obj=-d[\"alkylate_price\"])\n    for s in (\"LPG\", \"Distillate\", \"Residue\"):\n        m.var(f\"sell {s}\", obj=P[s])\n    m.var(\"sell LSR as naphtha\", obj=P[\"Naphtha\"]); m.var(\"sell HN as naphtha\", obj=P[\"Naphtha\"])\n    for g in GRADES:\n        for i in POOL:\n            m.var(f\"{i}>{g}\", obj=P[g])\n    bl = lambda i: {f\"{i}>{g}\": -1 for g in GRADES}\n    m.row(\"LPG\", {\"CDU\": CDU_YIELD[\"LPG\"], \"REF\": REF_YIELD[\"LPG\"], \"sell LPG\": -1}, \"==\")\n    m.row(\"LSR\", {\"CDU\": CDU_YIELD[\"LSR\"], \"sell LSR as naphtha\": -1, **bl(\"LSR\")}, \"==\")\n    m.row(\"HN\", {\"CDU\": CDU_YIELD[\"HN\"], \"REF\": -1, \"sell HN as naphtha\": -1}, \"==\")\n    m.row(\"Reformate\", {\"REF\": REF_YIELD[\"Reformate\"], **bl(\"Reformate\")}, \"==\")\n    m.row(\"Distillate\", {\"CDU\": CDU_YIELD[\"Distillate\"], \"sell Distillate\": -1}, \"==\")\n    m.row(\"Residue\", {\"CDU\": CDU_YIELD[\"Residue\"], \"sell Residue\": -1}, \"==\")\n    m.row(\"Butane\", {\"buy Butane\": 1, **bl(\"Butane\")}, \"==\")\n    m.row(\"Alkylate\", {\"buy Alkylate\": 1, **bl(\"Alkylate\")}, \"==\")\n    m.row(\"capacity CDU\", {\"CDU\": 1}, \"<=\", d[\"cdu_cap\"])\n    m.row(\"capacity reformer\", {\"REF\": 1}, \"<=\", ref_cap)\n    m.row(\"supply Butane\", {\"buy Butane\": 1}, \"<=\", d[\"butane_max\"])\n    m.row(\"supply Alkylate\", {\"buy Alkylate\": 1}, \"<=\", d[\"alkylate_max\"])\n    for g in GRADES:\n        m.row(f\"demand {g}\", {f\"{i}>{g}\": 1 for i in POOL}, \"<=\", d[\"demand\"][g])\n        m.row(f\"RON {g}\", {f\"{i}>{g}\": LAB_RON[i] - ron_min[g] for i in POOL}, \">=\")\n        m.row(f\"RVP {g}\", {f\"{i}>{g}\": float(f(LAB_RVP[i]) - f(rvp_max)) for i in POOL}, \"<=\")\n    r = m.solve()\n    if r[\"status\"] != \"optimal\":\n        return r\n    x = r[\"x\"]\n    out = {\"status\": \"optimal\", \"profit\": r[\"obj\"], \"x\": x}\n    if not details:\n        return out\n    grades = {}\n    for g in GRADES:\n        v = {i: x[f\"{i}>{g}\"] for i in POOL}; V = sum(v.values())\n        w = {i: v[i] / V for i in POOL} if V > 0 else None\n        grades[g] = {\"recipe\": v, \"volume\": V,\n                     \"RON\": sum(w[i] * LAB_RON[i] for i in POOL) if w else None,\n                     \"RVP_true\": rvp_from_index(sum(w[i] * rvp_index(LAB_RVP[i]) for i in POOL)) if w else None,\n                     \"RVP_linear\": sum(w[i] * LAB_RVP[i] for i in POOL) if w else None}\n    inflow = x[\"CDU\"] + x[\"buy Butane\"] + x[\"buy Alkylate\"]\n    outflow = (x[\"sell LPG\"] + x[\"sell Distillate\"] + x[\"sell Residue\"] + x[\"sell LSR as naphtha\"]\n               + x[\"sell HN as naphtha\"] + grades[\"Regular\"][\"volume\"] + grades[\"Premium\"][\"volume\"])\n    out.update({\"grades\": grades, \"closure\": {\"in\": inflow, \"out\": outflow, \"difference\": inflow - outflow},\n                \"tight\": r[\"tight_rows\"], \"n_positive\": len(r[\"positive\"]), \"positive\": r[\"positive\"],\n                \"n_tight\": len(r[\"tight_rows\"]), \"n_cols\": len(x), \"n_rows\": len(m.rows),\n                \"duals\": r[\"duals\"], \"slack\": r[\"slack\"],\n                \"rows\": [{\"name\": nm, \"sense\": se, \"rhs\": rh} for nm, _, se, rh in m.rows]})\n    return out\n\n\ndef stream_dof():\n    \"\"\"Degrees of freedom of the refinery stream table: columns minus the rank of the balance rows.\"\"\"\n    names = [\"LPG\", \"LSR\", \"HN\", \"Reformate\", \"Distillate\", \"Residue\", \"Butane\", \"Alkylate\"]\n    cols = [\"CDU\", \"REF\", \"buy Butane\", \"buy Alkylate\", \"sell LPG\", \"sell Distillate\", \"sell Residue\",\n            \"sell LSR as naphtha\", \"sell HN as naphtha\"] + [f\"{i}>{g}\" for g in GRADES for i in POOL]\n    ix = {c: k for k, c in enumerate(cols)}\n    A = np.zeros((len(names), len(cols)))\n    def put(r, terms):\n        for c, a in terms.items():\n            A[names.index(r), ix[c]] += a\n    bl = lambda i: {f\"{i}>{g}\": -1 for g in GRADES}\n    put(\"LPG\", {\"CDU\": CDU_YIELD[\"LPG\"], \"REF\": REF_YIELD[\"LPG\"], \"sell LPG\": -1})\n    put(\"LSR\", {\"CDU\": CDU_YIELD[\"LSR\"], \"sell LSR as naphtha\": -1, **bl(\"LSR\")})\n    put(\"HN\", {\"CDU\": CDU_YIELD[\"HN\"], \"REF\": -1, \"sell HN as naphtha\": -1})\n    put(\"Reformate\", {\"REF\": REF_YIELD[\"Reformate\"], **bl(\"Reformate\")})\n    put(\"Distillate\", {\"CDU\": CDU_YIELD[\"Distillate\"], \"sell Distillate\": -1})\n    put(\"Residue\", {\"CDU\": CDU_YIELD[\"Residue\"], \"sell Residue\": -1})\n    put(\"Butane\", {\"buy Butane\": 1, **bl(\"Butane\")}); put(\"Alkylate\", {\"buy Alkylate\": 1, **bl(\"Alkylate\")})\n    rank = int(np.linalg.matrix_rank(A))\n    return {\"columns\": len(cols), \"balance_rows\": len(names), \"rank\": rank, \"dof\": len(cols) - rank,\n            \"column_sums\": {c: round(float(A[:, ix[c]].sum()), 9) for c in (\"CDU\", \"REF\")}}\n\n\ndef lab_results():\n    base = refinery()\n    lin = refinery(rvp_basis=\"linear\")\n    up = refinery(ref_cap=LAB[\"ref_cap\"] + 1.0, details=False)\n    # the dual of the reformer row, checked by re-solving with one more m3/d\n    shadow_ref = {\"dual\": base[\"duals\"][\"capacity reformer\"], \"finite_difference\": up[\"profit\"] - base[\"profit\"]}\n    lo, hi = 690.0, 810.0                       # premium price at which the plan switches (bisection)\n    plan = lambda p: round(refinery(premium_price=p, details=False)[\"x\"][\"Reformate>Premium\"], 6)\n    hi_plan = plan(hi)\n    for _ in range(40):\n        mid = (lo + hi) / 2\n        lo, hi = (lo, mid) if plan(mid) == hi_plan else (mid, hi)\n    sweeps = {\n        \"premium_price\": [{\"value\": p, **_brief(refinery(premium_price=p))} for p in np.arange(690.0, 811.0, 5.0)],\n        \"ref_cap\": [{\"value\": c, **_brief(refinery(ref_cap=c))} for c in np.arange(700.0, 1651.0, 50.0)],\n        \"rvp_max\": [{\"value\": v, **_brief(refinery(rvp_max=v))} for v in np.arange(50.0, 72.5, 2.5)],\n    }\n    return {\"base\": base, \"linear_rvp\": lin, \"shadow_reformer\": shadow_ref, \"premium_breakpoint\": (lo + hi) / 2,\n            \"linear_rvp_true_check\": {g: lin[\"grades\"][g][\"RVP_true\"] for g in GRADES},\n            \"sweeps\": sweeps,\n            \"data\": {\"cdu_yield\": CDU_YIELD, \"ref_yield\": REF_YIELD, \"lab\": LAB, \"ron\": LAB_RON, \"rvp\": LAB_RVP,\n                     \"rvp_index_spec\": float(rvp_index(LAB[\"rvp_max\"]))}}\n\n\ndef _brief(r):\n    g = r[\"grades\"]\n    return {\"profit\": r[\"profit\"], \"regular\": g[\"Regular\"][\"volume\"], \"premium\": g[\"Premium\"][\"volume\"],\n            \"butane\": r[\"x\"][\"buy Butane\"], \"alkylate\": r[\"x\"][\"buy Alkylate\"], \"REF\": r[\"x\"][\"REF\"],\n            \"lsr_naphtha\": r[\"x\"][\"sell LSR as naphtha\"]}\n\n\ndef classroom_results():\n    R = {\"meta\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__,\n                  \"python\": sys.version.split()[0]}}\n    base = blend()\n    R[\"lecture\"] = {\n        \"data\": {\"comp\": COMP, \"ron\": RON, \"rvp\": RVP, \"cost\": COST, \"avail\": AVAIL, \"grades\": GRADES,\n                 \"ron_min\": RON_MIN, \"rvp_max\": RVP_MAX, \"price\": PRICE, \"demand\": DEMAND},\n        \"base\": base,\n        \"linear_rvp\": blend(rvp_basis=\"linear\"),\n        \"ron_sweep\": [dict(spec=float(s), **_lec(blend(ron_min={\"Premium\": float(s)})))\n                      for s in np.arange(93.0, 99.01, 0.25)],\n        \"rvp_sweep\": [dict(spec=float(s), **_lec(blend(rvp_max=float(s)))) for s in np.arange(45.0, 75.01, 2.5)],\n        \"butane_curve\": butane_curve(),\n        \"tiers\": price_tiers(),\n        \"charnes_cooper\": charnes_cooper(),\n        \"spec_rows\": spec_rows(),\n        \"recompute\": recompute_premium(),\n        \"spec_dual\": spec_dual(),\n        \"fits\": {\"clean\": line_fits(), \"outlier\": line_fits(outlier=True)},\n        \"pooling\": pooling(),\n        \"dof\": stream_dof(),\n    }\n    R[\"lab\"] = lab_results()\n    return R\n\n\ndef _lec(r):\n    if r[\"status\"] != \"optimal\":\n        return {\"status\": r[\"status\"]}\n    return {\"status\": \"optimal\", \"margin\": r[\"margin\"], \"premium\": r[\"recipe\"][\"Premium\"],\n            \"regular\": r[\"recipe\"][\"Regular\"], \"props\": r[\"props\"], \"n_positive\": r[\"n_positive\"],\n            \"n_tight\": r[\"n_tight\"], \"tight\": r[\"tight\"]}\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"blending-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote blending-results.json\")\n        sys.exit()\n    L = R[\"lecture\"]; b = L[\"base\"]\n    print(\"PART A  Two-grade blend\")\n    print(f\"  margin {b['margin']:.1f} USD/d; positive flows {b['n_positive']}, tight rows {b['n_tight']}: {b['tight']}\")\n    for g in GRADES:\n        print(f\"  {g}: \" + \", \".join(f\"{i} {v:.1f}\" for i, v in b[\"recipe\"][g].items() if v > 1e-6), \"|\",\n              {k: round(v, 2) for k, v in b[\"props\"][g].items()})\n    l = L[\"linear_rvp\"]\n    print(f\"  linear RVP model: margin {l['margin']:.1f}; true RVP \" +\n          \", \".join(f\"{g} {l['props'][g].get('RVP_true', 0):.2f}\" for g in GRADES))\n    print(\"  tiers:\", L[\"tiers\"])\n    cc = L[\"charnes_cooper\"]; print(f\"  Charnes-Cooper: V {cc['volume']:.1f}, cost/m3 {cc['cost_per_m3']:.2f}; scan\",\n                                    [(round(s['V']), round(s['cost_per_m3'], 2) if s['cost_per_m3'] else None) for s in cc[\"scan\"]])\n    for s in L[\"ron_sweep\"]:\n        print(\"   RON\", s[\"spec\"], s.get(\"status\"), round(s.get(\"margin\", 0), 1), s.get(\"n_positive\"), s.get(\"n_tight\"))\n    print(\"PART B  Refinery\")\n    lb = R[\"lab\"][\"base\"]\n    print(f\"  profit {lb['profit']:.1f}; closure {lb['closure']}; positive {lb['n_positive']}, tight {lb['n_tight']}, cols {lb['n_cols']}, rows {lb['n_rows']}\")\n    print(\"  activities:\", {k: round(v, 1) for k, v in lb[\"x\"].items() if v > 1e-6})\n    for g in GRADES:\n        print(f\"  {g}:\", {k: round(v, 3) if isinstance(v, float) else v for k, v in lb[\"grades\"][g].items() if k != \"recipe\"},\n              {i: round(v, 1) for i, v in lb[\"grades\"][g][\"recipe\"].items()})\n    print(\"  tight:\", lb[\" let R = RECORDED, MODE = "recorded";
const C = {teal:"#0F6E6B",amber:"#E29A2D",rust:"#BE654C",sky:"#5A91BE",sage:"#83A462",plum:"#995A90",graphite:"#333F4A",sand:"#DFC98F",ink:"#1C242B",slate:"#66727C",mist:"#B9C1C6",paper:"#F3F0EB"};
const fmt = (x,d=0)=>x==null?"–":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

/* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks
  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";
  for(let k=0;k<=n;k++){const v=ymin+(ymax-ymin)*k/n, y=t+Y-(v-ymin)/(ymax-ymin)*Y;
    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  const z=t+Y-(0-ymin)/(ymax-ymin)*Y; s+=`<line x1="${l}" x2="${w-r}" y1="${Math.min(t+Y,Math.max(t,z))}" y2="${Math.min(t+Y,Math.max(t,z))}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;
  return s}
function ymap(o,v){const Y=o.h-o.t-o.b;return o.t+Y-(v-o.ymin)/(o.ymax-o.ymin)*Y}
function legend(items,x,y){let s="";items.forEach((it,i)=>{const yy=y+i*22;s+=it.line?`<line x1="${x}" x2="${x+22}" y1="${yy}" y2="${yy}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${x}" y="${yy-8}" width="16" height="16" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${x+28}" y="${yy+5}" font-size="16" fill="${C.ink}">${it.t}</text>`});return s}
function legendRow(items,x,y){let s="",xx=x;items.forEach(it=>{s+=it.line?`<line x1="${xx}" x2="${xx+20}" y1="${y}" y2="${y}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${xx}" y="${y-7}" width="14" height="14" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${xx+26}" y="${y+5}" font-size="16" fill="${C.ink}">${it.t}</text>`;xx+=38+it.t.length*8.2});return s}

/* Food Manufacture: stacked bars of a [month][oil] matrix, optional line */
function hbar(items,opt={}){ // items: {t,v,c}
  const w=opt.w||640,h=opt.h||330,l=opt.l||250,r=90,t=16,rowh=(h-t-20)/items.length;
  const mx=opt.max||niceMax(Math.max(...items.map(i=>i.v)));let s=svgEl(w,h);
  items.forEach((it,i)=>{const y=t+i*rowh,bw=(w-l-r)*it.v/mx;
    s+=`<text x="${l-12}" y="${y+rowh/2+5}" font-size="16" text-anchor="end" fill="${C.ink}">${it.t}</text><rect x="${l}" y="${y+rowh*0.18}" width="${Math.max(bw,1)}" height="${rowh*0.64}" fill="${it.c}" rx="3"/><text x="${l+bw+8}" y="${y+rowh/2+6}" font-size="17" font-weight="700" fill="${C.ink}">${opt.fmt?opt.fmt(it.v):fmt(it.v)}</text>`});
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${h-20}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  return s+"</svg>"}

function xyChart(o){ // series:[{pts:[[x,y]],c,dash,w,t}], xmin,xmax,ymin,ymax,xlab,ylab,marks,hline,xstep
  const w=o.w||620,h=o.h||430,l=o.l||84,r=24,t=18,b=58,X=w-l-r;let s=svgEl(w,h);const A=scale({w,h,l,r,t,b,ylab:o.ylab},o.ymin,o.ymax);
  const px=x=>l+X*(x-o.xmin)/(o.xmax-o.xmin),py=y=>ymap(A,y);s+=axes(A);
  for(let x=o.xmin;x<=o.xmax+1e-9;x+=o.xstep){s+=`<text x="${px(x)}" y="${h-b+24}" font-size="16" text-anchor="middle" fill="${C.ink}">${o.xfmt?o.xfmt(x):fmt(x)}</text>`}
  s+=`<text x="${l+X/2}" y="${h-8}" font-size="17" text-anchor="middle" fill="${C.ink}">${o.xlab}</text>`;
  if(o.band)s+=`<rect x="${px(o.band[0])}" y="${t}" width="${px(o.band[1])-px(o.band[0])}" height="${h-t-b}" fill="${C.sand}" opacity=".45"/>`;
  if(o.hline)s+=`<line x1="${l}" x2="${w-r}" y1="${py(o.hline.y)}" y2="${py(o.hline.y)}" stroke="${C.graphite}" stroke-width="1.6" stroke-dasharray="7 5"/><text x="${w-r-6}" y="${py(o.hline.y)-8}" font-size="16" text-anchor="end" fill="${C.graphite}">${o.hline.t}</text>`;
  o.series.forEach(se=>{s+=`<polyline fill="none" stroke="${se.c}" stroke-width="${se.w||3}" ${se.dash?'stroke-dasharray="8 6"':''} points="${se.pts.map(p=>`${px(p[0])},${py(p[1])}`).join(" ")}"/>`});
  (o.marks||[]).forEach(m=>{s+=`<circle cx="${px(m.x)}" cy="${py(m.y)}" r="7" fill="${m.c||C.amber}" stroke="#fff" stroke-width="2"/>`+(m.t?`<text x="${px(m.x)+(m.dx||10)}" y="${py(m.y)+(m.dy||-12)}" font-size="16" font-weight="700" text-anchor="${m.anchor||"start"}" fill="${C.ink}">${m.t}</text>`:"")});
  if(o.legend)s+=legend(o.legend,l+16,t+18);
  return s+"</svg>"}
function stackBars(rows,opt={}){ // rows:[{t, parts:{comp:v}}]
  const w=opt.w||620,h=opt.h||260,l=110,r=70,t=10,rowh=(h-t-(opt.leg?44:10))/rows.length,mx=opt.max;let s=svgEl(w,h);
  rows.forEach((row,k)=>{const y=t+k*rowh;let x=l;s+=`<text x="${l-12}" y="${y+rowh/2+6}" font-size="17" text-anchor="end" fill="${C.ink}">${row.t}</text>`;
    let tot=0;ORDER.forEach(c=>{const v=row.parts[c]||0;if(v<=1e-6)return;const bw=(w-l-r)*v/mx;s+=`<rect x="${x}" y="${y+rowh*.16}" width="${bw}" height="${rowh*.68}" fill="${CC[c]}"/>`;x+=bw;tot+=v});
    s+=`<text x="${x+8}" y="${y+rowh/2+6}" font-size="16" font-weight="700" fill="${C.ink}">${fmt(tot)}</text>`});
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+rows.length*rowh}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(opt.leg){let xx=10;ORDER.forEach(c=>{s+=`<rect x="${xx}" y="${h-24}" width="14" height="14" fill="${CC[c]}"/><text x="${xx+20}" y="${h-12}" font-size="15" fill="${C.ink}">${c}</text>`;xx+=c.length*7.6+36})}
  return s+"</svg>"}

S.push({kicker:"Part 1 · Blending basis", title:"Blend in the variable that blends linearly", html:()=>`<div class="body"><div class="col w40"><ul class="b xs">
<li>Octane is close to linear by volume (an approximation; real octane blending has interaction terms)</li>
<li>Vapor pressure is not. A common index blends linearly by volume: I = RVP<sup>1.25</sup></li>
<li>Row on the index basis: Σ<sub>i</sub> (RVP<sub>i</sub><sup>1.25</sup> − 60<sup>1.25</sup>) x<sub>ig</sub> ≤ 0. Butane: 1,568 − 167 = 1,401</li>
<li>I(R) is convex, so the true blend RVP is at least the volume average (power-mean inequality). A linear-RVP row <b>under-predicts</b> RVP and lets off-spec blends through</li></ul></div>
<div class="col"><div class="panel grow"><div class="chart" id="ch-bc"></div></div></div></div>`,

 series:[{pts:bc.map(p=>[p.butane,p.linear]),c:C.teal,dash:true},{pts:bc.map(p=>[p.butane,p.true]),c:C.amber}],

S.push({kicker:"Part 1 · Derivation", title:"Why a linear RVP row under-predicts: Jensen in two lines", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:21px;line-height:1.75">
Index I = φ(R) = R<sup>1.25</sup>: convex and increasing. Volume fractions w<sub>i</sub> ≥ 0, Σ w<sub>i</sub> = 1.<br>
True blend: φ(R<sub>blend</sub>) = Σ w<sub>i</sub> φ(R<sub>i</sub>) ≥ φ(Σ w<sub>i</sub> R<sub>i</sub>) &nbsp;(Jensen)<br>
φ increasing ⇒ R<sub>blend</sub> ≥ Σ w<sub>i</sub> R<sub>i</sub> = the linear average</div></div>
<p style="font-size:20px;margin:14px 0 0">10% butane in the 50/50 base: linear average <b>69.8 kPa</b>, true value <b>80.7 kPa</b>.</p></div>
<div class="col"><ul class="b xs"><li>The gap grows with the spread of the component values: one very volatile component in a heavy base is the worst case</li>
<li>General rule: if a property blends linearly through a convex increasing index, a row on the property itself is optimistic for a maximum limit</li>
<li>With a concave index the bias reverses. Work out the direction before trusting a shortcut</li>
<li>Viscosity and pour point also blend through indices; octane blending has interaction terms (Session 13)</li></ul></div></div>`});

S.push({kicker:"Part 1 · LP geometry", title:"Why an optimal blend uses few components", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:21px;line-height:1.6">
At a vertex of {x : Ax ≤ b, x ≥ 0} ⊂ ℝⁿ, n linearly independent constraints are tight.<br>
If p variables are positive, only n − p bounds x<sub>j</sub> ≥ 0 are tight, so at least p rows are tight:<br>
<b>positive variables ≤ tight rows</b></div></div>
<p style="font-size:20px;margin:14px 0 0">Base blend: <b id="vx"></b>. Ten flows are possible; the solver uses only what the tight rows can pay for.</p></div>
<div class="col"><ul class="b xs"><li>Simplex and interior point with crossover return a vertex. Interior point without crossover may return a point with every flow positive</li>
<li>Read a recipe through its tight rows: each positive flow is "paid for" by a binding spec, capacity or demand</li>
<li>Adding a specification can add a component to the blend; removing one can drop a component</li>
<li>Degenerate vertices have more tight rows than positive flows: at RON 98 in the demo, 6 positive and 7 tight</li></ul></div></div>`,
draw:()=>{const b=R.lecture.base;document.getElementById("vx").textContent=`${b.n_positive} positive flows, ${b.n_tight} tight rows`}});

S.push({kicker:"Part 3 · Reformulations", title:"Four nonlinear-looking models that are LPs", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:17.5px">
<tr><th>Looks like</th><th>LP form</th><th>Valid when</th></tr>
<tr><td>min max<sub>k</sub> (a<sub>k</sub>ᵀx + b<sub>k</sub>)</td><td>min t s.t. t ≥ a<sub>k</sub>ᵀx + b<sub>k</sub> for all k (epigraph)</td><td>minimizing a max, or maximizing a min</td></tr>
<tr><td>min Σ |x<sub>j</sub> − x̂<sub>j</sub>|</td><td>t<sub>j</sub> ≥ x<sub>j</sub> − x̂<sub>j</sub>, t<sub>j</sub> ≥ x̂<sub>j</sub> − x<sub>j</sub>, min Σ t<sub>j</sub></td><td>the absolute value is minimized, not maximized</td></tr>
<tr><td>Cost in tiers, c<sub>1</sub> up to q<sub>1</sub>, then c<sub>2</sub></td><td>q = q<sub>1</sub>′ + q<sub>2</sub>′, 0 ≤ q<sub>k</sub>′ ≤ size<sub>k</sub>, cost Σ c<sub>k</sub> q<sub>k</sub>′</td><td>c<sub>1</sub> ≤ c<sub>2</sub> (convex cost when minimized)</td></tr>
<tr><td>min (cᵀx + α) / (dᵀx + β)</td><td>Charnes–Cooper: t = 1/(dᵀx + β), y = t x, an LP in (y, t)</td><td>dᵀx + β &gt; 0 on the feasible set</td></tr></table>
<p class="note">Each "valid when" is a convexity condition. Break it and the reformulation returns a wrong answer with status <i>optimal</i>: see the tiers demo.</p></div></div>`});

S.push({kicker:"Part 3 · Derivation", title:"Why the epigraph is exact, and when it is not", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:20px;line-height:1.75">
(A) min<sub>x</sub> max<sub>k</sub> f<sub>k</sub>(x) &nbsp;&nbsp;(B) min<sub>x,t</sub> t s.t. t ≥ f<sub>k</sub>(x) for all k<br>
Any x gives a feasible (x, t) with t = max<sub>k</sub> f<sub>k</sub>(x), so v<sub>B</sub> ≤ v<sub>A</sub><br>
At any feasible (x, t), t ≥ max<sub>k</sub> f<sub>k</sub>(x), so v<sub>B</sub> ≥ v<sub>A</sub><br>
At the optimum t = max<sub>k</sub> f<sub>k</sub>(x*): otherwise t could fall</div></div></div>
<div class="col"><ul class="b xs"><li>The argument uses only that t is pushed down. Maximize a maximum instead, and t floats up to infinity: the reformulation fails</li>
<li>|x| is max(x, −x): fine to minimize, not to maximize. max |x − 3| on [0, 5] is attained at an end point, and an LP cannot choose which end without a binary</li>
<li>Convex piecewise-linear costs are maxima of lines, which is why rising price tiers worked</li></ul></div></div>`});

S.push({kicker:"Part 3 · Derivation", title:"Charnes–Cooper, step by step", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:20px;line-height:1.75">
min (cᵀx + α)/(dᵀx + β) s.t. Ax ≤ b, with dᵀx + β &gt; 0<br>
1. Set t = 1/(dᵀx + β) &gt; 0 and y = t x<br>2. Objective: t(cᵀx + α) = cᵀy + α t<br>3. Ax ≤ b ⇔ Ay ≤ b t (multiply by t &gt; 0)<br>
4. Normalization: dᵀy + β t = 1<br>5. Solve the LP in (y, t); recover x = y / t</div></div></div>
<div class="col"><ul class="b xs"><li>Every feasible x gives a feasible (y, t) with the same objective, and back again whenever t &gt; 0: the two problems are equivalent</li>
<li>The condition dᵀx + β &gt; 0 is what makes the multiplication safe; it is the same sign check as for the blending ratio</li>
<li>In the batch example: d = 1, β = 0, so t = 1/V. The LP returns t* = 1/<span id="cct"></span> and the recipe y*/t*</li></ul></div></div>`,
draw:()=>{document.getElementById("cct").textContent=fmt(R.lecture.charnes_cooper.volume,0)}});

S.push({kicker:"Part 3 · Check your understanding · 5 minutes", title:"Which of these can be solved as an LP?", html:()=>`<div class="body"><div class="col w55"><div class="act"><span class="tag">PAUSE AND ANSWER</span>

<li>min (3x + 2)/(x + 1) for 0 ≤ x ≤ 4</li><li>Buy fuel at 10 USD/GJ for the first 100 GJ and 8 USD/GJ beyond</li><li>min Σ<sub>i</sub> |r<sub>i</sub>| over the parameters of a linear model</li></ol></div>
<div class="ctrl" style="margin-top:12px"><button id="k4btn">Show answers</button></div></div>
<div class="col"><div class="panel grow" id="k4ans" style="visibility:hidden"><ul class="b xs"><li>1. LP by the epigraph: min t, t ≥ 2x + 1, t ≥ −x + 4. Optimum x = 1, value 3</li><li>2. Not by the epigraph (a maximum of a convex function). Compare the end points: x = 0 gives 3</li>
<li>3. LP by Charnes–Cooper, since x + 1 &gt; 0. The ratio rises with x (its derivative is 1/(x + 1)² &gt; 0): optimum x = 0, value 2</li><li>4. Not an LP: a discount is a concave cost; it needs a binary (Session 3)</li>

S.push({kicker:"Summary", title:"What to take from today", html:()=>`<div class="body"><div class="col w45"><table class="t" style="font-size:17px" id="sumt"></table></div>
<div class="col"><ul class="b xs"><li>Multiply a ratio specification through by the volume; check it blends linearly on that basis and the volume is positive</li><li>Convex index: a row on the property itself is optimistic (Jensen). Recompute properties from the recipe</li>
<li>Dual of a specification × grade volume = price per unit of quality</li><li>Positive variables ≤ tight rows at a vertex: read recipes through their binding constraints</li>
<li>Stream tables: audit by column sums; degrees of freedom = columns − rank</li><li>A shared tank is bilinear: a local solver can stop at a poor plan and report success</li>
<li>Epigraph (minimized maxima), L1 and L∞ fits, convex tiers and Charnes–Cooper stay LP; maximized maxima, concave costs and pooling do not</li></ul></div></div>`,
draw:()=>{const b=R.lecture.base,l=R.lecture.linear_rvp,t=R.lecture.tiers.discount,cc=R.lecture.charnes_cooper;
 document.getElementById("sumt").innerHTML=`<tr><th>Quantity</th><th class="n">Value</th></tr><tr><td>Two-grade blend margin</td><td class="n">${fmt(b.margin)} USD/d</td></tr>
<tr><td>Positive flows, tight rows</td><td class="n">${b.n_positive}, ${b.n_tight}</td></tr><tr><td>Linear-RVP plan, true RVP Premium</td><td class="n">${fmt(l.props.Premium.RVP_true,1)} kPa</td></tr>
<tr><td>Premium RON price</td><td class="n">${fmt(R.lecture.spec_dual.predicted_per_ron)} USD/d per RON</td></tr><tr><td>Refinery degrees of freedom</td><td class="n">${R.lecture.dof.dof}</td></tr>
<tr><td>Shared tank: local vs best, USD/h</td><td class="n">${fmt(R.lecture.pooling.distinct[0].profit,1)} vs ${fmt(R.lecture.pooling.distinct[R.lecture.pooling.distinct.length-1].profit,1)}</td></tr>
<tr><td>Discount tiers: LP overstatement</td><td class="n">${fmt(t.lp_margin-t.true_margin)} USD/d</td></tr><tr><td>Best batch, Charnes–Cooper</td><td class="n">${fmt(cc.volume)} m³/d</td></tr>`}});

const N=S.length; let cur=0;
function build(){const host=document.getElementById("slides");host.innerHTML="";
 S.forEach((s,i)=>{const d=document.createElement("section");d.className="slide"+(s.cls?" "+s.cls:"");d.id="s"+(i+1);
  d.innerHTML=(s.kicker&&!s.cls?`<p class="kicker">${s.kicker}</p>`:"")+(s.title?`<h1>${s.title}</h1>`:"")+s.html()+(s.py?`<div class="dhint">D · Python</div>`:"")+`<footer><span>${foot}</span><span>${i+1} / ${N}</span></footer>`;host.appendChild(d)})}
function drawAll(){S.forEach(s=>{if(s.draw)try{s.draw()}catch(e){console.error(e)}})}
function show(i){cur=Math.max(0,Math.min(N-1,i));document.querySelectorAll(".slide").forEach((el,k)=>el.classList.toggle("on",k===cur));
 history.replaceState(null,"",location.search+"#"+(cur+1));fillDrawer();if(window.onSlideChange)onSlideChange(cur);const n=document.getElementById("notes");n.textContent=S[cur].notes||"No notes for this slide."}
let CAP_ON=false;   // set by the narration player; reserves a caption band under the slide
function fit(){const W=innerWidth,H=innerHeight,vp=document.getElementById("viewport"),dock=document.getElementById("dock"),cap=document.getElementById("cap");
 const hasDock=dock.style.display==="flex",barH=hasDock?document.getElementById("nbar").offsetHeight:0;
 let k=Math.min(W/1280,H/720)*0.98,capH=0,fs=0,dockH=0;
 for(let it=0;it<3;it++){if(hasDock&&CAP_ON){const lines=k<0.6?4:2;fs=Math.max(12,Math.min(22,24*k));capH=Math.ceil(lines*fs*1.45)+4}else capH=0;
  dockH=hasDock?capH+barH+(capH?6:0)+14:0;k=Math.min(W/1280,Math.max(120,H-dockH)/720)*0.98}
 const h=720*k,pad=10,top=Math.max(0,(H-h-dockH)/2);
 vp.style.top=(top-pad)+"px";vp.style.bottom="auto";vp.style.height=(h+2*pad)+"px";
 document.getElementById("stage").style.transform=`scale(${k})`;
 if(hasDock){dock.style.top=(top+h+6)+"px";cap.style.display=CAP_ON?"block":"none";cap.style.width=Math.min(1280*k,W-16)+"px";cap.style.height=capH+"px";cap.dataset.fs=fs;if(window.capRefit)capRefit()}}
function fillDrawer(){const p=S[cur].py,dr=document.getElementById("drawer");
 if(!p){document.getElementById("dTitle").textContent="No Python on this slide";document.getElementById("dSub").textContent="Slides with a 'D · Python' tag have code and output.";document.getElementById("dCode").value="";document.getElementById("dOut").textContent="";return}
 document.getElementById("dTitle").textContent=p.title;document.getElementById("dSub").textContent=p.sub||"";document.getElementById("dCode").value=p.code;
 try{document.getElementById("dOut").textContent=p.out()}catch(e){document.getElementById("dOut").textContent=String(e)}
 const m=document.getElementById("dMode");m.className="pill "+(MODE==="live"?"live":"rec");m.textContent=MODE==="live"?"LIVE RUN":"RECORDED RUN"}
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes(e.target.tagName)){if(e.key==="Escape")e.target.blur();return}const k=e.key;
 if(["ArrowRight","PageDown"," "].includes(k)){e.preventDefault();show(cur+1)}else if(["ArrowLeft","PageUp"].includes(k)){e.preventDefault();show(cur-1)}
 else if(k==="Home")show(0);else if(k==="End")show(N-1);else if(k==="d"||k==="D")document.getElementById("drawer").classList.toggle("open");
 else if(k==="f"||k==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
 else if(k==="p"||k==="P"){if(window.narrToggle)narrToggle()}

/* ---------- live Python (Pyodide) ---------- */
let py=null;
async function ensurePy(msg){if(py)return py;msg.textContent="Loading Python in the browser (first time about 5–10 s) ...";
 if(!window.loadPyodide){await new Promise((ok,bad)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js";s.onload=ok;s.onerror=()=>bad(new Error("could not load Pyodide"));document.head.appendChild(s)})}
 const p=await loadPyodide();await p.loadPackage(["numpy","scipy"]);
 const src=LAB_SRC||await (await fetch(LAB_FILE)).text();p.FS.writeFile("blending_lab.py",src);
 await p.runPythonAsync('import sys\nsys.path.insert(0, ".")\nfrom blending_lab import *');py=p;return p}
async function runCode(){const msg=document.getElementById("liveMsg"),out=document.getElementById("dOut"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Running ...";const buf=[];p.setStdout({batched:s=>buf.push(s)});p.setStderr({batched:s=>buf.push(s)});
  try{await p.runPythonAsync(document.getElementById("dCode").value)}catch(e){buf.push(String(e.message||e).split("\n").slice(-4).join("\n"))}
  out.textContent=buf.join("\n")||"(no output)";const m=document.getElementById("dMode");m.className="pill live";m.textContent="LIVE OUTPUT";
  msg.textContent=`Ran in ${((performance.now()-t0)/1000).toFixed(1)} s in the browser`}
 catch(e){msg.textContent="Python could not start: "+e.message+". The recorded output is still available."}}
async function runLive(){const msg=document.getElementById("liveMsg"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Solving every model ...";
  const out=await p.runPythonAsync('import importlib, json\nimport blending_lab as lab\nimportlib.reload(lab)\njson.dumps(lab.classroom_results())');
  R=JSON.parse(out);MODE="live";drawAll();fillDrawer();msg.textContent=`All slides now show a live run (${((performance.now()-t0)/1000).toFixed(1)} s, SciPy ${R.meta.scipy})`}
 catch(e){msg.textContent="Live run failed: "+e.message+". The recorded run is still shown."}}
document.getElementById("runCode").onclick=runCode;
document.getElementById("runLive").onclick=runLive;
document.getElementById("useRec").onclick=()=>{R=RECORDED;MODE="recorded";drawAll();fillDrawer();document.getElementById("liveMsg").textContent="Showing the recorded run."};

     "en": "An octane specification is a statement about a ratio: the volume-weighted average octane must be at least the minimum.",

(function(){if(!NARR)return;
 const au=document.getElementById("narr"),bar=document.getElementById("nbar"),cap=document.getElementById("cap"),play=document.getElementById("nPlay"),tm=document.getElementById("nTime"),msg=document.getElementById("nMsg");
 document.getElementById("dock").style.display="flex";document.getElementById("help").style.display="none";let on=false,lang="off",slideIdx=-1;
 const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
 lang=ls("cc-lang")||"off";const sp=ls("narr-speed");if(sp)document.getElementById("nSpeed").value=sp;
 const fmtT=t=>isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`:"0:00";
 const S_=i=>NARR.slides[i];
 function load(i){slideIdx=i;const s=S_(i);if(!s){au.removeAttribute("src");return}au.src=s.file;au.playbackRate=+document.getElementById("nSpeed").value;tm.textContent=`0:00 / ${fmtT(s.duration)}`;showCap(0)}
 function setPlayUI(){play.textContent=au.paused?"▶ Play":"❚❚ Pause";play.classList.toggle("on",!au.paused)}
 // captions sit in their own band under the slide; long lines shrink to fit the band
 window.capRefit=()=>{let f=parseFloat(cap.dataset.fs)||18;cap.style.fontSize=f+"px";while(cap.scrollHeight>cap.clientHeight+1&&f>11){f-=1;cap.style.fontSize=f+"px"}};
 function showCap(t){const s=S_(slideIdx);let c=null;if(s&&lang!=="off"){for(const q of s.cues){if(t>=q.s-0.05)c=q;else break}}
  const txt=(!c||(au.paused&&au.currentTime===0&&!on))?"":(lang==="th"?c.th:c.en);if(cap.textContent!==txt){cap.textContent=txt;capRefit()}}
 function ccUI(){const b=document.getElementById("nCC");b.textContent=lang==="off"?"CC off":lang==="en"?"CC English":"CC ไทย";b.classList.toggle("on",lang!=="off");CAP_ON=lang!=="off";fit();showCap(au.currentTime||0)}
 window.ccCycle=()=>{lang=lang==="off"?"en":lang==="en"?"th":"off";ls("cc-lang",lang);ccUI()};
 // "on" means the student is listening: it starts with Play and ends with Pause or Stop.
 // Slides change only when the student moves; the new slide's narration then starts if "on".
 window.narrToggle=()=>{if(au.paused){on=true;if(slideIdx!==cur)load(cur);if(au.ended)au.currentTime=0;msg.textContent="";au.play().catch(()=>{msg.textContent="Press Play again to start audio."})}else{on=false;au.pause()}};
 window.onSlideChange=i=>{au.pause();msg.textContent="";load(i);if(on)au.play().catch(()=>{})};
 document.getElementById("nPlay").onclick=narrToggle;
 document.getElementById("nStop").onclick=()=>{au.pause();au.currentTime=0;on=false;setPlayUI();showCap(0);tm.textContent=`0:00 / ${fmtT((S_(cur)||{}).duration)}`};
 document.getElementById("nCC").onclick=ccCycle;
 document.getElementById("nPrev").onclick=()=>show(cur-1);document.getElementById("nNext").onclick=()=>show(cur+1);
 document.getElementById("nSpeed").onchange=e=>{au.playbackRate=+e.target.value;ls("narr-speed",e.target.value)};

 ccUI();setTimeout(()=>{if(slideIdx<0)load(cur)},0);
})();
