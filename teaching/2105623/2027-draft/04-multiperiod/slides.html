const LAB_SRC = "\"\"\"2105623 Lab 4: multiperiod optimization.\n\nTwo time-indexed models, each solved with SciPy's HiGHS interface so that the\nsame file runs in the browser (Pyodide) and in desktop Python:\n\n  Part A  Food Manufacture: six-month oil blending with storage\n          (data from H. P. Williams, Model Building in Mathematical\n          Programming, 5th ed., Section 12.1).\n  Part B  24-hour dispatch of a battery beside rooftop PV under a\n          time-of-use tariff (PEA Tariff 2.2.2, energy charge only;\n          load and PV profiles are synthetic teaching data).\n\nRun   python multiperiod_lab.py          print every part\n      python multiperiod_lab.py --step   pause after each part\n      python multiperiod_lab.py --json   write the recorded results file\n\nEvery result is checked by recomputing balances and the objective from the\nsolution itself. A solver status of \"optimal\" is not treated as evidence.\n\"\"\"\nimport json\nimport sys\n\nimport numpy as np\nfrom scipy.optimize import Bounds, LinearConstraint, linprog, milp\n\n# ---------------------------------------------------------------------------\n# Part A. Food Manufacture (Williams 12.1)\n# ---------------------------------------------------------------------------\nMONTHS = [\"Jan\", \"Feb\", \"Mar\", \"Apr\", \"May\", \"Jun\"]\nOILS = [\"VEG1\", \"VEG2\", \"OIL1\", \"OIL2\", \"OIL3\"]\nIS_VEG = np.array([1, 1, 0, 0, 0], dtype=bool)\nHARDNESS = np.array([8.8, 6.1, 2.0, 4.2, 5.0])\nPRICE = np.array([          # GBP per tonne, rows = months, columns = oils\n    [110, 120, 130, 110, 115],\n    [130, 130, 110, 90, 115],\n    [110, 140, 130, 100, 95],\n    [120, 110, 120, 120, 125],\n    [100, 120, 150, 110, 105],\n    [90, 100, 140, 80, 135],\n], dtype=float)\nSELL = 150.0                # GBP per tonne of product\nINITIAL_STOCK = 500.0       # tonnes of each oil at the start\nMAX_STOCK = 1000.0          # tonnes of each oil\n\n\ndef food_manufacture(storage_cost=5.0, veg_capacity=200.0, nonveg_capacity=250.0,\n                     terminal=True, carryover=True):\n    \"\"\"Maximize profit over six months. Returns plan, profit, checks and duals.\"\"\"\n    nI, nT = len(OILS), len(MONTHS)\n    n = 3 * nI * nT                                   # buy, use, stock\n\n    def b(i, t): return i * nT + t                    # buy[i, t]\n    def u(i, t): return nI * nT + i * nT + t          # use[i, t]\n    def s(i, t): return 2 * nI * nT + i * nT + t      # stock[i, t] at month end\n\n    c = np.zeros(n)                                   # minimize -profit\n    for i in range(nI):\n        for t in range(nT):\n            c[b(i, t)] = PRICE[t, i]\n            c[u(i, t)] = -SELL\n            c[s(i, t)] = storage_cost\n\n    A_eq, b_eq = [], []                               # stock balance\n    for i in range(nI):\n        for t in range(nT):\n            row = np.zeros(n)\n            row[b(i, t)], row[u(i, t)], row[s(i, t)] = 1, -1, -1\n            if t == 0:\n                b_eq.append(-INITIAL_STOCK)\n            else:\n                row[s(i, t - 1)] = 1\n                b_eq.append(0.0)\n            A_eq.append(row)\n\n    A_ub, b_ub, ub_names = [], [], []\n    for t in range(nT):\n        veg, nonveg, hmax, hmin = (np.zeros(n) for _ in range(4))\n        for i in range(nI):\n            (veg if IS_VEG[i] else nonveg)[u(i, t)] = 1\n            hmax[u(i, t)] = HARDNESS[i] - 6.0         # hardness <= 6\n            hmin[u(i, t)] = 3.0 - HARDNESS[i]         # hardness >= 3\n        A_ub += [veg, nonveg, hmax, hmin]\n        b_ub += [veg_capacity, nonveg_capacity, 0.0, 0.0]\n        ub_names += [f\"veg_cap_{t}\", f\"nonveg_cap_{t}\", f\"hard_max_{t}\", f\"hard_min_{t}\"]\n\n    bounds = [(0, None)] * (2 * nI * nT)\n    for i in range(nI):\n        for t in range(nT):\n            lo, hi = 0.0, MAX_STOCK\n            if not carryover:\n                lo = hi = INITIAL_STOCK\n            if terminal and t == nT - 1:\n                lo = hi = INITIAL_STOCK\n            bounds.append((lo, hi))\n\n    res = linprog(c, A_ub=np.array(A_ub), b_ub=b_ub, A_eq=np.array(A_eq), b_eq=b_eq,\n                  bounds=bounds, method=\"highs\")\n    if res.status != 0:\n        return {\"status\": res.message, \"profit\": None}\n    x = res.x\n    buy = np.array([[x[b(i, t)] for i in range(nI)] for t in range(nT)])\n    use = np.array([[x[u(i, t)] for i in range(nI)] for t in range(nT)])\n    stock = np.array([[x[s(i, t)] for i in range(nI)] for t in range(nT)])\n    product = use.sum(axis=1)\n\n    # Independent audit from the solution values only\n    prev = np.full(nI, INITIAL_STOCK)\n    balance = []\n    for t in range(nT):\n        balance.append(np.abs(prev + buy[t] - use[t] - stock[t]).max())\n        prev = stock[t]\n    quality = (use @ HARDNESS) / np.where(product > 0, product, 1)\n    profit = SELL * product.sum() - (PRICE * buy).sum() - storage_cost * stock.sum()\n    marg = res.ineqlin.marginals                      # d(-profit)/d(rhs)\n    duals = {name: -m for name, m in zip(ub_names, marg)}\n    return {\n        \"status\": \"optimal\",\n        \"profit\": profit,\n        \"solver_objective\": -res.fun,\n        \"buy\": (buy.round(6) + 0.0).tolist(), \"use\": (use.round(6) + 0.0).tolist(),\n        \"stock\": (stock.round(6) + 0.0).tolist(), \"product\": (product.round(6) + 0.0).tolist(),\n        \"hardness\": quality.round(6).tolist(),\n        \"checks\": {\n            \"max_stock_balance_residual_t\": float(max(balance)),\n            \"hardness_within_3_to_6\": bool(np.all((quality > 3 - 1e-7) & (quality < 6 + 1e-7))),\n            \"veg_capacity_ok\": bool(np.all(use[:, IS_VEG].sum(axis=1) <= veg_capacity + 1e-7)),\n            \"nonveg_capacity_ok\": bool(np.all(use[:, ~IS_VEG].sum(axis=1) <= nonveg_capacity + 1e-7)),\n            \"objective_residual_gbp\": float(abs(profit - (-res.fun))),\n        },\n        \"capacity_value_gbp_per_t\": {\n            \"veg\": [round(duals[f\"veg_cap_{t}\"], 4) for t in range(nT)],\n            \"nonveg\": [round(duals[f\"nonveg_cap_{t}\"], 4) for t in range(nT)],\n        },\n    }\n\n\n# ---------------------------------------------------------------------------\n# Part B. Battery beside rooftop PV under a time-of-use tariff\n# ---------------------------------------------------------------------------\nHOURS = np.arange(24)                                 # hour t covers t:00 to t+1:00\nPEAK, OFFPEAK = 5.7982, 2.6369                        # THB/kWh, PEA 2.2.2, no Ft or VAT\nTOU_WEEKDAY = np.where((HOURS >= 9) & (HOURS < 22), PEAK, OFFPEAK)\nTOU_SATURDAY = np.full(24, OFFPEAK)                   # weekends are off-peak all day\nLOAD_WEEKDAY = np.array([55, 55, 55, 55, 55, 58, 65, 85, 120, 130, 135, 140,\n                         110, 135, 140, 135, 130, 115, 100, 95, 90, 80, 65, 60], float)\nLOAD_SATURDAY = np.array([55, 55, 55, 55, 55, 55, 60, 75, 99, 104, 109, 109,\n                          99, 104, 109, 104, 99, 85, 75, 70, 65, 60, 58, 55], float)\nCLOUD = np.ones(24)\nCLOUD[12:17] = [0.7, 0.35, 0.3, 0.5, 0.8]             # cloudy afternoon\nBATTERY = {\"E\": 200.0, \"P\": 100.0, \"eta_c\": 0.95, \"eta_d\": 0.95,\n           \"soc_min\": 20.0, \"soc0\": 100.0, \"wear\": 0.05}   # wear: THB per kWh discharged\n\n\ndef pv_profile(kwp=200.0, cloud=None):\n    \"\"\"Clear-sky PV output in kW for each hour (synthetic, sunrise 6:00, sunset 18:00).\"\"\"\n    mid = HOURS + 0.5\n    shape = np.clip(np.sin(np.pi * (mid - 6.0) / 12.0), 0, None) ** 1.3\n    pv = 0.8 * kwp * shape\n    return pv * (CLOUD if cloud is True else (cloud if cloud is not None else 1.0))\n\n\ndef dispatch(load, pv, price, export=False, export_price=0.0, curtail=True,\n             terminal=True, binary=False, soc_start=None, soc_end=None, battery=None):\n    \"\"\"Least-cost 1-hour dispatch. Variables per hour: import, export, charge,\n    discharge, curtailment, state of charge (kWh at the end of the hour).\"\"\"\n    bat = dict(BATTERY, **(battery or {}))\n    load, pv, price = (np.asarray(a, float) for a in (load, pv, price))\n    n = len(load)\n    soc_start = bat[\"soc0\"] if soc_start is None else soc_start\n    soc_end = bat[\"soc0\"] if soc_end is None else soc_end\n    IMP, EXP, CH, DIS, CUR, SOC, Y = (k * n for k in range(7))\n    nv = 7 * n if binary else 6 * n\n\n    c = np.zeros(nv)\n    c[IMP:IMP + n] = price\n    c[EXP:EXP + n] = -export_price\n    c[DIS:DIS + n] = bat[\"wear\"]\n\n    rows, lo, hi, names = [], [], [], []\n    for t in range(n):                                # power balance (kW, 1 h)\n        r = np.zeros(nv)\n        r[IMP + t], r[DIS + t], r[CH + t], r[EXP + t], r[CUR + t] = 1, 1, -1, -1, -1\n        rows.append(r); lo.append(load[t] - pv[t]); hi.append(load[t] - pv[t]); names.append((\"power\", t))\n    for t in range(n):                                # state-of-charge balance\n        r = np.zeros(nv)\n        r[SOC + t], r[CH + t], r[DIS + t] = 1, -bat[\"eta_c\"], 1 / bat[\"eta_d\"]\n        rhs = soc_start if t == 0 else 0.0\n        if t > 0:\n            r[SOC + t - 1] = -1\n        rows.append(r); lo.append(rhs); hi.append(rhs); names.append((\"soc\", t))\n    if binary:                                        # y = 1 charge allowed, y = 0 discharge allowed\n        for t in range(n):\n            r = np.zeros(nv); r[CH + t], r[Y + t] = 1, -bat[\"P\"]\n            rows.append(r); lo.append(-np.inf); hi.append(0.0); names.append((\"ychg\", t))\n            r = np.zeros(nv); r[DIS + t], r[Y + t] = 1, bat[\"P\"]\n            rows.append(r); lo.append(-np.inf); hi.append(bat[\"P\"]); names.append((\"ydis\", t))\n\n    lb, ub = np.zeros(nv), np.full(nv, np.inf)\n    ub[EXP:EXP + n] = np.inf if export else 0.0\n    ub[CH:CH + n] = bat[\"P\"]\n    ub[DIS:DIS + n] = bat[\"P\"]\n    ub[CUR:CUR + n] = pv if curtail else 0.0\n    lb[SOC:SOC + n], ub[SOC:SOC + n] = bat[\"soc_min\"], bat[\"E\"]\n    if terminal:\n        lb[SOC + n - 1] = max(soc_end, bat[\"soc_min\"])\n    if binary:\n        ub[Y:Y + n] = 1.0\n\n    A = np.array(rows)\n    if binary:\n        integ = np.zeros(nv); integ[Y:Y + n] = 1\n        res = milp(c, constraints=LinearConstraint(A, lo, hi), bounds=Bounds(lb, ub),\n                   integrality=integ)\n        ok, x, marg = res.status == 0, res.x, None\n    else:\n        eq = [i for i, (a, z) in enumerate(zip(lo, hi)) if a == z]\n        res = linprog(c, A_eq=A[eq], b_eq=np.array(lo)[eq], bounds=list(zip(lb, ub)),\n                      method=\"highs\")\n        ok, x = res.status == 0, res.x\n        marg = res.eqlin.marginals[:n] if ok else None\n    if not ok:\n        return {\"status\": \"infeasible\" if res.status == 2 else str(res.message), \"cost\": None}\n\n    g = {k: x[o:o + n] for k, o in ((\"imp\", IMP), (\"exp\", EXP), (\"ch\", CH), (\"dis\", DIS),\n                                     (\"cur\", CUR), (\"soc\", SOC))}\n    soc_prev = np.concatenate([[soc_start], g[\"soc\"][:-1]])\n    power_res = g[\"imp\"] + pv - g[\"cur\"] + g[\"dis\"] - load - g[\"ch\"] - g[\"exp\"]\n    soc_res = soc_prev + bat[\"eta_c\"] * g[\"ch\"] - g[\"dis\"] / bat[\"eta_d\"] - g[\"soc\"]\n    cost = float(price @ g[\"imp\"] - export_price * g[\"exp\"].sum() + bat[\"wear\"] * g[\"dis\"].sum())\n    out = {k: (np.round(v, 6) + 0.0).tolist() for k, v in g.items()}\n    out.update({\n        \"status\": \"optimal\",\n        \"cost\": cost,\n        \"energy_cost\": float(price @ g[\"imp\"]),\n        \"simultaneous_kw\": float(np.minimum(g[\"ch\"], g[\"dis\"]).max()),\n        \"checks\": {\n            \"max_power_balance_residual_kw\": float(np.abs(power_res).max()),\n            \"max_soc_balance_residual_kwh\": float(np.abs(soc_res).max()),\n            \"objective_residual_thb\": float(abs(cost - res.fun)),\n            \"soc_end_kwh\": float(g[\"soc\"][-1]),\n        },\n        \"marginal_thb_per_kwh\": None if marg is None else np.round(marg, 4).tolist(),\n    })\n    return out\n\n\ndef no_battery_cost(load, pv, price):\n    \"\"\"Cost when the site has PV but no battery; surplus PV is curtailed.\"\"\"\n    imp = np.clip(np.asarray(load) - np.asarray(pv), 0, None)\n    return float(np.asarray(price) @ imp)\n\n\ndef rolling_horizon(load, pv_actual, pv_forecast, price):\n    \"\"\"Re-plan every hour to the end of the day. The current hour uses the\n    measured PV, later hours use the forecast. Only the first hour is applied.\"\"\"\n    bat = BATTERY\n    soc, cost, applied = bat[\"soc0\"], 0.0, {\"ch\": [], \"dis\": [], \"imp\": [], \"soc\": []}\n    for h in range(len(load)):\n        pv_view = np.concatenate([[pv_actual[h]], pv_forecast[h + 1:]])\n        plan = dispatch(load[h:], pv_view, price[h:], soc_start=soc, soc_end=bat[\"soc0\"])\n        ch, dis, imp = plan[\"ch\"][0], plan[\"dis\"][0], plan[\"imp\"][0]\n        soc = soc + bat[\"eta_c\"] * ch - dis / bat[\"eta_d\"]\n        cost += price[h] * imp + bat[\"wear\"] * dis\n        for k, v in ((\"ch\", ch), (\"dis\", dis), (\"imp\", imp), (\"soc\", soc)):\n            applied[k].append(round(float(v), 6) + 0.0)\n    applied[\"cost\"] = float(cost)\n    return applied\n\n\ndef open_loop(load, pv_actual, pv_forecast, price):\n    \"\"\"Fix the battery schedule from the morning forecast; the grid absorbs the error.\"\"\"\n    plan = dispatch(load, pv_forecast, price)\n    ch, dis = np.array(plan[\"ch\"]), np.array(plan[\"dis\"])\n    net = np.asarray(load) - np.asarray(pv_actual) + ch - dis\n    imp = np.clip(net, 0, None)\n    return {\"cost\": float(np.asarray(price) @ imp + BATTERY[\"wear\"] * dis.sum()),\n            \"imp\": (np.round(imp, 6) + 0.0).tolist()}\n\n\n# ---------------------------------------------------------------------------\n# Everything the slides show, in one dictionary\n# ---------------------------------------------------------------------------\ndef classroom_results():\n    pv_clear, pv_cloudy = pv_profile(), pv_profile(cloud=True)\n    R = {\"meta\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__,\n                  \"python\": sys.version.split()[0]},\n         \"data\": {\"hours\": HOURS.tolist(), \"tou_weekday\": TOU_WEEKDAY.tolist(),\n                  \"load_weekday\": LOAD_WEEKDAY.tolist(), \"load_saturday\": LOAD_SATURDAY.tolist(),\n                  \"pv_clear\": np.round(pv_clear, 4).tolist(),\n                  \"pv_cloudy\": np.round(pv_cloudy, 4).tolist(), \"battery\": BATTERY,\n                  \"oils\": OILS, \"months\": MONTHS, \"price\": PRICE.tolist(),\n                  \"hardness\": HARDNESS.tolist()}}\n    # Part A\n    R[\"food\"] = {\"reference\": food_manufacture()}\n    R[\"food\"][\"holding_sweep\"] = []\n    for h in range(0, 11):\n        run = food_manufacture(storage_cost=h)\n        R[\"food\"][\"holding_sweep\"].append(\n            {\"h\": h, \"profit\": run[\"profit\"], \"stock_total\": float(np.sum(run[\"stock\"])),\n             \"buy\": run[\"buy\"], \"stock\": run[\"stock\"]})\n    R[\"food\"][\"no_carryover\"] = food_manufacture(carryover=False)\n    R[\"food\"][\"no_terminal\"] = food_manufacture(terminal=False)\n    # Part B\n    base = dispatch(LOAD_WEEKDAY, pv_clear, TOU_WEEKDAY)\n    R[\"storage\"] = {\n        \"base\": base,\n        \"no_battery_cost\": no_battery_cost(LOAD_WEEKDAY, pv_clear, TOU_WEEKDAY),\n        \"no_terminal\": dispatch(LOAD_WEEKDAY, pv_clear, TOU_WEEKDAY, terminal=False),\n        \"base_binary\": dispatch(LOAD_WEEKDAY, pv_clear, TOU_WEEKDAY, binary=True),\n        \"saturday_lp_no_curtail\": dispatch(LOAD_SATURDAY, pv_clear, TOU_SATURDAY, curtail=False),\n        \"saturday_milp_no_curtail\": dispatch(LOAD_SATURDAY, pv_clear, TOU_SATURDAY, curtail=False, binary=True),\n        \"saturday_lp_curtail\": dispatch(LOAD_SATURDAY, pv_clear, TOU_SATURDAY, curtail=True),\n    }\n    R[\"uncertainty\"] = {\n        \"perfect\": dispatch(LOAD_WEEKDAY, pv_cloudy, TOU_WEEKDAY),\n        \"open_loop\": open_loop(LOAD_WEEKDAY, pv_cloudy, pv_clear, TOU_WEEKDAY),\n        \"rolling\": rolling_horizon(LOAD_WEEKDAY, pv_cloudy, pv_clear, TOU_WEEKDAY),\n        \"no_battery_cost\": no_battery_cost(LOAD_WEEKDAY, pv_cloudy, TOU_WEEKDAY),\n    }\n    return R\n\n\ndef _print_parts(R, step=False):\n    def pause():\n        if step:\n            input(\"\\nPress Enter for the next part ...\")\n    f = R[\"food\"][\"reference\"]\n    print(\"PART 1  Food Manufacture, reference plan\")\n    print(f\"  profit = {f['profit']:,.2f} GBP (solver {f['solver_objective']:,.2f})\")\n    for m, p, h in zip(MONTHS, f[\"product\"], f[\"hardness\"]):\n        print(f\"  {m}: product {p:7.2f} t  hardness {h:5.3f}\")\n    print(\"  checks:\", f[\"checks\"]); pause()\n    print(\"\\nPART 2  What storage is worth\")\n    print(f\"  no carryover : {R['food']['no_carryover']['profit']:,.2f} GBP\")\n    print(f\"  no terminal  : {R['food']['no_terminal']['profit']:,.2f} GBP  (end effect)\")\n    for row in R[\"food\"][\"holding_sweep\"]:\n        print(f\"  holding {row['h']:2d} GBP/t-month: profit {row['profit']:11,.2f}  \"\n              f\"total month-end stock {row['stock_total']:8.1f} t\")\n    pause()\n    s = R[\"storage\"]\n    print(\"\\nPART 3  Weekday dispatch with TOU\")\n    print(f\"  no battery {s['no_battery_cost']:.2f} THB, with battery {s['base']['cost']:.2f} THB\")\n    print(\"  checks:\", s[\"base\"][\"checks\"]); pause()\n    print(\"\\nPART 4  Terminal condition\")\n    print(f\"  without SoC(24) >= SoC(0): {s['no_terminal']['cost']:.2f} THB, \"\n          f\"ends at {s['no_terminal']['checks']['soc_end_kwh']:.1f} kWh\"); pause()\n    print(\"\\nPART 5  Charge and discharge in the same hour\")\n    print(f\"  base LP simultaneous {s['base']['simultaneous_kw']:.3f} kW; MILP cost {s['base_binary']['cost']:.2f}\")\n    print(f\"  Saturday, no curtailment, LP  : simultaneous {s['saturday_lp_no_curtail']['simultaneous_kw']:.2f} kW\")\n    print(f\"  Saturday, no curtailment, MILP: {s['saturday_milp_no_curtail']['status']}\")\n    hc = s[\"saturday_lp_curtail\"]\n    print(f\"  Saturday with curtailment, LP: simultaneous {hc['simultaneous_kw']:.3f} kW, \"\n          f\"curtailed {sum(hc['cur']):.1f} kWh\"); pause()\n    u = R[\"uncertainty\"]\n    print(\"\\nPART 6  Forecast error and re-planning (cloudy afternoon)\")\n    print(f\"  no battery {u['no_battery_cost']:.2f} | fixed morning plan {u['open_loop']['cost']:.2f} | \"\n          f\"re-plan hourly {u['rolling']['cost']:.2f} | perfect forecast {u['perfect']['cost']:.2f} THB\")\n\n\nif __name__ == \"__main__\":\n    results = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"lab4-results.json\", \"w\") as fh:\n            json.dump(results, fh, indent=1)\n        print(\"wrote lab4-results.json\")\n    else:\n        _print_parts(results, step=\"--step\" in sys.argv)\n";   // embedded copy, so live Python also works when the file is opened locally
let R = RECORDED, MODE = "recorded";
const C = {teal:"#0F6E6B",amber:"#E29A2D",rust:"#BE654C",sky:"#5A91BE",sage:"#83A462",plum:"#995A90",graphite:"#333F4A",sand:"#DFC98F",ink:"#1C242B",slate:"#66727C",mist:"#B9C1C6",paper:"#F3F0EB"};
const OILC = [C.teal,C.sage,C.amber,C.rust,C.plum];
const fmt = (x,d=0)=>x==null?"–":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

/* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks
  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";
  for(let k=0;k<=n;k++){const v=ymin+(ymax-ymin)*k/n, y=t+Y-(v-ymin)/(ymax-ymin)*Y;
    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  const z=t+Y-(0-ymin)/(ymax-ymin)*Y; s+=`<line x1="${l}" x2="${w-r}" y1="${Math.min(t+Y,Math.max(t,z))}" y2="${Math.min(t+Y,Math.max(t,z))}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;
  return s}
function ymap(o,v){const Y=o.h-o.t-o.b;return o.t+Y-(v-o.ymin)/(o.ymax-o.ymin)*Y}
function legend(items,x,y){let s="";items.forEach((it,i)=>{const yy=y+i*22;s+=it.line?`<line x1="${x}" x2="${x+22}" y1="${yy}" y2="${yy}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${x}" y="${yy-8}" width="16" height="16" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${x+28}" y="${yy+5}" font-size="16" fill="${C.ink}">${it.t}</text>`});return s}
function legendRow(items,x,y){let s="",xx=x;items.forEach(it=>{s+=it.line?`<line x1="${xx}" x2="${xx+20}" y1="${y}" y2="${y}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${xx}" y="${y-7}" width="14" height="14" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${xx+26}" y="${y+5}" font-size="16" fill="${C.ink}">${it.t}</text>`;xx+=38+it.t.length*8.2});return s}

/* Food Manufacture: stacked bars of a [month][oil] matrix, optional line */
function foodChart(mat,ylab,opt={}){
  const w=640,h=380,o={w,h,l:70,r:16,t:30,b:44};
  const tot=mat.map(r=>r.reduce((a,b)=>a+b,0)); scale(o,0,opt.ymax||Math.max(...tot)*1.08);
  let s=svgEl(w,h)+axes({...o,ylab}); const X=w-o.l-o.r, bw=X/6*0.62;
  mat.forEach((row,t)=>{let acc=0;const x=o.l+X*(t+0.5)/6-bw/2;
    row.forEach((v,i)=>{if(v>1e-6){const y0=ymap(o,acc),y1=ymap(o,acc+v);s+=`<rect x="${x}" y="${y1}" width="${bw}" height="${y0-y1}" fill="${OILC[i]}"><title>${R.data.oils[i]} ${fmt(v,1)} t</title></rect>`}acc+=v});
    s+=`<text x="${x+bw/2}" y="${h-o.b+24}" font-size="16" text-anchor="middle">${R.data.months[t]}</text>`;
    if(opt.labels)s+=`<text x="${x+bw/2}" y="${ymap(o,tot[t])-6}" font-size="15" text-anchor="middle" fill="${C.slate}">${fmt(tot[t])}</text>`});
  s+=legendRow(R.data.oils.map((n,i)=>({t:n,c:OILC[i]})),o.l+4,14);
  return s+"</svg>"}

/* 24-hour chart: lines + optional battery bars + peak shading */
function dayChart(series,opt={}){
  const w=opt.w||660,h=opt.h||380,o={w,h,l:62,r:16,t:opt.t||34,b:40};
  let vals=[];series.forEach(s=>vals=vals.concat(s.v.map(Number)));
  const lo=opt.ymin!=null?opt.ymin:Math.min(0,...vals)*1.05, hi=opt.ymax!=null?opt.ymax:Math.max(...vals)*1.06; scale(o,lo,hi);
  const X=w-o.l-o.r, xs=k=>o.l+X*(k+0.5)/24; let s=svgEl(w,h);
  if(opt.peak){const x0=o.l+X*9/24,x1=o.l+X*22/24;s+=`<rect x="${x0}" y="${o.t}" width="${x1-x0}" height="${h-o.t-o.b}" fill="${C.sand}" opacity=".35"/><text x="${(x0+x1)/2}" y="${o.t+18}" font-size="15" text-anchor="middle" fill="${C.slate}">peak tariff 09–22</text>`}
  s+=axes({...o,ylab:opt.ylab});
  for(let k=0;k<=24;k+=3)s+=`<text x="${o.l+X*k/24}" y="${h-o.b+22}" font-size="16" text-anchor="middle">${String(k).padStart(2,"0")}</text>`;
  const bw=X/24*0.7;
  series.filter(z=>z.bar).forEach(z=>z.v.forEach((v,k)=>{if(Math.abs(v)>1e-6){const y0=ymap(o,0),y1=ymap(o,v);s+=`<rect x="${xs(k)-bw/2}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.abs(y0-y1)}" fill="${z.c}" opacity="${z.op||0.85}"><title>${z.t} ${String(k).padStart(2,"0")}:00 ${fmt(v,1)}</title></rect>`}}));
  series.filter(z=>!z.bar).forEach(z=>{const pts=z.step?z.v.map((v,k)=>`${o.l+X*k/24},${ymap(o,v)} ${o.l+X*(k+1)/24},${ymap(o,v)}`).join(" "):z.v.map((v,k)=>`${xs(k)},${ymap(o,v)}`).join(" ");
    s+=`<polyline points="${pts}" fill="none" stroke="${z.c}" stroke-width="${z.wd||2.6}" ${z.dash?'stroke-dasharray="7 5"':''} stroke-linejoin="round"/>`});
  s+=legendRow(series.map(z=>({t:z.t,c:z.c,line:!z.bar,dash:z.dash,op:z.op})),o.l+4,16);
  return s+"</svg>"}

function hbar(items,opt={}){ // items: {t,v,c}
  const w=opt.w||640,h=opt.h||330,l=opt.l||250,r=90,t=16,rowh=(h-t-20)/items.length;
  const mx=opt.max||niceMax(Math.max(...items.map(i=>i.v)));let s=svgEl(w,h);
  items.forEach((it,i)=>{const y=t+i*rowh,bw=(w-l-r)*it.v/mx;
    s+=`<text x="${l-12}" y="${y+rowh/2+5}" font-size="16" text-anchor="end" fill="${C.ink}">${it.t}</text><rect x="${l}" y="${y+rowh*0.18}" width="${Math.max(bw,1)}" height="${rowh*0.64}" fill="${it.c}" rx="3"/><text x="${l+bw+8}" y="${y+rowh/2+6}" font-size="17" font-weight="700" fill="${C.ink}">${opt.fmt?opt.fmt(it.v):fmt(it.v)}</text>`});
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${h-20}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  return s+"</svg>"}

S.push({kicker:"Part 1 · Why time matters", title:"Storage links decisions across periods", html:()=>`<div class="body"><div class="col w45"><ul class="b sm">
<li>A single-period model treats each month or hour on its own</li>
<li>With storage, what you buy or produce now can be used later</li>
<li>The model must then decide <span class="hl">all periods together</span></li>
<li>Chemical engineering examples: feed purchasing, tank inventory, campaign scheduling, energy storage, maintenance windows</li></ul></div>
<div class="col"><div class="panel grow">${timeline()}</div></div></div>`,
notes:"The arrows between periods are the stock variables. Without them the problem separates into independent single-period problems."});
function timeline(){let s=svgEl(600,400);const xs=[40,215,390];
  xs.forEach((x,i)=>{s+=`<rect x="${x}" y="140" width="150" height="110" rx="12" fill="#fff" stroke="${C.teal}" stroke-width="2"/><text x="${x+75}" y="185" font-size="20" text-anchor="middle" font-weight="700" fill="${C.teal}">Period ${i+1}</text><text x="${x+75}" y="215" font-size="15" text-anchor="middle" fill="${C.slate}">buy, use, produce</text>`;
    s+=`<line x1="${x+75}" y1="70" x2="${x+75}" y2="134" stroke="${C.graphite}" stroke-width="2" marker-end="url(#ar)"/><text x="${x+75}" y="60" font-size="15" text-anchor="middle">input</text>`;
    s+=`<line x1="${x+75}" y1="256" x2="${x+75}" y2="320" stroke="${C.graphite}" stroke-width="2" marker-end="url(#ar)"/><text x="${x+75}" y="342" font-size="15" text-anchor="middle">demand</text>`;
    if(i<2)s+=`<line x1="${x+152}" y1="195" x2="${x+211}" y2="195" stroke="${C.amber}" stroke-width="5" marker-end="url(#aa)"/>`});
  s+=`<text x="300" y="120" font-size="16" text-anchor="middle" fill="${C.amber}" font-weight="700">stock carried forward</text>`;
  s+=`<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${C.graphite}"/></marker><marker id="aa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${C.amber}"/></marker></defs>`;
  return s+"</svg>"}

S.push({kicker:"Part 1 · Balance equation", title:"The balance equation carries the state", html:()=>`<div class="body"><div class="col w55"><div class="panel">
<div class="math"><span class="lbl">Inventory, tonnes</span>s<sub>t</sub> = s<sub>t−1</sub> + b<sub>t</sub> − u<sub>t</sub><br>
<span class="lbl">Energy, kWh</span>S<sub>t</sub> = S<sub>t−1</sub> + (η<sub>c</sub>C<sub>t</sub> − D<sub>t</sub>/η<sub>d</sub>) Δt</div></div>
<ul class="b sm" style="margin-top:20px"><li><span class="hl">State</span> variables (s, S) are measured at the end of a period</li>
<li><span class="hl">Flow</span> variables (b, u, C, D) are amounts or rates during the period</li>
<li>Δt converts a rate in kW into energy in kWh</li></ul></div>
<div class="col"><div class="panel grow">${tank()}</div></div></div>`,
notes:"Ask which variables are states and which are flows. Point out that S_0 is data, not a variable."});
function tank(){let s=svgEl(460,400);
 s+=`<rect x="150" y="90" width="160" height="230" rx="10" fill="#fff" stroke="${C.graphite}" stroke-width="2.5"/><rect x="152" y="200" width="156" height="118" fill="${C.teal}" opacity=".25"/>`;
 s+=`<text x="230" y="265" font-size="22" text-anchor="middle" font-weight="700" fill="${C.teal}">s<tspan dy="6" font-size="15">t</tspan></text>`;
 s+=`<line x1="40" y1="130" x2="146" y2="130" stroke="${C.amber}" stroke-width="5" marker-end="url(#a2)"/><text x="60" y="118" font-size="18">b<tspan dy="5" font-size="13">t</tspan> in</text>`;
 s+=`<line x1="314" y1="290" x2="420" y2="290" stroke="${C.amber}" stroke-width="5" marker-end="url(#a2)"/><text x="350" y="278" font-size="18">u<tspan dy="5" font-size="13">t</tspan> out</text>`;
 s+=`<text x="230" y="70" font-size="16" text-anchor="middle" fill="${C.slate}">start of period: s<tspan dy="5" font-size="12">t−1</tspan></text><text x="230" y="352" font-size="16" text-anchor="middle" fill="${C.slate}">end of period: s<tspan dy="5" font-size="12">t</tspan></text>`;
 s+=`<defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${C.amber}"/></marker></defs>`;return s+"</svg>"}

S.push({kicker:"Part 1 · Common errors", title:"Index errors are the most common bug", html:()=>`<div class="body"><div class="col"><table class="t">
<tr><th>Error</th><th>Symptom</th><th>Test that catches it</th></tr>
<tr><td>s<sub>t−1</sub> at t = 1 points to nothing, or to the last period</td><td>Stock appears from nowhere</td><td>Recompute the balance for every period</td></tr>
<tr><td>Start-of-period and end-of-period stock mixed</td><td>Plan is shifted by one period</td><td>Check one period by hand</td></tr>
<tr><td>kW used as kWh, or Δt omitted</td><td>Battery fills too fast or too slowly</td><td>Change Δt from 1 h to 0.5 h; energy must not change</td></tr>
<tr><td>Python index 0 versus month 1</td><td>Prices used one month late</td><td>Print the price used in each period</td></tr>
<tr><td>No terminal condition</td><td>Storage is emptied at the end</td><td>Look at the last period</td></tr></table></div></div>`,

S.push({kicker:"Part 1 · Boundary conditions", title:"The horizon has two ends", html:()=>`<div class="body"><div class="col w55"><ul class="b sm">
<li><span class="hl">Initial condition</span>: s<sub>0</sub> is measured data, not a decision</li>
<li><span class="hl">Terminal condition</span>: the model does not know that the plant continues after period T</li>
<li>Without it, the cheapest plan uses up the stock: the <span class="hl">end effect</span></li>
<li>Common choices: s<sub>T</sub> ≥ s<sub>0</sub>; a value for each unit left at the end; a longer horizon whose last periods are discarded</li></ul></div>
<div class="col"><div class="panel grow"><div class="note" style="margin:0 0 6px">Total stock of the five oils, Food Manufacture</div><div class="chart" id="ch-end"></div></div></div></div>`,
draw:()=>{const a=R.food.reference.stock.map(r=>r.reduce((x,y)=>x+y,0)),b=R.food.no_terminal.stock.map(r=>r.reduce((x,y)=>x+y,0));
 document.getElementById("ch-end").innerHTML=monthLines([{t:"with terminal stock = 500 t",v:[2500,...a],c:C.teal},{t:"no terminal condition",v:[2500,...b],c:C.amber,dash:true}],"total stock, t")},
notes:"The chart shows total stock of the five oils, starting at 2,500 t. Without a terminal condition the model ends with nothing in storage."});
function monthLines(series,ylab){const w=600,h=360,o={w,h,l:76,r:16,t:40,b:44};scale(o,0,Math.max(...series.flatMap(s=>s.v))*1.05);
 const X=w-o.l-o.r,xs=k=>o.l+X*k/6;let s=svgEl(w,h)+axes({...o,ylab});
 ["start",...R.data.months].forEach((m,k)=>s+=`<text x="${xs(k)}" y="${h-o.b+24}" font-size="16" text-anchor="middle">${m}</text>`);
 series.forEach(z=>{s+=`<polyline points="${z.v.map((v,k)=>`${xs(k)},${ymap(o,v)}`).join(" ")}" fill="none" stroke="${z.c}" stroke-width="3" ${z.dash?'stroke-dasharray="8 5"':''}/>`;z.v.forEach((v,k)=>s+=`<circle cx="${xs(k)}" cy="${ymap(o,v)}" r="4.5" fill="${z.c}"/>`)});
 s+=legendRow(series.map(z=>({t:z.t,c:z.c,line:true,dash:z.dash})),o.l+4,18);return s+"</svg>"}

/* ---------- deck engine ---------- */
const N=S.length; let cur=0;
function build(){const host=document.getElementById("slides");host.innerHTML="";
 S.forEach((s,i)=>{const d=document.createElement("section");d.className="slide"+(s.cls?" "+s.cls:"");d.id="s"+(i+1);
  d.innerHTML=(s.kicker&&!s.cls?`<p class="kicker">${s.kicker}</p>`:"")+(s.title?`<h1>${s.title}</h1>`:"")+s.html()+(s.py?`<div class="dhint">D · Python</div>`:"")+`<footer><span>${foot}</span><span>${i+1} / ${N}</span></footer>`;host.appendChild(d)})}
function drawAll(){S.forEach(s=>{if(s.draw)try{s.draw()}catch(e){console.error(e)}})}
function show(i){cur=Math.max(0,Math.min(N-1,i));document.querySelectorAll(".slide").forEach((el,k)=>el.classList.toggle("on",k===cur));
 history.replaceState(null,"","#"+(cur+1));fillDrawer();const n=document.getElementById("notes");n.textContent=S[cur].notes||"No notes for this slide."}
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720)*0.98;document.getElementById("stage").style.transform=`scale(${k})`}
function fillDrawer(){const p=S[cur].py,dr=document.getElementById("drawer");
 if(!p){document.getElementById("dTitle").textContent="No Python on this slide";document.getElementById("dSub").textContent="Slides with a 'D · Python' tag have code and output.";document.getElementById("dCode").value="";document.getElementById("dOut").textContent="";return}
 document.getElementById("dTitle").textContent=p.title;document.getElementById("dSub").textContent=p.sub||"";document.getElementById("dCode").value=p.code;
 try{document.getElementById("dOut").textContent=p.out()}catch(e){document.getElementById("dOut").textContent=String(e)}
 const m=document.getElementById("dMode");m.className="pill "+(MODE==="live"?"live":"rec");m.textContent=MODE==="live"?"LIVE RUN":"RECORDED RUN"}
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes(e.target.tagName)){if(e.key==="Escape")e.target.blur();return}const k=e.key;
 if(["ArrowRight","PageDown"," "].includes(k)){e.preventDefault();show(cur+1)}else if(["ArrowLeft","PageUp"].includes(k)){e.preventDefault();show(cur-1)}
 else if(k==="Home")show(0);else if(k==="End")show(N-1);else if(k==="d"||k==="D")document.getElementById("drawer").classList.toggle("open");
 else if(k==="f"||k==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
 else if(k==="n"||k==="N"){const n=document.getElementById("notes");n.style.display=n.style.display==="block"?"none":"block"}});
document.getElementById("stage").addEventListener("click",e=>{if(e.target.closest("button,input,#drawer,a"))return;const r=e.currentTarget.getBoundingClientRect();(e.clientX-r.left)>r.width*0.5?show(cur+1):show(cur-1)});
addEventListener("resize",fit);

async function ensurePy(msg){if(py)return py;msg.textContent="Loading Python in the browser (first time about 5–10 s) ...";
 if(!window.loadPyodide){await new Promise((ok,bad)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js";s.onload=ok;s.onerror=()=>bad(new Error("could not load Pyodide"));document.head.appendChild(s)})}
 const p=await loadPyodide();await p.loadPackage(["numpy","scipy"]);
 const src=LAB_SRC||await (await fetch(LAB_FILE)).text();p.FS.writeFile("multiperiod_lab.py",src);
 await p.runPythonAsync('import sys\nsys.path.insert(0, ".")\nfrom multiperiod_lab import *');py=p;return p}
async function runCode(){const msg=document.getElementById("liveMsg"),out=document.getElementById("dOut"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Running ...";const buf=[];p.setStdout({batched:s=>buf.push(s)});p.setStderr({batched:s=>buf.push(s)});
  try{await p.runPythonAsync(document.getElementById("dCode").value)}catch(e){buf.push(String(e.message||e).split("\n").slice(-4).join("\n"))}
  out.textContent=buf.join("\n")||"(no output)";const m=document.getElementById("dMode");m.className="pill live";m.textContent="LIVE OUTPUT";
  msg.textContent=`Ran in ${((performance.now()-t0)/1000).toFixed(1)} s in the browser`}
 catch(e){msg.textContent="Python could not start: "+e.message+". The recorded output is still available."}}
async function runLive(){const msg=document.getElementById("liveMsg"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Solving every model ...";
  const out=await p.runPythonAsync('import importlib, json\nimport multiperiod_lab as lab\nimportlib.reload(lab)\njson.dumps(lab.classroom_results())');
  R=JSON.parse(out);MODE="live";drawAll();fillDrawer();msg.textContent=`All slides now show a live run (${((performance.now()-t0)/1000).toFixed(1)} s, SciPy ${R.meta.scipy})`}
 catch(e){msg.textContent="Live run failed: "+e.message+". The recorded run is still shown."}}
document.getElementById("runCode").onclick=runCode;
document.getElementById("runLive").onclick=runLive;
document.getElementById("useRec").onclick=()=>{R=RECORDED;MODE="recorded";drawAll();fillDrawer();document.getElementById("liveMsg").textContent="Showing the recorded run."};

build();drawAll();fit();show((parseInt(location.hash.slice(1))||1)-1);
</script>
</body>
</html>
