ul.b{list-style:none;margin:0;padding:0;font-size:24px;line-height:1.36}

.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:25px;line-height:1.75}

.code{font-family:var(--mono);font-size:17px;line-height:1.5;white-space:pre;color:var(--graphite)}
.note{font-size:18px;color:var(--slate);margin-top:10px;line-height:1.4}
.big{font-size:56px;font-weight:800;color:var(--teal)}

:15.280702,"F2":27.719298,"B":40.0,"profit":2269.0498245614026,"throughput":100.0,"shadow_capacity":7.18357894736846,"shadow_demand":38.76729824561397},{"value":0.075,"F1":23.973684,"F2":20.526316,"B":40.0,"profit":2341.5115789473675,"throughput":100.0,"shadow_capacity":10.775368421052633,"shadow_demand":31.599368421052617},{"value":0.1,"F1":32.666667,"F2":13.333333,"B":40.0,"profit":2413.9733333333334,"throughput":100.0,"shadow_capacity":14.367157894736863,"shadow_demand":24.431438596491205},{"value":0.15,"F1":48.888889,"F2":0.0,"B":40.0,"profit":2542.9333333333334,"throughput":99.25925925925925,"shadow_capacity":0.0,"shadow_demand":63.57333333333334},{"value":0.2,"F1":50.37037,"F2":0.0,"B":40.0,"profit":2469.6888888888893,"throughput":91.85185185185185,"shadow_capacity":0.0,"shadow_demand":61.74222222222223}],"inert_cheap":[{"value":0.05,"F1":44.912281,"F2":0.0,"B":40.0,"profit":2682.0491228070173,"throughput":89.12280701754389,"shadow_capacity":0.0,"shadow_demand":67.05122807017543},{"value":0.1,"F1":32.666667,"F2":13.333333,"B":40.0,"profit":2413.9733333333334,"throughput":100.0,"shadow_capacity":14.367157894736863,"shadow_demand":24.431438596491205},{"value":0.15,"F1":21.402299,"F2":24.597701,"B":40.0,"profit":2211.7554022988497,"throughput":100.0,"shadow_capacity":7.883586206896538,"shadow_demand":35.58491954022989},{"value":0.2,"F1":15.91453,"F2":30.08547,"B":40.0,"profit":2113.238974358974,"throughput":100.0,"shadow_capacity":4.724923076923083,"shadow_demand":41.01866666666663}],"capacity":[{"value":80.0,"F1":11.719298,"F2":32.280702,"B":40.0,"profit":2126.630175438596,"throughput":80.0,"shadow_capacity":14.367157894736863,"shadow_demand":24.431438596491205},{"value":90.0,"F1":22.192982,"F2":22.807018,"B":40.0,"profit":2270.301754385964,"throughput":90.0,"shadow_capacity":14.367157894736863,"shadow_demand":24.431438596491205},{"value":100.0,"F1":32.666667,"F2":13.333333,"B":40.0,"profit":2413.9733333333334,"throughput":100.0,"shadow_capacity":14.367157894736 const LAB_FILE = "workflow_lab.py?v=s01-6f160126";
const LAB_SRC = "\"\"\"2105623 Session 1: the optimization workflow.\n\nPart A  The lecture example: a two-product plan on shared equipment\n        (Additive and Binder), solved and read the way the slides read it.\nPart B  Lab 1: a colleague's model with three planted errors. Each error can\n        be fixed separately, so every combination of fixes is solved and kept.\n\nRuns in the browser (Pyodide: NumPy, SciPy/HiGHS) and in desktop Python.\n    python workflow_lab.py          print every part\n    python workflow_lab.py --json   write workflow-results.json for the slides and the lab page\n\"\"\"\nimport itertools\nimport json\nimport sys\n\nimport numpy as np\nfrom scipy.optimize import Bounds, LinearConstraint, linprog, milp\n\n# ---------------------------------------------------------------------------\n# Part A. Lecture example (same data as Week 1 of 2026)\n# ---------------------------------------------------------------------------\nPRODUCTS = [\"Additive\", \"Binder\"]\nRESOURCES = [\"Reactor train\", \"Separation and drying\", \"Finishing and packaging\"]\nMARGIN = np.array([400.0, 300.0])                 # USD per tonne\nUSE = np.array([[3.0, 2.0], [1.0, 2.0], [1.0, 1.0]])   # hours per tonne\nAVAIL = np.array([24.0, 16.0, 9.0])               # hours per week\n\n\ndef product_mix(avail=AVAIL, margin=MARGIN):\n    \"\"\"Maximize weekly margin. Returns plan, value, slack and shadow prices.\"\"\"\n    res = linprog(-np.asarray(margin), A_ub=USE, b_ub=avail, bounds=[(0, None)] * 2, method=\"highs\")\n    if res.status != 0:\n        return {\"status\": {2: \"infeasible\", 3: \"unbounded\"}.get(res.status, res.message)}\n    x = res.x\n    used = USE @ x\n    shadow = -res.ineqlin.marginals                  # USD per extra hour\n    return {\"status\": \"optimal\", \"x\": (x.round(9) + 0.0).tolist(), \"z\": float(margin @ x),\n            \"used\": used.tolist(), \"slack\": (np.asarray(avail) - used).round(9).tolist(),\n            \"shadow\": (shadow.round(9) + 0.0).tolist(),\n            \"dual_value\": float(shadow @ np.asarray(avail))}\n\n\ndef lp_certificate(y=(100.0, 0.0, 100.0), x=(6.0, 3.0)):\n    \"\"\"Check a claimed optimum without trusting any solver: primal feasibility,\n    dual feasibility (y >= 0 and A^T y >= c) and equal objectives (no gap).\"\"\"\n    x, y = np.asarray(x, float), np.asarray(y, float)\n    return {\"Ax\": (USE @ x).tolist(), \"b\": AVAIL.tolist(), \"primal_feasible\": bool(np.all(USE @ x <= AVAIL + 1e-9) and np.all(x >= 0)),\n            \"ATy\": (USE.T @ y).tolist(), \"c\": MARGIN.tolist(), \"dual_feasible\": bool(np.all(y >= 0) and np.all(USE.T @ y >= MARGIN - 1e-9)),\n            \"primal_value\": float(MARGIN @ x), \"dual_value\": float(AVAIL @ y), \"gap\": float(AVAIL @ y - MARGIN @ x)}\n\n\ndef integer_batches(batch=4.0):\n    \"\"\"Products made only in whole batches of `batch` tonnes: x = batch * n, n integer.\"\"\"\n    c = -MARGIN * batch\n    res = milp(c, constraints=LinearConstraint(USE * batch, -np.inf, AVAIL),\n               integrality=np.ones(2), bounds=Bounds(0, np.inf))\n    n = res.x\n    return {\"status\": \"optimal\", \"x\": ((batch * n).round(9) + 0.0).tolist(), \"z\": float(MARGIN @ (batch * n))}\n\n\ndef broken_models():\n    \"\"\"Two ways to break the lecture model, solved so students see the status.\"\"\"\n    out = {}\n    # infeasible: add a supply contract x1 + x2 >= 12\n    A = np.vstack([USE, [-1.0, -1.0]]); b = np.concatenate([AVAIL, [-12.0]])\n    r = linprog(-MARGIN, A_ub=A, b_ub=b, bounds=[(0, None)] * 2, method=\"highs\")\n    out[\"supply_contract\"] = {\"status\": {0: \"optimal\", 2: \"infeasible\", 3: \"unbounded\"}[r.status]}\n    # unbounded: keep only x2 - x1 <= 5\n    r = linprog(-MARGIN, A_ub=[[-1.0, 1.0]], b_ub=[5.0], bounds=[(0, None)] * 2, method=\"highs\")\n    out[\"resources_deleted\"] = {\"status\": {0: \"optimal\", 2: \"infeasible\", 3: \"unbounded\"}[r.status]}\n    return out\n\n\n# ---------------------------------------------------------------------------\n# Part B. Lab 1: debug a colleague's flowsheet model\n# ---------------------------------------------------------------------------\n# Isomerization A -> B with recycle and purge. Two fresh feeds: a cheap one with\n# 10 mol% inert I and an expensive one with 0.5 mol% inert. Prices are quoted per kg.\nX, PHI = 0.60, 0.10                     # per-pass conversion; purged fraction of the recycle loop\nY_A = {\"F1\": 0.90, \"F2\": 0.995}         # mole fraction of A in each fresh feed\nMW = {\"A\": 60.0, \"B\": 60.0, \"I\": 28.0}  # kg/kmol\nPRICE_KG = {\"F1\": 0.80, \"F2\": 1.10, \"B\": 2.00}   # USD/kg\nPURGE_COST = 4.0                        # USD per kmol purged\nCAP, DEMAND = 100.0, 40.0               # kmol/h at the reactor inlet; kmol/h of B the market takes\nVARS = [\"F1\", \"F2\", \"FA\", \"FI\", \"AM\", \"IM\", \"Aout\", \"B\", \"PA\", \"PI\", \"RA\", \"RI\"]\nERRORS = {\n    \"units\": \"Feed prices in USD/kg are multiplied by flows in kmol/h\",\n    \"inert\": \"The inert recycle equation RI = (1 - phi) IM is missing\",\n    \"sign\": \"The mixer balance for A is written AM = FA - RA\",\n}\n\n\ndef feed_mw(f, yA=None):\n    yA = Y_A[f] if yA is None else yA\n    return yA * MW[\"A\"] + (1 - yA) * MW[\"I\"]\n\n\ndef flowsheet(fix_units=False, fix_inert=False, fix_sign=False, phi=PHI, y1=None,\n              cap=CAP, demand=DEMAND, price_b=None):\n    \"\"\"The colleague's model with any subset of the three errors fixed (all True = correct).\"\"\"\n    y = dict(Y_A); y[\"F1\"] = Y_A[\"F1\"] if y1 is None else y1\n    pb = PRICE_KG[\"B\"] if price_b is None else price_b\n    n, ix = len(VARS), {v: k for k, v in enumerate(VARS)}\n    rows, rhs, names = [], [], []\n\n    def eq(name, terms, b=0.0):\n        r = np.zeros(n)\n        for v, a in terms.items():\n            r[ix[v]] += a\n        rows.append(r); rhs.append(b); names.append(name)\n\n    eq(\"feed_A\", {\"FA\": 1, \"F1\": -y[\"F1\"], \"F2\": -y[\"F2\"]})\n    eq(\"feed_I\", {\"FI\": 1, \"F1\": -(1 - y[\"F1\"]), \"F2\": -(1 - y[\"F2\"])})\n    eq(\"mixer_A\", {\"AM\": 1, \"FA\": -1, \"RA\": -1 if fix_sign else 1})\n    eq(\"mixer_I\", {\"IM\": 1, \"FI\": -1, \"RI\": -1})\n    eq(\"reactor_A\", {\"Aout\": 1, \"AM\": -(1 - X)})\n    eq(\"reactor_B\", {\"B\": 1, \"AM\": -X})\n    eq(\"purge_A\", {\"PA\": 1, \"Aout\": -phi})\n    eq(\"recycle_A\", {\"RA\": 1, \"Aout\": -(1 - phi)})\n    eq(\"purge_I\", {\"PI\": 1, \"IM\": -phi})\n    if fix_inert:\n        eq(\"recycle_I\", {\"RI\": 1, \"IM\": -(1 - phi)})\n    cost = {f: PRICE_KG[f] * (feed_mw(f, y[f]) if fix_units else 1.0) for f in (\"F1\", \"F2\")}\n    c = np.zeros(n)\n    c[ix[\"F1\"]], c[ix[\"F2\"]] = cost[\"F1\"], cost[\"F2\"]\n    c[ix[\"B\"]] = -pb * MW[\"B\"]\n    c[ix[\"PA\"]] = c[ix[\"PI\"]] = PURGE_COST\n    A_ub = np.zeros((2, n)); A_ub[0, ix[\"AM\"]] = A_ub[0, ix[\"IM\"]] = 1; A_ub[1, ix[\"B\"]] = 1\n    res = linprog(c, A_ub=A_ub, b_ub=[cap, demand], A_eq=np.array(rows), b_eq=rhs,\n                  bounds=[(0, None)] * n, method=\"highs\")\n    if res.status != 0:\n        return {\"status\": {2: \"infeasible\", 3: \"unbounded\"}.get(res.status, res.message)}\n    x = dict(zip(VARS, res.x))\n    true_cost = {f: PRICE_KG[f] * feed_mw(f, y[f]) for f in (\"F1\", \"F2\")}\n    true_profit = (pb * MW[\"B\"] * x[\"B\"] - true_cost[\"F1\"] * x[\"F1\"] - true_cost[\"F2\"] * x[\"F2\"]\n                   - PURGE_COST * (x[\"PA\"] + x[\"PI\"]))\n    out = {\"status\": \"optimal\", \"flows\": {k: round(v, 6) + 0.0 for k, v in x.items()},\n           \"model_objective\": float(-res.fun), \"true_profit\": float(true_profit),\n           \"throughput\": float(x[\"AM\"] + x[\"IM\"]),\n           # plant-wide conservation, computed from the solution only\n           \"closure\": {\"A_and_B\": float(x[\"FA\"] - x[\"PA\"] - x[\"B\"]), \"inert\": float(x[\"FI\"] - x[\"PI\"])}}\n    if fix_units and fix_inert and fix_sign:\n        y_eq, y_ub = res.eqlin.marginals, res.ineqlin.marginals\n        reduced = c - np.array(rows).T @ y_eq - A_ub.T @ y_ub\n        dual_obj = float(np.array(rhs) @ y_eq + np.array([cap, demand]) @ y_ub)\n        out[\"certificate\"] = {\n            \"shadow_capacity\": float(-y_ub[0]), \"shadow_demand\": float(-y_ub[1]),\n            \"min_reduced_cost\": float(reduced.min()),\n            \"complementarity\": float(np.abs(reduced * res.x).max()),\n            \"primal_objective\": float(c @ res.x), \"dual_objective\": dual_obj,\n            \"gap\": float(abs(c @ res.x - dual_obj))}\n    return out\n\n\ndef lab_all_combinations():\n    out = {}\n    for fu, fi, fs in itertools.product([False, True], repeat=3):\n        key = f\"{int(fu)}{int(fi)}{int(fs)}\"            # units, inert, sign\n        out[key] = flowsheet(fu, fi, fs)\n        out[key][\"zero_price\"] = flowsheet(fu, fi, fs, price_b=0.0)[\"flows\"]\n    return out\n\n\ndef lab_sweeps():\n    def run(**kw):\n        r = flowsheet(True, True, True, **kw)\n        return {\"F1\": r[\"flows\"][\"F1\"], \"F2\": r[\"flows\"][\"F2\"], \"B\": r[\"flows\"][\"B\"],\n                \"profit\": r[\"true_profit\"], \"throughput\": r[\"throughput\"],\n                \"shadow_capacity\": r[\"certificate\"][\"shadow_capacity\"],\n                \"shadow_demand\": r[\"certificate\"][\"shadow_demand\"]}\n    return {\"phi\": [dict(value=v, **run(phi=v)) for v in (0.05, 0.075, 0.10, 0.15, 0.20)],\n            \"inert_cheap\": [dict(value=v, **run(y1=1 - v)) for v in (0.05, 0.10, 0.15, 0.20)],\n            \"capacity\": [dict(value=v, **run(cap=v)) for v in (80.0, 90.0, 100.0, 110.0, 120.0)],\n            \"demand\": [dict(value=v, **run(demand=v)) for v in (30.0, 35.0, 40.0, 45.0, 50.0)]}\n\n\ndef classroom_results():\n    R = {\"meta\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__,\n                  \"python\": sys.version.split()[0]}}\n    base = product_mix()\n    R[\"lecture\"] = {\n        \"base\": base,\n        \"packaging_sweep\": [dict(hours=h, **product_mix(avail=np.array([24.0, 16.0, h])))\n                            for h in np.arange(5.0, 15.5, 0.5)],\n        \"integer_batches\": integer_batches(),\n        \"certificate\": lp_certificate(),\n        \"rounded_lp\": {\"x\": [4.0, 0.0], \"z\": float(MARGIN @ np.array([4.0, 0.0]))},\n        \"broken\": broken_models(),\n    }\n    R[\"lab\"] = {\"combinations\": lab_all_combinations(), \"sweeps\": lab_sweeps(),\n                \"data\": {\"X\": X, \"phi\": PHI, \"y_A\": Y_A, \"MW\": MW, \"price_kg\": PRICE_KG,\n                         \"purge_cost\": PURGE_COST, \"cap\": CAP, \"demand\": DEMAND,\n                         \"feed_mw\": {f: feed_mw(f) for f in (\"F1\", \"F2\")}},\n                \"errors\": ERRORS}\n    return R\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"workflow-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote workflow-results.json\")\n        sys.exit()\n    b = R[\"lecture\"][\"base\"]\n    print(\"PART 1  Lecture example\")\n    print(f\"  plan {b['x']} t/week, margin {b['z']:.2f} USD/week, status {b['status']}\")\n    print(f\"  slack {b['slack']} h, shadow prices {b['shadow']} USD/h\")\n    print(f\"  shadow prices x availability = {b['dual_value']:.2f} (equals the margin)\")\n    p14 = [r for r in R[\"lecture\"][\"packaging_sweep\"] if r[\"hours\"] == 14.0][0]\n    print(f\"  packaging 14 h: plan {p14['x']}, margin {p14['z']:.2f}\")\n    print(f\"  whole 4 t batches: {R['lecture']['integer_batches']}; LP rounded down: {R['lecture']['rounded_lp']}\")\n    print(f\"  broken models: {R['lecture']['broken']}\")\n    print(\"\\nPART 2  Lab 1, every combination of fixes (units, inert, sign)\")\n    for k, v in R[\"lab\"][\"combinations\"].items():\n        f = v[\"flows\"]\n        print(f\"  {k}: F1 {f['F1']:7.2f}  F2 {f['F2']:7.2f}  B {f['B']:6.2f}  model {v['model_objective']:8.1f}\"\n              f\"  true {v['true_profit']:8.1f}  closure A+B {v['closure']['A_and_B']:6.2f}  inert {v['closure']['inert']:6.2f}\")\n    print(\"  certificate of the repaired model:\", R[\"lab\"][\"combinations\"][\"111\"][\"certificate\"])\n";   // embedded copy, so live Python also works when the file is opened locally

function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks

    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;

  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;

function clipPoly(poly,a,b){const out=[];for(let i=0;i<poly.length;i++){const P=poly[i],Q=poly[(i+1)%poly.length];
  const fp=a[0]*P[0]+a[1]*P[1]-b,fq=a[0]*Q[0]+a[1]*Q[1]-b;if(fp<=1e-9)out.push(P);
  if((fp<-1e-9&&fq>1e-9)||(fp>1e-9&&fq<-1e-9)){const t=fp/(fp-fq);out.push([P[0]+t*(Q[0]-P[0]),P[1]+t*(Q[1]-P[1])])}}return out}
function regionOf(cons,box){let p=[[0,0],[box,0],[box,box],[0,box]];cons.forEach(c=>{if(p.length)p=clipPoly(p,c.a,c.b)});return p}
function lineInBox(a,b,box){const pts=[];const add=(x,y)=>{if(x>=-1e-9&&x<=box+1e-9&&y>=-1e-9&&y<=box+1e-9&&!pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<1e-6))pts.push([x,y])};
  if(Math.abs(a[1])>1e-12){add(0,b/a[1]);add(box,(b-a[0]*box)/a[1])}if(Math.abs(a[0])>1e-12){add(b/a[0],0);add((b-a[1]*box)/a[0],box)}return pts.slice(0,2)}

  s+=`<text x="${l+X/2}" y="${H-8}" font-size="17" text-anchor="middle">x₁ Additive, t/week</text><text transform="translate(18,${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle">x₂ Binder, t/week</text>`;

<tr><th>Stage</th><th>Artifact it produces</th><th>Typical failure</th></tr>
<tr><td>1 Verbal</td><td>Prose, with a source for every number</td><td>Optimizing the wrong thing, or a decision the plant cannot carry out</td></tr>

S.push({kicker:"Part 2 · Anatomy", title:"Every optimization problem is four things", html:()=>`<div class="body"><div class="col"><table class="t">
<tr><th>Part</th><th>What it is</th><th>In today's example</th></tr>
<tr><td><b>Decision variables</b></td><td>What you are free to choose</td><td>x₁, x₂ in t/week</td></tr>
<tr><td><b>Parameters</b></td><td>Numbers fixed before solving: prices, capacities, yields</td><td>margins, hours per tonne, hours available</td></tr>
<tr><td><b>Objective</b></td><td>One number that says how good a choice is</td><td>weekly margin, USD/week</td></tr>
<tr><td><b>Constraints</b></td><td>Rules a choice must satisfy: g(x) ≤ 0, h(x) = 0, bounds</td><td>three resource limits, x ≥ 0</td></tr></table>
<ul class="b xs" style="margin-top:16px"><li>A quantity you cannot change is a parameter, not a variable</li><li>Maximizing f is minimizing −f, so every problem can be written as a minimization</li>
<li><b>Hard or soft</b> is your modeling decision: a safety limit is hard; a delivery date is usually soft, with a penalty for being late</li></ul></div></div>`});

S.push({kicker:"Part 2 · Classification", title:"Convexity and integrality decide what a solver can promise", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:17px">
<tr><th>Class</th><th>Structure</th><th>What a solver returns</th><th>Evidence you can check</th></tr>
<tr><td><b>LP</b></td><td>linear f, g, h</td><td>global optimum, or infeasible, or unbounded</td><td>primal-dual pair; Farkas vector; improving ray</td></tr>
<tr><td><b>Convex NLP</b> (QP, SOCP, ...)</td><td>convex f and g, affine h</td><td>global optimum</td><td>KKT point plus convexity; duality gap</td></tr>
<tr><td><b>Nonconvex NLP</b></td><td>anything else continuous</td><td>a local optimum, if all goes well</td><td>KKT residuals at that point only</td></tr>
<tr><td><b>MILP</b></td><td>linear, some integers</td><td>best plan found and a bound</td><td>relative gap between them</td></tr>
<tr><td><b>MINLP</b></td><td>nonlinear, some integers</td><td>local, or global with spatial branch and bound</td><td>gap, if the solver is global</td></tr></table>
<ul class="b xs" style="margin-top:14px"><li>Linear versus nonlinear is the wrong first question; convex versus nonconvex is the right one</li><li>Uncertainty (Session 12) and multiple objectives (Session 13) cut across this table</li></ul></div></div>`});

draw:()=>{const sl=document.getElementById("zl"),cons=BASE_CONS(),V=vertsOf(cons,10).map(p=>({p,z:400*p[0]+300*p[1]})).sort((a,b)=>a.z-b.z);
 document.getElementById("vt").innerHTML=`<tr><th>Vertex</th><th class="n">z, USD/week</th></tr>`+V.map(v=>`<tr><td>(${fmt(v.p[0],0)}, ${fmt(v.p[1],0)})</td><td class="n">${fmt(v.z)}</td></tr>`).join("");
 const up=()=>{const z=+sl.value,ok=V.some(v=>v.z>=z-1e-9);document.getElementById("zv").textContent=fmt(z);
  document.getElementById("zmsg").innerHTML=ok?(z===3300?`<b style="color:${C.amber}">Last touch: only the corner (6, 3) is left on the line.</b>`:"Some feasible plans earn exactly this margin. Push further."):`<b style="color:${C.rust}">No feasible plan earns this much.</b>`;

notes:"Region: the intersection of five half planes, so it is convex. The gradient (400, 300) is the same everywhere, so the last point touched is a corner. Session 7 turns this into the simplex method.",
py:{title:"List the vertices", sub:"an LP with a finite optimum has an optimal vertex", code:
`import itertools, numpy as np
A = np.array([[3, 2], [1, 2], [1, 1], [-1, 0], [0, -1]], float)
b = np.array([24, 16, 9, 0, 0], float)
for i, j in itertools.combinations(range(5), 2):
    M = A[[i, j]]
    if abs(np.linalg.det(M)) > 1e-9:
        x = np.linalg.solve(M, b[[i, j]])
        if np.all(A @ x <= b + 1e-9):
            print(x, 400 * x[0] + 300 * x[1])`, out:()=>vertsOf(BASE_CONS(),10).map(p=>`[${p[0]}. ${p[1]}.] ${400*p[0]+300*p[1]}`).join("\n")}});

S.push({kicker:"Part 2 · Formulation", title:"The same physics can be a hard or an easy problem", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:17px">
<tr><th>Choice</th><th>Weak formulation</th><th>Better formulation</th></tr>
<tr><td>Quality ratio</td><td>Σ h<sub>i</sub>u<sub>i</sub> / Σ u<sub>i</sub> ≤ 6 (nonlinear, undefined at zero flow)</td><td>Σ (h<sub>i</sub> − 6) u<sub>i</sub> ≤ 0 (linear, exact for Σ u<sub>i</sub> ≥ 0)</td></tr>
<tr><td>On/off unit</td><td>x ≤ M y with M far too large: weak LP bound</td><td>x ≤ x<sup>max</sup> y with the tightest valid M (Session 3)</td></tr>
<tr><td>Scaling</td><td>variables from 10⁻³ to 10⁶ in one model: tolerances lose meaning</td><td>choose units so most variables are near 1; report in physical units</td></tr>
<tr><td>Mixing streams</td><td>flow × composition: bilinear, nonconvex</td><td>component flows where possible; when not, expect local optima (Session 13)</td></tr></table>
<p class="note">Formulation is part of the model. Two formulations with the same feasible set can differ by orders of magnitude in solve time and in the quality of the bound.</p></div></div>`});

S.push({kicker:"Part 2 · Validity", title:"Optimization error is not model error", html:()=>`<div class="body"><div class="col w55"><ul class="b sm">
<li>An optimizer pushes the model to its boundaries, exactly where a fitted correlation or a linearization is least accurate</li>
<li>A certificate proves that x* is optimal <i>for the model</i>. It says nothing about whether the model describes the plant</li>
<li>Ask: over what range are the data and correlations valid, and does x* stay inside it?</li>
<li>Ask: how much does x* change if each uncertain parameter moves by its error bar?</li></ul></div>
<div class="col"><div class="panel"><table class="t" style="font-size:17px"><tr><th>Error</th><th>Who catches it</th></tr>
<tr><td>Solver did not converge</td><td>status, residuals, certificate</td></tr><tr><td>Model has a coding error</td><td>units, conservation, extreme cases</td></tr>

S.push({kicker:"Part 3 · Tools", title:"Two layers, and neither knows what the other knows", html:()=>`<div class="body"><div class="col"><table class="t">

/* ---------- deck engine ---------- */
const N=S.length; let cur=0;
function build(){const host=document.getElementById("slides");host.innerHTML="";
 S.forEach((s,i)=>{const d=document.createElement("section");d.className="slide"+(s.cls?" "+s.cls:"");d.id="s"+(i+1);
  d.innerHTML=(s.kicker&&!s.cls?`<p class="kicker">${s.kicker}</p>`:"")+(s.title?`<h1>${s.title}</h1>`:"")+s.html()+(s.py?`<div class="dhint">D · Python</div>`:"")+`<footer><span>${foot}</span><span>${i+1} / ${N}</span></footer>`;host.appendChild(d)})}
function drawAll(){S.forEach(s=>{if(s.draw)try{s.draw()}catch(e){console.error(e)}})}
function show(i){cur=Math.max(0,Math.min(N-1,i));document.querySelectorAll(".slide").forEach((el,k)=>el.classList.toggle("on",k===cur));
 history.replaceState(null,"",location.search+"#"+(cur+1));fillDrawer();if(window.onSlideChange)onSlideChange(cur);const n=document.getElementById("notes");n.textContent=S[cur].notes||"No notes for this slide."}
let CAP_ON=false;   // set by the narration player; reserves a caption band under the slide
function fit(){const W=innerWidth,H=innerHeight,vp=document.getElementById("viewport"),dock=document.getElementById("dock"),cap=document.getElementById("cap");
 const hasDock=dock.style.display==="flex",barH=hasDock?document.getElementById("nbar").offsetHeight:0;
 let k=Math.min(W/1280,H/720)*0.98,capH=0,fs=0,dockH=0;
 for(let it=0;it<3;it++){if(hasDock&&CAP_ON){const lines=k<0.6?4:2;fs=Math.max(12,Math.min(22,24*k));capH=Math.ceil(lines*fs*1.45)+4}else capH=0;
  dockH=hasDock?capH+barH+(capH?6:0)+14:0;k=Math.min(W/1280,Math.max(120,H-dockH)/720)*0.98}
 const h=720*k,pad=10,top=Math.max(0,(H-h-dockH)/2);
 vp.style.top=(top-pad)+"px";vp.style.bottom="auto";vp.style.height=(h+2*pad)+"px";
 document.getElementById("stage").style.transform=`scale(${k})`;
 if(hasDock){dock.style.top=(top+h+6)+"px";cap.style.display=CAP_ON?"block":"none";cap.style.width=Math.min(1280*k,W-16)+"px";cap.style.height=capH+"px";cap.dataset.fs=fs;if(window.capRefit)capRefit()}}
function fillDrawer(){const p=S[cur].py,dr=document.getElementById("drawer");
 if(!p){document.getElementById("dTitle").textContent="No Python on this slide";document.getElementById("dSub").textContent="Slides with a 'D · Python' tag have code and output.";document.getElementById("dCode").value="";document.getElementById("dOut").textContent="";return}
 document.getElementById("dTitle").textContent=p.title;document.getElementById("dSub").textContent=p.sub||"";document.getElementById("dCode").value=p.code;
 try{document.getElementById("dOut").textContent=p.out()}catch(e){document.getElementById("dOut").textContent=String(e)}
 const m=document.getElementById("dMode");m.className="pill "+(MODE==="live"?"live":"rec");m.textContent=MODE==="live"?"LIVE RUN":"RECORDED RUN"}
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes(e.target.tagName)){if(e.key==="Escape")e.target.blur();return}const k=e.key;
 if(["ArrowRight","PageDown"," "].includes(k)){e.preventDefault();show(cur+1)}else if(["ArrowLeft","PageUp"].includes(k)){e.preventDefault();show(cur-1)}
 else if(k==="Home")show(0);else if(k==="End")show(N-1);else if(k==="d"||k==="D")document.getElementById("drawer").classList.toggle("open");
 else if(k==="f"||k==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
 else if(k==="p"||k==="P"){if(window.narrToggle)narrToggle()}
 else if(k==="c"||k==="C"){if(window.ccCycle)ccCycle()}
 else if(k==="n"||k==="N"){const n=document.getElementById("notes");n.style.display=n.style.display==="block"?"none":"block"}});
document.getElementById("stage").addEventListener("click",e=>{if(e.target.closest("button,input,select,#drawer,a,#startov"))return;const r=e.currentTarget.getBoundingClientRect();(e.clientX-r.left)>r.width*0.5?show(cur+1):show(cur-1)});
addEventListener("resize",fit);

/* ---------- live Python (Pyodide) ---------- */
let py=null;
async function ensurePy(msg){if(py)return py;msg.textContent="Loading Python in the browser (first time about 5–10 s) ...";
 if(!window.loadPyodide){await new Promise((ok,bad)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js";s.onload=ok;s.onerror=()=>bad(new Error("could not load Pyodide"));document.head.appendChild(s)})}
 const p=await loadPyodide();await p.loadPackage(["numpy","scipy"]);
 const src=LAB_SRC||await (await fetch(LAB_FILE)).text();p.FS.writeFile("workflow_lab.py",src);
 await p.runPythonAsync('import sys\nsys.path.insert(0, ".")\nfrom workflow_lab import *');py=p;return p}
async function runCode(){const msg=document.getElementById("liveMsg"),out=document.getElementById("dOut"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Running ...";const buf=[];p.setStdout({batched:s=>buf.push(s)});p.setStderr({batched:s=>buf.push(s)});
  try{await p.runPythonAsync(document.getElementById("dCode").value)}catch(e){buf.push(String(e.message||e).split("\n").slice(-4).join("\n"))}
  out.textContent=buf.join("\n")||"(no output)";const m=document.getElementById("dMode");m.className="pill live";m.textContent="LIVE OUTPUT";
  msg.textContent=`Ran in ${((performance.now()-t0)/1000).toFixed(1)} s in the browser`}
 catch(e){msg.textContent="Python could not start: "+e.message+". The recorded output is still available."}}
async function runLive(){const msg=document.getElementById("liveMsg"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Solving every model ...";
  const out=await p.runPythonAsync('import importlib, json\nimport workflow_lab as lab\nimportlib.reload(lab)\njson.dumps(lab.classroom_results())');
  R=JSON.parse(out);MODE="live";drawAll();fillDrawer();msg.textContent=`All slides now show a live run (${((performance.now()-t0)/1000).toFixed(1)} s, SciPy ${R.meta.scipy})`}
 catch(e){msg.textContent="Live run failed: "+e.message+". The recorded run is still shown."}}
document.getElementById("runCode").onclick=runCode;
document.getElementById("runLive").onclick=runLive;
document.getElementById("useRec").onclick=()=>{R=RECORDED;MODE="recorded";drawAll();fillDrawer();document.getElementById("liveMsg").textContent="Showing the recorded run."};
