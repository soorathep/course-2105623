const LAB_SRC = "\"\"\"2105623 Session 11: dynamic optimization and model predictive control (2027 draft).\n\nPart A  Batch reactor A -> B -> C, temperature profile that maximizes B at t = 1 h (Logsdon and Biegler, 1989):\n        isothermal operation, single shooting with a piecewise-constant temperature, and (in Colab, with CasADi)\n        orthogonal collocation solved by Ipopt\nPart B  Collocation by hand: Radau collocation on dx/dt = -k x, and the sparsity of the collocation NLP\nPart C  Level control of two tanks in series by MPC, solved at every step as a bounded least-squares problem\n\nRuns in desktop Python and in the browser (NumPy and SciPy). Collocation with Ipopt needs CasADi: pip install casadi.\nCourse notation: lambda and mu are multipliers; the barrier parameter of Session 9 was tau.\n\"\"\"\nimport json, math, sys\nimport numpy as np\nfrom scipy.linalg import expm\nfrom scipy.optimize import minimize, minimize_scalar, lsq_linear\n\n\ndef r6(v):\n    if isinstance(v, (list, tuple, np.ndarray)):\n        return [r6(u) for u in v]\n    v = round(float(v), 6)\n    return 0.0 if v == 0 else v\n\n\ndef sig(v, d=4):\n    return f\"{float(v):.{d}g}\"\n\n\n# ---------------------------------------------------------------------------\n# Part A. Batch reactor: dx1/dt = -k1 x1^2, dx2/dt = k1 x1^2 - k2 x2, x(0) = (1, 0), 0 <= t <= 1 h,\n#         k1 = 4000 exp(-2500/T), k2 = 620000 exp(-5000/T) (1/h), 298 <= T <= 398 K; maximize x2(1)\n# ---------------------------------------------------------------------------\nBR = {\"tf\": 1.0, \"h\": 0.005, \"Tlo\": 298.0, \"Thi\": 398.0, \"k10\": 4000.0, \"E1\": 2500.0, \"k20\": 620000.0, \"E2\": 5000.0}\n\n\ndef br_rates(T, k2f=1.0):\n    return BR[\"k10\"] * math.exp(-BR[\"E1\"] / T), k2f * BR[\"k20\"] * math.exp(-BR[\"E2\"] / T)\n\n\ndef br_sim(Ts, x0=(1.0, 0.0), k2f=1.0, t_int=None, traj=False):\n    \"\"\"Integrate with the temperature Ts[i] held on interval i (piecewise constant) by classical RK4 with a fixed step\n    of 0.005 h. Each interval lasts tf/len(Ts) unless t_int is given. Returns x at the end, or (t, x1, x2) if traj.\"\"\"\n    t_int = BR[\"tf\"] / len(Ts) if t_int is None else t_int\n    n = int(round(t_int / BR[\"h\"])); h = t_int / n\n    a, b = float(x0[0]), float(x0[1]); t = 0.0; out = [(t, a, b)]\n    for T in Ts:\n        k1, k2 = br_rates(float(T), k2f)\n        for _ in range(n):\n            f1a = -k1 * a * a; f1b = k1 * a * a - k2 * b\n            a2 = a + h / 2 * f1a; b2 = b + h / 2 * f1b; f2a = -k1 * a2 * a2; f2b = k1 * a2 * a2 - k2 * b2\n            a3 = a + h / 2 * f2a; b3 = b + h / 2 * f2b; f3a = -k1 * a3 * a3; f3b = k1 * a3 * a3 - k2 * b3\n            a4 = a + h * f3a; b4 = b + h * f3b; f4a = -k1 * a4 * a4; f4b = k1 * a4 * a4 - k2 * b4\n            a += h / 6 * (f1a + 2 * f2a + 2 * f3a + f4a); b += h / 6 * (f1b + 2 * f2b + 2 * f3b + f4b); t += h\n            if traj:\n                out.append((t, a, b))\n    if traj:\n        return [list(c) for c in zip(*out)]\n    return [a, b]\n\n\ndef br_iso():\n    \"\"\"Isothermal operation: x2(1) against a constant T, and the best constant T.\"\"\"\n    Ts = np.arange(298.0, 398.01, 2.0)\n    r = minimize_scalar(lambda T: -br_sim([T])[1], bounds=(BR[\"Tlo\"], BR[\"Thi\"]), method=\"bounded\", options={\"xatol\": 1e-6})\n    return {\"T\": Ts.tolist(), \"x2\": [br_sim([T])[1] for T in Ts], \"Tbest\": float(r.x), \"x2best\": float(-r.fun)}\n\n\ndef br_shoot(N, k2f=1.0, x0=(1.0, 0.0), t_int=None, u0=None):\n    \"\"\"Single shooting: N piecewise-constant temperatures, T = 298 + 100 u with 0 <= u <= 1, maximize x2(tf) by SLSQP\n    with finite-difference gradients. Each objective evaluation integrates the model over the whole horizon.\"\"\"\n    u0 = np.full(N, 0.5) if u0 is None else np.asarray(u0, float)\n    r = minimize(lambda u: -br_sim(298 + 100 * u, x0, k2f, t_int)[1], u0, method=\"SLSQP\", bounds=[(0, 1)] * N,\n                 options={\"ftol\": 1e-12, \"maxiter\": 300})\n    return {\"N\": N, \"T\": (298 + 100 * r.x).tolist(), \"x2\": float(-r.fun), \"nit\": int(r.nit), \"nfev\": int(r.nfev), \"status\": int(r.status)}\n\n\ndef br_robust():\n    \"\"\"The nominal 20-interval profile when k2 is really 10% higher: predicted, obtained, best possible, and a\n    shrinking-horizon re-optimization that uses the measured state but keeps the nominal (wrong) k2.\"\"\"\n    nom = br_shoot(20); tru = br_shoot(20, k2f=1.1)\n    applied = br_sim(nom[\"T\"], k2f=1.1)[1]\n    x = [1.0, 0.0]; used = []; u_prev = (np.array(nom[\"T\"]) - 298) / 100\n    for i in range(20):\n        T = nom[\"T\"][0] if i == 0 else br_shoot(20 - i, x0=x, t_int=0.05, u0=u_prev[i:])[\"T\"][0]\n        used.append(T); x = br_sim([T], x0=x, k2f=1.1, t_int=0.05)\n    return {\"predicted\": nom[\"x2\"], \"applied\": applied, \"best\": tru[\"x2\"], \"T_best\": tru[\"T\"], \"shrinking\": x[1], \"T_shrinking\": used}\n\n\ndef br_colloc(NE=50, K=3, Thi=398.0, k2f=1.0, print_level=0):\n    \"\"\"Direct collocation: NE finite elements, K Radau points each, T constant on each element; Ipopt through CasADi.\n    Variables: element-start states, collocation-point states and one temperature per element (in 100 K).\"\"\"\n    import casadi as ca\n    tau, Cm, Dv = colloc_matrices(K)\n    h = BR[\"tf\"] / NE; opti = ca.Opti(); Xk = opti.variable(2); opti.subject_to(Xk == ca.DM([1, 0])); us = []\n    for e in range(NE):\n        u = opti.variable(); opti.subject_to(opti.bounded(BR[\"Tlo\"] / 100, u, Thi / 100)); opti.set_initial(u, 3.5); us.append(u)\n        k1 = BR[\"k10\"] * ca.exp(-BR[\"E1\"] / (100 * u)); k2 = k2f * BR[\"k20\"] * ca.exp(-BR[\"E2\"] / (100 * u))\n        Xc = [opti.variable(2) for _ in range(K)]\n        for xc in Xc:\n            opti.set_initial(xc, [0.5, 0.3])\n        Xend = Dv[0] * Xk\n        for j in range(1, K + 1):\n            xp = Cm[0][j] * Xk\n            for r in range(K):\n                xp = xp + Cm[r + 1][j] * Xc[r]\n            x = Xc[j - 1]\n            opti.subject_to(xp == h * ca.vertcat(-k1 * x[0]**2, k1 * x[0]**2 - k2 * x[1]))\n            Xend = Xend + Dv[j] * Xc[j - 1]\n        Xk = opti.variable(2); opti.set_initial(Xk, [0.5, 0.3]); opti.subject_to(Xk == Xend)\n    opti.minimize(-Xk[1])\n    opti.solver(\"ipopt\", {\"print_time\": False}, {\"print_level\": print_level, \"tol\": 1e-10, \"sb\": \"yes\"})\n    s = opti.solve(); st = s.stats()\n    return {\"NE\": NE, \"K\": K, \"x2\": float(s.value(Xk[1])), \"iter\": int(st[\"iter_count\"]), \"status\": st[\"return_status\"],\n            \"nvar\": int(opti.nx), \"ncon\": int(opti.ng), \"T\": [100 * float(s.value(u)) for u in us]}\n\n\n# ---------------------------------------------------------------------------\n# Part B. Collocation by hand\n# ---------------------------------------------------------------------------\nRADAU = {1: [1.0], 2: [1 / 3, 1.0], 3: [(4 - math.sqrt(6)) / 10, (4 + math.sqrt(6)) / 10, 1.0]}\n\n\ndef colloc_matrices(K):\n    \"\"\"Lagrange polynomials through tau = (0, Radau points): C[r][j] = derivative of polynomial r at point j,\n    D[r] = polynomial r at tau = 1 (the end of the element).\"\"\"\n    tau = [0.0] + RADAU[K]; Cm = [[0.0] * (K + 1) for _ in range(K + 1)]; Dv = [0.0] * (K + 1)\n    for j in range(K + 1):\n        p = np.poly1d([1.0])\n        for r in range(K + 1):\n            if r != j:\n                p = p * np.poly1d([1.0, -tau[r]]) / (tau[j] - tau[r])\n        Dv[j] = float(p(1.0)); dp = np.polyder(p)\n        for r in range(K + 1):\n            Cm[j][r] = float(dp(tau[r]))\n    return tau, Cm, Dv\n\n\ndef colloc_decay(k=5.0, K=3, NE=4):\n    \"\"\"Radau collocation of dx/dt = -k x, x(0) = 1 on [0, 1]: returns the element-end values and the error at t = 1.\"\"\"\n    tau, Cm, Dv = colloc_matrices(K); h = 1.0 / NE; x = 1.0; ends = [1.0]; pts = []\n    for e in range(NE):\n        A = np.array([[Cm[r + 1][j] + (k * h if r + 1 == j else 0.0) for r in range(K)] for j in range(1, K + 1)])\n        b = np.array([-Cm[0][j] * x for j in range(1, K + 1)]); xc = np.linalg.solve(A, b)\n        pts += [((e + tau[j + 1]) * h, float(xc[j])) for j in range(K)]\n        x = Dv[0] * x + sum(Dv[j + 1] * xc[j] for j in range(K)); ends.append(float(x))\n    return {\"K\": K, \"NE\": NE, \"ends\": ends, \"points\": pts, \"x1\": x, \"err\": abs(x - math.exp(-k))}\n\n\ndef colloc_pattern(NE=4, K=3):\n    \"\"\"Sparsity of the equality-row Jacobian of the batch collocation NLP. Variables, element by element:\n    [X_e (2), Xc_e,1..K (2K), u_e (1)], then the final state. Rows: 2K collocation rows and 2 continuity rows per\n    element (the fixed initial state and the bounds on u are left out). Returns the nonzero (row, column) pairs.\"\"\"\n    tau, Cm, Dv = colloc_matrices(K); nv_e = 2 + 2 * K + 1; nz = []; row = 0\n    for e in range(NE):\n        c0 = e * nv_e; xc = lambda r, s: c0 + 2 + 2 * r + s\n        for j in range(K):\n            for s in range(2):\n                cols = [c0 + s] + [xc(r, s) for r in range(K)] + [xc(j, 0), c0 + 2 + 2 * K] + ([xc(j, 1)] if s == 1 else [])\n                nz += [(row, c) for c in sorted(set(cols))]; row += 1\n        for s in range(2):\n            cols = ([c0 + s] if abs(Dv[0]) > 1e-12 else []) + [xc(r, s) for r in range(K) if abs(Dv[r + 1]) > 1e-12] + [c0 + nv_e + s]\n            nz += [(row, c) for c in sorted(set(cols))]; row += 1\n    return {\"NE\": NE, \"K\": K, \"rows\": row, \"cols\": NE * nv_e + 2, \"nz\": nz, \"density\": len(nz) / (row * (NE * nv_e + 2))}\n\n\n# ---------------------------------------------------------------------------\n# Part C. Two tanks in series; MPC on the level of tank 2\n#   A1 dh1/dt = u - h1/R1,  A2 dh2/dt = h1/R1 - h2/R2 + d;  u: valve flow 0 to 0.5 m3/min; d: unmeasured flow into tank 2\n# ---------------------------------------------------------------------------\nTANK = {\"A1\": 1.0, \"A2\": 1.0, \"R1\": 2.0, \"R2\": 4.0, \"dt\": 0.5, \"umax\": 0.5, \"steps\": 120, \"x0\": [0.6, 1.2], \"u0\": 0.3,\n        \"r0\": 1.2, \"r1\": 1.6, \"k_r\": 10, \"d1\": -0.05, \"k_d\": 60}\n\n\ndef tank_model():\n    \"\"\"Exact discretization with the inputs held over each 0.5 min step (zero-order hold).\"\"\"\n    A1, A2, R1, R2 = TANK[\"A1\"], TANK[\"A2\"], TANK[\"R1\"], TANK[\"R2\"]\n    Ac = np.array([[-1 / (A1 * R1), 0], [1 / (A2 * R1), -1 / (A2 * R2)]]); Bc = np.array([[1 / A1, 0], [0, 1 / A2]])\n    M = expm(np.block([[Ac, Bc], [np.zeros((2, 4))]]) * TANK[\"dt\"])\n    return M[:2, :2], M[:2, 2], M[:2, 3]\n\n\ndef tank_pred(N):\n    \"\"\"Level of tank 2 over the next N steps: y = Phi x + G U + Gd d.\"\"\"\n    Ad, Bd, Ed = tank_model(); P = [np.linalg.matrix_power(Ad, k) for k in range(N + 1)]\n    Phi = np.array([P[i + 1][1] for i in range(N)]); G = np.zeros((N, N)); Gd = np.zeros(N)\n    for i in range(N):\n        for j in range(i + 1):\n            G[i, j] = (P[i - j] @ Bd)[1]\n        Gd[i] = sum((P[i - j] @ Ed)[1] for j in range(i + 1))\n    return Phi, G, Gd\n\n\ndef mpc_solve(x, u_prev, r, dhat, N, w, P=None):\n    \"\"\"min sum (y_i - r_i)^2 + w sum (u_i - u_{i-1})^2 subject to 0 <= u_i <= umax: a bounded linear least-squares\n    problem in U, solved by lsq_linear (bounded-variable least squares).\"\"\"\n    Phi, G, Gd = tank_pred(N) if P is None else P\n    D = np.eye(N) - np.eye(N, k=-1); e = np.zeros(N); e[0] = u_prev\n    A = np.vstack([G, math.sqrt(w) * D]); b = np.concatenate([np.asarray(r) - Phi @ x - Gd * dhat, math.sqrt(w) * e])\n    return lsq_linear(A, b, bounds=(0, TANK[\"umax\"]), method=\"bvls\").x\n\n\ndef tank_run(N=20, w=1.0, est=True, openloop=False):\n    \"\"\"Closed loop for 60 min: setpoint 1.2 -> 1.6 m at 5 min; an unmeasured withdrawal of 0.05 m3/min from tank 2\n    starts at 30 min. est: update a constant-disturbance estimate from the one-step prediction error of h2.\n    openloop: plan the whole hour at t = 0 and apply it without feedback.\"\"\"\n    Ad, Bd, Ed = tank_model(); P = tank_pred(N); S = TANK[\"steps\"]\n    rr = lambda k: TANK[\"r0\"] if k < TANK[\"k_r\"] else TANK[\"r1\"]\n    x = np.array(TANK[\"x0\"]); u = TANK[\"u0\"]; dh = 0.0; H1 = [x[0]]; H2 = [x[1]]; U = []; Dh = []\n    plan = mpc_solve(x, u, [rr(i + 1) for i in range(S)], 0.0, S, w) if openloop else None\n    for k in range(S):\n        if openloop:\n            u = plan[k]\n        else:\n            u = mpc_solve(x, u, [rr(k + i + 1) for i in range(N)], dh, N, w, P)[0]\n        d = TANK[\"d1\"] if k >= TANK[\"k_d\"] else 0.0\n        xp = Ad @ x + Bd * u + Ed * dh; x = Ad @ x + Bd * u + Ed * d\n        if est and not openloop:\n            dh = dh + (x[1] - xp[1]) / Ed[1]\n        H1.append(x[0]); H2.append(x[1]); U.append(u); Dh.append(dh)\n    H2 = np.array(H2); seg = H2[TANK[\"k_r\"]:TANK[\"k_d\"]]; step = TANK[\"r1\"] - TANK[\"r0\"]\n    out = np.where(np.abs(seg - TANK[\"r1\"]) > 0.02 * step)[0]\n    after = H2[TANK[\"k_d\"]:]\n    return {\"N\": N, \"w\": w, \"est\": est, \"openloop\": openloop, \"h1\": r6(H1), \"h2\": r6(H2), \"u\": r6(U), \"dhat\": r6(Dh),\n            \"overshoot\": float(max(0.0, (seg.max() - TANK[\"r1\"]) / step * 100)), \"settle\": float((out[-1] + 1 - 0) * TANK[\"dt\"]) if len(out) else 0.0,\n            \"dist_dev\": float(np.max(np.abs(after - TANK[\"r1\"]))), \"offset\": float(H2[-1] - TANK[\"r1\"]),\n            \"sat\": int(np.sum(np.array(U) > TANK[\"umax\"] - 1e-6))}\n\n\ndef tank_grid():\n    return [tank_run(N, w) for N in (5, 10, 20, 40) for w in (0.01, 0.1, 1.0, 10.0)]\n\n\ndef clean(o):\n    if isinstance(o, dict):\n        return {k: clean(v) for k, v in o.items()}\n    if isinstance(o, (list, tuple)):\n        return [clean(v) for v in o]\n    if isinstance(o, np.ndarray):\n        return clean(o.tolist())\n    if isinstance(o, (float, np.floating)):\n        return float(o) if np.isfinite(o) else None\n    if isinstance(o, (np.integer,)):\n        return int(o)\n    if isinstance(o, np.bool_):\n        return bool(o)\n    return o\n\n\ndef lab_results():\n    iso = br_iso(); shoot = {N: br_shoot(N) for N in (1, 2, 4, 5, 10, 20)}\n    tr = {N: br_sim(shoot[N][\"T\"], traj=True) for N in (1, 20)}\n    return {\"br\": BR, \"iso\": iso, \"shoot\": {str(k): v for k, v in shoot.items()}, \"traj\": {str(k): v for k, v in tr.items()},\n            \"robust\": br_robust(), \"tank\": TANK, \"mpc_grid\": tank_grid(), \"mpc_noest\": tank_run(20, 1.0, est=False), \"mpc_open\": tank_run(20, 1.0, openloop=True)}\n\n\ndef colloc_results():\n    \"\"\"Collocation runs for the slides and the lab (CasADi); None where CasADi is not installed (the browser).\"\"\"\n    try:\n        import casadi\n    except ImportError:\n        return None\n    runs = {str(n): br_colloc(n) for n in (10, 25, 50, 100)}\n    return {\"casadi\": casadi.__version__, \"runs\": runs, \"Tmax370\": br_colloc(50, Thi=370.0), \"k2f11\": br_colloc(50, k2f=1.1), \"log\": br_colloc_log()}\n\n\ndef br_colloc_log():\n    \"\"\"Ipopt's printed log for the 50-element collocation run (Lab 11, notebook Step 3), without the banner.\"\"\"\n    import os, subprocess\n    here = os.path.dirname(os.path.abspath(__file__))\n    r = subprocess.run([sys.executable, \"-c\", \"import dyn_lab as m; m.br_colloc(50, 3, print_level=5)\"], cwd=here, capture_output=True, text=True)\n    lines = r.stdout.splitlines()\n    start = next((i for i, l in enumerate(lines) if l.startswith(\"This is Ipopt\")), 0)\n    return \"\\n\".join(lines[start:]).strip()\n\n\ndef classroom_results():\n    import scipy\n    R = {\"meta\": {\"numpy\": np.__version__, \"scipy\": scipy.__version__, \"python\": sys.version.split()[0]}}\n    R[\"lecture\"] = {\"decay\": {f\"{K}-{n}\": colloc_decay(K=K, NE=n) for K in (1, 2, 3) for n in (1, 2, 4, 8, 16)},\n                    \"pattern\": colloc_pattern(4, 3), \"colloc\": colloc_results(),\n                    \"mpc_first\": mpc_solve([0.6, 1.2], 0.3, [1.6] * 20, 0.0, 20, 1.0).tolist()}\n    R[\"lab\"] = lab_results()\n    return clean(R)\n\n\nif __name__ == \"__main__\":\n    if \"--json\" in sys.argv:\n        R = classroom_results()\n        with open(\"dyn-results.json\", \"w\") as fh:\n            json.dump(R, fh)\n        print(\"wrote dyn-results.json\", R[\"meta\"]); sys.exit()\n    iso = br_iso(); print(\"A iso\", r6(iso[\"Tbest\"]), r6(iso[\"x2best\"]))\n    for N in (1, 5, 20):\n        s = br_shoot(N); print(\"A shoot\", N, r6(s[\"x2\"]), s[\"nit\"], s[\"nfev\"], r6(s[\"T\"][:3]))\n    rb = br_robust(); print(\"A robust\", {k: r6(v) for k, v in rb.items() if not k.startswith(\"T\")})\n    for K in (1, 2, 3):\n        print(\"B decay K\", K, [sig(colloc_decay(K=K, NE=n)[\"err\"], 3) for n in (1, 2, 4, 8, 16)])\n    p = colloc_pattern(); print(\"B pattern\", p[\"rows\"], p[\"cols\"], len(p[\"nz\"]), r6(p[\"density\"]))\n    for q in (tank_run(20, 1.0, est=False), tank_run(20, 1.0), tank_run(20, 1.0, openloop=True), tank_run(5, 10.0)):\n        print(\"C tank\", q[\"N\"], q[\"w\"], q[\"est\"], q[\"openloop\"], r6(q[\"overshoot\"]), q[\"settle\"], r6(q[\"offset\"]), r6(q[\"dist_dev\"]), q[\"sat\"])\n";   // embedded copy, so live Python also works when the file is opened locally
let R = RECORDED, MODE = "recorded";
const C = {teal:"#0F6E6B",amber:"#E29A2D",rust:"#BE654C",sky:"#5A91BE",sage:"#83A462",plum:"#995A90",graphite:"#333F4A",sand:"#DFC98F",ink:"#1C242B",slate:"#66727C",mist:"#B9C1C6",paper:"#F3F0EB"};
const fmt = (x,d=0)=>x==null?"–":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

/* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks
  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";
  for(let k=0;k<=n;k++){const v=ymin+(ymax-ymin)*k/n, y=t+Y-(v-ymin)/(ymax-ymin)*Y;
    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  const z=t+Y-(0-ymin)/(ymax-ymin)*Y; s+=`<line x1="${l}" x2="${w-r}" y1="${Math.min(t+Y,Math.max(t,z))}" y2="${Math.min(t+Y,Math.max(t,z))}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;

S.push({kicker:"Part 1 · Optimality conditions", title:"The continuous answer: costates and the Hamiltonian", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:19px;line-height:1.75">
H(x, u, λ) = λᵀ f(x, u) &nbsp;(Mayer form, maximize φ)<br>
dλ/dt = −∂H/∂x, &nbsp;λ(t<sub>f</sub>) = ∂φ/∂x(t<sub>f</sub>)<br>
u(t) maximizes H at every t; interior: ∂H/∂u = 0<br>
here: λ₁(1) = 0, λ₂(1) = 1</div></div>
<p class="note">The costates λ(t) are the multipliers of the ODE rows, as λ was the multiplier of an equality row in Session 7: λ₂(t) is the value at the end of the batch of one more unit of B at time t.</p></div>
<div class="col"><ul class="b xs"><li>For this reactor, ∂H/∂T = 0 balances the gain from faster formation, weighted by λ₂ − λ₁, against the loss from faster destruction, weighted by λ₂</li>
<li>As A is used up, formation matters less, so the best T falls through the batch</li>
<li>Solving these conditions is an indirect method: a two-point boundary-value problem, x from the start and λ from the end. Hard to start, and hard with path constraints</li>
<li>Direct methods discretize first and hand an NLP to a solver; the NLP multipliers then approximate λ(t)</li>
<li>Most process applications use direct methods, the topic of the rest of today</li></ul></div></div>`});

<tr><th></th><th>Single shooting</th><th>Multiple shooting</th><th>Collocation</th></tr>
<tr><td>NLP variables</td><td>Control values only</td><td>Control values and the state at the start of each interval</td><td>Control values and the state at every collocation point</td></tr>
<tr><td>Model</td><td>Integrated by an ODE solver at every function call</td><td>Integrated interval by interval; continuity rows join them</td><td>Equality rows of the NLP; no ODE solver</td></tr>

S.push({kicker:"Part 2 · Multiple shooting", title:"Cut the horizon into pieces and join them with rows", html:()=>`<div class="body"><div class="col w55"><div class="panel grow"><div class="chart" id="ch-ms"></div></div>
<div class="ctrl" style="margin-top:6px"><button id="ms0" class="on">Guessed interval starts</button><button id="ms1">After convergence</button></div></div>
<div class="col"><ul class="b xs"><li>Single shooting integrates the whole horizon from x₀. A change in an early control acts through everything after it; with unstable or long dynamics the gradients become huge and the solver fails</li>
<li>Multiple shooting adds the state at the start of each interval as NLP variables, integrates each interval from there, and adds continuity rows: the end of one piece equals the start of the next</li>
<li>Before convergence the pieces need not join (the gaps on the chart); the solver closes the gaps and improves the objective at the same time</li>
<li>Each interval is short, so its sensitivities stay moderate; the intervals can be integrated in parallel</li>
<li>Collocation takes the idea to the limit: every point inside every interval becomes a variable</li></ul>
<p class="note">Chart: the batch reactor at a constant 360 K, four intervals, x₂ shown.</p></div></div>`,

S.push({kicker:"Part 2 · Orthogonal collocation", title:"Collocation: the model becomes equality rows", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18.5px;line-height:1.75">
On element i of length h, t = t<sub>i</sub> + τh, &nbsp;0 ≤ τ ≤ 1:<br>
x(τ) = Σ<sub>r=0</sub><sup>K</sup> ℓ<sub>r</sub>(τ) x<sub>i,r</sub> &nbsp;(Lagrange polynomial)<br>
Σ<sub>r</sub> ℓ′<sub>r</sub>(τ<sub>j</sub>) x<sub>i,r</sub> = h f(x<sub>i,j</sub>, u<sub>i</sub>), &nbsp;j = 1 … K<br>
x<sub>i+1,0</sub> = Σ<sub>r</sub> ℓ<sub>r</sub>(1) x<sub>i,r</sub> &nbsp;(continuity)<br>
Radau, K = 3: τ = 0.155, 0.645, 1</div></div>
<p class="note">ℓ′<sub>r</sub>(τ<sub>j</sub>) is a fixed matrix for given points, computed once. With Radau points the last point is τ = 1, so continuity reads x<sub>i+1,0</sub> = x<sub>i,K</sub>.</p></div>
<div class="col"><ul class="b xs"><li>The polynomial on each element must satisfy the ODE exactly at K points: K rows per state per element</li>
<li>Points at the roots of orthogonal polynomials (Gauss, Radau, Lobatto) give the highest accuracy for K points: Radau gives order 2K − 1 at the element ends</li>
<li>Radau with K = 1 is implicit Euler: x₁ − x₀ = h f(x₁)</li>
<li>Radau points are stiffly stable, and include the element end, which suits path constraints and control changes</li>
<li>The solver sees states, controls and rows together: the simultaneous approach. The model holds only at convergence</li></ul></div></div>`});

S.push({kicker:"Part 2 · Size and sparsity", title:"A large NLP, almost all zeros", html:()=>`<div class="body"><div class="col w45"><div class="panel grow"><div class="chart" id="ch-sp"></div></div></div>

<li>Each element touches only its own variables and the next element's start: a block band</li>
<li>With 50 elements: 452 variables and 452 rows in CasADi's count (the initial state and the bounds on T are rows there), and about 1% of the Jacobian is nonzero</li>

S.push({kicker:"Part 2 · CasADi and Ipopt", title:"Collocation in CasADi, solved by Ipopt", html:()=>`<div class="body"><div class="col w55"><div class="panel" style="padding:12px 14px"><div class="code" style="font-size:14px;line-height:1.45">opti = casadi.Opti()
for each element e:
    u = opti.variable()                # T/100 on element e
    opti.subject_to(opti.bounded(2.98, u, 3.98))
    Xc = [opti.variable(2) for j in range(K)]
    for j in 1..K:                     # collocation rows
        opti.subject_to(sum(C[r][j]*X[r]) == h*f(Xc[j], u))
    Xnext = opti.variable(2)           # continuity row
    opti.subject_to(Xnext == sum(D[r]*X[r]))
opti.minimize(-Xnext[1]); opti.solver("ipopt")</div></div>

S.push({kicker:"Part 3 · From a plan to feedback", title:"Model predictive control: plan, apply the first move, repeat", html:()=>`<div class="body"><div class="col w55"><div class="panel grow"><div class="chart" id="ch-rh"></div></div>
<div class="ctrl" style="margin-top:6px"><span>Sample k</span><input type="range" id="rhk" min="0" max="8" step="1" value="0"><b id="rhkv"></b></div></div>

<li>An open-loop plan cannot react to what it did not predict; re-solving with new measurements is feedback</li>

S.push({kicker:"Part 3 · The process", title:"Two tanks in series, and a model for prediction", html:()=>`<div class="body"><div class="col w45"><div class="panel"><div id="tkD"></div></div>
<div class="math" style="font-size:17.5px;line-height:1.65;margin-top:6px">A₁ dh₁/dt = u − h₁/R₁<br>A₂ dh₂/dt = h₁/R₁ − h₂/R₂ + d<br>A = 1 m², R₁ = 2, R₂ = 4 min/m²; 0 ≤ u ≤ 0.5 m³/min</div></div>
<div class="col"><div class="panel"><div class="math" style="font-size:18px;line-height:1.7">x<sub>k+1</sub> = A<sub>d</sub>x<sub>k</sub> + B<sub>d</sub>u<sub>k</sub> + E<sub>d</sub>d<sub>k</sub> &nbsp;(Δt = 0.5 min, exact)<br>
y = (h₂ at k+1, …, k+N) = Φx<sub>k</sub> + G U + G<sub>d</sub> d̂</div></div>
<ul class="b xs" style="margin-top:8px"><li>Controlled: the level h₂ of tank 2. Manipulated: the inlet valve flow u. Both levels are measured</li>
<li>d is an unmeasured flow into tank 2; a withdrawal is d &lt; 0</li>
<li>With u held over each sample, the discrete model is exact: A<sub>d</sub> = e<sup>AΔt</sup>, as the matrix exponential gave the α-pinene model in Session 10</li>
<li>Steady state: h₂ = R₂(u + d), so a setpoint of 1.6 m needs u = 0.4 m³/min with d = 0, and 0.45 with d = −0.05</li>
<li>Φ maps the current state, G the moves U = (u<sub>k</sub>, …, u<sub>k+N−1</sub>) and G<sub>d</sub> the disturbance estimate d̂ to the N predicted levels. G is lower triangular: a move affects only later levels</li></ul></div></div>`,

S.push({kicker:"Part 3 · MPC as an optimization problem", title:"Linear MPC with valve limits is bounded least squares", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:19px;line-height:1.75">
min<sub>U</sub> Σ<sub>i=1</sub><sup>N</sup> (y<sub>i</sub> − r<sub>i</sub>)² + w Σ<sub>i</sub> (u<sub>i</sub> − u<sub>i−1</sub>)²<br>
s.t. 0 ≤ u<sub>i</sub> ≤ 0.5, &nbsp;y = Φx + GU + G<sub>d</sub>d̂<br>
⇔ min ‖ [G; √w D] U − [r − Φx − G<sub>d</sub>d̂; √w e u<sub>prev</sub>] ‖², bounds on U</div></div>
<p class="note">D is the difference matrix (1 on the diagonal, −1 below it); e = (1, 0, …, 0). scipy.optimize.lsq_linear with method "bvls" solves it exactly, the same family of solvers as Session 10.</p></div>
<div class="col"><ul class="b xs"><li>The tracking term asks for the setpoint; w penalizes moves of the valve. Large w: smooth, slow; small w: fast, nervous</li>
<li>Only the bounds on u are constraints here, so a bounded least-squares solver is enough. Limits on the levels or on the size of each move make it a general QP (HiGHS, OSQP, quadprog)</li>
<li>The problem is convex: one global minimum, found in milliseconds for N = 40. That is what makes MPC practical every 30 seconds</li>
<li>A nonlinear model gives nonlinear MPC: the collocation NLP of Part 2, re-solved every sample, warm-started from the last solution</li></ul></div></div>`,

S.push({kicker:"Part 3 · Demo", title:"Open loop, feedback, and the offset that feedback alone leaves", html:()=>`<div class="body"><div class="col w55"><div class="panel grow" style="padding:8px 12px"><div class="chart" id="ch-of" style="display:flex;flex-direction:column"></div></div></div>

S.push({kicker:"Part 3 · In practice", title:"Tuning and running MPC", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:16.5px">
<tr><th>Choice</th><th>Rule of thumb</th></tr>
<tr><td>Sample time</td><td>About a tenth of the dominant time constant (here 0.5 min for time constants of 2 and 4 min)</td></tr>
<tr><td>Prediction horizon N</td><td>At least the settling time of the process; longer costs computation and changes little</td></tr>
<tr><td>Move weight w</td><td>Start where the valve moves no faster than it can; raise it if the moves are nervous or noise is amplified</td></tr>
<tr><td>Disturbance model</td><td>Always include one (a constant bias at the output or the input); without it, any model error leaves offset</td></tr>
<tr><td>State estimation</td><td>Measure what you can; estimate the rest with a Kalman filter or moving-horizon estimation, which is Session 10's least squares over a sliding window</td></tr>
<tr><td>Nonlinear MPC</td><td>Collocation of Part 2 solved every sample; warm start from the previous solution; check the solve time against the sample time</td></tr>

S.push({kicker:"Part 3 · Check your understanding · 5 minutes", title:"Receding horizons and offset", html:()=>CHECK(3,
OL+`<li>MPC computes 20 moves at each sample. How many are applied, and why compute the rest?</li>
<li>Why is linear MPC with only valve limits a bounded least-squares problem? What would make it a general QP?</li>
<li>With an unmeasured withdrawal and no disturbance model, the level settles 0.08 m low. Why does feedback not remove it?</li>
<li>N = 5 and w = 10 overshoot 22%; N = 20 and w = 10 overshoot 4%. Explain</li></ol>`,
`<li>1. One. The rest are the plan that justifies the first move: a move is chosen for its effect over the whole horizon</li>
<li>2. The objective is a sum of squares of linear functions of U and the only constraints are bounds on U. Limits on levels or on move sizes are linear rows: a QP</li>
<li>3. The model predicts h₂ = r with the current valve, so the optimizer sees nothing to correct; the error lies in the model, not in the state. A disturbance estimate puts it in the model</li>
<li>4. With 5 samples the penalty on moves outweighs the tracking error the controller can see, so it moves too little at first and then too long; with 20 it sees the whole response</li>`),
draw:()=>reveal("k3btn","k3ans")});

S.push({kicker:"Part 3 · Check your understanding · 5 minutes", title:"Choosing a method and judging a result", html:()=>CHECK(4,
OL+`<li>A polymer grade change has 40 states, 3 controls and a 6-hour horizon with limits on a temperature at all times. Shooting or collocation? Why?</li>
<li>Collocation with 20 elements gives a profile that alternates between the bounds from element to element. What do you suspect, and what do you try?</li>
<li>The batch profile computed with k₂ 10% too low is applied. Which number in the table do you trust less: the profile, or the predicted yield? Why?</li>
<li>MPC must run every 30 s; one nonlinear solve takes 45 s. Name two remedies</li></ol>`,
`<li>1. Collocation: large and possibly stiff, and the path limit can be imposed at every point; Ipopt exploits the sparsity</li>
<li>2. Chattering from a singular arc or poor discretization; check by refining, add a small penalty on control changes, or use fewer control intervals than elements</li>
<li>3. The predicted yield: the decision loses only 0.0003, but the prediction is off by 0.008</li>
<li>4. Warm start from the previous solution; a shorter horizon or coarser elements; a linearized model with a QP; real-time iteration schemes</li>`),
draw:()=>reveal("k4btn","k4ans")});

S.push({kicker:"Summary", title:"What to take from today", html:()=>{const L=R.lab,Cr=CL();return `<div class="body"><div class="col w45"><table class="t" style="font-size:16.5px">
<tr><th>Quantity</th><th class="n">Value</th></tr>
<tr><td>Best constant T; x₂(1 h)</td><td class="n">${fmt(L.iso.Tbest,1)} K; ${fmt(L.iso.x2best,4)}</td></tr>
<tr><td>Shooting, 20 intervals</td><td class="n">${fmt(L.shoot["20"].x2,4)}</td></tr>
<tr><td>Collocation, 100 elements</td><td class="n">${fmt(Cr.runs["100"].x2,4)}</td></tr>
<tr><td>Radau K = 3, error divided per doubling</td><td class="n">about 32</td></tr>
<tr><td>MPC offset without; with d̂</td><td class="n">${mn(fmt(L.mpc_noest.offset,3))} m; 0</td></tr>
<tr><td>k₂ error: loss; prediction error</td><td class="n">${fmt(L.robust.best-L.robust.applied,4)}; ${fmt(L.robust.predicted-L.robust.applied,4)}</td></tr></table></div>
<div class="col"><ul class="b xs"><li>A dynamic optimization chooses functions of time; direct methods discretize them into an NLP</li>
<li>Single shooting is small and always simulates; multiple shooting and collocation handle unstable, stiff and large problems; collocation gives Ipopt a sparse NLP with exact derivatives</li>
<li>Refine the discretization until the answer stops changing, and check the result by simulation</li>
<li>MPC re-solves a short problem at every sample; with linear models and valve limits it is bounded least squares</li>
<li>Feedback removes offset only with a disturbance model, and cannot fix a wrong parameter: estimation and robustness come next</li></ul></div></div>`}});

 const hasDock=dock.style.display==="flex",barH=hasDock?document.getElementById("nbar").offsetHeight:0;
 let k=Math.min(W/1280,H/720)*0.98,capH=0,fs=0,dockH=0;
 for(let it=0;it<3;it++){if(hasDock&&CAP_ON){const lines=k<0.6?4:2;fs=Math.max(12,Math.min(22,24*k));capH=Math.ceil(lines*fs*1.45)+4}else capH=0;
  dockH=hasDock?capH+barH+(capH?6:0)+14:0;k=Math.min(W/1280,Math.max(120,H-dockH)/720)*0.98}
 const h=720*k,pad=10,top=Math.max(0,(H-h-dockH)/2);
 vp.style.top=(top-pad)+"px";vp.style.bottom="auto";vp.style.height=(h+2*pad)+"px";
 document.getElementById("stage").style.transform=`scale(${k})`;
 if(hasDock){dock.style.top=(top+h+6)+"px";cap.style.display=CAP_ON?"block":"none";cap.style.width=Math.min(1280*k,W-16)+"px";cap.style.height=capH+"px";cap.dataset.fs=fs;if(window.capRefit)capRefit()}}
function fillDrawer(){const p=S[cur].py,dr=document.getElementById("drawer");
 if(!p){document.getElementById("dTitle").textContent="No Python on this slide";document.getElementById("dSub").textContent="Slides with a 'D · Python' tag have code and output.";document.getElementById("dCode").value="";document.getElementById("dOut").textContent="";return}
 document.getElementById("dTitle").textContent=p.title;document.getElementById("dSub").textContent=p.sub||"";document.getElementById("dCode").value=p.code;
 try{document.getElementById("dOut").textContent=p.out()}catch(e){document.getElementById("dOut").textContent=String(e)}
 const m=document.getElementById("dMode");m.className="pill "+(MODE==="live"?"live":"rec");m.textContent=MODE==="live"?"LIVE RUN":"RECORDED RUN"}
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes(e.target.tagName)){if(e.key==="Escape")e.target.blur();return}const k=e.key;
 if(["ArrowRight","PageDown"," "].includes(k)){e.preventDefault();show(cur+1)}else if(["ArrowLeft","PageUp"].includes(k)){e.preventDefault();show(cur-1)}
 else if(k==="Home")show(0);else if(k==="End")show(N-1);else if(k==="d"||k==="D")document.getElementById("drawer").classList.toggle("open");
 else if(k==="f"||k==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
 else if(k==="p"||k==="P"){if(window.narrToggle)narrToggle()}
 else if(k==="c"||k==="C"){if(window.ccCycle)ccCycle()}
 else if(k==="n"||k==="N"){const n=document.getElementById("notes");n.style.display=n.style.display==="block"?"none":"block"}});
document.getElementById("stage").addEventListener("click",e=>{if(e.target.closest("button,input,select,#drawer,a,#startov"))return;const r=e.currentTarget.getBoundingClientRect();(e.clientX-r.left)>r.width*0.5?show(cur+1):show(cur-1)});

/* ---------- live Python (Pyodide) ---------- */
let py=null;
async function ensurePy(msg){if(py)return py;msg.textContent="Loading Python in the browser (first time about 5–10 s) ...";
 if(!window.loadPyodide){await new Promise((ok,bad)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js";s.onload=ok;s.onerror=()=>bad(new Error("could not load Pyodide"));document.head.appendChild(s)})}
 const p=await loadPyodide();await p.loadPackage(["numpy","scipy"]);
 const src=LAB_SRC||await (await fetch(LAB_FILE)).text();p.FS.writeFile("dyn_lab.py",src);
 await p.runPythonAsync('import sys\nsys.path.insert(0, ".")\nfrom dyn_lab import *');py=p;return p}
async function runCode(){const msg=document.getElementById("liveMsg"),out=document.getElementById("dOut"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Running ...";const buf=[];p.setStdout({batched:s=>buf.push(s)});p.setStderr({batched:s=>buf.push(s)});
  try{await p.runPythonAsync(document.getElementById("dCode").value)}catch(e){buf.push(String(e.message||e).split("\n").slice(-4).join("\n"))}
  out.textContent=buf.join("\n")||"(no output)";const m=document.getElementById("dMode");m.className="pill live";m.textContent="LIVE OUTPUT";
  msg.textContent=`Ran in ${((performance.now()-t0)/1000).toFixed(1)} s in the browser`}
 catch(e){msg.textContent="Python could not start: "+e.message+". The recorded output is still available."}}
async function runLive(){const msg=document.getElementById("liveMsg"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Solving every model ...";
  const out=await p.runPythonAsync('import importlib, json\nimport dyn_lab as lab\nimportlib.reload(lab)\njson.dumps(lab.classroom_results())');
  R=JSON.parse(out);MODE="live";drawAll();fillDrawer();msg.textContent=`All slides now show a live run (${((performance.now()-t0)/1000).toFixed(1)} s, SciPy ${R.meta.scipy})`}
 catch(e){msg.textContent="Live run failed: "+e.message+". The recorded run is still shown."}}
document.getElementById("runCode").onclick=runCode;
document.getElementById("runLive").onclick=runLive;
document.getElementById("useRec").onclick=()=>{R=RECORDED;MODE="recorded";drawAll();fillDrawer();document.getElementById("liveMsg").textContent="Showing the recorded run."};

(function(){if(!NARR)return;
 const au=document.getElementById("narr"),bar=document.getElementById("nbar"),cap=document.getElementById("cap"),play=document.getElementById("nPlay"),tm=document.getElementById("nTime"),msg=document.getElementById("nMsg");
 document.getElementById("dock").style.display="flex";document.getElementById("help").style.display="none";let on=false,lang="off",slideIdx=-1;
 const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
 lang=ls("cc-lang")||"off";const sp=ls("narr-speed");if(sp)document.getElementById("nSpeed").value=sp;
 const fmtT=t=>isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`:"0:00";
 const S_=i=>NARR.slides[i];
 function load(i){slideIdx=i;const s=S_(i);if(!s){au.removeAttribute("src");return}au.src=s.file;au.playbackRate=+document.getElementById("nSpeed").value;tm.textContent=`0:00 / ${fmtT(s.duration)}`;showCap(0)}
 function setPlayUI(){play.textContent=au.paused?"▶ Play":"❚❚ Pause";play.classList.toggle("on",!au.paused)}
 // captions sit in their own band under the slide; long lines shrink to fit the band
 window.capRefit=()=>{let f=parseFloat(cap.dataset.fs)||18;cap.style.fontSize=f+"px";while(cap.scrollHeight>cap.clientHeight+1&&f>11){f-=1;cap.style.fontSize=f+"px"}};
 function showCap(t){const s=S_(slideIdx);let c=null;if(s&&lang!=="off"){for(const q of s.cues){if(t>=q.s-0.05)c=q;else break}}
  const txt=(!c||(au.paused&&au.currentTime===0&&!on))?"":(lang==="th"?c.th:c.en);if(cap.textContent!==txt){cap.textContent=txt;capRefit()}}
 function ccUI(){const b=document.getElementById("nCC");b.textContent=lang==="off"?"CC off":lang==="en"?"CC English":"CC ไทย";b.classList.toggle("on",lang!=="off");CAP_ON=lang!=="off";fit();showCap(au.currentTime||0)}
 window.ccCycle=()=>{lang=lang==="off"?"en":lang==="en"?"th":"off";ls("cc-lang",lang);ccUI()};
 // "on" means the student is listening: it starts with Play and ends with Pause or Stop.
 // Slides change only when the student moves; the new slide's narration then starts if "on".
 window.narrToggle=()=>{if(au.paused){on=true;if(slideIdx!==cur)load(cur);if(au.ended)au.currentTime=0;msg.textContent="";au.play().catch(()=>{msg.textContent="Press Play again to start audio."})}else{on=false;au.pause()}};
 window.onSlideChange=i=>{au.pause();msg.textContent="";load(i);if(on)au.play().catch(()=>{})};
 document.getElementById("nPlay").onclick=narrToggle;
 document.getElementById("nStop").onclick=()=>{au.pause();au.currentTime=0;on=false;setPlayUI();showCap(0);tm.textContent=`0:00 / ${fmtT((S_(cur)||{}).duration)}`};
 document.getElementById("nCC").onclick=ccCycle;
 document.getElementById("nPrev").onclick=()=>show(cur-1);document.getElementById("nNext").onclick=()=>show(cur+1);

 ccUI();setTimeout(()=>{if(slideIdx<0)load(cur)},0);
})();
