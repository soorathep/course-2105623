[50.0,40.0,10.0]},{"factor":1.0,"cost":81500.0,"x":[50.0,40.0,10.0]},{"factor":1.1,"cost":84100.0,"x":[50.0,40.0,10.0]},{"factor":1.2,"cost":86700.0,"x":[50.0,40.0,10.0]}]},"checklist":["Specification: sets, data and constraints, with units","Data: sources and dates","Model class stated and justified","Balances close in the stream table","Objective recomputed from the plan and the specification's data","A certificate, not only the solver status","Multipliers interpreted with units and sign","Global or local stated correctly","Uncertain data: sensitivity or scenarios","Several objectives: a front and a stated rule","Tests written from the specification","Reporting: code, versions and AI disclosure"],"key":["P","P","P","F","F","F","F","P","NS","NA","F","F"]}};
const LAB_FILE = "project_checks.py?v=s15-6b53a880";
const LAB_SRC = "\"\"\"2105623 Session 15: checks for a project model, and the practice review of Lab 15 (2027 draft).\n\nPart A  Reusable checks: an LP certificate from HiGHS (primal and dual residuals, duality gap), recomputing an\n        objective from the specification's data, closing a balance, and converting a multiplier to the units of\n        the decision maker\nLab 15  Group 0's report: a biodiesel feedstock blend (LP; synthetic data). The report's numbers are checked\n        against its own specification.\n\nRuns in desktop Python and in the browser (NumPy and SciPy only). Copy the functions into your project and call\nthem on your own model.\n\"\"\"\nimport json, math, sys\nimport numpy as np\nfrom scipy.optimize import linprog\n\n\ndef r6(v):\n    if isinstance(v, (list, tuple, np.ndarray)):\n        return [r6(u) for u in v]\n    v = round(float(v), 6)\n    return 0.0 if v == 0 else v\n\n\n# ---------------------------------------------------------------------------\n# Part A. Reusable checks\n# ---------------------------------------------------------------------------\ndef lp_certificate(c, A_ub=None, b_ub=None, A_eq=None, b_eq=None, bounds=None):\n    \"\"\"Solve min c'x with HiGHS and return the primal value, the dual value built from the marginals, the gap,\n    and the largest primal and dual residuals. A gap near zero with small residuals is a certificate of\n    optimality; the solver's status message is not.\"\"\"\n    c = np.asarray(c, float); n = len(c)\n    r = linprog(c, A_ub=A_ub, b_ub=b_ub, A_eq=A_eq, b_eq=b_eq, bounds=bounds, method=\"highs\")\n    if r.status != 0:\n        return {\"status\": int(r.status), \"message\": r.message}\n    x = r.x\n    lo = np.array([b[0] if b[0] is not None else -np.inf for b in (bounds or [(0, None)] * n)], float) if bounds is not None else np.zeros(n)\n    hi = np.array([b[1] if b[1] is not None else np.inf for b in (bounds or [(0, None)] * n)], float) if bounds is not None else np.full(n, np.inf)\n    if lo.shape == ():\n        lo, hi = np.full(n, lo), np.full(n, hi)\n    dual = 0.0; red = c.copy(); prim = 0.0\n    if A_ub is not None:\n        A, b, y = np.asarray(A_ub, float), np.asarray(b_ub, float), r.ineqlin.marginals\n        dual += b @ y; red -= A.T @ y; prim = max(prim, float(np.max(A @ x - b, initial=0.0)))\n    if A_eq is not None:\n        A, b, y = np.asarray(A_eq, float), np.asarray(b_eq, float), r.eqlin.marginals\n        dual += b @ y; red -= A.T @ y; prim = max(prim, float(np.max(np.abs(A @ x - b), initial=0.0)))\n    ml, mu = r.lower.marginals, r.upper.marginals\n    dual += sum(l * m for l, m in zip(lo, ml) if np.isfinite(l)) + sum(u * m for u, m in zip(hi, mu) if np.isfinite(u))\n    red -= ml + mu\n    return {\"status\": 0, \"x\": x.tolist(), \"primal\": float(r.fun), \"dual\": float(dual), \"gap\": float(r.fun - dual),\n            \"primal_residual\": prim, \"dual_residual\": float(np.max(np.abs(red))),\n            \"ineq_marginals\": [] if A_ub is None else r.ineqlin.marginals.tolist(),\n            \"eq_marginals\": [] if A_eq is None else r.eqlin.marginals.tolist(), \"upper_marginals\": mu.tolist()}\n\n\ndef recompute(x, prices):\n    \"\"\"The objective of a reported plan, recomputed from the specification's price table.\"\"\"\n    return float(np.dot(x, prices))\n\n\ndef closure(inputs, outputs):\n    \"\"\"Balance closure: total in minus total out (zero when the balance closes).\"\"\"\n    return float(np.sum(inputs) - np.sum(outputs))\n\n\ndef per_unit_of_limit(marginal, scale):\n    \"\"\"A multiplier of a row written as sum((p_i - limit) x_i) <= 0 is per unit of (property x mass).\n    Multiplying by the total mass gives the value per unit of the limit itself.\"\"\"\n    return float(marginal * scale)\n\n\n# a small LP for the lecture: max 30 x1 + 20 x2 with two shared resources\nLECTURE_LP = {\"c\": [-30.0, -20.0], \"A_ub\": [[1.0, 1.0], [2.0, 1.0]], \"b_ub\": [40.0, 60.0]}\n\n\ndef lecture_certificate():\n    return lp_certificate(LECTURE_LP[\"c\"], A_ub=LECTURE_LP[\"A_ub\"], b_ub=LECTURE_LP[\"b_ub\"])\n\n\n# ---------------------------------------------------------------------------\n# Lab 15. Group 0: a biodiesel feedstock blend (synthetic data)\n# ---------------------------------------------------------------------------\nG0 = {\"oils\": [\"palm oil\", \"used cooking oil\", \"soybean oil\"],\n      \"price\": [900.0, 650.0, 1050.0],          # USD/t, specification (supplier quote)\n      \"cloud\": [13.0, 9.0, -1.0],               # cloud point, deg C\n      \"acid\": [0.3, 1.6, 0.2],                  # acid value after pretreatment, mg KOH/g\n      \"iodine\": [52.0, 95.0, 130.0],            # iodine value, g I2/100 g\n      \"limits\": {\"cloud\": 10.0, \"acid\": 0.9, \"iodine\": 110.0},\n      \"blend\": 100.0,                           # t/d of blend\n      \"uco_max\": 40.0}                          # t/d of used cooking oil available\n\nREPORT = {\"x\": [50.0, 40.0, 12.0],              # the stream table in the report (t/d)\n          \"cost\": 80300.0,                      # USD/d, as reported\n          \"price_used\": [900.0, 620.0, 1050.0], # what the code used (an old quote for used cooking oil)\n          \"cloud_shadow_claim\": 10.7}           # \"relaxing the cloud point by 1 deg C saves 10.7 USD/d\"\n\n\ndef group0_model(price=None):\n    \"\"\"The blend LP: minimize cost; blend limits written as sum((p_i - limit) x_i) <= 0.\"\"\"\n    G = G0; p = np.array(price or G[\"price\"], float)\n    A = [np.array(G[k]) - G[\"limits\"][k] for k in (\"cloud\", \"acid\", \"iodine\")]\n    return lp_certificate(p, A_ub=A, b_ub=[0.0, 0.0, 0.0], A_eq=[[1.0, 1.0, 1.0]], b_eq=[G[\"blend\"]],\n                          bounds=[(0, None), (0, G[\"uco_max\"]), (0, None)])\n\n\ndef group0_review():\n    sol = group0_model(); rep = REPORT\n    cert = sol\n    out = {\"solution\": sol, \"report_run\": group0_model(rep[\"price_used\"]),\n           \"recomputed_cost\": recompute(sol[\"x\"], G0[\"price\"]),\n           \"report_cost_recomputed\": recompute([50.0, 40.0, 10.0], G0[\"price\"]),\n           \"report_balance\": closure(rep[\"x\"], [G0[\"blend\"]]),\n           \"cloud_value_per_degC\": -per_unit_of_limit(sol[\"ineq_marginals\"][0], G0[\"blend\"]),\n           \"uco_value_per_t\": -sol[\"upper_marginals\"][1],\n           \"properties\": {k: float(np.dot(G0[k], sol[\"x\"]) / G0[\"blend\"]) for k in (\"cloud\", \"acid\", \"iodine\")},\n           \"gap\": cert[\"gap\"]}\n    # sensitivity to the price of used cooking oil, plus or minus 20%\n    sens = []\n    for f in (0.8, 0.9, 1.0, 1.1, 1.2):\n        p = list(G0[\"price\"]); p[1] *= f; s = group0_model(p)\n        sens.append({\"factor\": f, \"cost\": s[\"primal\"], \"x\": s[\"x\"]})\n    out[\"sensitivity\"] = sens\n    return out\n\n\n# the twelve checklist items and the key for Group 0's report (P pass, F fail, NS not shown, NA not applicable)\nCHECKLIST = [\"Specification: sets, data and constraints, with units\",\n             \"Data: sources and dates\",\n             \"Model class stated and justified\",\n             \"Balances close in the stream table\",\n             \"Objective recomputed from the plan and the specification's data\",\n             \"A certificate, not only the solver status\",\n             \"Multipliers interpreted with units and sign\",\n             \"Global or local stated correctly\",\n             \"Uncertain data: sensitivity or scenarios\",\n             \"Several objectives: a front and a stated rule\",\n             \"Tests written from the specification\",\n             \"Reporting: code, versions and AI disclosure\"]\nKEY_G0 = [\"P\", \"P\", \"P\", \"F\", \"F\", \"F\", \"F\", \"P\", \"NS\", \"NA\", \"F\", \"F\"]\n\n\ndef clean(o):\n    if isinstance(o, dict):\n        return {str(k): clean(v) for k, v in o.items()}\n    if isinstance(o, (list, tuple)):\n        return [clean(v) for v in o]\n    if isinstance(o, np.ndarray):\n        return clean(o. function chol(A){const n=A.length,L=A.map(r=>r.map(()=>0));for(let i=0;i<n;i++)for(let j=0;j<=i;j++){let s=A[i][j];for(let k=0;k<j;k++)s-=L[i][k]*L[j][k];

/* X: array of input vectors in [0,1]^d; y: values; ell: array of length-scales; g: noise variance / signal variance */
function gpFit(X,y,ell,g){const n=y.length,yb=y.reduce((s,v)=>s+v,0)/n,ys=Math.sqrt(y.reduce((s,v)=>s+(v-yb)**2,0)/n)||1,z=y.map(v=>(v-yb)/ys);
 const K=X.map((a,i)=>X.map((b,j)=>k52(a,b,ell)+(i===j?g+1e-10:0))),L=chol(K),a=fsub(L,z),sf2=dot(a,a)/n;
 return {X,yb,ys,ell,g,L,alpha:bsub(L,a),sf2,ll:-0.5*n*Math.log(sf2)-L.reduce((s,r,i)=>s+Math.log(r[i]),0)-0.5*n*(1+Math.log(2*Math.PI))}}
function gpPred(M,x){const ks=M.X.map(a=>k52(x,a,M.ell)),m=M.yb+M.ys*dot(ks,M.alpha),v=fsub(M.L,ks);return [m,Math.sqrt(Math.max(M.ys*M.ys*M.sf2*(1-dot(v,v)),0))]}
/* standard normal pdf and cdf (cdf by erfc with a rational approximation, error below 1.2e-7) */
const npdf = z => Math.exp(-0.5*z*z)/Math.sqrt(2*Math.PI);
function ncdf(z){const x=Math.abs(z)/Math.SQRT2,t=1/(1+0.5*x),r=t*Math.exp(-x*x-1.26551223+t*(1.00002368+t*(0.37409196+t*(0.09678418+t*(-0.18628806+t*(0.27886807+t*(-1.13520398+t*(1.48851587+t*(-0.82215223+t*0.17087277)))))))));return z>=0?1-r/2:r/2}
const eiJS = (m, s, best) => s > 1e-12 ? (m - best) * ncdf((m - best) / s) + s * npdf((m - best) / s) : Math.max(m - best, 0);
/* Python's str(round(v, d)) for ordinary magnitudes */
const pyr = (v, d) => {let r = Math.round(v * 10 ** d) / 10 ** d; if (Object.is(r, -0) || r === 0) r = 0; const s = String(r); return /[.e]/.test(s) ? s : s + ".0"};
/* Python's f"{v:.{d}f}" */
const pyf = (v, d) => v.toFixed(d);
/* two or more SVG charts stacked in one .chart box, each with a share of the height */
const stack = parts => `<div style="display:flex;flex-direction:column;height:100%;gap:2px">${parts.map(([svg, wgt]) => `<div style="flex:${wgt};min-height:0">${svg}</div>`).join("")}</div>`;

function fit(){const W=innerWidth,H=innerHeight,vp=document.getElementById("viewport"),dock=document.getElementById("dock"),cap=document.getElementById("cap");
 const hasDock=dock.style.display==="flex",barH=hasDock?document.getElementById("nbar").offsetHeight:0;

 for(let it=0;it<3;it++){if(hasDock&&CAP_ON){const lines=k<0.6?4:2;fs=Math.max(12,Math.min(22,24*k));capH=Math.ceil(lines*fs*1.45)+4}else capH=0;
  dockH=hasDock?capH+barH+(capH?6:0)+14:0;k=Math.min(W/1280,Math.max(120,H-dockH)/720)*0.98}
 const h=720*k,pad=10,top=Math.max(0,(H-h-dockH)/2);
 vp.style.top=(top-pad)+"px";vp.style.bottom="auto";vp.style.height=(h+2*pad)+"px";
 document.getElementById("stage").style.transform=`scale(${k})`;
 if(hasDock){dock.style.top=(top+h+6)+"px";cap.style.display=CAP_ON?"block":"none";cap.style.width=Math.min(1280*k,W-16)+"px";cap.style.height=capH+"px";cap.dataset.fs=fs;if(window.capRefit)capRefit()}}

let py=null;
async function ensurePy(msg){if(py)return py;msg.textContent="Loading Python in the browser (first time about 5–10 s) ...";
 if(!window.loadPyodide){await new Promise((ok,bad)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js";s.onload=ok;s.onerror=()=>bad(new Error("could not load Pyodide"));document.head.appendChild(s)})}
 const p=await loadPyodide();await p.loadPackage(["numpy","scipy"]);
 const src=LAB_SRC||await (await fetch(LAB_FILE)).text();p.FS.writeFile("project_checks.py",src);
 await p.runPythonAsync('import sys\nsys.path.insert(0, ".")\nfrom project_checks import *');py=p;return p}
async function runCode(){const msg=document.getElementById("liveMsg"),out=document.getElementById("dOut"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Running ...";const buf=[];p.setStdout({batched:s=>buf.push(s)});p.setStderr({batched:s=>buf.push(s)});
  try{await p.runPythonAsync(document.getElementById("dCode").value)}catch(e){buf.push(String(e.message||e).split("\n").slice(-4).join("\n"))}
  out.textContent=buf.join("\n")||"(no output)";const m=document.getElementById("dMode");m.className="pill live";m.textContent="LIVE OUTPUT";
  msg.textContent=`Ran in ${((performance.now()-t0)/1000).toFixed(1)} s in the browser`}
 catch(e){msg.textContent="Python could not start: "+e.message+". The recorded output is still available."}}
async function runLive(){const msg=document.getElementById("liveMsg"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Solving every model ...";
  const out=await p.runPythonAsync('import importlib, json\nimport project_checks as lab\nimportlib.reload(lab)\njson.dumps(lab.classroom_results())');
  R=JSON.parse(out);MODE="live";drawAll();fillDrawer();msg.textContent=`All slides now show a live run (${((performance.now()-t0)/1000).toFixed(1)} s, SciPy ${R.meta.scipy})`}
 catch(e){msg.textContent="Live run failed: "+e.message+". The recorded run is still shown."}}
document.getElementById("runCode").onclick=runCode;
document.getElementById("runLive").onclick=runLive;
document.getElementById("useRec").onclick=()=>{R=RECORDED;MODE="recorded";drawAll();fillDrawer();document.getElementById("liveMsg").textContent="Showing the recorded run."};

 // captions sit in their own band under the slide; long lines shrink to fit the band
 window.capRefit=()=>{let f=parseFloat(cap.dataset.fs)||18;cap.style.fontSize=f+"px";while(cap.scrollHeight>cap.clientHeight+1&&f>11){f-=1;cap.style.fontSize=f+"px"}};
 function showCap(t){const s=S_(slideIdx);let c=null;if(s&&lang!=="off"){for(const q of s.cues){if(t>=q.s-0.05)c=q;else break}}
  const txt=(!c||(au.paused&&au.currentTime===0&&!on))?"":(lang==="th"?c.th:c.en);if(cap.textContent!==txt){cap.textContent=txt;capRefit()}}
 function ccUI(){const b=document.getElementById("nCC");b.textContent=lang==="off"?"CC off":lang==="en"?"CC English":"CC ไทย";b.classList.toggle("on",lang!=="off");CAP_ON=lang!=="off";fit();showCap(au.currentTime||0)}
 window.ccCycle=()=>{lang=lang==="off"?"en":lang==="en"?"th":"off";ls("cc-lang",lang);ccUI()};
 // "on" means the student is listening: it starts with Play and ends with Pause or Stop.
 // Slides change only when the student moves; the new slide's narration then starts if "on".
 window.narrToggle=()=>{if(au.paused){on=true;if(slideIdx!==cur)load(cur);if(au.ended)au.currentTime=0;msg.textContent="";au.play().catch(()=>{msg.textContent="Press Play again to start audio."})}else{on=false;au.pause()}};
 window.onSlideChange=i=>{au.pause();msg.textContent="";load(i);if(on)au.play().catch(()=>{})};
 document.getElementById("nPlay").onclick=narrToggle;
 document.getElementById("nStop").onclick=()=>{au.pause();au.currentTime=0;on=false;setPlayUI();showCap(0);tm.textContent=`0:00 / ${fmtT((S_(cur)||{}).duration)}`};
 document.getElementById("nCC").onclick=ccCycle;
 document.getElementById("nPrev").onclick=()=>show(cur-1);document.getElementById("nNext").onclick=()=>show(cur+1);
 document.getElementById("nSpeed").onchange=e=>{au.playbackRate=+e.target.value;ls("narr-speed",e.target.value)};
 au.addEventListener("play",setPlayUI);au.addEventListener("pause",setPlayUI);
 au.addEventListener("timeupdate",()=>{tm.textContent=`${fmtT(au.currentTime)} / ${fmtT((S_(slideIdx)||{}).duration)}`;showCap(au.currentTime)});
 au.addEventListener("ended",()=>{setPlayUI();const s=S_(slideIdx);msg.textContent=s&&s.hold?"Activity: do it now, then press Next ›":cur<N-1?"Press Next › or → for the next slide":"End of the session"});
 const q=new URLSearchParams(location.search);
 if(q.get("narrate")==="1"){const ov=document.getElementById("startov");ov.style.display="flex";document.getElementById("startBtn").onclick=()=>{ov.style.display="none";if(lang==="off"){lang="en";ls("cc-lang",lang)}ccUI();on=true;load(cur);au.play().catch(()=>{})}}
 ccUI();setTimeout(()=>{if(slideIdx<0)load(cur)},0);
})();

build();drawAll();fit();show((parseInt(location.hash.slice(1))||1)-1);
</script>
</body>
</html>
