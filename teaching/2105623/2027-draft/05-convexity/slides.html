const LAB_SRC = "\"\"\"2105623 Session 5: convexity and optimality.\n\nPart A  Convex sets and functions: a Hessian worked by hand, quadratic forms,\n        chemical equilibrium as a convex Gibbs minimization, and a Margules\n        liquid whose Gibbs energy of mixing stops being convex.\nPart B  Economies of scale: concave equipment cost, two parallel units, and a\n        geometric-programming vessel.\nPart C  Optimality and certificates: basins of attraction on the six-hump camel\n        function, how many starts are enough, a solver's report, and an alpha-BB\n        spatial branch and bound in one variable.\nPart D  Lab 5: Rosenbrock, Himmelblau, and a heat-recovery exchanger whose\n        installed cost follows the six-tenths rule.\n\nAll data are synthetic or classic test functions. Runs in the browser (Pyodide:\nNumPy, SciPy) and in desktop Python.\n    python convexity_lab.py          print every part\n    python convexity_lab.py --json   write convexity-results.json for the slides and the lab page\n\"\"\"\nimport json\nimport sys\nimport warnings\n\nimport numpy as np\nfrom scipy.optimize import minimize, minimize_scalar\n\n\ndef r6(a):\n    return (np.round(np.asarray(a, float), 6) + 0.0).tolist()\n\n\n# ---------------------------------------------------------------------------\n# Part A. Convex sets and functions\n# ---------------------------------------------------------------------------\ndef quartic(v):\n    x, y = v\n    return x**4 + y**4 - 4 * x * y + 1\n\n\ndef quartic_grad(v):\n    x, y = v\n    return np.array([4 * x**3 - 4 * y, 4 * y**3 - 4 * x])\n\n\ndef quartic_hess(v):\n    x, y = v\n    return np.array([[12 * x**2, -4.0], [-4.0, 12 * y**2]])\n\n\ndef quartic_worked():\n    \"\"\"Stationary points of x^4 + y^4 - 4xy + 1 and the Hessian test at each.\"\"\"\n    pts = [(0.0, 0.0), (1.0, 1.0), (-1.0, -1.0)]\n    rows = []\n    for p in pts:\n        H = quartic_hess(p); lam = np.linalg.eigvalsh(H)\n        kind = \"minimum\" if lam.min() > 0 else (\"maximum\" if lam.max() < 0 else \"saddle\")\n        rows.append({\"point\": list(p), \"f\": quartic(p), \"grad\": r6(quartic_grad(p)), \"hess\": H.tolist(),\n                     \"eig\": r6(lam), \"kind\": kind})\n    # where is the Hessian positive semidefinite? 144 x^2 y^2 >= 16 (and the diagonal is >= 0 anyway)\n    return {\"points\": rows, \"psd_region\": \"x^2 y^2 >= 1/9\"}\n\n\ndef quadratic_forms():\n    \"\"\"f = 1/2 (a x^2 + 2 b x y + c y^2) for a = c = 2 and b from 0 to 3: eigenvalues 2 - b and 2 + b.\"\"\"\n    out = []\n    for b in np.round(np.arange(0.0, 3.01, 0.5), 2):\n        H = np.array([[2.0, b], [b, 2.0]]); lam = np.linalg.eigvalsh(H)\n        out.append({\"b\": float(b), \"eig\": r6(lam), \"kind\": \"positive definite\" if lam.min() > 1e-12 else\n                    (\"positive semidefinite\" if lam.min() > -1e-12 else \"indefinite\")})\n    return out\n\n\nG_ISO = np.array([0.0, -0.4, -0.9])            # g_i = G_i\u00b0/RT for three isomers A, B, C (synthetic)\n\n\ndef gibbs_equilibrium(starts=25, seed=3):\n    \"\"\"Minimize G/RT = sum n_i (g_i + ln(n_i / N)) subject to n_A + n_B + n_C = 1, n >= 0.\n    The function is convex (sum of perspectives of x ln x), so every start must give the same answer.\n    Closed form: x_i = exp(-g_i) / sum exp(-g).\"\"\"\n    f = lambda n: float(np.sum(n * (G_ISO + np.log(np.maximum(n, 1e-300) / np.sum(n)))))\n    exact = np.exp(-G_ISO) / np.exp(-G_ISO).sum()\n    rng = np.random.default_rng(seed); runs = []\n    for k in range(starts):\n        x0 = rng.dirichlet(np.ones(3))\n        with warnings.catch_warnings():          # newer SciPy warns when a trial step leaves the bounds\n            warnings.simplefilter(\"ignore\", RuntimeWarning)\n            r = minimize(f, x0, method=\"SLSQP\", bounds=[(1e-10, 1)] * 3,\n                         constraints=[{\"type\": \"eq\", \"fun\": lambda n: np.sum(n) - 1}], options={\"ftol\": 1e-12, \"maxiter\": 300})\n        runs.append({\"start\": r6(x0), \"x\": r6(r.x), \"G\": float(r.fun), \"ok\": bool(r.success)})\n    spread = float(max(np.abs(np.array(q[\"x\"]) - exact).max() for q in runs))\n    return {\"g\": G_ISO.tolist(), \"exact\": r6(exact), \"G_exact\": f(exact), \"runs\": runs, \"max_deviation\": spread}\n\n\ndef margules(A_values=(0.0, 1.0, 2.0, 2.5, 3.0)):\n    \"\"\"Gibbs energy of mixing of a binary liquid, g = x ln x + (1-x) ln(1-x) + A x (1-x) (per RT).\n    g'' = 1/x + 1/(1-x) - 2A, smallest at x = 1/2: convex for A <= 2. For A > 2 the curve has two wells:\n    a common tangent gives two liquid phases (symmetric case: the two minima of g).\"\"\"\n    xs = np.linspace(0.001, 0.999, 199); out = []\n    for A in A_values:\n        g = xs * np.log(xs) + (1 - xs) * np.log(1 - xs) + A * xs * (1 - xs)\n        split = None\n        if A > 2:\n            r = minimize_scalar(lambda x: x * np.log(x) + (1 - x) * np.log(1 - x) + A * x * (1 - x),\n                                bounds=(1e-9, 0.5 - 1e-9), method=\"bounded\", options={\"xatol\": 1e-12})\n            split = [float(r.x), float(1 - r.x)]\n        out.append({\"A\": A, \"g\": r6(g), \"min_second_derivative\": 4 - 2 * A, \"split\": split})\n    return {\"x\": r6(xs), \"cases\": out}\n\n\n# ---------------------------------------------------------------------------\n# Part B. Economies of scale\n# ---------------------------------------------------------------------------\nUNIT = {\"C0\": 100.0, \"A0\": 100.0, \"n\": 0.6, \"max\": 1000.0}   # kUSD for a 100 m2 unit, six-tenths rule, max size m2\n\n\ndef unit_cost(A):\n    A = np.asarray(A, float)\n    return np.where(A > 0, UNIT[\"C0\"] * (np.maximum(A, 0) / UNIT[\"A0\"]) ** UNIT[\"n\"], 0.0)\n\n\ndef parallel_units(total=1500.0):\n    \"\"\"Two units share a required area; each at most 1,000 m2. Cost c(A1) + c(total - A1) along the\n    feasible segment A1 in [total - 1000, 1000]: concave, so the minimum is at an end and the equal split\n    is the maximum. A local method started at the equal split stops there: the gradient is zero.\"\"\"\n    lo, hi = max(0.0, total - UNIT[\"max\"]), min(UNIT[\"max\"], total)\n    a1 = np.linspace(lo, hi, 101)\n    cost = unit_cost(a1) + unit_cost(total - a1)\n    f = lambda a: float(unit_cost(a[0]) + unit_cost(total - a[0]))\n    starts = [lo + 1e-3 * (hi - lo), 0.25 * lo + 0.75 * hi, 0.5 * (lo + hi), 0.75 * lo + 0.25 * hi]\n    runs = []\n    for s0 in starts:\n        r = minimize(f, [s0], method=\"L-BFGS-B\", bounds=[(lo, hi)])\n        runs.append({\"start\": float(s0), \"A1\": float(r.x[0]), \"cost\": float(r.fun), \"nit\": int(r.nit)})\n    mid = 0.5 * total; h = 1.0\n    d2 = (f([mid + h]) - 2 * f([mid]) + f([mid - h])) / h**2\n    return {\"total\": total, \"lo\": lo, \"hi\": hi, \"a1\": r6(a1), \"cost\": r6(cost), \"runs\": runs,\n            \"equal_split_cost\": f([mid]), \"end_cost\": f([hi]), \"second_derivative_at_equal_split\": d2}\n\n\ndef parallel_sweep():\n    return [parallel_units(t) for t in (1100.0, 1300.0, 1500.0, 1700.0, 1900.0)]\n\n\ndef vessel_gp(V=10.0):\n    \"\"\"Closed cylindrical vessel: minimize surface area pi D L + pi D^2/2 subject to pi D^2 L / 4 >= V.\n    With D = e^u, L = e^w both are posynomials: convex in (u, w). Optimum L = D = (4V/pi)^(1/3).\"\"\"\n    f = lambda z: np.log(np.pi * np.exp(z[0] + z[1]) + np.pi * np.exp(2 * z[0]) / 2)\n    con = {\"type\": \"ineq\", \"fun\": lambda z: np.log(np.pi / 4) + 2 * z[0] + z[1] - np.log(V)}   # log of the volume row\n    runs = []\n    for z0 in ([0.0, 0.0], [2.0, -1.0], [-1.0, 3.0], [1.5, 1.5]):\n        r = minimize(f, z0, method=\"SLSQP\", constraints=[con], options={\"ftol\": 1e-12})\n        D, L = np.exp(r.x)\n        runs.append({\"start\": z0, \"D\": float(D), \"L\": float(L), \"area\": float(np.exp(r.fun))})\n    D = (4 * V / np.pi) ** (1 / 3)\n    return {\"V\": V, \"D_exact\": D, \"area_exact\": float(1.5 * np.pi * D**2), \"runs\": runs}\n\n\n# ---------------------------------------------------------------------------\n# Part C. Optimality and certificates\n# ---------------------------------------------------------------------------\ndef camel(v):\n    x, y = v\n    return (4 - 2.1 * x**2 + x**4 / 3) * x**2 + x * y + (-4 + 4 * y**2) * y**2\n\n\ndef camel_grad(v):\n    x, y = v\n    return np.array([8 * x - 8.4 * x**3 + 2 * x**5 + y, x - 8 * y + 16 * y**3])\n\n\ndef fd_hessian(f, x, h=1e-4):\n    x = np.asarray(x, float); n = len(x); H = np.zeros((n, n))\n    for i in range(n):\n        for j in range(n):\n            e_i, e_j = np.eye(n)[i] * h, np.eye(n)[j] * h\n            H[i, j] = (f(x + e_i + e_j) - f(x + e_i - e_j) - f(x - e_i + e_j) + f(x - e_i - e_j)) / (4 * h * h)\n    return 0.5 * (H + H.T)\n\n\ndef camel_basins(nx=25, ny=17):\n    \"\"\"BFGS from a grid of starts on [-2.5, 2.5] x [-1.5, 1.5]; label each start by the minimum it reaches.\"\"\"\n    xs, ys = np.linspace(-2.5, 2.5, nx), np.linspace(-1.5, 1.5, ny)\n    mins, grid = [], []\n    for y in ys:\n        row = []\n        for x in xs:\n            r = minimize(camel, [x, y], jac=camel_grad, method=\"BFGS\", options={\"gtol\": 1e-9})\n            k = next((i for i, m in enumerate(mins) if np.hypot(*(np.array(m[\"x\"]) - r.x)) < 1e-3), None)\n            if k is None:\n                lam = np.linalg.eigvalsh(fd_hessian(camel, r.x))\n                mins.append({\"x\": r6(r.x), \"f\": float(r.fun), \"eig\": r6(lam), \"count\": 0,\n                             \"kind\": \"minimum\" if lam.min() > 0 else \"saddle\"}); k = len(mins) - 1\n            mins[k][\"count\"] += 1; row.append(k)\n        grid.append(row)\n    order = sorted(range(len(mins)), key=lambda i: mins[i][\"f\"])\n    remap = {old: new for new, old in enumerate(order)}\n    mins = [mins[i] for i in order]; grid = [[remap[k] for k in row] for row in grid]\n    total = nx * ny; fglob = mins[0][\"f\"]\n    p_glob = sum(m[\"count\"] for m in mins if abs(m[\"f\"] - fglob) < 1e-6) / total\n    report_origin = solver_report(x0=(0.0, 0.0))\n    return {\"xs\": r6(xs), \"ys\": r6(ys), \"grid\": grid, \"minima\": mins, \"starts\": total, \"p_global\": p_glob, \"origin\": report_origin}\n\n\ndef starts_needed(p, delta=0.01):\n    \"\"\"Smallest N with (1 - p)^N <= delta.\"\"\"\n    return int(np.ceil(np.log(delta) / np.log(1 - p)))\n\n\ndef solver_report(x0=(-1.5, 1.0)):\n    \"\"\"What a local solver returns, and the second-order check it does not do for you.\"\"\"\n    r = minimize(camel, x0, jac=camel_grad, method=\"BFGS\", options={\"gtol\": 1e-8})\n    lam = np.linalg.eigvalsh(fd_hessian(camel, r.x))\n    return {\"x0\": list(x0), \"success\": bool(r.success), \"message\": str(r.message), \"x\": r6(r.x), \"fun\": float(r.fun),\n            \"nit\": int(r.nit), \"nfev\": int(r.nfev), \"grad_norm\": float(np.linalg.norm(camel_grad(r.x))), \"eig\": r6(lam)}\n\n\ndef poly(x):\n    \"\"\"A one-variable test function with two minima: (x - 1.5)^2 (x - 6)^2 / 10 + 0.8 x on [0, 8].\"\"\"\n    return (x - 1.5)**2 * (x - 6)**2 / 10 + 0.8 * x\n\n\ndef poly_d2(x):\n    # (x-1.5)^2 (x-6)^2 = q^2 with q = (x-1.5)(x-6) = x^2 - 7.5x + 9; d2(q^2) = 2 q'^2 + 2 q q''\n    q = x**2 - 7.5 * x + 9; qp = 2 * x - 7.5\n    return (2 * qp**2 + 4 * q) / 10\n\n\ndef min_d2(l, u):\n    \"\"\"Exact minimum of the quadratic poly_d2 over [l, u] (vertex at x = 3.75).\"\"\"\n    cand = [l, u] + ([3.75] if l < 3.75 < u else [])\n    return min(poly_d2(c) for c in cand)\n\n\ndef alpha_bb(lo=0.0, hi=8.0, tol=1e-3, max_nodes=100):\n    \"\"\"Spatial branch and bound in one variable with the alpha-BB underestimator\n    L(x) = f(x) + alpha (l - x)(u - x), alpha = max(0, -min f''/2) on the node's interval.\n    Each node: minimize L (convex) for a lower bound, then a local search on f inside the node for an\n    upper bound. Breadth first; prune a node whose lower bound is within tol of the incumbent.\"\"\"\n    nodes, inc, incx = [], np.inf, None\n    queue = [(lo, hi, 0, None)]\n    while queue and len(nodes) < max_nodes:\n        l, u, depth, parent = queue.pop(0)\n        alpha = max(0.0, -min_d2(l, u) / 2)\n        L = lambda x: poly(x) + alpha * (l - x) * (u - x)\n        r = minimize_scalar(L, bounds=(l, u), method=\"bounded\", options={\"xatol\": 1e-10})\n        lb = float(r.fun)\n        loc = minimize_scalar(poly, bounds=(l, u), method=\"bounded\", options={\"xatol\": 1e-10})\n        if loc.fun < inc:\n            inc, incx = float(loc.fun), float(loc.x)\n        node = {\"id\": len(nodes), \"parent\": parent, \"l\": l, \"u\": u, \"depth\": depth, \"alpha\": alpha,\n                \"lb\": lb, \"x_lb\": float(r.x), \"ub\": float(loc.fun), \"x_ub\": float(loc.x),\n                \"max_gap\": alpha * (u - l) ** 2 / 4}\n        if lb >= inc - tol:\n            node[\"status\"] = \"pruned\"\n        else:\n            node[\"status\"] = \"branched\"; m = 0.5 * (l + u)\n            queue += [(l, m, depth + 1, node[\"id\"]), (m, u, depth + 1, node[\"id\"])]\n        node[\"incumbent\"] = inc\n        # lower bound over everything still open after this node: the queue's parents' bounds and the incumbent\n        open_lbs = [nodes[q[3]][\"lb\"] if q[3] is not None and q[3] < len(nodes) else lb for q in queue]\n        node[\"global_lb\"] = min(open_lbs + [inc])\n        nodes.append(node)\n    # fix global_lb for children queued by this node (parents are known now)\n    xs = np.linspace(lo, hi, 161)\n    return {\"nodes\": nodes, \"x\": r6(xs), \"f\": r6(poly(xs)), \"incumbent\": inc, \"x_best\": incx,\n            \"complete\": not queue, \"tol\": tol}\n\n\n# ---------------------------------------------------------------------------\n# Part D. Lab 5\n# ---------------------------------------------------------------------------\ndef rosen(v):\n    x, y = v\n    return (1 - x)**2 + 100 * (y - x**2)**2\n\n\ndef rosen_hess(v):\n    x, y = v\n    return np.array([[2 - 400 * (y - x**2) + 800 * x**2, -400 * x], [-400 * x, 200.0]])\n\n\ndef himmel(v):\n    x, y = v\n    return (x**2 + y - 11)**2 + (x + y**2 - 7)**2\n\n\ndef himmel_grad(v):\n    x, y = v\n    return np.array([4 * x * (x**2 + y - 11) + 2 * (x + y**2 - 7), 2 * (x**2 + y - 11) + 4 * y * (x + y**2 - 7)])\n\n\ndef himmel_hess(v):\n    x, y = v\n    return np.array([[12 * x**2 + 4 * y - 42, 4 * x + 4 * y], [4 * x + 4 * y, 4 * x + 12 * y**2 - 26]])\n\n\nHX = {\"Qmax\": 3000.0, \"C\": 50.0, \"dTmax\": 60.0, \"U\": 0.5, \"value\": 40.0, \"inst\": 17.0, \"crf\": 0.2, \"Amax\": 300.0}\n# Two streams of 50 kW/K each, 60 K apart: at most 3,000 kW can be recovered (balanced counterflow,\n# effectiveness = NTU / (1 + NTU), NTU = U A / C). Heat not recovered is bought as low-pressure steam:\n# value = 40 USD per kW-year (about 2,000 h/yr at 5.5 USD/GJ). Installed cost 17 kUSD x A^0.6 (A in m2),\n# annualized with a capital recovery factor of 0.2. TAC in kUSD/yr.\n\n\ndef hx_tac(A, value=None):\n    v = (HX[\"value\"] if value is None else value) / 1000.0          # kUSD per kW-year\n    A = np.asarray(A, float)\n    ntu = HX[\"U\"] * np.maximum(A, 0) / HX[\"C\"]\n    return HX[\"crf\"] * HX[\"inst\"] * np.maximum(A, 0) ** 0.6 + v * HX[\"Qmax\"] / (1 + ntu)\n\n\ndef hx_stationary(value=None):\n    \"\"\"All stationary points of TAC(A) on (0, Amax] from a fine grid, refined; plus the end A = 0.\"\"\"\n    A = np.linspace(1e-6, HX[\"Amax\"], 300001); T = hx_tac(A, value); d = np.diff(T)\n    pts = []\n    for k in np.where(np.sign(d[1:]) != np.sign(d[:-1]))[0]:\n        kind = \"local min\" if d[k] < 0 else \"local max\"\n        f = (lambda a: hx_tac(a, value)) if kind == \"local min\" else (lambda a: -hx_tac(a, value))\n        r = minimize_scalar(f, bounds=(A[k], A[k + 2]), method=\"bounded\", options={\"xatol\": 1e-9})\n        pts.append({\"A\": float(r.x), \"tac\": float(hx_tac(r.x, value)), \"kind\": kind})\n    return pts\n\n\ndef hx_study(value=None, starts=(1.0, 3.0, 6.0, 20.0, 100.0, 250.0)):\n    f = lambda a: float(hx_tac(a[0], value))\n    runs = []\n    for a0 in starts:\n        r = minimize(f, [a0], method=\"L-BFGS-B\", bounds=[(0.0, HX[\"Amax\"])])\n        runs.append({\"start\": a0, \"A\": float(r.x[0]), \"tac\": float(r.fun), \"nit\": int(r.nit)})\n    st = hx_stationary(value); tac0 = float(hx_tac(0.0, value))\n    inner = [p for p in st if p[\"kind\"] == \"local min\"]\n    best = min([{\"A\": 0.0, \"tac\": tac0}] + [{\"A\": p[\"A\"], \"tac\": p[\"tac\"]} for p in inner], key=lambda q: q[\"tac\"])\n    hump = next((p for p in st if p[\"kind\"] == \"local max\"), None)\n    return {\"value\": HX[\"value\"] if value is None else value, \"runs\": runs, \"stationary\": st, \"tac_zero\": tac0,\n            \"best\": best, \"hump\": hump, \"interior\": inner[0] if inner else None}\n\n\ndef hx_breakpoint(lo=20.0, hi=60.0):\n    \"\"\"Value of heat (USD/kW-yr) at which the interior minimum ties with A = 0.\"\"\"\n    g = lambda v: (hx_study(v, starts=())[\"interior\"] or {\"tac\": np.inf})[\"tac\"] - hx_tac(0.0, v)\n    for _ in range(50):\n        m = 0.5 * (lo + hi)\n        lo, hi = (m, hi) if g(m) > 0 else (lo, m)\n    return 0.5 * (lo + hi)\n\n\ndef lab_results():\n    pts = {\"(1, 1)\": (1.0, 1.0), \"(0, 1)\": (0.0, 1.0), \"(-1, 1)\": (-1.0, 1.0), \"(0.5, 0.25)\": (0.5, 0.25)}\n    rosen_pts = {k: {\"hess\": rosen_hess(p).tolist(), \"eig\": r6(np.linalg.eigvalsh(rosen_hess(p)))} for k, p in pts.items()}\n    rs = minimize(rosen, [-1.2, 1.0], method=\"BFGS\", options={\"gtol\": 1e-9})\n    # Himmelblau: multistart from a 10 x 10 grid on [-4.5, 4.5]^2 (row by row, y outer)\n    g = np.linspace(-4.5, 4.5, 10); mins = []; assign = []\n    for y in g:\n        for x in g:\n            r = minimize(himmel, [x, y], jac=himmel_grad, method=\"BFGS\", options={\"gtol\": 1e-10})\n            k = next((i for i, m in enumerate(mins) if np.hypot(*(np.array(m[\"x\"]) - r.x)) < 1e-4), None)\n            if k is None:\n                mins.append({\"x\": r6(r.x), \"f\": float(r.fun), \"count\": 0,\n                             \"eig\": r6(np.linalg.eigvalsh(himmel_hess(r.x)))}); k = len(mins) - 1\n            mins[k][\"count\"] += 1; assign.append(k)\n    order = sorted(range(len(mins)), key=lambda i: (-mins[i][\"x\"][0], -mins[i][\"x\"][1]))\n    remap = {old: new for new, old in enumerate(order)}\n    mins = [mins[i] for i in order]; assign = [remap[k] for k in assign]\n    from scipy.optimize import root\n    s = root(himmel_grad, [-0.27, -0.92], tol=1e-14)\n    mx = {\"x\": r6(s.x), \"f\": float(himmel(s.x)), \"eig\": r6(np.linalg.eigvalsh(himmel_hess(s.x)))}\n    values = list(range(20, 61, 1))\n    sweep = [hx_study(v, starts=()) for v in values]\n    As = np.linspace(0, HX[\"Amax\"], 301)\n    return {\"rosen\": {\"points\": rosen_pts, \"boundary_c\": 0.005,\n                      \"bfgs\": {\"x\": r6(rs.x), \"nit\": int(rs.nit), \"fun\": float(rs.fun)}},\n            \"himmel\": {\"minima\": mins, \"starts\": 100, \"grid\": r6(g), \"assign\": assign, \"max\": mx},\n            \"hx\": {\"data\": HX, \"study\": hx_study(), \"values\": values,\n                   \"sweep\": [{\"value\": q[\"value\"], \"best\": q[\"best\"], \"hump\": q[\"hump\"], \"interior\": q[\"interior\"]} for q in sweep],\n                   \"breakpoint\": hx_breakpoint(), \"A\": r6(As), \"tac\": r6(hx_tac(As))}}\n\n\ndef classroom_results():\n    R = {\"meta\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__, \"python\": sys.version.split()[0]}}\n    cb = camel_basins()\n    R[\"lecture\"] = {\"quartic\": quartic_worked(), \"quad\": quadratic_forms(), \"gibbs\": gibbs_equilibrium(),\n                    \"margules\": margules(), \"unit\": UNIT, \"parallel\": parallel_sweep(), \"vessel\": vessel_gp(),\n                    \"camel\": cb, \"starts_needed\": {\"p\": cb[\"p_global\"], \"N_99\": starts_needed(cb[\"p_global\"], 0.01),\n                                                   \"table\": [{\"p\": p, \"N\": starts_needed(p, 0.01)} for p in (0.5, 0.2, 0.1, 0.05, 0.01)]},\n                    \"report\": solver_report(), \"abb\": alpha_bb()}\n    R[\"lab\"] = lab_results()\n    return R\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"convexity-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote convexity-results.json\")\n        sys.exit()\n    L = R[\"lecture\"]\n    print(\"A quartic\", [(p[\"point\"], p[\"kind\"], p[\"eig\"]) for p in L[\"quartic\"][\"points\"]])\n    print(\"A gibbs exact\", L[\"gibbs\"][\"exact\"], \"max deviation over starts\", L[\"gibbs\"][\"max_deviation\"])\n    print(\"A margules\", [(c[\"A\"], c[\"min_second_derivative\"], c[\"split\"]) for c in L[\"margules\"][\"cases\"]])\n    for p in L[\"parallel\"]:\n        print(\"B parallel\", p[\"total\"], \"ends\", round(p[\"end_cost\"], 2), \"equal\", round(p[\"equal_split_cost\"], 2),\n              \"d2\", round(p[\"second_derivative_at_equal_split\"], 6), [(round(q[\"start\"]), round(q[\"A1\"], 1), round(q[\"cost\"], 2)) for q in p[\"runs\"]])\n    print(\"B vessel\", L[\"vessel\"][\"D_exact\"], [(round(q[\"D\"], 4), round(q[\"L\"], 4)) for q in L[\"vessel\"][\"runs\"]])\n    cb = L[\"camel\"]; print(\"C camel minima\", [(m[\"x\"], round(m[\"f\"], 4), m[\"count\"]) for m in cb[\"minima\"]], \"p_global\", cb[\"p_global\"], L[\"starts_needed\"])\n    print(\"C report\", L[\"report\"])\n    ab = L[\"abb\"]; print(\"C abb nodes\", len(ab[\"nodes\"]), \"incumbent\", ab[\"incumbent\"], ab[\"x_best\"], \"complete\", ab[\"complete\"])\n    lab = R[\"lab\"]\n    print(\"D rosen\", lab[\"rosen\"][\"points\"], lab[\"rosen\"][\"bfgs\"])\n    print(\"D himmel\", lab[\"himmel\"][\"minima\"], lab[\"himmel\"][\"max\"])\n    print(\"D hx\", lab[\"hx\"][\"study\"])\n    print(\"D hx breakpoint\", lab[\"hx\"][\"breakpoint\"])\n    print(\"D hx sweep\", [(q[\"value\"], round(q[\"best\"][\"A\"], 1), round(q[\"best\"][\"tac\"], 2)) for q in lab[\"hx\"][\"sweep\"][::5]])\n    for n in ab[\"nodes\"]:\n        print(\"  node\", n[\"id\"], n[\"parent\"], round(n[\"l\"], 3), round(n[\"u\"], 3), \"alpha\", round(n[\"alpha\"], 4), \"lb\", round(n[\"lb\"], 4),\n              \"ub\", round(n[\"ub\"], 4), n[\"status\"], \"inc\", round(n[\"incumbent\"], 4), \"glb\", round(n[\"global_lb\"], 4))\n";   // embedded copy, so live Python also works when the file is opened locally
let R = RECORDED, MODE = "recorded";
const C = {teal:"#0F6E6B",amber:"#E29A2D",rust:"#BE654C",sky:"#5A91BE",sage:"#83A462",plum:"#995A90",graphite:"#333F4A",sand:"#DFC98F",ink:"#1C242B",slate:"#66727C",mist:"#B9C1C6",paper:"#F3F0EB"};
const fmt = (x,d=0)=>x==null?"–":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

/* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks
  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";
  for(let k=0;k<=n;k++){const v=ymin+(ymax-ymin)*k/n, y=t+Y-(v-ymin)/(ymax-ymin)*Y;
    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  const z=t+Y-(0-ymin)/(ymax-ymin)*Y; s+=`<line x1="${l}" x2="${w-r}" y1="${Math.min(t+Y,Math.max(t,z))}" y2="${Math.min(t+Y,Math.max(t,z))}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;
  return s}
function ymap(o,v){const Y=o.h-o.t-o.b;return o.t+Y-(v-o.ymin)/(o.ymax-o.ymin)*Y}
function legend(items,x,y){let s="";items.forEach((it,i)=>{const yy=y+i*22;s+=it.line?`<line x1="${x}" x2="${x+22}" y1="${yy}" y2="${yy}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${x}" y="${yy-8}" width="16" height="16" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${x+28}" y="${yy+5}" font-size="16" fill="${C.ink}">${it.t}</text>`});return s}
function legendRow(items,x,y){let s="",xx=x;items.forEach(it=>{s+=it.line?`<line x1="${xx}" x2="${xx+20}" y1="${y}" y2="${y}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${xx}" y="${y-7}" width="14" height="14" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${xx+26}" y="${y+5}" font-size="16" fill="${C.ink}">${it.t}</text>`;xx+=38+it.t.length*8.2});return s}

/* Food Manufacture: stacked bars of a [month][oil] matrix, optional line */
function hbar(items,opt={}){ // items: {t,v,c}
  const w=opt.w||640,h=opt.h||330,l=opt.l||250,r=90,t=16,rowh=(h-t-20)/items.length;

S.push({kicker:"Part 2 · Proof", title:"A concave function on a polytope is minimized at a vertex", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:19px;line-height:1.75">
A polytope P is a bounded set defined by linear inequalities.<br>Every x in P is a convex combination of its vertices:<br>x = Σ<sub>k</sub> θ<sub>k</sub> v<sub>k</sub>, &nbsp;θ<sub>k</sub> ≥ 0, &nbsp;Σ θ<sub>k</sub> = 1<br>
f concave ⇒ f(x) ≥ Σ<sub>k</sub> θ<sub>k</sub> f(v<sub>k</sub>) ≥ min<sub>k</sub> f(v<sub>k</sub>)<br>so some vertex is at least as good as x. ∎</div></div></div>
<div class="col"><ul class="b xs"><li>The same argument as for an LP, with an inequality where the LP has an equality</li>
<li>But a vertex that is better than its neighbors need not be the best vertex: local minima are vertices, and there can be many</li>
<li>The number of vertices grows exponentially with the number of units; concave-cost network design is NP-hard in general</li>
<li>Consequence for design: the cost-optimal plant puts capacity at bounds (one unit at its maximum, the next takes the rest), not in equal shares</li></ul></div></div>`});

<div class="col"><ul class="b xs"><li>First-order condition met, second-order condition for a minimum failed: a strict local maximum along the feasible line</li>

S.push({kicker:"Part 3 · Optimality conditions", title:"What a stationary point is, and what it is not", html:()=>`<div class="body"><div class="col w45"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
<span class="lbl" style="width:190px">First order, necessary</span>∇f(x*) = 0<br><span class="lbl" style="width:190px">Second order, necessary</span>∇²f(x*) ⪰ 0<br>
<span class="lbl" style="width:190px">Second order, sufficient</span>∇f(x*) = 0 and ∇²f(x*) ≻ 0:<br><span class="lbl" style="width:190px"></span>a strict local minimum<br><span style="font-size:15px;font-family:Helvetica Neue,Arial,sans-serif">⪰ 0: positive semidefinite; ≻ 0: positive definite</span></div></div>

  document.getElementById("cbc").textContent=`(${fm(x0,2)}, ${fm(y0,2)}) → (${fm(r.x[0],3)}, ${fm(r.x[1],3)}), f = ${fm(r.f,4)}, ${r.it} iterations`}},

S.push({kicker:"Part 3 · Derivation", title:"How many starts are enough?", html:()=>`<div class="body"><div class="col w45"><div class="panel"><div class="math" style="font-size:19px;line-height:1.75">

S.push({kicker:"Part 3 · Solvers", title:"Local and global solvers certify different things", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:17px">
<tr><th></th><th>Local NLP solvers</th><th>Global solvers</th></tr>
<tr><td>Examples</td><td>IPOPT, CONOPT, SNOPT, KNITRO; SciPy SLSQP and trust-constr</td><td>BARON, ANTIGONE, Couenne, SCIP; Gurobi for nonconvex quadratic models</td></tr>
<tr><td>Returns</td><td>A point that satisfies the KKT conditions (the first-order conditions with constraints, Session 7) to a tolerance</td><td>An incumbent and a lower bound</td></tr>
<tr><td>Certificate</td><td>Global only if the model is convex</td><td>The gap, as in MILP</td></tr>
<tr><td>Method</td><td>Newton-type steps on the KKT system</td><td>Spatial branch and bound: convex relaxations, branching on continuous variables, bound tightening</td></tr>
<tr><td>Size in practice</td><td>Hundreds of thousands of variables</td><td>Tens to a few thousand nonconvex terms, problem-dependent</td></tr>
<tr><td>Needs from you</td><td>Good starts, scaling, derivatives</td><td>Finite bounds on every variable in a nonconvex term</td></tr></table>
<ul class="b xs" style="margin-top:12px"><li>Global solvers need bounds because relaxations are built over boxes: an unbounded variable gives an unbounded relaxation</li>
<li>The next three slides show the two ingredients: a convex relaxation of a term, and branching that shrinks the boxes</li></ul></div></div>`});

S.push({kicker:"Part 3 · Relaxation", title:"McCormick envelopes for a bilinear term", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.7">
w = F·x, &nbsp;F ∈ [F<sup>L</sup>, F<sup>U</sup>], &nbsp;x ∈ [x<sup>L</sup>, x<sup>U</sup>]<br>
w ≥ F<sup>L</sup>x + F x<sup>L</sup> − F<sup>L</sup>x<sup>L</sup> &nbsp;&nbsp;w ≥ F<sup>U</sup>x + F x<sup>U</sup> − F<sup>U</sup>x<sup>U</sup><br>
w ≤ F<sup>U</sup>x + F x<sup>L</sup> − F<sup>U</sup>x<sup>L</sup> &nbsp;&nbsp;w ≤ F<sup>L</sup>x + F x<sup>U</sup> − F<sup>L</sup>x<sup>U</sup></div></div>
<ul class="b xs" style="margin-top:10px"><li>Each row is (F − F<sup>L</sup>)(x − x<sup>L</sup>) ≥ 0 or a similar product, expanded and linearized: valid on the box</li>
<li>The four rows are the convex and concave envelopes of F·x on the box: no linear relaxation is tighter (Al-Khayyal and Falk, 1983)</li>
<li>Exact on the edges of the box, where F or x is at a bound; loosest at the center, where the error is (F<sup>U</sup> − F<sup>L</sup>)(x<sup>U</sup> − x<sup>L</sup>)/4</li>
<li>Session 13 uses these rows on the pooling problem</li></ul></div>
<div class="col"><div class="panel grow"><p class="note" style="margin:0 0 8px">At F = 5, x = 0.5 the true value is w = 2.5.</p><table class="t" style="font-size:16px"><tr><th>Box</th><th class="n">Envelope</th><th class="n">Largest error</th></tr>
<tr><td style="white-space:nowrap">F ∈ [0, 10], x ∈ [0.2, 0.8]</td><td class="n">[1.0, 4.0]</td><td class="n">1.5</td></tr>
<tr><td style="white-space:nowrap">F ∈ [2.5, 7.5], x ∈ [0.2, 0.8]</td><td class="n">[1.75, 3.25]</td><td class="n">0.75</td></tr>
<tr><td style="white-space:nowrap">F ∈ [2.5, 7.5], x ∈ [0.35, 0.65]</td><td class="n" style="white-space:nowrap">[2.125, 2.875]</td><td class="n">0.375</td></tr>
<tr><td style="white-space:nowrap">F ∈ [0, 5], x ∈ [0.2, 0.8]</td><td class="n">[2.5, 2.5]</td><td class="n">0 at F = 5</td></tr></table>
<p class="note">Halving the F interval halves the error; halving both quarters it. In the last box the point sits on the edge F = 5, where the envelope is exact.</div></div></div>`});

S.push({kicker:"Part 3 · Relaxation", title:"αBB (alpha branch and bound): a convex underestimator for any smooth term", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.7">
On the box l ≤ x ≤ u: &nbsp;L(x) = f(x) + α Σ<sub>i</sub> (l<sub>i</sub> − x<sub>i</sub>)(u<sub>i</sub> − x<sub>i</sub>)<br>
∇²L = ∇²f + 2αI ⪰ 0 &nbsp;if &nbsp;α ≥ max(0, −½ min<sub>x∈box</sub> e<sub>min</sub>(∇²f(x)))<br>
largest gap f − L = α Σ<sub>i</sub> (u<sub>i</sub> − l<sub>i</sub>)²/4, at the center</div></div>
<ul class="b xs" style="margin-top:10px"><li>The added term is ≤ 0 on the box and 0 at its corners: L ≤ f, and L is convex, so min L is a valid lower bound found by a local solver</li>
<li>e<sub>min</sub> is the smallest eigenvalue. In practice it is bounded with interval arithmetic on the Hessian (Gershgorin), which is safe but loose</li>
<li>The gap shrinks with the square of the box width: halve the box, quarter the gap</li>
<li>Androulakis, Maranas and Floudas (1995); used inside BARON-type solvers with many other relaxations</li></ul></div>
<div class="col"><div class="panel"><div class="math" style="font-size:17px;line-height:1.7">
Example on [0, 8]: the Session 1 demo cost<br>f(x) = (x − 1.5)²(x − 6)²/10 + 0.8x<br>
f″ = [2(2x − 7.5)² + 4(x − 1.5)(x − 6)]/10<br>min f″ = −2.025 at x = 3.75 ⇒ α = 1.0125<br>largest gap at the root: 1.0125 × 64/4 = 16.2</div></div>
<p class="note">Two local minima: x = 1.32 with f = 1.13 and x = 5.77 with f = 4.71. In Session 1, BFGS found one or the other depending on its start. Next slide: branch and bound finds the first and proves it global.</p></div></div>`});

<div class="col"><div class="ctrl"><button id="bbn">Next node</button><button id="bbr">Start again</button><span id="bbs"></span></div>

S.push({kicker:"Part 3 · Check your understanding · 5 minutes", title:"Starts, bounds and gaps", html:()=>CHECK(3,
OL+`<li>On the camel, 58.8% of starts reach a global minimum. How many random starts give 99.9% confidence?</li>
<li>Fifty starts all returned the same best value. Is it the global minimum?</li>
<li>f(x) = x³ − 3x on [−2, 2]. Find α for αBB and the largest gap. What happens on [0, 2]?</li>
<li>Why does the αBB gap fall by a factor of four when a box is halved, and the McCormick gap only by two?</li></ol>`,
`<li>1. ln 0.001 / ln 0.412 = 7.8, so 8 starts</li>
<li>2. Not proven. If the global basin is small (say p = 1%), fifty starts miss it with probability 0.99<sup>50</sup> = 61%</li>
<li>3. f″ = 6x ≥ −12 on the box, α = 6, gap 6 × 16/4 = 24. On [0, 2], f″ ≥ 0: α = 0 and the underestimator is f itself, exact</li>
<li>4. αBB: α(u − l)²/4 is quadratic in the width, and α cannot rise on a smaller box. McCormick: (F<sup>U</sup> − F<sup>L</sup>)(x<sup>U</sup> − x<sup>L</sup>)/4 is linear in each width, so halving one interval halves it</li>`),
draw:()=>reveal("k3btn","k3ans")});

<ul class="b xs" style="margin-top:10px"><li>success and message: the gradient norm fell below gtol, the gradient tolerance. Nothing about other minima</li><li>nit, nfev: iterations and function evaluations</li>

`import numpy as np
from scipy.optimize import minimize
from convexity_lab import camel, camel_grad, fd_hessian
r = minimize(camel, [-1.5, 1.0], jac=camel_grad, method="BFGS", options={"gtol": 1e-8})

S.push({kicker:"Part 3 · Check your understanding · 4 minutes", title:"Read these reports", html:()=>CHECK(4,
OL+`<li>Camel, BFGS from (0, 0): success True, nit 0, f = 0. What happened?</li>
<li>"Desired error not necessarily achieved due to precision loss", gradient norm 3 × 10<sup>−6</sup>, f equal to the best value from other starts. What do you report?</li>
<li>Two IPOPT runs on a heat-exchanger network: 1.92 and 2.05 MUSD/yr, both "Optimal Solution Found". Which do you report, and what do you claim?</li>
<li>A global solver stops at its time limit: incumbent 1.92, lower bound 1.80. The gap?</li></ol>`,
`<li>1. The start is a stationary point: the gradient is zero at once. The Hessian there has eigenvalues ±8.06, a saddle</li>
<li>2. Probably converged: the line search ran out of precision near a minimum. Check the gradient against the scale of f, rescale, and restart from the point</li>
<li>3. 1.92, as the best of two local solutions. Do not call it optimal without a bound; say how many starts you ran</li>
<li>4. (1.92 − 1.80)/1.92 = 6.25%. The true optimum is between 1.80 and 1.92</li>`),

S.push({kicker:"Summary", title:"What to take from today", html:()=>`<div class="body"><div class="col w45"><table class="t" style="font-size:17px" id="sumt"></table></div>
<div class="col"><ul class="b xs"><li>Convex objective, convex inequalities, affine equalities: every local minimum is global, and a stationary point is the answer</li>
<li>Test with the Hessian or with composition rules; a nonlinear equality is the most common way a process model loses convexity</li>
<li>Some convexity is hidden: ideal-gas equilibrium, and power laws in log variables</li>
<li>Concave cost puts the minimum at a vertex and turns the equal split into a maximum</li>
<li>First-order conditions find candidates; the second-order check is yours</li>
<li>Multistart gives a probability; a relaxation and branching give a bound</li></ul></div></div>`,
draw:()=>{const L=LC();document.getElementById("sumt").innerHTML=`<tr><th>Quantity</th><th class="n">Value</th></tr>
<tr><td>Quartic: minima, saddle</td><td class="n">(±1, ±1), (0, 0)</td></tr><tr><td>Gibbs: deviation over 25 starts</td><td class="n">${L.gibbs.max_deviation.toExponential(1)}</td></tr>
<tr><td>Margules: one phase while</td><td class="n">A ≤ 2</td></tr><tr><td>Two units, 1,500 m²: vertex / equal split</td><td class="n">${fmt(L.parallel[2].end_cost,1)} / ${fmt(L.parallel[2].equal_split_cost,1)} kUSD</td></tr>
<tr><td>Camel: starts reaching the global minimum</td><td class="n">${fmt(100*L.camel.p_global,1)}%</td></tr><tr><td>αBB on [0, 8]: nodes, optimum</td><td class="n">${L.abb.nodes.length}, ${fmt(L.abb.incumbent,4)}</td></tr>`}});

const N=S.length; let cur=0;
function build(){const host=document.getElementById("slides");host.innerHTML="";
 S.forEach((s,i)=>{const d=document.createElement("section");d.className="slide"+(s.cls?" "+s.cls:"");d.id="s"+(i+1);

function drawAll(){S.forEach(s=>{if(s.draw)try{s.draw()}catch(e){console.error(e)}})}
function show(i){cur=Math.max(0,Math.min(N-1,i));document.querySelectorAll(".slide").forEach((el,k)=>el.classList.toggle("on",k===cur));
 history.replaceState(null,"",location.search+"#"+(cur+1));fillDrawer();if(window.onSlideChange)onSlideChange(cur);const n=document.getElementById("notes");n.textContent=S[cur].notes||"No notes for this slide."}

function fit(){const W=innerWidth,H=innerHeight,vp=document.getElementById("viewport"),dock=document.getElementById("dock"),cap=document.getElementById("cap");
 const hasDock=dock.style.display==="flex",barH=hasDock?document.getElementById("nbar").offsetHeight:0;
 let k=Math.min(W/1280,H/720)*0.98,capH=0,fs=0,dockH=0;
 for(let it=0;it<3;it++){if(hasDock&&CAP_ON){const lines=k<0.6?4:2;fs=Math.max(12,Math.min(22,24*k));capH=Math.ceil(lines*fs*1.45)+4}else capH=0;
  dockH=hasDock?capH+barH+(capH?6:0)+14:0;k=Math.min(W/1280,Math.max(120,H-dockH)/720)*0.98}
 const h=720*k,pad=10,top=Math.max(0,(H-h-dockH)/2);
 vp.style.top=(top-pad)+"px";vp.style.bottom="auto";vp.style.height=(h+2*pad)+"px";
 document.getElementById("stage").style.transform=`scale(${k})`;
 if(hasDock){dock.style.top=(top+h+6)+"px";cap.style.display=CAP_ON?"block":"none";cap.style.width=Math.min(1280*k,W-16)+"px";cap.style.height=capH+"px";cap.dataset.fs=fs;if(window.capRefit)capRefit()}}

(function(){if(!NARR)return;
 const au=document.getElementById("narr"),bar=document.getElementById("nbar"),cap=document.getElementById("cap"),play=document.getElementById("nPlay"),tm=document.getElementById("nTime"),msg=document.getElementById("nMsg");
 document.getElementById("dock").style.display="flex";document.getElementById("help").style.display="none";let on=false,lang="off",slideIdx=-1;
 const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
 lang=ls("cc-lang")||"off";const sp=ls("narr-speed");if(sp)document.getElementById("nSpeed").value=sp;
 const fmtT=t=>isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`:"0:00";
 const S_=i=>NARR.slides[i];
 function load(i){slideIdx=i;const s=S_(i);if(!s){au.removeAttribute("src");return}au.src=s.file;au.playbackRate=+document.getElementById("nSpeed").value;tm.textContent=`0:00 / ${fmtT(s.duration)}`;showCap(0)}
 function setPlayUI(){play.textContent=au.paused?"▶ Play":"❚❚ Pause";play.classList.toggle("on",!au.paused)}
 // captions sit in their own band under the slide; long lines shrink to fit the band
 window.capRefit=()=>{let f=parseFloat(cap.dataset.fs)||18;cap.style.fontSize=f+"px";while(cap.scrollHeight>cap.clientHeight+1&&f>11){f-=1;cap.style.fontSize=f+"px"}};
 function showCap(t){const s=S_(slideIdx);let c=null;if(s&&lang!=="off"){for(const q of s.cues){if(t>=q.s-0.05)c=q;else break}}
  const txt=(!c||(au.paused&&au.currentTime===0&&!on))?"":(lang==="th"?c.th:c.en);if(cap.textContent!==txt){cap.textContent=txt;capRefit()}}
 function ccUI(){const b=document.getElementById("nCC");b.textContent=lang==="off"?"CC off":lang==="en"?"CC English":"CC ไทย";b.classList.toggle("on",lang!=="off");CAP_ON=lang!=="off";fit();showCap(au.currentTime||0)}
 window.ccCycle=()=>{lang=lang==="off"?"en":lang==="en"?"th":"off";ls("cc-lang",lang);ccUI()};
 // "on" means the student is listening: it starts with Play and ends with Pause or Stop.
 // Slides change only when the student moves; the new slide's narration then starts if "on".
 window.narrToggle=()=>{if(au.paused){on=true;if(slideIdx!==cur)load(cur);if(au.ended)au.currentTime=0;msg.textContent="";au.play().catch(()=>{msg.textContent="Press Play again to start audio."})}else{on=false;au.pause()}};
 window.onSlideChange=i=>{au.pause();msg.textContent="";load(i);if(on)au.play().catch(()=>{})};
 document.getElementById("nPlay").onclick=narrToggle;
 document.getElementById("nStop").onclick=()=>{au.pause();au.currentTime=0;on=false;setPlayUI();showCap(0);tm.textContent=`0:00 / ${fmtT((S_(cur)||{}).duration)}`};
 document.getElementById("nCC").onclick=ccCycle;
 document.getElementById("nPrev").onclick=()=>show(cur-1);document.getElementById("nNext").onclick=()=>show(cur+1);
 document.getElementById("nSpeed").onchange=e=>{au.playbackRate=+e.target.value;ls("narr-speed",e.target.value)};
 au.addEventListener("play",setPlayUI);au.addEventListener("pause",setPlayUI);
 au.addEventListener("timeupdate",()=>{tm.textContent=`${fmtT(au.currentTime)} / ${fmtT((S_(slideIdx)||{}).duration)}`;showCap(au.currentTime)});
 au.addEventListener("ended",()=>{setPlayUI();const s=S_(slideIdx);msg.textContent=s&&s.hold?"Activity: do it now, then press Next ›":cur<N-1?"Press Next › or → for the next slide":"End of the session"});
 const q=new URLSearchParams(location.search);
 if(q.get("narrate")==="1"){const ov=document.getElementById("startov");ov.style.display="flex";document.getElementById("startBtn").onclick=()=>{ov.style.display="none";if(lang==="off"){lang="en";ls("cc-lang",lang)}ccUI();on=true;load(cur);au.play().catch(()=>{})}}
 ccUI();setTimeout(()=>{if(slideIdx<0)load(cur)},0);
})();

build();drawAll();fit();show((parseInt(location.hash.slice(1))||1)-1);
</script>
