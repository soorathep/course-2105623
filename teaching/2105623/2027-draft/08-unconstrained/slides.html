const LAB_SRC = "\"\"\"Session 8 (2027 draft): algorithms for unconstrained minimization.\n\nSteepest descent, Newton's method and BFGS, written out in a few lines each so\nthat every iteration, function evaluation and gradient evaluation can be\ncounted. All three use the same Armijo backtracking line search.\n\nRun `python descent_lab.py` for a printed summary, or `python descent_lab.py --json`\nto write descent-results.json, which the slides and the lab page read.\n\"\"\"\nimport json\nimport math\nimport sys\nimport warnings\n\nimport numpy as np\n\n\ndef r6(v):\n    \"\"\"Round for printing, so recorded and live runs print the same text.\"\"\"\n    if isinstance(v, (list, tuple, np.ndarray)):\n        return [r6(u) for u in v]\n    v = round(float(v), 6)\n    return 0.0 if v == 0 else v\n\n\ndef sig(v, d=4):\n    \"\"\"A number with d significant digits, as text (for values spanning many decades).\"\"\"\n    return f\"{float(v):.{d}g}\"\n\n\n# ---------------------------------------------------------------------------\n# Part A. One line search and three methods\n# ---------------------------------------------------------------------------\nclass Counter:\n    \"\"\"Wrap f and its derivatives so every call is counted.\"\"\"\n    def __init__(self, f, g=None, h=None):\n        self.f0, self.g0, self.h0 = f, g, h\n        self.nf = self.ng = self.nh = 0\n\n    def f(self, x):\n        self.nf += 1\n        return self.f0(x)\n\n    def g(self, x):\n        self.ng += 1\n        return self.g0(x)\n\n    def h(self, x):\n        self.nh += 1\n        return self.h0(x)\n\n\ndef armijo(F, x, fx, gx, p, alpha0=1.0, c1=1e-4, rho=0.5, max_back=60):\n    \"\"\"Backtracking: halve alpha until f(x + alpha p) <= f(x) + c1 alpha g'p.\"\"\"\n    slope = float(gx @ p); a = alpha0\n    for _ in range(max_back):\n        xn = x + a * p; fn = F.f(xn)\n        if np.isfinite(fn) and fn <= fx + c1 * a * slope:\n            return a, xn, fn\n        a *= rho\n    return 0.0, x, fx\n\n\ndef run(method, f, g, x0, h=None, gtol=1e-6, max_iter=5000, keep=400, gscale=None):\n    \"\"\"method: 'gd' (steepest descent), 'newton' (modified Newton), 'pure_newton' (full steps, no\n    line search, no modification) or 'bfgs'. Stops when max|gscale * grad f| <= gtol (gscale = 1 unless given).\"\"\"\n    F = Counter(f, g, h); x = np.array(x0, float); fx = F.f(x); gx = F.g(x)\n    n = len(x); Hinv = np.eye(n); path = [x.tolist()]; gs = np.ones(n) if gscale is None else np.array(gscale, float)\n    gn = [float(np.max(np.abs(gs * gx)))]; fv = [float(fx)]\n    status = \"max_iter\"\n    for k in range(max_iter):\n        if np.max(np.abs(gs * gx)) <= gtol:\n            status = \"converged\"; break\n        if method == \"gd\":\n            p = -gx\n        elif method in (\"newton\", \"pure_newton\"):\n            H = F.h(x)\n            if method == \"newton\":\n                lam, V = np.linalg.eigh(H)                       # make the model convex: flip and floor eigenvalues\n                lam = np.maximum(np.abs(lam), 1e-12 * max(1e-12, float(np.max(np.abs(lam)))))\n                p = -V @ ((V.T @ gx) / lam)\n            else:\n                p = -np.linalg.solve(H, gx)\n        else:\n            p = -Hinv @ gx\n        if method == \"pure_newton\":\n            xn = x + p; fn = F.f(xn); a = 1.0\n        else:\n            a, xn, fn = armijo(F, x, fx, gx, p)\n            if a == 0.0:\n                status = \"line search failed\"; break\n        gn_new = F.g(xn)\n        if method == \"bfgs\":\n            s = xn - x; y = gn_new - gx; sy = float(s @ y)\n            if sy > 1e-12 * float(np.linalg.norm(s) * np.linalg.norm(y)):\n                rho_ = 1.0 / sy; I = np.eye(n)\n                Hinv = (I - rho_ * np.outer(s, y)) @ Hinv @ (I - rho_ * np.outer(y, s)) + rho_ * np.outer(s, s)\n        x, fx, gx = xn, fn, gn_new\n        if len(path) < keep:\n            path.append(x.tolist())\n        gn.append(float(np.max(np.abs(gs * gx)))); fv.append(float(fx))\n    return {\"method\": method, \"x\": x.tolist(), \"f\": float(fx), \"nit\": len(gn) - 1, \"nfev\": F.nf, \"ngev\": F.ng, \"nhev\": F.nh,\n            \"gnorm\": gn[-1], \"status\": status, \"path\": path, \"gnorms\": gn[:keep], \"fvals\": fv[:keep]}\n\n\ndef summary(r):\n    return f'{r[\"method\"]:11s} nit {r[\"nit\"]:5d} nfev {r[\"nfev\"]:5d} ngev {r[\"ngev\"]:5d} |g| {sig(r[\"gnorm\"], 2):>8s} {r[\"status\"]}'\n\n\n# ---------------------------------------------------------------------------\n# Part B. Test functions\n# ---------------------------------------------------------------------------\ndef quadratic(kappa, theta_deg=30.0):\n    \"\"\"f = 1/2 x'Ax with eigenvalues 1 and kappa, axes rotated by theta.\"\"\"\n    t = math.radians(theta_deg); Q = np.array([[math.cos(t), -math.sin(t)], [math.sin(t), math.cos(t)]])\n    A = Q @ np.diag([1.0, kappa]) @ Q.T\n    return (lambda x: 0.5 * x @ A @ x), (lambda x: A @ x), (lambda x: A), A\n\n\ndef worst_start(kappa, theta_deg=30.0, radius=4.0):\n    \"\"\"The start from which steepest descent zigzags most: gradient at 45 degrees to both axes.\"\"\"\n    t = math.radians(theta_deg); Q = np.array([[math.cos(t), -math.sin(t)], [math.sin(t), math.cos(t)]])\n    u = np.array([kappa, 1.0]); u = radius * u / np.linalg.norm(u)\n    return Q @ u\n\n\ndef gd_exact_quadratic(kappa, x0=None, theta_deg=30.0, tol=1e-6, max_iter=100000):\n    \"\"\"Steepest descent with the exact step on a quadratic: iterations to cut |grad| by tol.\"\"\"\n    f, g, h, A = quadratic(kappa, theta_deg)\n    x = worst_start(kappa, theta_deg) if x0 is None else np.array(x0, float); g0 = np.linalg.norm(A @ x)\n    for k in range(max_iter):\n        gk = A @ x\n        if np.linalg.norm(gk) <= tol * g0:\n            return k\n        x = x - (gk @ gk) / (gk @ A @ gk) * gk\n    return max_iter\n\n\ndef himmelblau(x):\n    return (x[0]**2 + x[1] - 11)**2 + (x[0] + x[1]**2 - 7)**2\n\n\ndef himmelblau_g(x):\n    A = x[0]**2 + x[1] - 11; B = x[0] + x[1]**2 - 7\n    return np.array([4 * x[0] * A + 2 * B, 2 * A + 4 * x[1] * B])\n\n\ndef himmelblau_h(x):\n    A = x[0]**2 + x[1] - 11; B = x[0] + x[1]**2 - 7\n    return np.array([[4 * A + 8 * x[0]**2 + 2, 4 * x[0] + 4 * x[1]], [4 * x[0] + 4 * x[1], 2 + 4 * B + 8 * x[1]**2]])\n\n\ndef rosenbrock(x):\n    return 100 * (x[1] - x[0]**2)**2 + (1 - x[0])**2\n\n\ndef rosenbrock_g(x):\n    return np.array([-400 * x[0] * (x[1] - x[0]**2) - 2 * (1 - x[0]), 200 * (x[1] - x[0]**2)])\n\n\ndef rosenbrock_h(x):\n    return np.array([[1200 * x[0]**2 - 400 * x[1] + 2, -400 * x[0]], [-400 * x[0], 200.0]])\n\n\ndef double_well(x):\n    \"\"\"1-D: f = x^4 - 4x^2 + x, for the Newton-model demo.\"\"\"\n    return x**4 - 4 * x**2 + x\n\n\ndef newton_1d(x0, modified=False, n=8):\n    \"\"\"Newton on the double well f = x^4 - 4x^2 + x. Pure: x - f'/f''. Modified: curvature max(|f''|, 1)\n    and Armijo backtracking, so every step goes downhill.\"\"\"\n    xs = [float(x0)]; x = float(x0)\n    for _ in range(n):\n        d1 = 4 * x**3 - 8 * x + 1; d2 = 12 * x**2 - 8\n        if not modified:\n            x = x - d1 / d2\n        else:\n            p = -d1 / max(abs(d2), 1.0); a = 1.0\n            while double_well(x + a * p) > double_well(x) + 1e-4 * a * d1 * p and a > 1e-10:\n                a /= 2\n            x = x + a * p\n        xs.append(x)\n    return xs\n\n\ndef fd_errors(x0=1.5):\n    \"\"\"Forward, central and complex-step derivative errors for f = e^x / sqrt(sin^3 x + cos^3 x).\"\"\"\n    f = lambda z: np.exp(z) / np.sqrt(np.sin(z)**3 + np.cos(z)**3)\n    s, c = math.sin(x0), math.cos(x0); den = s**3 + c**3\n    exact = f(x0) * (1 - 0.5 * (3 * s * s * c - 3 * c * c * s) / den)\n    out = []\n    for k in range(1, 21):\n        hh = 10.0**-k\n        fwd = (f(x0 + hh) - f(x0)) / hh; cen = (f(x0 + hh) - f(x0 - hh)) / (2 * hh); cs = (f(x0 + 1j * hh)).imag / hh\n        out.append({\"h\": hh, \"forward\": abs(fwd - exact) / abs(exact), \"central\": abs(cen - exact) / abs(exact),\n                    \"complex\": max(abs(cs - exact) / abs(exact), 1e-17)})\n    return {\"x0\": x0, \"exact\": float(exact), \"rows\": out}\n\n\ndef backtracking_by_hand():\n    \"\"\"f = x1^2 + 10 x2^2 at (1, 1), p = -grad f: the trials of Armijo backtracking (c1 = 1e-4, halving).\"\"\"\n    A = np.diag([2.0, 20.0]); f = lambda x: 0.5 * x @ A @ x; x = np.array([1.0, 1.0]); g = A @ x; p = -g\n    fx = f(x); slope = float(g @ p); a = 1.0; rows = []\n    while True:\n        fn = f(x + a * p); ok = fn <= fx + 1e-4 * a * slope\n        rows.append({\"alpha\": a, \"x\": (x + a * p).tolist(), \"f\": float(fn), \"bound\": float(fx + 1e-4 * a * slope), \"ok\": bool(ok)})\n        if ok:\n            break\n        a /= 2\n    return {\"x\": x.tolist(), \"f\": float(fx), \"g\": g.tolist(), \"slope\": slope, \"trials\": rows, \"exact\": float((g @ g) / (g @ A @ g))}\n\n\ndef scaling_sweep(exps=None):\n    \"\"\"A quadratic written in badly scaled units: x2 = s z2. Iterations of each method versus s = 10^e.\"\"\"\n    A0 = np.array([[2.0, 0.6], [0.6, 1.0]]); out = []\n    for e in (np.arange(0, 4.01, 0.25) if exps is None else exps):\n        s = 10.0**e; Di = np.diag([1.0, 1.0 / s]); A = Di @ A0 @ Di; xs = np.array([1.0, 2.0 * s])\n        f = lambda x, A=A, xs=xs: 0.5 * (x - xs) @ A @ (x - xs); g = lambda x, A=A, xs=xs: A @ (x - xs); h = lambda x, A=A: A\n        row = {\"log10s\": float(e), \"cond\": float(np.linalg.cond(A))}\n        for m in (\"gd\", \"bfgs\", \"newton\"):\n            r = run(m, f, g, [0.0, 0.0], h=h, gtol=1e-6, max_iter=20000, keep=2, gscale=[1.0, s])\n            row[m] = r[\"nit\"] if r[\"status\"] == \"converged\" else None\n        out.append(row)\n    return out\n\n\n# ---------------------------------------------------------------------------\n# Lab 8. Two-stage compressor with an intercooler (synthetic data)\n# ---------------------------------------------------------------------------\nCOMP = {\"n\": 50.0, \"gamma\": 1.4, \"eta\": 0.8, \"p1\": 1e5, \"p3\": 1e6, \"T1\": 300.0,       # mol/s, -, -, Pa, Pa, K\n        \"Tw_in\": 293.0, \"Tw_out\": 303.0, \"U\": 40.0,                                    # cooling water K, gas-side U W/m2K\n        \"c_power\": 0.8, \"c_area\": 300.0, \"c_water\": 0.03,                               # USD/yr per W, per m2, per W removed\n        \"x0\": [5e5, 340.0], \"scale\": [1e5, 10.0],                                       # start (Pa, K); scaled units: bar and 10 K\n        \"units\": \"p in Pa and T in K (SI); cost in USD/yr\"}\n\n\ndef comp_cost(x, D=COMP):\n    \"\"\"Annual cost: power for both stages + intercooler area + cooling water. Works for complex x (complex step).\"\"\"\n    p, T = x[0], x[1]\n    if np.real(p) <= 0:\n        return np.inf\n    a = (D[\"gamma\"] - 1) / D[\"gamma\"]; R = 8.314; cp = D[\"gamma\"] * R / (D[\"gamma\"] - 1)\n    r1 = (p / D[\"p1\"])**a; r2 = (D[\"p3\"] / p)**a\n    Tout = D[\"T1\"] + D[\"T1\"] * (r1 - 1) / D[\"eta\"]\n    d1 = Tout - D[\"Tw_out\"]; d2 = T - D[\"Tw_in\"]\n    if np.real(d1) <= 0 or np.real(d2) <= 0:\n        return np.inf\n    lm = (d1 - d2) / np.log(d1 / d2) if abs(np.real(d1 - d2)) > 1e-9 else d1\n    W = D[\"n\"] * cp * (D[\"T1\"] * (r1 - 1) + T * (r2 - 1)) / D[\"eta\"]\n    Q = D[\"n\"] * cp * (Tout - T); A = Q / (D[\"U\"] * lm)\n    return D[\"c_power\"] * W + D[\"c_area\"] * A + D[\"c_water\"] * Q\n\n\ndef comp_parts(x, D=COMP):\n    p, T = x; a = (D[\"gamma\"] - 1) / D[\"gamma\"]; R = 8.314; cp = D[\"gamma\"] * R / (D[\"gamma\"] - 1)\n    r1 = (p / D[\"p1\"])**a; r2 = (D[\"p3\"] / p)**a; Tout = D[\"T1\"] + D[\"T1\"] * (r1 - 1) / D[\"eta\"]\n    d1 = Tout - D[\"Tw_out\"]; d2 = T - D[\"Tw_in\"]; lm = (d1 - d2) / math.log(d1 / d2)\n    W = D[\"n\"] * cp * (D[\"T1\"] * (r1 - 1) + T * (r2 - 1)) / D[\"eta\"]; Q = D[\"n\"] * cp * (Tout - T)\n    return {\"power_kW\": W / 1e3, \"duty_kW\": Q / 1e3, \"area_m2\": Q / (D[\"U\"] * lm), \"T_out1\": Tout}\n\n\ndef comp_grad(x, D=COMP):\n    \"\"\"Complex-step gradient: exact to rounding, with no subtraction error.\"\"\"\n    x = np.array(x, float); g = np.zeros(2); hh = 1e-20 * np.maximum(1.0, np.abs(x))\n    for i in range(2):\n        xc = x.astype(complex); xc[i] += 1j * hh[i]\n        g[i] = np.imag(comp_cost(xc, D)) / hh[i]\n    return g\n\n\ndef comp_hess(x, D=COMP):\n    \"\"\"Central differences of the complex-step gradient.\"\"\"\n    x = np.array(x, float); H = np.zeros((2, 2)); hh = 1e-5 * np.maximum(1.0, np.abs(x))\n    for j in range(2):\n        e = np.zeros(2); e[j] = hh[j]\n        H[:, j] = (comp_grad(x + e, D) - comp_grad(x - e, D)) / (2 * hh[j])\n    return 0.5 * (H + H.T)\n\n\ndef scaled(D=COMP):\n    \"\"\"The same cost in scaled variables z = x / s (p in bar, T in units of 10 K).\"\"\"\n    s = np.array(D[\"scale\"])\n    return (lambda z: comp_cost(z * s, D)), (lambda z: comp_grad(z * s, D) * s), (lambda z: s[:, None] * comp_hess(z * s, D) * s[None, :])\n\n\ndef lab_results():\n    D = COMP; s = np.array(D[\"scale\"]); x0 = np.array(D[\"x0\"])\n    fz, gz, hz = scaled(D)\n    si = {m: run(m, comp_cost, comp_grad, x0, h=comp_hess, gtol=1e-3, max_iter=5000, keep=300) for m in (\"gd\", \"newton\", \"bfgs\")}\n    sc = {m: run(m, fz, gz, x0 / s, h=hz, gtol=1e-3, max_iter=5000, keep=300) for m in (\"gd\", \"newton\", \"bfgs\")}\n    xs = np.array(sc[\"newton\"][\"x\"]) * s\n    Hsi = comp_hess(xs); Hsc = s[:, None] * Hsi * s[None, :]\n    sweep = []\n    for e in np.arange(0, 5.01, 0.5):                       # scale of p only: 10^e Pa per unit; T in units of 10 K\n        sp = np.array([10.0**e, 10.0])\n        fz2 = lambda z, sp=sp: comp_cost(z * sp, D); gz2 = lambda z, sp=sp: comp_grad(z * sp, D) * sp\n        r = run(\"gd\", fz2, gz2, x0 / sp, gtol=1e-3, max_iter=5000, keep=2); rb = run(\"bfgs\", fz2, gz2, x0 / sp, gtol=1e-3, max_iter=5000, keep=2)\n        sweep.append({\"log10s\": float(e), \"gd\": r[\"nit\"], \"gd_status\": r[\"status\"], \"gd_f\": r[\"f\"], \"bfgs\": rb[\"nit\"], \"bfgs_status\": rb[\"status\"]})\n    ros = {m: run(m, rosenbrock, rosenbrock_g, [-1.2, 1.0], h=rosenbrock_h, gtol=1e-6, max_iter=20000, keep=400)\n           for m in (\"gd\", \"newton\", \"bfgs\")}\n    for r in ros.values():                                              # error |x - x*| by iteration, for the rate plot\n        r[\"err\"] = [float(np.linalg.norm(np.array(p) - 1.0)) for p in r[\"path\"]]\n    return {\"data\": D, \"opt\": {\"x\": xs.tolist(), \"f\": float(comp_cost(xs)), **comp_parts(xs),\n                               \"geometric_mean_bar\": math.sqrt(D[\"p1\"] * D[\"p3\"]) / 1e5},\n            \"hess_si\": {\"H\": Hsi.tolist(), \"eig\": np.linalg.eigvalsh(Hsi).tolist(), \"cond\": float(np.linalg.cond(Hsi))},\n            \"hess_scaled\": {\"H\": Hsc.tolist(), \"eig\": np.linalg.eigvalsh(Hsc).tolist(), \"cond\": float(np.linalg.cond(Hsc))},\n            \"si\": si, \"scaled\": {m: dict(r, x_si=(np.array(r[\"x\"]) * s).tolist()) for m, r in sc.items()},\n            \"rosenbrock\": ros, \"p_scale_sweep\": sweep}\n\n\n# ---------------------------------------------------------------------------\ndef clean(o):\n    if isinstance(o, dict):\n        return {k: clean(v) for k, v in o.items()}\n    if isinstance(o, (list, tuple)):\n        return [clean(v) for v in o]\n    if isinstance(o, np.ndarray):\n        return clean(o.tolist())\n    if isinstance(o, (float, np.floating)):\n        return float(o) if np.isfinite(o) else None\n    if isinstance(o, np.integer):\n        return int(o)\n    return o\n\n\ndef classroom_results():\n    R = {\"meta\": {\"numpy\": np.__version__, \"python\": sys.version.split()[0]}}\n    kap = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000]\n    hstarts = {\"origin\": [0.0, 0.0], \"left\": [-1.0, 3.5], \"low\": [1.0, -4.5]}\n    race = {}\n    for name, x0 in hstarts.items():\n        race[name] = {m: run(m, himmelblau, himmelblau_g, x0, h=himmelblau_h, gtol=1e-8, max_iter=2000, keep=300)\n                      for m in (\"gd\", \"pure_newton\", \"newton\", \"bfgs\")}\n    R[\"lecture\"] = {\"kappa\": [{\"kappa\": k, \"gd_exact\": gd_exact_quadratic(k), \"factor\": ((k - 1) / (k + 1))**2} for k in kap],\n                    \"backtrack\": backtracking_by_hand(), \"scaling\": scaling_sweep(),\n                    \"newton1d\": {\"pure\": newton_1d(0.3), \"modified\": newton_1d(0.3, True)},\n                    \"race\": race, \"fd\": fd_errors()}\n    R[\"lab\"] = lab_results()\n    return clean(R)\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"descent-results.json\", \"w\") as fh:\n            json.dump(R, fh)\n        print(\"wrote descent-results.json\"); sys.exit()\n    L = R[\"lecture\"]\n    print(\"A kappa\", [(q[\"kappa\"], q[\"gd_exact\"]) for q in L[\"kappa\"]])\n    for name, rr in L[\"race\"].items():\n        for m, r in rr.items():\n            print(\"B race\", name, summary(r), \"x\", r6(r[\"x\"]))\n    print(\"A backtrack\", [(q[\"alpha\"], r6(q[\"f\"]), q[\"ok\"]) for q in L[\"backtrack\"][\"trials\"]], \"exact\", r6(L[\"backtrack\"][\"exact\"]))\n    print(\"C scaling\", [(q[\"log10s\"], sig(q[\"cond\"], 3), q[\"gd\"], q[\"bfgs\"], q[\"newton\"]) for q in L[\"scaling\"]])\n    print(\"C fd\", [(sig(q[\"h\"], 1), sig(q[\"forward\"], 2), sig(q[\"central\"], 2), sig(q[\"complex\"], 2)) for q in L[\"fd\"][\"rows\"]])\n    lab = R[\"lab\"]\n    print(\"E opt\", r6(lab[\"opt\"][\"x\"]), r6(lab[\"opt\"][\"f\"]), {k: r6(v) for k, v in lab[\"opt\"].items() if k not in (\"x\", \"f\")})\n    print(\"E cond SI\", sig(lab[\"hess_si\"][\"cond\"]), r6(lab[\"hess_si\"][\"eig\"]), \"scaled\", sig(lab[\"hess_scaled\"][\"cond\"]), r6(lab[\"hess_scaled\"][\"eig\"]))\n    for m, r in lab[\"si\"].items():\n        print(\"E SI    \", summary(r), \"x\", r6(r[\"x\"]), \"f\", r6(r[\"f\"]))\n    for m, r in lab[\"scaled\"].items():\n        print(\"E scaled\", summary(r), \"x\", r6(r[\"x_si\"]), \"f\", r6(r[\"f\"]))\n    print(\"E p-scale sweep\", [(q[\"log10s\"], q[\"gd\"], q[\"gd_status\"], round(q[\"gd_f\"]), q[\"bfgs\"]) for q in lab[\"p_scale_sweep\"]])\n    for m, r in lab[\"rosenbrock\"].items():\n        print(\"E rosen \", summary(r), \"x\", r6(r[\"x\"]))\n";   // embedded copy, so live Python also works when the file is opened locally
let R = RECORDED, MODE = "recorded";
const C = {teal:"#0F6E6B",amber:"#E29A2D",rust:"#BE654C",sky:"#5A91BE",sage:"#83A462",plum:"#995A90",graphite:"#333F4A",sand:"#DFC98F",ink:"#1C242B",slate:"#66727C",mist:"#B9C1C6",paper:"#F3F0EB"};
const fmt = (x,d=0)=>x==null?"–":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

/* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}

S.push({kicker:"Part 2 · Demo", title:"Newton's model in one dimension: when it helps and when it misleads", html:()=>`<div class="body"><div class="col w60"><div class="panel grow"><div class="chart" id="ch-n1"></div></div>
<div class="ctrl" style="margin-top:6px">start x₀ <input type="range" id="n1x" min="-200" max="200" step="1" value="30"><b id="n1xv"></b><button id="n1m0" class="on">Pure Newton</button><button id="n1m1">Modified</button></div></div>
<div class="col"><table class="t" style="font-size:16px" id="n1T"></table><p style="font-size:17px;margin:8px 0 0;font-weight:700" id="n1M"></p>

  const m=d=>DW(x0)+DW1(x0)*d+0.5*(mode===0?DW2(x0):Math.max(Math.abs(DW2(x0)),1))*d*d,pts=lin(-2,2,161);

   marks:xs.slice(0,6).map((u,i)=>Math.abs(u)<=2?{x:u,y:Math.max(-8,Math.min(8,DW(u))),c:i===0?C.ink:C.amber,r:i===0?7:5}:null).filter(Boolean)});
  const last=xs[xs.length-1],kind=DW2(last)>0?"a local minimum":"a local maximum";
  document.getElementById("n1T").innerHTML=`<tr><th class="n">k</th><th class="n">x<sub>k</sub></th><th class="n">f′(x<sub>k</sub>)</th><th class="n">f″(x<sub>k</sub>)</th></tr>`+xs.slice(0,7).map((u,i)=>`<tr><td class="n">${i}</td><td class="n">${Math.abs(u)>1e3?pyExp(u,1):mn(fmt(u,4))}</td><td class="n">${Math.abs(u)>1e3?"–":mn(fmt(DW1(u),4))}</td><td class="n" style="color:${DW2(u)<0?C.rust:C.ink}">${Math.abs(u)>1e3?"–":mn(fmt(DW2(u),2))}</td></tr>`).join("");

S.push({kicker:"Part 2 · Repairs", title:"When Newton fails, and how solvers repair it", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:17px">
<tr><th>Failure</th><th>What happens</th><th>Repair used by solvers</th></tr>
<tr><td>H<sub>k</sub> indefinite or negative definite</td><td>p<sub>k</sub> may point uphill, toward a maximum or a saddle</td><td>Modify H<sub>k</sub>: add τI with τ &gt; 0, or flip and floor its eigenvalues, until it is positive definite</td></tr>
<tr><td>Far from the solution</td><td>The model is poor and a full step overshoots</td><td>Line search on α, or a trust region that limits ‖p‖</td></tr>
<tr><td>H<sub>k</sub> singular or nearly so</td><td>The linear solve blows up</td><td>Same modification; or regularize, as Levenberg–Marquardt does for least squares (Session 10)</td></tr>
<tr><td>Second derivatives unavailable</td><td>No H<sub>k</sub> to use</td><td>Quasi-Newton (next slides), or finite differences of ∇f</td></tr>
<tr><td>n large</td><td>Forming and factoring H<sub>k</sub> costs O(n²) memory and O(n³) time</td><td>Newton-CG: solve H<sub>k</sub>p = −g<sub>k</sub> approximately with conjugate gradients and Hessian-vector products</td></tr></table>
<p class="note">"Modified Newton" in this course: each eigenvalue of H<sub>k</sub> replaced by max(|eigenvalue|, small floor), then an Armijo line search.</p></div></div>`});

S.push({kicker:"Part 2 · Convergence rates", title:"Linear, superlinear, quadratic: read the rate from a log plot", html:()=>`<div class="body"><div class="col w45"><div class="panel"><div class="math" style="font-size:22px;line-height:1.75">
Linear: ‖e<sub>k+1</sub>‖ ≤ r‖e<sub>k</sub>‖, 0 &lt; r &lt; 1<br>
Superlinear: ‖e<sub>k+1</sub>‖/‖e<sub>k</sub>‖ → 0<br>
Quadratic: ‖e<sub>k+1</sub>‖ ≤ C‖e<sub>k</sub>‖²</div></div>
<ul class="b xs" style="margin-top:10px"><li>On a log scale, linear is a straight line; superlinear bends down; quadratic falls off a cliff</li>
<li>Linear with r = 0.5 gains one bit per step; r = 0.99 needs 230 steps per digit</li>
<li>Quadratic doubles the digits: 10⁻², 10⁻⁴, 10⁻⁸, 10⁻¹⁶</li></ul></div>
<div class="col"><div class="panel grow"><div class="chart" id="ch-rate"></div></div></div></div>`,
draw:()=>{const lin_=[],sup=[],quad=[];let a=0.5,b=0.5,c=0.5;for(let k=0;k<=12;k++){lin_.push([k,Math.log10(a)]);sup.push([k,Math.max(-16,Math.log10(b))]);quad.push([k,Math.max(-16,Math.log10(c))]);a*=0.5;b=b**1.5;c=Math.max(1e-17,c*c)}
 document.getElementById("ch-rate").innerHTML=xyChart({w:600,h:420,xmin:0,xmax:12,xstep:2,ymin:-16,ymax:0,ystep:4,xlab:"iteration k",ylab:"log₁₀ ‖eₖ‖",l:58,
  series:[{pts:lin_,c:C.rust,w:2.8},{pts:sup,c:C.amber,w:2.8},{pts:quad,c:C.teal,w:2.8}],legend:[{c:C.rust,line:true,t:"linear, r = 0.5"},{c:C.amber,line:true,t:"superlinear, e₊ = e<tspan baseline-shift='super' font-size='11'>1.5</tspan>"},{c:C.teal,line:true,t:"quadratic, e₊ = e²"}],lx:80,ly:300})}});

S.push({kicker:"Part 2 · Quasi-Newton", title:"BFGS: learn the curvature from the gradients you already have", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:20px;line-height:1.75">
s<sub>k</sub> = x<sub>k+1</sub> − x<sub>k</sub>, &nbsp;y<sub>k</sub> = g<sub>k+1</sub> − g<sub>k</sub><br>
Secant condition: B<sub>k+1</sub>s<sub>k</sub> = y<sub>k</sub> &nbsp;(H s ≈ y along the last step)<br>
Inverse update, W = B⁻¹, ρ = 1/y<sub>k</sub>ᵀs<sub>k</sub>:<br>
W<sub>k+1</sub> = (I − ρs<sub>k</sub>y<sub>k</sub>ᵀ) W<sub>k</sub> (I − ρy<sub>k</sub>s<sub>k</sub>ᵀ) + ρs<sub>k</sub>s<sub>k</sub>ᵀ<br>
p<sub>k</sub> = −W<sub>k</sub>g<sub>k</sub>, &nbsp;W<sub>0</sub> = I (or a scaled I)</div></div></div>
<div class="col"><ul class="b xs"><li>The update is a rank-two change that keeps W symmetric and positive definite, provided y<sub>k</sub>ᵀs<sub>k</sub> &gt; 0. The Wolfe curvature condition guarantees it</li>
<li>No second derivatives: one gradient per step. Cost O(n²) per step for the matrix-vector work</li>
<li>W<sub>0</sub> = I makes the first step a steepest-descent step, so BFGS also feels bad units at the start</li>
<li>On a quadratic with exact steps, BFGS finds the minimum in at most n steps, and B<sub>n</sub> equals the Hessian (the zigzag demo)</li>
<li>Locally superlinear. SciPy's 'BFGS' is the default of minimize when there are no bounds or rows</li></ul></div></div>`});

S.push({kicker:"Part 2 · Large problems and other methods", title:"Memory and derivatives decide the method for large n", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:16.5px">
<tr><th>Method</th><th>Information</th><th>Memory</th><th>Work per step</th><th>When</th></tr>
<tr><td>Newton (modified)</td><td>f, ∇f, ∇²f</td><td>n²</td><td>n³</td><td>n up to a few thousand, Hessian cheap or sparse</td></tr>
<tr><td>Newton-CG (truncated Newton)</td><td>f, ∇f, Hessian-vector products</td><td>n</td><td>a few CG iterations</td><td>large n with AD or structure</td></tr>
<tr><td>BFGS</td><td>f, ∇f</td><td>n²</td><td>n²</td><td>n up to a few thousand</td></tr>
<tr><td>L-BFGS (m = 5 to 20 pairs)</td><td>f, ∇f</td><td>2mn</td><td>4mn</td><td>large n; bounds with L-BFGS-B</td></tr>
<tr><td>Nonlinear conjugate gradient</td><td>f, ∇f</td><td>n</td><td>n</td><td>very large n, cheap gradients</td></tr>
<tr><td>Nelder–Mead, Powell</td><td>f only</td><td>n²</td><td>n per step, many steps</td><td>few variables, noisy or no derivatives; Session 14 for expensive ones</td></tr></table>
<p class="note">L-BFGS keeps only the last m pairs (s, y) and applies W<sub>k</sub> to g<sub>k</sub> by the two-loop recursion, never forming a matrix. With 10⁶ variables, BFGS would need 8 TB for W; L-BFGS with m = 10 needs 160 MB.</p></div></div>`});

S.push({kicker:"Part 2 · Demo", title:"A race on Himmelblau's function: click a start", html:()=>`<div class="body"><div class="col w55"><div class="panel grow"><div class="chart" id="ch-race" style="cursor:crosshair"></div></div>

   series:R.map(r=>({pts:r.gn.slice(0,41).map((v,i)=>[i,Math.max(-10,Math.log10(Math.max(v,1e-12)))]),c:MC[r.method],w:2.2,dash:r.method==="pure_newton"}))})};

S.push({kicker:"Part 2 · Reading the race", title:"Three starts, four methods: count the work, then check where they stop", html:()=>`<div class="body"><div class="col w60"><table class="t" style="font-size:15px" id="raceTab"></table></div>

S.push({kicker:"Part 3 · Scaling", title:"Units change the problem for steepest descent, and not for Newton", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:21px;line-height:1.75">
Scaled variables: x = Dz, &nbsp;D = diag(d₁, …, d<sub>n</sub>)<br>
∇<sub>z</sub>f = D∇<sub>x</sub>f, &nbsp;∇²<sub>z</sub>f = D∇²<sub>x</sub>f D<br>
Steepest descent in z moves x by −D²∇<sub>x</sub>f: a different direction<br>
κ(DHD) can differ from κ(H) by many orders of magnitude<br>
Choose d<sub>i</sub> ≈ a typical value of x<sub>i</sub> at the solution</div></div>
<p class="note">Scale the objective as well: divide f by a typical value, so that gradient tolerances mean something.</p></div>
<div class="col"><ul class="b xs"><li>A pressure in Pa (about 10⁵) next to a temperature in K (about 10²): a change of 1 Pa does almost nothing, a change of 1 K a lot. The Hessian entries differ by factors of 10⁷ or more</li>

<li>Newton is invariant: the same iterates in any units, up to rounding</li>
<li>BFGS from W₀ = I is not invariant: its first step is a steepest-descent step and the path differs from then on (Lab 8: 23 iterations in SI units, 10 after scaling). It is invariant only if W₀ is transformed with the variables, W₀ᶻ = D⁻¹W₀ˣD⁻¹</li>
<li>Tolerances are in units too: ‖g‖ ≤ 10⁻⁵ means different things in USD per Pa and USD per bar. Lab 8 measures all of this</li></ul></div></div>`});

S.push({kicker:"Part 3 · Derivatives", title:"Where gradients come from, and how accurate they are", html:()=>`<div class="body"><div class="col w45"><table class="t" style="font-size:15.5px">
<tr><th>Method</th><th>Error</th><th>Best h</th><th>Cost</th></tr>
<tr><td>Forward difference</td><td>h|f″|/2 + 2ε|f|/h</td><td>≈ √ε |x| ≈ 10⁻⁸|x|</td><td>n + 1 evaluations</td></tr>
<tr><td>Central difference</td><td>h²|f‴|/6 + ε|f|/h</td><td>≈ ε<sup>1/3</sup>|x| ≈ 10⁻⁵|x|</td><td>2n evaluations</td></tr>
<tr><td>Complex step, Im f(x + ih)/h</td><td>h²|f‴|/6, no cancellation</td><td>10⁻²⁰</td><td>n complex evaluations</td></tr>
<tr><td>Automatic differentiation</td><td>rounding only</td><td>none</td><td>reverse mode: a few f evaluations for the whole ∇f</td></tr></table>
<ul class="b xs" style="margin-top:10px"><li>ε ≈ 2.2 × 10⁻¹⁶ is the machine precision. A finite difference loses about half the digits</li>
<li>Complex step needs code that works with complex numbers (no abs, no branches on x)</li>
<li>AD: CasADi, JAX, PyTorch; Pyomo passes exact derivatives to Ipopt</li></ul></div>

S.push({kicker:"Part 3 · Stopping tests", title:"What 'converged' means in a solver's report", html:()=>`<div class="body"><div class="col w55"><table class="t" style="font-size:16px">
<tr><th>Test</th><th>Meaning</th><th>SciPy</th></tr>
<tr><td>Gradient</td><td>‖g<sub>k</sub>‖ small: stationarity, the condition that matters</td><td>BFGS: gtol = 10⁻⁵ on max|g|; L-BFGS-B: gtol on the projected gradient</td></tr>
<tr><td>Function change</td><td>f stopped falling, relative to |f|</td><td>L-BFGS-B: ftol ≈ 2.2 × 10⁻⁹</td></tr>
<tr><td>Step size</td><td>x stopped moving</td><td>Nelder–Mead: xatol, fatol = 10⁻⁴</td></tr>
<tr><td>Iteration or evaluation limit</td><td>no conclusion</td><td>maxiter, maxfun; status ≠ 0</td></tr></table>
<p class="note">"Desired error not necessarily achieved due to precision loss" (SciPy BFGS): the line search could not decrease f. Usual causes: an inaccurate gradient, or bad scaling.</p></div>
<div class="col"><ul class="b xs"><li>A small change in f or x can also mean slow progress, as steepest descent shows. Only the gradient test speaks about stationarity</li>
<li>Gradient tolerances carry units: scale the problem, or use a relative test such as ‖g‖ ≤ 10⁻⁶·(1 + |f|)</li>
<li>Before trusting a hand-coded gradient, compare it with finite differences: scipy.optimize.check_grad(f, grad, x0)</li>
<li>Report iterations, function and gradient evaluations, and the final ‖g‖, not only the status</li></ul></div></div>`});

S.push({kicker:"Part 3 · Check your understanding · 5 minutes", title:"Scaling, derivatives and stopping", html:()=>CHECK(3,
OL+`<li>A model uses flow in m³/s (about 0.002) and temperature in K (about 350). Propose a scaling D</li>
<li>Steepest descent takes 40 steps in good units. A unit change multiplies κ by 100. Roughly how many steps now?</li>
<li>Forward differences give a gradient accurate to about 10⁻⁸. A solver is asked for gtol = 10⁻¹⁰ (relative). What happens?</li>
<li>BFGS reports success after 3 iterations, with ‖g‖ = 4 × 10⁻⁶ in USD per Pa. Is the point good?</li></ol>`,
`<li>1. D = diag(0.002 m³/s, 350 K) or round values (10⁻³, 10²): each scaled variable of order one</li>
<li>2. About 100 times as many: of order 4,000. Steepest descent's work grows about in proportion to κ</li>
<li>3. It cannot reach it: noise in the gradient stops progress, the line search fails, and the solver reports precision loss</li>
<li>4. Not shown yet: 4 × 10⁻⁶ USD per Pa is 0.4 USD per bar. Check the gradient in scaled units, and the step and f history</li>`),
draw:()=>reveal("k3btn","k3ans")});

S.push({kicker:"Part 3 · Trust regions", title:"Trust regions: choose the step length first, then the direction", html:()=>`<div class="body"><div class="col w45"><div class="panel"><div class="math" style="font-size:20px;line-height:1.7">
min m(p) = gᵀp + ½pᵀBp &nbsp;s.t. &nbsp;‖p‖ ≤ Δ<br>
Dogleg: from 0 to the Cauchy point p<sub>U</sub> = −(gᵀg/gᵀBg)g, then toward the Newton point p<sub>B</sub> = −B⁻¹g<br>
ρ = (actual decrease)/(model decrease)<br>
ρ &gt; 3/4: accept, grow Δ; &nbsp;ρ &lt; 1/4: shrink Δ</div></div>
<div class="ctrl" style="margin-top:8px">radius Δ <input type="range" id="trd" min="5" max="300" step="1" value="80"><b id="trdv"></b></div>
<p style="font-size:16.5px;margin:4px 0 0" id="trM"></p></div>
<div class="col"><div class="panel grow"><div class="chart" id="ch-tr"></div></div>
<p class="note">A small radius gives a short step close to steepest descent; a large one gives the Newton step. SciPy's 'trust-constr', 'trust-ncg' and Levenberg–Marquardt (Session 10) work this way.</p></div></div>`,
draw:()=>{const B=[[1,-0.3],[-0.3,3]],g=[-2.3,-2.22],m=p=>dot(g,p)+0.5*dot(p,mv(B,p)),pB=mv(inv2(B),[-g[0],-g[1]]),pU=(()=>{const a=dot(g,g)/dot(g,mv(B,g));return [-a*g[0],-a*g[1]]})();
 const P=plane({w:640,h:400,xr:[-0.9,3.85],yr:[-0.6,2.2],xt:[0,1,2,3],yt:[0,1,2],xlab:"p₁",ylab:"p₂",l:40,b:40});
 const go=()=>{const D=+document.getElementById("trd").value/100;document.getElementById("trdv").textContent=fmt(D,2);let p;
  const nB=Math.hypot(...pB),nU=Math.hypot(...pU);if(nB<=D)p=pB;else if(nU>=D)p=[D*pU[0]/nU,D*pU[1]/nU];else{const d=[pB[0]-pU[0],pB[1]-pU[1]],a=dot(d,d),b=2*dot(pU,d),c=dot(pU,pU)-D*D,t=(-b+Math.sqrt(b*b-4*a*c))/(2*a);p=[pU[0]+t*d[0],pU[1]+t*d[1]]}
  let s=P.s+contours((x,y)=>m([x,y]),[-0.9,3.85],[-0.6,2.2],70,50,[-4,-3.5,-3,-2,-1,0,1,2],P.px,P.py,C.mist,1.1);const sx=P.px(1)-P.px(0),sy=P.py(0)-P.py(1);
  s+=`<ellipse cx="${P.px(0)}" cy="${P.py(0)}" rx="${D*sx}" ry="${D*sy}" fill="${C.sand}" opacity=".35" stroke="${C.graphite}" stroke-width="1.6"/>`;
  s+=`<polyline points="${P.px(0)},${P.py(0)} ${P.px(pU[0])},${P.py(pU[1])} ${P.px(pB[0])},${P.py(pB[1])}" fill="none" stroke="${C.slate}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  s+=`<circle cx="${P.px(pU[0])}" cy="${P.py(pU[1])}" r="5" fill="${C.rust}"/><text x="${P.px(pU[0])-6}" y="${P.py(pU[1])-12}" font-size="18" text-anchor="end" fill="${C.rust}">Cauchy point p<tspan baseline-shift="sub" font-size="13">U</tspan></text>`;
  s+=`<circle cx="${P.px(pB[0])}" cy="${P.py(pB[1])}" r="5" fill="${C.teal}"/><text x="${P.px(pB[0])+4}" y="${P.py(pB[1])-12}" font-size="18" text-anchor="middle" fill="${C.teal}">Newton point p<tspan baseline-shift="sub" font-size="13">B</tspan></text>`;
  s+=arrow(P.px(0),P.py(0),P.px(p[0]),P.py(p[1]),C.amber,3.5);s+=`<circle cx="${P.px(0)}" cy="${P.py(0)}" r="5" fill="${C.ink}"/>`;
  document.getElementById("ch-tr").innerHTML=s+P.frame()+"</svg>";
  document.getElementById("trM").textContent=`Step (${fmt(p[0],2)}, ${fmt(p[1],2)}), length ${fmt(Math.hypot(...p),2)}; model decrease ${fmt(-m(p),2)} of ${fmt(-m(pB),2)} for the full Newton step.`};
 document.getElementById("trd").oninput=go;go()}});

S.push({kicker:"Part 3 · Choosing", title:"Which method when", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:17px">
<tr><th>Situation</th><th>Method</th><th>SciPy minimize</th></tr>
<tr><td>A few variables, smooth, Hessian available</td><td>Newton with a line search or trust region</td><td>'trust-exact', 'Newton-CG' with hess</td></tr>
<tr><td>Up to a few thousand variables, gradients available</td><td>BFGS</td><td>'BFGS' (default with no bounds)</td></tr>
<tr><td>Many variables, or simple bounds</td><td>L-BFGS, L-BFGS-B</td><td>'L-BFGS-B'</td></tr>
<tr><td>Large, with Hessian-vector products</td><td>Newton-CG (truncated Newton)</td><td>'Newton-CG' with hessp, 'trust-krylov'</td></tr>
<tr><td>Few variables, no derivatives, noise</td><td>Nelder–Mead, Powell</td><td>'Nelder-Mead', 'Powell'</td></tr>
<tr><td>Sum of squared residuals</td><td>Gauss–Newton, Levenberg–Marquardt</td><td>least_squares (Session 10)</td></tr>
<tr><td>Rows: equalities and inequalities</td><td>SQP, interior point</td><td>'SLSQP', 'trust-constr'; Ipopt (Session 9)</td></tr></table>
<p class="note">Whatever the method: scale, supply exact gradients if you can, start from more than one point when the problem may be nonconvex, and check the end point.</p></div></div>`});

S.push({kicker:"Part 3 · Practice", title:"A checklist before you trust an unconstrained solve", html:()=>`<div class="body"><div class="col"><ol style="font-size:20px;line-height:1.55;margin:0;padding-left:28px">
<li>Variables and objective scaled to order one, with units written down</li>
<li>Gradient exact (by hand, AD or complex step), or checked against finite differences with check_grad</li>
<li>Method chosen for n, derivative cost and smoothness; tolerances stated in scaled units</li>
<li>More than one start if the problem may be nonconvex (Session 5)</li>
<li>Status, iterations, function and gradient evaluations, and final ‖g‖ recorded</li>

<li>Result reproduced with a second method or a second solver</li></ol>

S.push({kicker:"Part 3 · Check your understanding · 5 minutes", title:"Choosing and checking", html:()=>CHECK(4,
OL+`<li>A model has 50,000 variables and cheap gradients from AD. Which method, and why not BFGS?</li>
<li>A trust-region step predicted a decrease of 10 and achieved 1. What happens to Δ and to the step?</li>
<li>Pure Newton converges in 4 steps to a point where the Hessian has eigenvalues −45.6 and −16.1. What is the point?</li>
<li>Name two ways to make a hand-coded gradient trustworthy</li></ol>`,
`<li>1. L-BFGS (or Newton-CG with Hessian-vector products). BFGS would store a 50,000 × 50,000 matrix: 20 GB</li>
<li>2. ρ = 0.1 &lt; 1/4: the step is rejected or kept with caution, and Δ shrinks</li>
<li>3. A local maximum: both eigenvalues are negative. This is Himmelblau's maximum near (−0.27, −0.92)</li>
<li>4. Compare it with finite differences (check_grad) at a few points; or replace it with AD or the complex step</li>`),
draw:()=>reveal("k4btn","k4ans")});

S.push({kicker:"Summary", title:"What to take from today", html:()=>`<div class="body"><div class="col w45"><table class="t" style="font-size:17px">
<tr><th>Quantity</th><th class="n">Value</th></tr><tr><td>Exact steepest descent, κ = 1,000</td><td class="n">6,908 steps</td></tr>
<tr><td>Backtracking by hand: trials</td><td class="n">5, α = 0.0625</td></tr><tr><td>Pure Newton from (0, 0) on Himmelblau</td><td class="n">a maximum</td></tr>
<tr><td>Newton steps on any quadratic</td><td class="n">1</td></tr><tr><td>Best forward-difference error</td><td class="n">about 10⁻⁸</td></tr>
<tr><td>L-BFGS memory, n = 10⁶, m = 10</td><td class="n">160 MB</td></tr></table></div>
<div class="col"><ul class="b xs"><li>Descent template: a direction with gᵀp &lt; 0, a step from a line search (Armijo, Wolfe) or a trust region, and a gradient test to stop</li>
<li>Steepest descent: cheap per step, linear rate, work about proportional to κ; it zigzags</li>
<li>Newton: quadratic model, quadratic rate, affine invariant; needs repair where H is not positive definite</li>
<li>BFGS: learns the curvature from gradients; superlinear; L-BFGS for large n</li>
<li>Scale variables and objective; get exact gradients; check the end point and report the work</li></ul></div></div>`});

 const hasDock=dock.style.display==="flex",barH=hasDock?document.getElementById("nbar").offsetHeight:0;
 let k=Math.min(W/1280,H/720)*0.98,capH=0,fs=0,dockH=0;
 for(let it=0;it<3;it++){if(hasDock&&CAP_ON){const lines=k<0.6?4:2;fs=Math.max(12,Math.min(22,24*k));capH=Math.ceil(lines*fs*1.45)+4}else capH=0;
  dockH=hasDock?capH+barH+(capH?6:0)+14:0;k=Math.min(W/1280,Math.max(120,H-dockH)/720)*0.98}
 const h=720*k,pad=10,top=Math.max(0,(H-h-dockH)/2);
 vp.style.top=(top-pad)+"px";vp.style.bottom="auto";vp.style.height=(h+2*pad)+"px";
 document.getElementById("stage").style.transform=`scale(${k})`;
 if(hasDock){dock.style.top=(top+h+6)+"px";cap.style.display=CAP_ON?"block":"none";cap.style.width=Math.min(1280*k,W-16)+"px";cap.style.height=capH+"px";cap.dataset.fs=fs;if(window.capRefit)capRefit()}}

 if(!p){document.getElementById("dTitle").textContent="No Python on this slide";document.getElementById("dSub").textContent="Slides with a 'D · Python' tag have code and output.";document.getElementById("dCode").value="";document.getElementById("dOut").textContent="";return}
 document.getElementById("dTitle").textContent=p.title;document.getElementById("dSub").textContent=p.sub||"";document.getElementById("dCode").value=p.code;
 try{document.getElementById("dOut").textContent=p.out()}catch(e){document.getElementById("dOut").textContent=String(e)}

 if(["ArrowRight","PageDown"," "].includes(k)){e.preventDefault();show(cur+1)}else if(["ArrowLeft","PageUp"].includes(k)){e.preventDefault();show(cur-1)}
 else if(k==="Home")show(0);else if(k==="End")show(N-1);else if(k==="d"||k==="D")document.getElementById("drawer").classList.toggle("open");
 else if(k==="f"||k==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}

let py=null;
async function ensurePy(msg){if(py)return py;msg.textContent="Loading Python in the browser (first time about 5–10 s) ...";
 if(!window.loadPyodide){await new Promise((ok,bad)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js";s.onload=ok;s.onerror=()=>bad(new Error("could not load Pyodide"));document.head.appendChild(s)})}
 const p=await loadPyodide();await p.loadPackage(["numpy","scipy"]);
 const src=LAB_SRC||await (await fetch(LAB_FILE)).text();p.FS.writeFile("descent_lab.py",src);
 await p.runPythonAsync('import sys\nsys.path.insert(0, ".")\nfrom descent_lab import *');py=p;return p}
async function runCode(){const msg=document.getElementById("liveMsg"),out=document.getElementById("dOut"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Running ...";const buf=[];p.setStdout({batched:s=>buf.push(s)});p.setStderr({batched:s=>buf.push(s)});
  try{await p.runPythonAsync(document.getElementById("dCode").value)}catch(e){buf.push(String(e.message||e).split("\n").slice(-4).join("\n"))}
  out.textContent=buf.join("\n")||"(no output)";const m=document.getElementById("dMode");m.className="pill live";m.textContent="LIVE OUTPUT";
  msg.textContent=`Ran in ${((performance.now()-t0)/1000).toFixed(1)} s in the browser`}
 catch(e){msg.textContent="Python could not start: "+e.message+". The recorded output is still available."}}
async function runLive(){const msg=document.getElementById("liveMsg"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Solving every model ...";
  const out=await p.runPythonAsync('import importlib, json\nimport descent_lab as lab\nimportlib.reload(lab)\njson.dumps(lab.classroom_results())');
  R=JSON.parse(out);MODE="live";drawAll();fillDrawer();msg.textContent=`All slides now show a live run (${((performance.now()-t0)/1000).toFixed(1)} s, SciPy ${R.meta.scipy})`}
 catch(e){msg.textContent="Live run failed: "+e.message+". The recorded run is still shown."}}
document.getElementById("runCode").onclick=runCode;
document.getElementById("runLive").onclick=runLive;
document.getElementById("useRec").onclick=()=>{R=RECORDED;MODE="recorded";drawAll();fillDrawer();document.getElementById("liveMsg").textContent="Showing the recorded run."};
